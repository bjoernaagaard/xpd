pre-commit:
  parallel: true
  jobs:
    - name: comments
      run: uv run tools/comments.py lint
    - name: cargo fmt
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    # Rules are parsed when xpd starts, so a rule file that does not parse only shows in a run.
    - name: rules load
      glob: &build_inputs
        - "*.rs"
        - "src/**/*"
        - "rules/**/*"
        - "skills/**/*"
        - "py/**/*"
        - "python/**/*.py"
        - "indexes/**/*"
        - "licenses/**/*"
        - "LICENSE-*"
        - README.md
        - pyproject.toml
        - .cargo/config.toml
        - .claude-plugin/plugin.json
        - mcp.json
        - Cargo.toml
        - Cargo.lock
      run: cargo run --quiet -- check samples/good.py --format text
    - name: discovery ranking
      glob: *build_inputs
      run: cargo run --quiet -- find --check indexes/questions.json
    - name: ruff format
      glob: &python_sources ["py/*.py", "python/**/*.py"]
      run: ruff format {staged_files}
      stage_fixed: true
    - name: ruff check
      glob: *python_sources
      run: ruff check --fix {staged_files}
      stage_fixed: true
    - name: jactionlint
      glob: ".github/**/*.yml"
      # Without paths, jactionlint also lints workflows in ignored folders, such as research/.
      run: jactionlint {staged_files}

pre-push:
  jobs:
    - name: deny
      run: cargo deny check
