[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "xpd"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND NCSA AND MPL-2.0 AND ISC AND MIT-0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "licenses/*"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version", "description", "readme", "keywords"]
# The MCP server, `xpd mcp`, with every FastMCP extra. FastMCP stays within one minor release,
# and prefab-ui, which draws the app views, is pinned because its releases break often.
dependencies = [
  "fastmcp[anthropic,apps,azure,code-mode,gemini,jev,openai,tasks]~=4.2.0",
  "prefab-ui==0.21.1",
]

[project.urls]
Documentation = "https://bjoernaagaard.github.io/xpd/"
Repository = "https://github.com/bjoernaagaard/xpd"

[tool.maturin]
bindings = "bin"
# The wheel also installs the `xpd` Python package, which holds the MCP server.
python-source = "python"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# D: docstrings; COM812, ISC001: clash with ruff format; CPY: no copyright headers;
# T20: the helpers print their JSON result; INP001: py/ holds scripts, not a package.
ignore = ["D", "COM812", "ISC001", "CPY", "T20", "INP001"]
