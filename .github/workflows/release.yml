name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }} # jactionlint ignore=concurrency-cancels-release

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.read.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib
          from pathlib import Path

          rust = tomllib.loads(Path("mise.toml").read_text())["tools"]["rust"]
          print("rust=" + (rust if isinstance(rust, str) else rust["version"]))

          if os.environ.get("IS_TAG") == "true":
              tag_version = os.environ["REF_NAME"].removeprefix("v")
              cargo_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
              if tag_version != cargo_version:
                  print(
                      f"::error title=Tag mismatch::Tag v{tag_version} does not match Cargo.toml version {cargo_version}",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          PYTHON

  wheels:
    name: ${{ matrix.name }}
    needs: [toolchain]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux (x86_64)
            runner: ubuntu-24.04
            target: x86_64
            args: --release --out dist --zig
            manylinux: "2014"
            artifact: wheels-linux-x86_64
            smoke: true
          - name: linux (aarch64)
            runner: ubuntu-24.04-arm
            target: aarch64
            args: --release --out dist --zig
            manylinux: "2014"
            artifact: wheels-linux-aarch64
            smoke: true
          - name: musllinux (x86_64)
            runner: ubuntu-24.04
            target: x86_64
            args: --release --out dist --zig
            manylinux: musllinux_1_2
            artifact: wheels-musllinux-x86_64
            smoke: false
          - name: musllinux (aarch64)
            runner: ubuntu-24.04-arm
            target: aarch64
            args: --release --out dist --zig
            manylinux: musllinux_1_2
            artifact: wheels-musllinux-aarch64
            smoke: false
          - name: macos (aarch64)
            runner: macos-15
            target: aarch64
            args: --release --out dist
            manylinux: ""
            artifact: wheels-macos-aarch64
            smoke: true
          - name: windows (x64)
            runner: windows-latest
            target: x64
            args: --release --out dist
            manylinux: ""
            artifact: wheels-windows-x64
            smoke: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          target: ${{ matrix.target }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          args: ${{ matrix.args }}
          sccache: 'true'
          manylinux: ${{ matrix.manylinux }}
      - uses: ./.github/actions/smoke
        if: matrix.smoke
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # Only this job may mint a PyPI token, as the uv publishing guide recommends.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [wheels, sdist]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Check the tag matches the package version
        run: |
          expected="wheels-sdist/xpd-${GITHUB_REF_NAME#v}.tar.gz"
          test -f "$expected" || { echo "tag $GITHUB_REF_NAME does not match $(ls wheels-sdist)"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A cache restored here could slip into what gets published.
          enable-cache: false
      # A failure is repeated as an annotation, which shows on the run page without opening the log.
      - name: Publish
        run: |
          set -o pipefail
          uv publish --trusted-publishing always 'wheels-*/*' 2>&1 | tee publish.log || {
            echo "::error title=uv publish failed::$(grep -v '^Uploading\|^Publishing' publish.log | tail -n 6 | tr '\n' ' ')"
            exit 1
          }

  # As the uv package guide does: install the published version from PyPI and run it.
  install-from-pypi:
    name: Install from PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [publish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The PyPI index can take a minute to list a new version, so the install tries a few times.
      - run: |
          for _ in 1 2 3 4 5 6; do
            uv run --isolated --no-project --python 3.13 --refresh-package xpd --with "xpd==${GITHUB_REF_NAME#v}" \
              -- xpd check samples/good.py --format text && exit 0
            sleep 20
          done
          exit 1
      - uses: ./.github/actions/smoke
        with:
          published: 'true'

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [wheels, sdist, publish]
    permissions:
      # actions/attest signs with an OIDC token and stores the attestation.
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'wheels-*/*'
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes wheels-*/*
        env:
          GH_TOKEN: ${{ github.token }}
