name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**"
      - "!website/**"
      - "!**.md"
      - "!.github/workflows/ci.yml"
      - "!.github/workflows/docs.yml"
      - README.md
      - rules/**
      - skills/**
      - licenses/**
      - src/**
      - indexes/**
      - py/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }} # jactionlint ignore=concurrency-cancels-release

jobs:
  linux:
    name: linux + musllinux + sdist (homelab)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: [self-hosted, homelab]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist and Linux wheels
        run: |
          set -euo pipefail
          rm -rf dist dist-sdist
          uvx maturin sdist --out dist-sdist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            uvx --with ziglang maturin build --release --zig --compatibility manylinux2014 --target "$target" --out dist
          done
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            uvx --with ziglang maturin build --release --zig --compatibility musllinux_1_2 --target "$target" --out dist
          done
          ls -lh dist-sdist dist
      - uses: ./.github/actions/smoke
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist-sdist
      - name: Upload Linux wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux
          path: dist

  macos:
    name: macos aarch64 (mini)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: [self-hosted, mini]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build macOS wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          set -euo pipefail
          rm -rf dist
          uvx maturin build --release --target aarch64-apple-darwin --out dist
          ls -lh dist
      - uses: ./.github/actions/smoke
      - name: Upload macOS wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-aarch64
          path: dist

  windows:
    name: windows (x64)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Windows wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: x64
          args: --release --out dist
          sccache: 'true'
      - uses: ./.github/actions/smoke
      - name: Upload Windows wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-x64
          path: dist

  # The run on main that built the wheels of the tagged commit. The tag is pushed after that run
  # passed, so a tag on a commit without one stops here and publishes nothing.
  built:
    name: Find the wheels built on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run" || { echo "::error title=No wheels for this commit::No Release run on main passed for $GITHUB_SHA. Push the commit to main, wait for its Release run, and push the tag again."; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Only this job may mint a PyPI token, as the uv publishing guide recommends.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [built]
    environment: pypi
    permissions:
      id-token: write
      # Reads the wheels of the run on main.
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.built.outputs.run }}
          github-token: ${{ github.token }}
      - name: Check the tag matches the package version
        run: |
          expected="wheels-sdist/xpd-${GITHUB_REF_NAME#v}.tar.gz"
          test -f "$expected" || { echo "tag $GITHUB_REF_NAME does not match $(ls wheels-sdist)"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A cache restored here could slip into what gets published.
          enable-cache: false
      # A failure is repeated as an annotation, which shows on the run page without opening the log.
      - name: Publish
        run: |
          set -o pipefail
          uv publish --trusted-publishing always 'wheels-*/*' 2>&1 | tee publish.log || {
            echo "::error title=uv publish failed::$(grep -v '^Uploading\|^Publishing' publish.log | tail -n 6 | tr '\n' ' ')"
            exit 1
          }

  # As the uv package guide does: install the published version from PyPI and run it.
  install-from-pypi:
    name: Install from PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The PyPI index can take a minute to list a new version, so the install tries a few times.
      - run: |
          for _ in 1 2 3 4 5 6; do
            uv run --isolated --no-project --python 3.13 --refresh-package xpd --with "xpd==${GITHUB_REF_NAME#v}" \
              -- xpd check samples/good.py --format text && exit 0
            sleep 20
          done
          exit 1
      - uses: ./.github/actions/smoke
        with:
          published: 'true'

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [built, publish]
    permissions:
      # actions/attest signs with an OIDC token and stores the attestation.
      id-token: write
      attestations: write
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.built.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'wheels-*/*'
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes wheels-*/*
        env:
          GH_TOKEN: ${{ github.token }}
