# Builds wheels for xpd on native runners on each push to main. A pushed v* tag builds nothing.
# It publishes the wheels that the run on main built for the same commit to PyPI with trusted
# publishing, and attaches them to a GitHub Release. A release therefore compiles once, and the
# tag waits only for the upload. Started from `maturin generate-ci github` (maturin 1.16).
#
# When one job fails for a reason outside the code, such as a timed out artifact upload, rerun the
# failed job on the run's page before tagging. A push that changes no file starts no run here,
# because of its path filters.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**"
      - "!website/**"
      - "!**.md"
      - README.md
      - rules/**
      - skills/**
      - licenses/**
      - src/**
      - indexes/**
      - py/**
  workflow_dispatch:

permissions:
  contents: read

# Each branch or tag gets its own queue, and a new run waits for the running one to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # mise.toml pins Rust. Runners ship older toolchains, so every build installs this one.
  toolchain:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.read.outputs.rust }}
      platforms: ${{ steps.read.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          from pathlib import Path

          rust = tomllib.loads(Path("mise.toml").read_text())["tools"]["rust"]
          print("rust=" + (rust if isinstance(rust, str) else rust["version"]))
          platforms = json.loads(Path(".github/wheel-platforms.json").read_text())
          print("platforms=" + json.dumps(platforms))
          PYTHON

  linux:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [toolchain]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.toolchain.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: ${{ matrix.platform }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          # zig builds on the runner, which has cmake and libclang for llama.cpp. The manylinux
          # containers have no libclang that bindgen can use.
          args: --release --out dist --zig
          sccache: 'true'
          manylinux: auto
      - uses: ./.github/actions/smoke
        if: matrix.platform == 'x86_64'
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.platform }}
          path: dist

  musllinux:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [toolchain]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.toolchain.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: ${{ matrix.platform }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          # zig builds on the runner, which has cmake and libclang for llama.cpp. The manylinux
          # containers have no libclang that bindgen can use.
          args: --release --out dist --zig
          sccache: 'true'
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-musllinux-${{ matrix.platform }}
          path: dist

  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [toolchain]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-11-arm
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build llama.cpp with clang-cl and Ninja
        if: matrix.platform.target == 'aarch64'
        shell: bash
        run: |
          {
            echo "CMAKE_GENERATOR=Ninja"
            echo "CMAKE_C_COMPILER=clang-cl"
            echo "CMAKE_CXX_COMPILER=clang-cl"
          } >> "$GITHUB_ENV"
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        with:
          target: ${{ matrix.platform.target }}
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          args: --release --out dist
          sccache: 'true'
      - uses: ./.github/actions/smoke
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [toolchain]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        # The cache comes only from runs on main, which run reviewed code, as bas also accepts.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0 # jactionlint ignore=cache-poisoning
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          target: aarch64
          rust-toolchain: ${{ needs.toolchain.outputs.rust }}
          args: --release --out dist
          sccache: 'true'
      - uses: ./.github/actions/smoke
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-aarch64
          path: dist

  sdist:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # The run on main that built the wheels of the tagged commit. The tag is pushed after that run
  # passed, so a tag on a commit without one stops here and publishes nothing.
  built:
    name: Find the wheels built on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch main \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run" || { echo "::error title=No wheels for this commit::No Release run on main passed for $GITHUB_SHA. Push the commit to main, wait for its Release run, and push the tag again."; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Only this job may mint a PyPI token, as the uv publishing guide recommends.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [built]
    environment: pypi
    permissions:
      id-token: write
      # Reads the wheels of the run on main.
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.built.outputs.run }}
          github-token: ${{ github.token }}
      - name: Check the tag matches the package version
        run: |
          expected="wheels-sdist/xpd-${GITHUB_REF_NAME#v}.tar.gz"
          test -f "$expected" || { echo "tag $GITHUB_REF_NAME does not match $(ls wheels-sdist)"; exit 1; }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # A cache restored here could slip into what gets published.
          enable-cache: false
      # A failure is repeated as an annotation, which shows on the run page without opening the log.
      - name: Publish
        run: |
          set -o pipefail
          uv publish --trusted-publishing always 'wheels-*/*' 2>&1 | tee publish.log || {
            echo "::error title=uv publish failed::$(grep -v '^Uploading\|^Publishing' publish.log | tail -n 6 | tr '\n' ' ')"
            exit 1
          }

  # As the uv package guide does: install the published version from PyPI and run it.
  install-from-pypi:
    name: Install from PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The PyPI index can take a minute to list a new version, so the install tries a few times.
      - run: |
          for _ in 1 2 3 4 5 6; do
            uv run --isolated --no-project --python 3.13 --refresh-package xpd --with "xpd==${GITHUB_REF_NAME#v}" \
              -- xpd check samples/good.py --format text && exit 0
            sleep 20
          done
          exit 1
      - uses: ./.github/actions/smoke
        with:
          published: 'true'

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [built, publish]
    permissions:
      # actions/attest signs with an OIDC token and stores the attestation.
      id-token: write
      attestations: write
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ needs.built.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'wheels-*/*'
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes wheels-*/*
        env:
          GH_TOKEN: ${{ github.token }}
