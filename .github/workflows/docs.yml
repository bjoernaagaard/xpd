# Builds the documentation site with `mise run docs` and publishes site/ to GitHub Pages. A pull
# request only builds the site, so a broken page or reference fails the check before it merges.
# A push to main builds and deploys. The site reads the rule catalog, the command tree and the MCP
# server of the xpd that this checkout builds, so their sources are inputs too. The build also runs
# every example on the pages and in the README with that xpd, on the files in samples/, and fails
# when an example differs from what xpd does. Each Monday it runs the examples with the newest
# release of the libraries that the samples import, so a change in a library shows within a week.
name: Documentation
on:
  pull_request:
    paths: &inputs
      - website/**
      - rules/**
      - src/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - indexes/**
      - python/**
      - skills/**
      - samples/**
      - py/**
      - README.md
      - pyproject.toml
      - mise.toml
      - .cargo/config.toml
      - .claude-plugin/plugin.json
      - mcp.json
      - licenses/**
      - LICENSE-*
      - .github/actions/build-setup/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *inputs
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    cache-mode: read
    # A new push to the same pull request cancels its older build.
    concurrency:
      group: docs-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/build-setup
      - if: runner.environment == 'self-hosted'
        run: mise trust --quiet
      - run: mise run docs
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          XPD_NEWEST_LIBRARIES: ${{ github.event_name == 'schedule' && '1' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    needs: build
    permissions:
      pages: write
      id-token: write
    # A new push waits for a running deploy instead of cancelling it halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
