# Builds the documentation site with `mise run docs` and publishes site/ to GitHub Pages. A pull
# request only builds the site, so a broken page or reference fails the check before it merges.
# A push to main builds and deploys. The site reads the rule catalog, the command tree and the MCP
# server of the xpd that this checkout builds, so their sources are inputs too.
name: Documentation
on:
  pull_request:
    paths: &inputs
      - website/**
      - rules/**
      - src/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - indexes/**
      - python/**
      - skills/**
      - pyproject.toml
      - mise.toml
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:
permissions: {}
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Restores the build cache but never saves it. The CI job saves it for each push to main
    # under the same key, so a save from here races CI's and is refused or keeps a target/ without
    # clippy's output.
    cache-mode: read
    # A new push to the same pull request cancels its older build.
    concurrency:
      group: docs-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: rust mr-boxington aqua:Kitware/CMake node uv
      # mise.toml routes cargo through mbx. Its action restores target/ and the cargo registry
      # from the cache that pushes to main save.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
      - run: mise run docs
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    # A new push waits for a running deploy instead of cancelling it halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
