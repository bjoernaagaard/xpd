# Runs the lefthook checks on every file, so pull requests from anyone get them too.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A new push to the same pull request or branch cancels its older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lefthook:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: runner.environment != 'self-hosted'
        uses: ./.github/actions/build-setup
      - if: runner.environment == 'self-hosted'
        run: mise trust --quiet
      - run: lefthook run pre-commit --all-files --force --no-auto-install
      - run: node examples/verify_stop_ownership.mjs
      # The formatters fix and stage files, so any change from HEAD means a file was not formatted.
      - run: git diff --exit-code HEAD
      - run: python3 .github/scripts/check_sample_marks.py
      - run: cargo build --quiet
      - run: python3 .github/scripts/check_rule_conflicts.py --xpd target/debug/xpd
      - run: lefthook run pre-push --force --no-auto-install
