schema = 6
revision = 8
summary = "The setup that xpd doctor holds a Python project to. Each value is explained by the record of the same id in decisions.jsonl."

[pins]
ruff = "0.17.4"
ty = "0.0.106"
pytest = "9.2.0"
pre-commit = "4.7.0"

[dev]
pins = ["pytest", "ruff", "ty", "pre-commit"]

[dev.tools]
ruff = ["ruff"]
ty = ["ty"]
pytest = ["pytest"]

[kinds.library]
summary = "A package that others install. It keeps its build backend, and uv.lock locks its development environment."
lock = "project"
project = "required"
build-system = "required"
scripts = "allowed"
tool-only = false
metadata = ["name", "version", "description", "readme", "requires-python", "urls", "license", "license-files"]
files = ["pre-commit"]
python-version = true

[kinds.application]
summary = "A program that runs from its checkout or as an installed command, locked in uv.lock."
lock = "project"
project = "required"
build-system = "allowed"
scripts = "allowed"
tool-only = false
metadata = ["name", "version", "description", "readme", "requires-python", "urls"]
files = ["pre-commit"]
python-version = true

[kinds.pipeline]
summary = "An application that turns data into results, locked in uv.lock like an application."
lock = "project"
project = "required"
build-system = "allowed"
scripts = "allowed"
tool-only = false
metadata = ["name", "version", "description", "readme", "requires-python", "urls"]
files = ["pre-commit"]
python-version = true

[kinds.script]
summary = "Standalone scripts with inline script metadata. Each script is locked in the lock file beside it, and pyproject.toml holds only tool settings."
lock = "script"
project = "forbidden"
build-system = "forbidden"
scripts = "required"
tool-only = true
metadata = []
files = ["pre-commit-script"]
python-version = false

[files.pre-commit]
path = ".pre-commit-config.yaml"
template = "pre-commit.yaml.template"

[files.pre-commit-script]
path = ".pre-commit-config.yaml"
template = "pre-commit-script.yaml.template"

[packaging]
cooldown = "3 days"
python-floor = "3.14"

[packaging.backends]
"hatchling.build" = ""
maturin = "Cargo.toml"
"scikit_build_core.build" = "CMakeLists.txt"

[packaging.uv]
index-strategy = "first-index"
no-build-isolation = false
no-build-isolation-package = []
default-groups = ["dev"]

[packaging.migrate.files]
"setup.py" = "Move the metadata and entry points to [project], read the script for build steps before you remove it, and choose the backend by what the build needs."
"setup.cfg" = "Move the metadata to [project] and each tool's section to its table in pyproject.toml, and let the backend find the package."
"requirements*.txt" = "Add the direct requirements with uv add -r, put the development ones in the dev group, and export a requirements file from uv.lock only for a reader that needs one."
"tox.ini" = "Move the environments that matter to the CI workflow, and run each command with uv on its Python and platform."

[packaging.migrate.tables]
"tool.poetry" = "Move the metadata, scripts and runtime requirements to [project], turn the groups and markers into [dependency-groups], run uv lock, and map named indexes to [tool.uv.sources]."

[ruff]
select = ["E4", "E7", "E9", "F", "I"]

[ruff.settings]
required-version = "==0.17.4"

[ruff.settings.lint]
unfixable = ["E711"]

[ty.rules]
blanket-ignore-comment = "error"
disjoint-cast = "error"
missing-direct-dependency = "error"
missing-type-argument = "warn"
unused-ignore-comment = "error"

[ty.settings]
analysis.respect-type-ignore-comments = false
terminal.error-on-warning = false

[pytest]
settings = { strict = true, markers = ["e2e: drives a full user flow"], filterwarnings = ["error"] }
addopts = ["-ra", "--import-mode=importlib", "-p no:doctest"]

[pytest.before-9]
settings = { xfail_strict = true, markers = ["e2e: drives a full user flow"], filterwarnings = ["error"] }
addopts = ["-ra", "--import-mode=importlib", "-p no:doctest", "--strict-markers", "--strict-config"]

[pytest.forbid]
addopts = ["--reruns", "--reruns-delay", "--count", "--repeat-scope", "--allow-hosts", "--cov", "--cov-fail-under", "-n", "--dist", "--doctest-glob"]
switches = ["--disable-socket", "--force-enable-socket", "--allow-unix-socket", "--disable-warnings", "--disable-pytest-warnings", "--strict-markers", "--strict-config", "--snapshot-update", "--doctest-modules"]
disabled = ["warnings"]
settings = ["reruns", "reruns_delay"]
false = ["strict_config", "strict_markers", "strict_parametrization_ids", "strict_xfail", "xfail_strict"]
plugins = ["pytest-rerunfailures", "flaky", "pytest-mock", "pytest-repeat", "pytest-socket", "mock"]

[pytest.plugin-names]
pytest-rerunfailures = ["rerunfailures", "pytest_rerunfailures"]
flaky = ["flaky"]
pytest-mock = ["pytest_mock"]
pytest-repeat = ["repeat", "pytest_repeat"]
pytest-socket = ["socket", "pytest_socket"]
mock = ["mock"]
