schema = 1
revision = 1
summary = "The setup that xpd doctor holds a Python project to. Each value is explained by the record of the same id in decisions.jsonl."

[pins]
ruff = "0.17.4"
ty = "0.0.106"
pytest = "9.2.0"

[kinds.library]
summary = "A package that others install. It keeps its build backend, and uv.lock locks its development environment."
lock = "project"

[kinds.application]
summary = "A program that runs from its checkout or as an installed command, locked in uv.lock."
lock = "project"

[kinds.pipeline]
summary = "An application that turns data into results, locked in uv.lock like an application."
lock = "project"

[kinds.script]
summary = "Standalone scripts with inline script metadata. Each script is locked in the lock file beside it, and pyproject.toml holds only tool settings."
lock = "script"

[ruff]
rules = ["PTH118", "PERF101", "PERF102", "PGH003", "PGH004", "RUF017", "RUF100"]

[ty.rules]
blanket-ignore-comment = "error"
disjoint-cast = "error"
missing-type-argument = "warn"

[pytest]
settings = { strict = true }
addopts = ["-ra", "--import-mode=importlib"]
plugins = ["pytest-timeout", "pytest-randomly"]

[pytest.before-9]
settings = { xfail_strict = true }
addopts = ["--strict-markers", "--strict-config"]

[pytest.forbid]
addopts = ["--reruns", "--reruns-delay"]
settings = ["reruns", "reruns_delay"]
false = ["strict_xfail", "xfail_strict"]
plugins = ["pytest-rerunfailures", "flaky", "pytest-mock"]
