# The code that makes a conditional decision of the doctor catalog relevant. Each rule's id is
# the trigger that the catalog's records name. A match is evidence, not a verdict: the condition
# of the record says what the developer still decides.
id: explicit-any
language: python
rule:
  matches: any-type
  inside:
    any:
      - kind: typed_parameter
      - kind: typed_default_parameter
      - kind: function_definition
---
id: lazy-import
language: python
rule:
  any:
    - pattern: __lazy_modules__ = $X
    - all:
        - any:
            - kind: ERROR
            - kind: expression_statement
        - regex: ^lazy$
        - precedes:
            any:
              - kind: import_statement
              - kind: import_from_statement
---
id: numpy-import
language: python
rule:
  any:
    - kind: import_statement
      has: { kind: dotted_name, stopBy: end, regex: ^numpy(\.|$) }
    - kind: import_from_statement
      has: { field: module_name, regex: ^numpy(\.|$) }
---
id: pandas-values
language: python
rule:
  kind: attribute
  all:
    - has: { field: attribute, regex: ^values$ }
    - not: { inside: { kind: call } }
    - inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          any:
            - kind: import_statement
              has: { kind: dotted_name, stopBy: end, regex: ^pandas$ }
            - kind: import_from_statement
              has: { field: module_name, regex: ^pandas(\.|$) }
---
id: manual-list-copy
language: python
rule:
  pattern: |
    for $X in $Y:
        $Z.append($X)
---
id: manual-dict-loop
language: python
rule:
  any:
    - pattern: |
        for $K, $V in $I:
            $D[$K] = $V
    - pattern: |
        for $K in $I:
            $D[$K] = $V
---
id: local-import
language: python
rule:
  any:
    - kind: import_statement
    - kind: import_from_statement
  inside: { stopBy: end, kind: function_definition }
---
id: sorted-extreme
language: python
rule:
  any:
    - pattern: sorted($$$A)[0]
    - pattern: sorted($$$A)[-1]
---
id: first-element-slice
language: python
rule:
  any:
    - pattern: list($X)[0]
    - pattern: tuple($X)[0]
    - pattern: list($X)[:1]
    - pattern: "[*$X][0]"
---
id: logging-eager-conversion
language: python
rule:
  kind: call
  all:
    - has:
        field: function
        regex: ^(logging|logger|log|LOGGER|LOG|_logger|_log|self\.logger|self\.log)\.(debug|info|warning|error|critical|exception|log)$
    - has:
        field: arguments
        has:
          kind: call
          has: { field: function, regex: ^(str|repr|ascii|oct|hex)$ }
---
id: noqa-comment
language: python
rule:
  kind: comment
  regex: (?i)#\s*noqa\b
---
id: pydantic-model
language: python
rule:
  kind: class_definition
  has:
    field: superclasses
    has: { regex: ^(pydantic\.)?BaseModel$ }
---
id: pydantic-validate-call
language: python
rule:
  kind: decorator
  regex: ^@(pydantic\.)?validate_call\b
---
id: division
language: python
rule:
  kind: binary_operator
  all:
    - has: { field: operator, regex: ^//?$ }
    - has:
        field: right
        any:
          - kind: identifier
          - kind: attribute
          - kind: subscript
          - kind: call
---
id: owned-decorator
language: python
rule:
  kind: function_definition
  has:
    field: body
    all:
      - has:
          stopBy: end
          kind: function_definition
          has: { field: name, pattern: $W }
      - has:
          kind: return_statement
          has: { kind: identifier, pattern: $W }
---
id: conditional-binding
language: python
rule:
  kind: if_statement
  all:
    - has:
        field: consequence
        has:
          kind: expression_statement
          has:
            kind: assignment
            has: { field: left, kind: identifier, pattern: $N }
    - precedes:
        stopBy: end
        has: { stopBy: end, kind: identifier, pattern: $N }
    - not:
        any:
          - has: { kind: else_clause }
          - follows:
              stopBy: end
              has:
                stopBy: end
                kind: assignment
                has: { field: left, pattern: $N }
---
id: optional-truthiness
language: python
rule:
  any:
    - kind: if_statement
    - kind: elif_clause
  all:
    - has:
        field: condition
        any:
          - kind: identifier
            pattern: $P
          - kind: not_operator
            has: { field: argument, kind: identifier, pattern: $P }
    - inside:
        stopBy: end
        kind: function_definition
        has:
          field: parameters
          has:
            any:
              - kind: typed_parameter
              - kind: typed_default_parameter
            all:
              - has: { kind: identifier, pattern: $P }
              - has:
                  field: type
                  regex: ^(Optional\[(int|float|str|bytes|list|dict|set|tuple|Decimal)\b.*\]|(int|float|str|bytes|list|dict|set|tuple|Decimal)\b.*\|\s*None|None\s*\|\s*(int|float|str|bytes|list|dict|set|tuple|Decimal)\b.*)$
---
id: dynamic-return
language: python
rule:
  kind: return_statement
  all:
    - has: { matches: dynamic-value }
    - inside:
        stopBy: end
        kind: function_definition
        has: { field: return_type, matches: narrow-annotation }
---
id: dynamic-assignment
language: python
rule:
  kind: assignment
  all:
    - has: { field: type, matches: narrow-annotation }
    - has: { field: right, matches: dynamic-value }
---
id: dynamic-yield
language: python
rule:
  kind: yield
  all:
    - has: { matches: dynamic-value }
    - inside:
        stopBy: end
        kind: function_definition
        has: { field: return_type, matches: narrow-annotation }
---
id: ty-ignore-comment
language: python
rule:
  kind: comment
  regex: \bty:\s*ignore\b
---
id: unannotated-return
language: python
rule:
  kind: function_definition
  not: { has: { field: return_type, kind: type } }
---
id: container-isinstance
language: python
rule:
  kind: call
  all:
    - has: { field: function, regex: ^isinstance$ }
    - has:
        field: arguments
        has:
          nthChild: 2
          regex: \b(list|dict|tuple|set|frozenset|Mapping|MutableMapping|Sequence|MutableSequence)\b
---
id: inline-script-metadata
language: python
rule:
  kind: comment
  regex: ^#\s*///\s*script\s*$
