id: lazy-import
language: python
rule:
  any:
    - pattern: __lazy_modules__ = $X
    - all:
        - any:
            - kind: ERROR
            - kind: expression_statement
        - regex: ^lazy$
        - precedes:
            any:
              - kind: import_statement
              - kind: import_from_statement
---
id: pydantic-model
language: python
rule:
  kind: class_definition
  has:
    field: superclasses
    has: { regex: ^(pydantic\.)?BaseModel$ }
---
id: pydantic-validate-call
language: python
rule:
  kind: decorator
  regex: ^@(pydantic\.)?validate_call\b
---
id: division
language: python
rule:
  kind: binary_operator
  all:
    - has: { field: operator, regex: ^//?$ }
    - has:
        field: right
        any:
          - kind: identifier
          - kind: attribute
          - kind: subscript
          - kind: call
---
id: owned-decorator
language: python
rule:
  kind: function_definition
  has:
    field: body
    all:
      - has:
          stopBy: end
          kind: function_definition
          has: { field: name, pattern: $W }
      - has:
          kind: return_statement
          has: { kind: identifier, pattern: $W }
---
id: conditional-binding
language: python
rule:
  kind: if_statement
  all:
    - has:
        field: consequence
        has:
          kind: expression_statement
          has:
            kind: assignment
            has: { field: left, kind: identifier, pattern: $N }
    - precedes:
        stopBy: end
        has: { stopBy: end, kind: identifier, pattern: $N }
    - not:
        any:
          - has: { kind: else_clause }
          - follows:
              stopBy: end
              has:
                stopBy: end
                kind: assignment
                has: { field: left, pattern: $N }
---
id: optional-truthiness
language: python
rule:
  any:
    - kind: if_statement
    - kind: elif_clause
  all:
    - has:
        field: condition
        any:
          - kind: identifier
            pattern: $P
          - kind: not_operator
            has: { field: argument, kind: identifier, pattern: $P }
    - inside:
        stopBy: end
        kind: function_definition
        has:
          field: parameters
          has:
            any:
              - kind: typed_parameter
              - kind: typed_default_parameter
            all:
              - has: { kind: identifier, pattern: $P }
              - has:
                  field: type
                  regex: ^(Optional\[(int|float|str|bytes|list|dict|set|tuple|Decimal)\b.*\]|(int|float|str|bytes|list|dict|set|tuple|Decimal)\b.*\|\s*None|None\s*\|\s*(int|float|str|bytes|list|dict|set|tuple|Decimal)\b.*)$
---
id: dynamic-return
language: python
rule:
  kind: return_statement
  all:
    - has: { matches: dynamic-value }
    - inside:
        stopBy: end
        kind: function_definition
        has: { field: return_type, matches: narrow-annotation }
---
id: dynamic-assignment
language: python
rule:
  kind: assignment
  all:
    - has: { field: type, matches: narrow-annotation }
    - has: { field: right, matches: dynamic-value }
---
id: dynamic-yield
language: python
rule:
  kind: yield
  all:
    - has: { matches: dynamic-value }
    - inside:
        stopBy: end
        kind: function_definition
        has: { field: return_type, matches: narrow-annotation }
---
id: unannotated-return
language: python
rule:
  kind: function_definition
  not: { has: { field: return_type, kind: type } }
---
id: container-isinstance
language: python
rule:
  kind: call
  all:
    - has: { field: function, regex: ^isinstance$ }
    - has:
        field: arguments
        has:
          nthChild: 2
          regex: \b(list|dict|tuple|set|frozenset|Mapping|MutableMapping|Sequence|MutableSequence)\b
---
id: inline-script-metadata
language: python
rule:
  kind: comment
  regex: ^#\s*///\s*script\s*$
