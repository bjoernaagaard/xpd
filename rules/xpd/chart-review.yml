facts:
  - id: canvas
    text: "Drawn canvas width and height in pixels and the number of panels. A single panel taller than wide is named."
  - id: values
    text: "Number of values drawn per trace and in total, by mark (pie wedges, bars, line or scatter points), and values per square inch of canvas."
  - id: colors
    text: "Resolved color, line dash and marker of each trace, and whether direct labels exist. A pair told apart only by red against green is named."
  - id: x-values
    text: "The plotted x values of each trace, and the years they span when they are dates or years."
  - id: text
    text: "The title, the axis titles, the tick label angle and the annotations, and the text written in capitals."
  - id: axes
    text: "Resolved axis ranges, secondary axes, grid lines, box frames, and tick counts compared with plotted data points."
  - id: banking
    text: "Median absolute slope angle of line segments in pixels, checking whether a time-series aspect ratio banks near 45 degrees."
  - id: table-borders
    text: "Table cell borders, vertical gridlines, and alternating row striping in Plotly go.Table and AG Grid."
  - id: table-numbers
    text: "Numeric column formatting, decimal consistency, alignment, and zero versus missing value presentation in tables."
  - id: table-structure
    text: "Table row count, topical row grouping, header clarity, and alphabetical versus value-based row ordering."
questions:
  - id: show-the-data
    page: 13
    line: 108
    chapter: "1 Graphical Excellence"
    principle: "Show the data"
    text: "Does the chart show the observations themselves, so a reader sees what a summary statistic or a fitted line would hide?"
    look: "Whether points or values are drawn or only an aggregate, and whether a fitted line runs through the middle of the points as its own trace."
    kinds: ["any"]
    facts: []
    plotly: "Draw the observations with px.scatter or px.line(markers=True) and add a fit as a separate trace."
    rules: ["heatmap-smoothing", "spline-line"]
    covers: [108, 118, 983]
    mode: "judgment"
  - id: substance
    page: 13
    line: 109
    chapter: "1 Graphical Excellence"
    principle: "Substance over method"
    text: "Does the design send the reader to the substance of the data rather than to the method, the graphic design or the software, and would someone who knows the subject and the statistics stand behind it?"
    look: "Decoration and software defaults that draw the eye, and patterns that could be noise or an artifact of how the data were collected."
    kinds: ["any", "table"]
    facts: []
    plotly: "Start from template=\"simple_white\" and remove what does not serve the data."
    rules: []
    covers: [109, 514, 1346, 3212, 3268, 3658, 5238, 7982]
    mode: "judgment"
  - id: compare
    page: 13
    line: 113
    chapter: "1 Graphical Excellence"
    principle: "Encourage comparison"
    text: "Are the values the reader must compare placed side by side in one view, with marks of the same shape on a common scale?"
    look: "Comparisons split over separate charts, tabs or pages, and different shapes or scales for the things compared."
    kinds: ["any", "table"]
    facts: []
    plotly: "Put the compared series in one figure or in facet_col panels with shared axes."
