facts:
  - id: "L21"
    text: "Melt wide files whose column names are values and read low-cardinality text as category."
    how: "Adapter keeps both findings verbatim from py/profile.py: values-as-column-names at 3 or more shared names, and category-candidate when category memory is under half."
  - id: "L22"
    text: "Report dtype, null count, distinct count and memory for every column."
    how: "Reused as the base row of py/data_facts.py, which imports the profile column loop and adds the fields below per column."
  - id: "L23"
    text: "Count sentinel and fake-zero values in every column and in the target."
    how: "Per column, share of values in {-999, -9999, 999, 9999, -1 on non-negative columns} and share of exact 0, printed as sentinel_share and zero_share."
  - id: "L24"
    text: "Report whether columns go missing together."
    how: "Pairwise Pearson correlation of isna masks for columns with any missing, pairs with |r|>=0.3 listed. Needs at least 30 rows, else null."
  - id: "L25"
    text: "Report duplicated values of each likely key column and of full rows."
    how: "For columns named id, key or ending _id, plus the first column: duplicate share and largest repeat count. Full-row duplicate share for every frame."
  - id: "L26"
    text: "Report skewness and excess kurtosis for every numeric column and the target."
    how: "scipy.stats.skew and kurtosis on non-null values; probe gave amount skew 9.87 kurtosis 95.45, income 0.07 and -0.10, target 4.86 and 37.05."
  - id: "L27"
    text: "Report zero inflation and the share of outliers for each column and the target."
    how: "Zero share above 0.5 on a numeric column flags zero-inflated. Outlier share outside 1.5 IQR fences; probe gave amount 0.080, target 0.087, income 0.006."
  - id: "L28"
    text: "Recommend one scaler or none for each numeric column and for the target."
    how: "Decision tree in spec.md section 4, using L23, L26 and L27 and the model family the adapter is told. Names verified on scikit-learn 1.9.1: StandardScaler, RobustScaler, QuantileTransformer, PowerTransformer, TransformedTargetRegressor."
  - id: "L29"
    text: "State whether the target is positive, right-skewed and fit for a log or power transform."
    how: "Target min, skew and zero share. log1p only when min>=0, Box-Cox path of PowerTransformer only when min>0, both wrapped in TransformedTargetRegressor per L28."
  - id: "L30"
    text: "Read the step pipeline and the columns each step needs before changing a step."
    how: "data-prep list embeds xpd graph pipelines and source columns for the measured files; no new graph code."
  - id: "L31"
    text: "Prove a preparation rewrite equal with xpd equiv before its gate."
    how: "Gate instruction in the skill: a fix that only reorders preparation runs xpd equiv old.py new.py and keeps the JSON line in the plan reason; the ledger itself runs checks, not equiv."
  - id: "L48"
    text: "A non-pandas (polars or numpy) preparation file still gets a checklist."
    how: "Checklist is built from the adapter data file columns, not from pandas code, so polars and numpy projects work. The playbook pipe shape binds only pandas fixes."
  - id: "L53"
    text: "State the model family before accepting a no-scaling recommendation."
    how: "Adapter flag --adapter file defines columns() or prints JSON with model_family tree, linear, knn, svm, neural or unknown. A pure tree pipeline gets no scaling per column; unknown defaults to the distribution rules in L28 and the checklist asks."
  - id: "L54"
    text: "Check that no exact duplicate row sits on both sides of the split."
    how: "Adapter reports full-row duplicate share (L25). Above 0, the checklist duplicate question must be answered pass only with deduplication or a group-aware split named in the reason."
questions:
  - id: "outlier-meaning"
    text: "Is each outlier in this column an error or a real extreme, and should it be clipped, kept or dropped?"
    look: "The adapter outlier share, the 10 largest values and whether they recur. Clip or drop only errors; keep real extremes and prefer RobustScaler or QuantileTransformer."
  - id: "missing-meaning"
    text: "What does a missing value in this column mean: not measured, not applicable, or a value of its own?"
    look: "Missing share, missingness correlation with other columns and the target, and whether missing rows differ on the target. The answer picks drop, SimpleImputer inside the Pipeline, or a missing category."
  - id: "sentinel-meaning"
    text: "Is a sentinel such as -999 or a fake zero in this column a code for missing, and where is it replaced?"
    look: "Sentinel and zero shares from the adapter and every place the value is compared or replaced. Replace before any imputer or scaler is fitted."
  - id: "duplicate-keys"
    text: "Are the duplicate keys in this column real repeated measures or a join accident?"
    look: "Duplicate share and repeat count from the adapter and the validate value of the joins that built the column. Deduplicate only on proof of an accident."
  - id: "dtype-truth"
    text: "Does the dtype of this column match what the values mean, and did any coercion drop values?"
    look: "Profile dtype, silent-dtype-coercion findings and values that became NaN under errors='coerce'. Fix the source values, then cast explicitly."
  - id: "target-loss"
    text: "For the target column: does the transform still match the loss the business cares about?"
    look: "Target skew, the chosen TransformedTargetRegressor and whether scores are inverse-transformed before the business metric. A log target optimises relative error; if the business loss is absolute money, answer na or accepted with that reason, or drop the transform."
  - id: "target-rows"
    text: "For the target column: is any row with a missing, sentinel or duplicate target dropped before the split, and is that documented?"
    look: "Target null, sentinel and duplicate shares. Dropping target rows before the split is allowed; imputing the target never is."
  - id: "target-leakage"
    text: "Does this column leak the target or the future: was it recorded after the outcome?"
    look: "Column name, graph step that built it and correlation with the target from the adapter. Remove or lag it; no scaler answer settles this."
  - id: "constant-or-id"
    text: "Is this column constant, near-constant or an identifier that must leave the features?"
    look: "Unique count from the profile: 1 distinct value, or unique equal to row count on an id column. Drop it or keep it as a key only."
  - id: "rare-levels"
    text: "For a text or category column: which levels are rare or unseen, and how does the encoder treat them?"
    look: "Distinct count, rarest level share when the adapter is given the file, and the encoder handle_unknown setting. Rare levels are grouped or the encoder ignores unknowns."
  - id: "time-split"
    text: "Is this data ordered by time, and does the split respect that order?"
    look: "a date column in the profile, graph steps that sort, and whether train_test_split uses shuffle on dated rows."
  - id: "zero-inflation"
    text: "Do these zeros represent a separate process?"
    look: "Check the zero share. Consider a separate indicator before scaling the nonzero values."
  - id: "model-family"
    text: "Which model family will consume this feature?"
    look: "Confirm this before skipping scaling or selecting a scaler."
