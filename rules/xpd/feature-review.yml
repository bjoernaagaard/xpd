facts:
  - {"id": "stability", "text": "Measure how every implemented feature varies between development folds.", "how": "For each inner training partition, report usable count and missing share plus numeric median and IQR or categorical vocabulary size."}
  - {"id": "clusters", "text": "Identify numeric features that carry nearly the same signal.", "how": "Compute pairwise Spearman correlations from finite paired inner-training values and return connected components of qualifying edges with coefficients and counts."}
  - {"id": "unseen", "text": "Measure how often a categorical level is absent from the corresponding training vocabulary.", "how": "Count nonmissing inner-validation rows with labels absent from the inner-training vocabulary and divide by nonmissing validation rows."}
  - {"id": "ablation", "text": "Compare each implemented candidate against a fixed baseline on identical development folds.", "how": "Fit fresh baseline and baseline-plus-one pipelines on each inner training partition and report their signed paired score difference on its inner validation partition."}
  - {"id": "protocol", "text": "Keep the final holdout out of feature discovery and comparison.", "how": "Record the development fingerprint, split mode, fold sizes and partition evidence, and reject overlap, invalid chronology or missing group isolation for the declared mode."}
questions:
  - {"id": "lineage", "text": "Which inputs produce this feature and where is it used?", "look": "Read xpd graph nodes, inputs and model consumers, then record the units and where the implementation lives. Run xpd graph on one Driver and review named definitions, inputs, warnings and downstream reads. For rewiring or deduplication cite xpd equiv on matched inputs, including nulls and group boundaries."}
  - {"id": "mechanism", "text": "What process links this input transformation to the target?", "look": "Compare the load and wind forecast vintages and units with the market supply model in mazzi2018pricetaker p. 2177. Check whether both the observed price and the historical mean were available before prediction. Check denominator behavior near zero and whether the price is a published historical value, a known earlier-market price, or the outcome. Cite a library key and page or primary source locator plus the transformation, expected direction and causal path. Trace how net demand moves along the modeled supply curve and check which production sources the proxy leaves out. Compare the ratio proxy with a pre-cutoff capacity margin and check that the feature never uses its own target."}
  - {"id": "availability", "text": "When could the model first know every input to this feature?", "look": "Check actual issue times, forecast horizon, group boundaries, timestamps and the rolling window endpoint. Check source publication timestamps, revisions, predictions by horizon, feature windows and joins. Find provider issue timestamps and original vintages, and separate pre-auction forecasts from final dispatch outcomes. Read the encoder, outer split and inner encoder split, including the temporal or group policy. Inspect the wrapper or time-aware equivalent and the call that transforms the validation rows. Verify value shifting, group order and missing periods against the actual publication lag and forecast horizon."}
  - {"id": "regimes", "text": "Where should the mechanism hold, and where could it fail?", "look": "Compare fold summaries and named operating periods, and cite mechanism evidence for any weakly represented regime. Compare the stage-specific clearing curves and wind forecast error or imbalance. Use dated capacity and fuel conditions together with fold score spread and the direction of the proposed effect. Read timestamps, label availability, split gap and group overlap evidence against the deployment question."}
  - {"id": "value", "text": "What evidence earns this feature a place in the model?", "look": "Read paired fold lift, correlation clusters and unseen counts, then record retain, remove or defer and the reason. Compare correlations and cluster members rather than summing single-feature effects."}
