id: polars-sort-then-head
language: python
severity: info
message: For a small number of rows, top_k or bottom_k can avoid a full sort. Sort the small result if
  its output order matters.
rule:
  all:
  - pattern: $R.sort($$$SORT).head($$$HEAD)
  - not:
      any:
      - all:
        - pattern: $R.sort($COL, descending=True).head($N)
        - has:
            field: function
            has:
              field: object
              has:
                field: arguments
                has:
                  any:
                  - kind: string
                  - kind: list
      - all:
        - pattern: $R.sort($COL).head($N)
        - has:
            field: function
            has:
              field: object
              has:
                field: arguments
                has:
                  any:
                  - kind: string
                  - kind: list
metadata:
  holds:
    R:
      matches: polars-frame
