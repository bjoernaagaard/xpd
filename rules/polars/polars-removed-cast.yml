id: polars-removed-cast
language: python
severity: error
message: Polars 2.1.0 raises ComputeError for a categorical to integer cast. Use to_physical for category
  codes or cast through String to parse numeric labels.
rule:
  kind: call
  all:
  - has:
      field: function
      kind: attribute
      all:
      - has:
          field: object
          all:
          - pattern: $R
          - kind: call
            all:
            - has:
                field: function
                kind: attribute
                all:
                - has:
                    field: object
                    kind: call
                    all:
                    - has:
                        field: function
                        matches:
                          polars-member:
                            MEMBER:
                              regex: ^(Series)$
                    - has:
                        field: arguments
                        has:
                          kind: list
                          all:
                          - has:
                              kind: string
                          - not:
                              has:
                                all:
                                - not:
                                    kind: string
                                - regex: ^[^\s\[\],#]
                          nthChild:
                            position: 1
                            ofRule:
                              not:
                                any:
                                - kind: comment
                                - kind: line_continuation
                    - not:
                        has:
                          field: arguments
                          has:
                            any:
                            - kind: keyword_argument
                              all:
                              - has:
                                  field: name
                                  regex: ^(dtype)$
                            - kind: keyword_argument
                              all:
                              - has:
                                  field: name
                                  regex: ^(values)$
                            - kind: dictionary_splat
                - has:
                    field: attribute
                    regex: ^(cast)$
            - has:
                field: arguments
                has:
                  matches:
                    polars-member:
                      MEMBER:
                        regex: ^(Categorical)$
                  nthChild:
                    position: 1
                    ofRule:
                      not:
                        any:
                        - kind: comment
                        - kind: line_continuation
      - has:
          field: attribute
          regex: ^(cast)$
  - has:
      field: arguments
      has:
        matches:
          polars-member:
            MEMBER:
              regex: ^(Int8|Int16|Int32|Int64|Int128|UInt8|UInt16|UInt32|UInt64)$
        nthChild:
          position: 1
          ofRule:
            not:
              any:
              - kind: comment
              - kind: line_continuation
metadata:
  since: '2.0'
  holds:
    R:
      matches: polars-series
