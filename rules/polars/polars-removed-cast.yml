id: polars-removed-cast
language: python
severity: error
message: Polars 2.1.0 raises InvalidOperationError for this cast. Parse strings with str.to_date.
rule:
  all:
  - pattern: $R.cast($T)
  - has:
      field: function
      kind: attribute
      has:
        field: object
        kind: call
        all:
        - has:
            field: function
            matches:
              polars-member:
                MEMBER:
                  regex: ^(Series)$
        - has:
            field: arguments
            has:
              kind: list
              all:
              - has:
                  kind: string
              - not:
                  has:
                    all:
                    - not:
                        kind: string
                    - regex: ^[^\s\[\],#]
              nthChild:
                position: 1
                ofRule:
                  not:
                    any:
                    - kind: comment
                    - kind: line_continuation
        - not:
            has:
              field: arguments
              has:
                any:
                - kind: keyword_argument
                  all:
                  - has:
                      field: name
                      regex: ^(dtype)$
                - kind: keyword_argument
                  all:
                  - has:
                      field: name
                      regex: ^(values)$
                - kind: dictionary_splat
  - has:
      field: arguments
      has:
        matches:
          polars-member:
            MEMBER:
              regex: ^(Date)$
        nthChild:
          position: 1
          ofRule:
            not:
              any:
              - kind: comment
              - kind: line_continuation
fix: $R.str.to_date()
metadata:
  since: '2.0'
  holds:
    R:
      matches: polars-series
  fix: unsafe
