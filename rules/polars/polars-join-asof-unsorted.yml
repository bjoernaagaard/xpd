id: polars-join-asof-unsorted
language: python
severity: info
message: An as-of join needs ascending join keys. Check that each input is sorted by the join key within
  each group.
rule:
  kind: 'false'
  inside:
    kind: keyword_argument
    field: value
    has: { field: name, regex: '^check_sortedness$' }
    inside:
      kind: argument_list
      inside:
        pattern: $R.join_asof($$$ARGS)
fix: 'True'
metadata:
  fix: unsafe
  holds:
    R:
      matches: polars-frame
