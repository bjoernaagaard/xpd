id: deprecated-in-polars
language: python
severity: info
message: Polars 2.1.0 exposes Utf8 as the same dtype object as String. Use String in new code.
rule:
  all:
  - kind: attribute
    all:
    - has:
        field: object
        pattern: $R
    - has:
        field: attribute
        regex: ^(Utf8)$
  - not:
      inside:
        kind: assignment
        field: left
fix: $R.String
metadata:
  holds:
    R:
      matches: polars-module
  fix: safe
