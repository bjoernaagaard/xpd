id: polars-pandas-api-name
language: python
severity: error
message: Polars 2.1.0 raises AttributeError for groupby. Use group_by instead.
rule:
  all:
  - kind: attribute
    all:
    - has:
        field: object
        pattern: $R
    - has:
        field: attribute
        regex: ^(groupby)$
  - not:
      matches: polars-compatibility-guard
fix: $R.group_by
metadata:
  holds:
    R:
      any:
      - matches: polars-frame
      - matches: polars-series
  fix: unsafe
