id: polars-expr-mask-precedence
language: python
severity: error
message: Polars 2.1.0 raises TypeError for this unparenthesized mask. Enclose each comparison in parentheses
  before combining it.
rule:
  kind: comparison_operator
  all:
  - has:
      all:
      - kind: binary_operator
      - has:
          field: operator
          regex: ^[&|^]$
  - has:
      all:
      - pattern: $R
      - any:
        - kind: identifier
        - kind: call
  - regex: (?:[<>]=?|==|!=)[^\n]*[&|^][^\n]*(?:[<>]=?|==|!=)
  - pattern: $CMP
rewriters:
  - id: split-and
    rule:
      pattern: $L & $R
      inside: { kind: comparison_operator }
    fix: $L) & ($R
  - id: split-or
    rule:
      pattern: $L | $R
      inside: { kind: comparison_operator }
    fix: $L) | ($R
  - id: split-xor
    rule:
      pattern: $L ^ $R
      inside: { kind: comparison_operator }
    fix: $L) ^ ($R
transform:
  SPLIT:
    rewrite: { source: $CMP, rewriters: [split-and, split-or, split-xor] }
fix: ($SPLIT)
metadata:
  holds:
    R:
      matches: polars-element
  fix: unsafe
