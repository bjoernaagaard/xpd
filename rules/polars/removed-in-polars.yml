id: removed-in-polars
language: python
severity: info
message: Polars 2.1.0 ignores POLARS_AUTO_STRUCTIFY. Wrap multiple outputs explicitly with pl.struct.
rule:
  any:
  - all:
    - pattern: $OS.environ[$KEY] = $V
    - has:
        field: left
        kind: subscript
  - pattern: $OS.putenv($KEY, $V)
constraints:
  KEY:
    kind: string
    regex: ^["']POLARS_AUTO_STRUCTIFY["']$
  OS:
    regex: ^(os)$
metadata:
  since: '2.0'
