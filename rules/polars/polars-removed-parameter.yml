severity: error
message: Polars 2.1.0 raises ArgumentRemovedError for rechunk on this call. Call rechunk on the resulting
  DataFrame when you need contiguous chunks.
rule:
  all:
  - pattern: $F($$$ARGS)
  - has:
      field: function
      matches:
        polars-member:
          MEMBER:
            regex: ^(read_csv|read_parquet|read_ipc|read_ndjson|read_ipc_stream)$
  - has:
      field: arguments
      has:
        kind: keyword_argument
        all:
        - has:
            field: name
            regex: ^(rechunk)$
        - has:
            field: value
            kind: 'true'
  - not:
      has:
        field: arguments
        has:
          any:
          - kind: comment
          - kind: line_continuation
  - not:
      matches: polars-compatibility-guard
rewriters:
  - id: drop-rechunk
    rule:
      kind: keyword_argument
      has:
        field: name
        regex: ^(rechunk)$
    fix: ""
  - id: keep-arg
    rule:
      pattern: $ARG
      not:
        any:
        - kind: comment
        - kind: line_continuation
        - kind: keyword_argument
          has:
            field: name
            regex: ^(rechunk)$
    fix: "$ARG, "
transform:
  KEPT:
    rewrite:
      source: $$$ARGS
      rewriters: [drop-rechunk, keep-arg]
      joinBy: ""
  REST:
    replace:
      source: $KEPT
      replace: ", $"
      by: ""
fix: $F($REST).rechunk()
