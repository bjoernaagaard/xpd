id: polars-expr-boolean-op
language: python
severity: error
message: Polars 2.1.0 raises TypeError when a Python boolean operator tests a Polars expression or Series.
  Use parenthesized masks with &, | or ~.
rule:
  all:
  - pattern: $L and $RHS
  - has:
      field: left
      any:
      - all:
        - pattern: $R
        - any:
          - kind: identifier
          - kind: call
      - kind: parenthesized_expression
        has:
          all:
          - kind: comparison_operator
          - has:
              field: operators
              regex: '^(==|!=|<=?|>=?)$'
          - has:
              all:
              - pattern: $R
              - any:
                - kind: identifier
                - kind: call
  - has:
      field: left
      any:
      - kind: parenthesized_expression
      - kind: identifier
      - kind: call
  - has:
      field: right
      any:
      - kind: parenthesized_expression
      - kind: identifier
      - kind: call
fix: $L & $RHS
metadata:
  holds:
    R:
      matches: polars-element
  fix: unsafe
