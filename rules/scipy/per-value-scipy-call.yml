# A scipy.stats distribution frozen once per value of a comprehension, then evaluated. Freezing
# checks the parameters in Python. For 1,000 means and 1,000 points, one call with the means as
# a column ran 4.9 to 18 times faster, and 18 to 49 times for 10 means and 100 points, on float64
# and float32, with bit equal results, in speed/runs/bench.jsonl and bench2.jsonl. No fix,
# because the parameters need an axis when the points are an array too.
id: per-value-scipy-call
language: python
severity: warning
message: This freezes $D once per value of $IT. Call $D.$METH once with np.asarray($IT) in place of $X, as a column with [:, None] when the points are an array, which ran 4.9 to 18 times faster for 1,000 values of $X and 1,000 points.
rule:
  kind: call
  pattern: $CALL
  all:
    - inside: { matches: per-value }
    - has: { field: function, kind: attribute, all: [{ has: { field: attribute, pattern: $METH } }, { has: { field: object, kind: call, all: [{ has: { field: function, any: [{ pattern: $M.$D, matches: stats-module-of }, { kind: identifier, pattern: $D, matches: from-stats-name }] } }, { has: { field: arguments, has: { stopBy: end, pattern: $X } } }] } }] }
constraints:
  D: { regex: '^(alpha|anglit|arcsine|argus|bernoulli|beta|betabinom|betanbinom|betaprime|binom|boltzmann|bradford|burr|burr12|cauchy|chi|chi2|cosine|crystalball|dgamma|dlaplace|dpareto_lognorm|dweibull|erlang|expon|exponnorm|exponpow|exponweib|f|fatiguelife|fisk|foldcauchy|foldnorm|gamma|gausshyper|genexpon|genextreme|gengamma|genhalflogistic|genhyperbolic|geninvgauss|genlogistic|gennorm|genpareto|geom|gibrat|gompertz|gumbel_l|gumbel_r|halfcauchy|halfgennorm|halflogistic|halfnorm|hypergeom|hypsecant|invgamma|invgauss|invweibull|irwinhall|jf_skew_t|johnsonsb|johnsonsu|kappa3|kappa4|ksone|kstwo|kstwobign|landau|laplace|laplace_asymmetric|levy|levy_l|levy_stable|loggamma|logistic|loglaplace|lognorm|logser|loguniform|lomax|maxwell|mielke|moyal|nakagami|nbinom|ncf|nchypergeom_fisher|nchypergeom_wallenius|nct|ncx2|nhypergeom|norm|norminvgauss|pareto|pearson3|planck|poisson|poisson_binom|powerlaw|powerlognorm|powernorm|randint|rayleigh|rdist|recipinvgauss|reciprocal|rel_breitwigner|rice|semicircular|skellam|skewcauchy|skewnorm|studentized_range|t|trapezoid|triang|truncexpon|truncnorm|truncpareto|truncweibull_min|tukeylambda|uniform|vonmises|vonmises_line|wald|weibull_max|weibull_min|wrapcauchy|yulesimon|zipf|zipfian)$' }
  METH: { regex: '^(pdf|logpdf|cdf|logcdf|sf|logsf|ppf|isf|pmf|logpmf)$' }
  X: { kind: identifier }
utils:
  # One for clause over a name, no if clause, and the element is the call itself with the loop
  # name as one of its arguments.
  per-value:
    any: [{ kind: list_comprehension }, { kind: generator_expression }]
    all:
      - has: { field: body, pattern: $CALL }
      - has: { kind: for_in_clause, all: [{ has: { field: left, kind: identifier, pattern: $X } }, { has: { field: right, pattern: $IT } }] }
      - not: { has: { kind: if_clause } }
      - not: { has: { kind: for_in_clause, nthChild: 3 } }
  stats-module-of:
    matches: stats-module
  stats-module:
    any:
      - has: { field: object, regex: '^scipy\.stats$' }
      - all:
          - has: { field: object, pattern: $S.stats }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $S } }] } } }
      - all:
          - has: { field: object, pattern: $M }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.stats$' } }, { has: { field: alias, pattern: $M } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $M, regex: '^stats$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^stats$' } }, { has: { field: alias, pattern: $M } }] }
  from-stats-name:
    inside:
      stopBy: end
      kind: module
      has:
        kind: import_from_statement
        all: [{ has: { field: module_name, regex: '^scipy\.stats$' } }, { has: { kind: dotted_name, pattern: $D } }]
