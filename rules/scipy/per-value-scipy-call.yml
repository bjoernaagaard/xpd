# stats.scoreatpercentile sorts its data again on every call, and it takes a sequence of
# percentiles. For 1,000 percentiles of 1,000 values one call ran 2.1 to 3.2 times faster, and
# 1.12 to 1.17 times for 10 percentiles of 100 values, on float64 and float32, in
# speed/runs/bench_stats.jsonl and bench_stats2.jsonl. No fix, because the comprehension may
# feed a list where the call returns an array.
id: per-value-scipy-call
language: python
severity: warning
message: This calls $F once per value of $IT, and each call sorts the data again. Pass np.asarray($IT) as the percentiles in one call, which sorts once and ran 2.1 to 3.2 times faster for 1,000 percentiles of 1,000 values.
rule:
  kind: call
  pattern: $CALL
  all:
    - inside: { matches: per-value }
    - has: { field: function, any: [{ pattern: $M.$F, matches: stats-module }, { kind: identifier, pattern: $F, matches: from-stats-name }] }
    - has: { field: arguments, has: { nthChild: 2, pattern: $X } }
constraints:
  F: { regex: '^scoreatpercentile$' }
  X: { kind: identifier }
utils:
  # One for clause over a name, no if clause, and the element is the call itself with the loop
  # name as one of its arguments.
  per-value:
    any: [{ kind: list_comprehension }, { kind: generator_expression }]
    all:
      - has: { field: body, pattern: $CALL }
      - has: { kind: for_in_clause, all: [{ has: { field: left, kind: identifier, pattern: $X } }, { has: { field: right, pattern: $IT } }] }
      - not: { has: { kind: if_clause } }
      - not: { has: { kind: for_in_clause, nthChild: 3 } }
  stats-module:
    any:
      - has: { field: object, regex: '^scipy\.stats$' }
      - all:
          - has: { field: object, pattern: $S.stats }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $S } }] } } }
      - all:
          - has: { field: object, pattern: $M }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.stats$' } }, { has: { field: alias, pattern: $M } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $M, regex: '^stats$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^stats$' } }, { has: { field: alias, pattern: $M } }] }
  from-stats-name:
    inside:
      stopBy: end
      kind: module
      has:
        kind: import_from_statement
        all: [{ has: { field: module_name, regex: '^scipy\.stats$' } }, { has: { kind: dotted_name, pattern: $F } }]
