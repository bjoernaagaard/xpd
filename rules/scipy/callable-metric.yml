# A SciPy metric function passed to cdist or pdist as a callable runs once per pair in Python,
# where the metric's name runs the same metric in C. On 1,000 by 1,000 points the name ran 720
# to 7,600 times faster for euclidean, cityblock and cosine in cdist and euclidean in pdist, and
# 12 to 870 times on 25 by 40 points, on float64 and float32, in speed/runs/bench.jsonl and bench2.jsonl. Unsafe: cosine
# and correlation differ in the last bits, the C metrics cast complex input to float, and V or
# VI given by keyword still reach the named metric.
id: callable-metric
language: python
severity: warning
message: Passing $F as a function makes $CD call it once per pair in Python. Pass the name '$F', which runs the same metric in C and ran 720 to 7,600 times faster on 1,000,000 pairs.
rule:
  any:
    - { pattern: $D.$F, matches: distance-module }
    - { kind: identifier, pattern: $F, matches: from-distance }
  inside:
    any:
      - { kind: argument_list, matches: metric-slot }
      - { kind: keyword_argument, has: { field: name, regex: '^metric$' }, inside: { kind: argument_list, matches: xdist-call } }
constraints:
  CD: { regex: '^(cdist|pdist)$' }
  F: { regex: '^(braycurtis|canberra|chebyshev|cityblock|correlation|cosine|dice|euclidean|hamming|jaccard|jensenshannon|mahalanobis|minkowski|rogerstanimoto|russellrao|seuclidean|sokalsneath|sqeuclidean|yule)$' }
transform:
  NAME: { replace: { source: $F, replace: '^(.*)$', by: "'$1'" } }
fix: $NAME
metadata: { fix: unsafe }
utils:
  xdist-call:
    inside:
      kind: call
      has:
        field: function
        any:
          - { pattern: $X.$CD, matches: xdist-module }
          - { kind: identifier, pattern: $CD, matches: from-xdist }
  # The third positional argument of cdist or the second of pdist.
  metric-slot:
    matches: xdist-call
    any:
      - all: [{ has: { nthChild: 3, any: [{ pattern: $D.$F }, { pattern: $F }] } }, { inside: { kind: call, has: { field: function, regex: 'cdist$' } } }]
      - all: [{ has: { nthChild: 2, any: [{ pattern: $D.$F }, { pattern: $F }] } }, { inside: { kind: call, has: { field: function, regex: 'pdist$' } } }]
  distance-module:
    any:
      - has: { field: object, regex: '^scipy\.spatial\.distance$' }
      - all:
          - has: { field: object, pattern: $S.spatial.distance }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $S } }] } } }
      - all:
          - has: { field: object, pattern: $P.distance }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.spatial$' } }, { has: { field: alias, pattern: $P } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $P, regex: '^spatial$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^spatial$' } }, { has: { field: alias, pattern: $P } }] }
      - all:
          - has: { field: object, pattern: $D }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.spatial\.distance$' } }, { has: { field: alias, pattern: $D } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy\.spatial$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $D, regex: '^distance$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^distance$' } }, { has: { field: alias, pattern: $D } }] }
  from-distance:
    inside:
      stopBy: end
      kind: module
      has:
        kind: import_from_statement
        all: [{ has: { field: module_name, regex: '^scipy\.spatial\.distance$' } }, { has: { kind: dotted_name, pattern: $F } }]
  xdist-module:
    any:
      - has: { field: object, regex: '^scipy\.spatial\.distance$' }
      - all:
          - has: { field: object, pattern: $S.spatial.distance }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $S } }] } } }
      - all:
          - has: { field: object, pattern: $P.distance }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.spatial$' } }, { has: { field: alias, pattern: $P } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $P, regex: '^spatial$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^spatial$' } }, { has: { field: alias, pattern: $P } }] }
      - all:
          - has: { field: object, pattern: $X }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.spatial\.distance$' } }, { has: { field: alias, pattern: $X } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy\.spatial$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $X, regex: '^distance$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^distance$' } }, { has: { field: alias, pattern: $X } }] }
  from-xdist:
    inside:
      stopBy: end
      kind: module
      has:
        kind: import_from_statement
        all: [{ has: { field: module_name, regex: '^scipy\.spatial\.distance$' } }, { has: { kind: dotted_name, pattern: $CD } }]
