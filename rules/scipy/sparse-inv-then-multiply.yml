language: python
severity: warning
message: inv($A) builds the whole inverse, which is dense for most sparse matrices. Write spsolve($A, $B) from scipy.sparse.linalg, which ran 260 to 620 times faster with an inverse of 1,000,000 values.
rule:
  any:
    - pattern: $F($A) @ $B
    - pattern: $F($A).dot($B)
  has: { stopBy: end, kind: identifier, pattern: $F, matches: from-sparse-linalg }
constraints:
  F: { regex: '^inv$' }
utils:
  sparse-linalg:
    any:
      - has: { field: object, regex: '^scipy\.sparse\.linalg$' }
      - all:
