# stats.mode(x)[0][0] raises IndexError for 1-D x, in runs/probe3.jsonl. keepdims=True gives back
# the old shape, but for 2-D x the old form returns the mode of the first column today and the
# fix returns the first row, so the fix is unsafe. Humans made this change in statsmodels
# b24e6d2a8e.
id: mode-keepdims
language: python
severity: error
message: stats.mode returns plain values unless keepdims=True, so [0][0] or [1][0] on its result raises IndexError
  for 1-D input. Pass keepdims=True, or drop the second index.
rule:
  all:
  - any:
    - {kind: dictionary_splat}
    - {kind: keyword_argument}
    - {kind: list_splat}
    - {kind: parenthesized_expression}
    - {kind: as_pattern}
    - {kind: boolean_operator}
    - {kind: comparison_operator}
    - {kind: conditional_expression}
    - {kind: lambda}
    - {kind: named_expression}
    - {kind: not_operator}
    - {kind: attribute}
    - {kind: await}
    - {kind: binary_operator}
    - {kind: call}
    - {kind: concatenated_string}
    - {kind: dictionary}
    - {kind: dictionary_comprehension}
    - {kind: ellipsis}
    - {kind: 'false'}
    - {kind: float}
    - {kind: generator_expression}
    - {kind: identifier}
    - {kind: integer}
    - {kind: list}
    - {kind: list_comprehension}
    - {kind: none}
    - {kind: set}
    - {kind: set_comprehension}
    - {kind: string}
    - {kind: subscript}
    - {kind: 'true'}
    - {kind: tuple}
    - {kind: unary_operator}
  - inside:
      kind: argument_list
      inside:
        kind: call
        all:
        - has:
            field: function
            any:
            - {regex: ^scipy\.stats\.(mode)$, pattern: scipy.stats.$F}
            - all:
              - {regex: \.stats\.(mode)$, pattern: $R.stats.$F}
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: import_statement
                      has:
                        kind: aliased_import
                        all:
                        - has: {field: name, regex: ^scipy$}
                        - has: {field: alias, pattern: $R}
            - all:
              - {regex: \.(mode)$, pattern: $R.$F}
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: import_statement
                      has:
                        kind: aliased_import
                        all:
                        - has: {field: name, regex: ^scipy\.stats$}
                        - has: {field: alias, pattern: $R}
                    - kind: import_from_statement
                      all:
                      - has: {field: module_name, regex: ^scipy$}
                      - any:
                        - has: {kind: dotted_name, pattern: $R, regex: ^stats$}
                        - has:
                            kind: aliased_import
                            all:
                            - has: {field: name, regex: ^stats$}
                            - has: {field: alias, pattern: $R}
            - all:
              - {kind: identifier, regex: ^(mode)$, pattern: $F}
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: import_from_statement
                      all:
                      - has: {field: module_name, regex: ^scipy\.stats$}
                      - has: {kind: dotted_name, pattern: $F}
            - all:
              - {kind: identifier, pattern: $F_AS}
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    any:
                    - kind: import_from_statement
                      all:
                      - has: {field: module_name, regex: ^scipy\.stats$}
                      - has:
                          kind: aliased_import
                          all:
                          - has: {field: name, pattern: $F, regex: ^(mode)$}
                          - has: {field: alias, pattern: $F_AS}
        - not:
            has:
              field: arguments
              has:
                kind: keyword_argument
                has: {field: name, regex: ^(keepdims|axis)$}
        - not:
            has:
              field: arguments
              has: {kind: dictionary_splat}
        - not:
            has:
              field: arguments
              has: {kind: list_splat}
        - not:
            all:
            - has:
                field: arguments
                has:
                  nthChild: 4
                  not:
                    any:
                    - {kind: keyword_argument}
                    - {kind: list_splat}
                    - {kind: dictionary_splat}
            - not:
                has:
                  field: arguments
                  has: {kind: list_splat}
        - inside:
            kind: subscript
            field: value
            has: {field: subscript, regex: '^[01]$'}
            inside:
              kind: subscript
              field: value
              has: {field: subscript, regex: ^0$}
  - nthChild:
      position: 1
      reverse: true
      ofRule:
        not: {kind: comment}
  - {pattern: $LAST}
constraints:
  F: {regex: ^mode$}
fix: $LAST, keepdims=True
metadata: {fix: unsafe}
