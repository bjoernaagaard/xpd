                          any:
                          - kind: import_statement
                            has:
                              kind: aliased_import
                              all:
                              - has: {field: name, regex: ^scipy\.spatial$}
                              - has: {field: alias, pattern: $Q}
                          - kind: import_from_statement
                            all:
                            - has: {field: module_name, regex: ^scipy$}
                            - any:
                              - has: {kind: dotted_name, pattern: $Q, regex: ^spatial$}
                              - has:
                                  kind: aliased_import
                                  all:
                                  - has: {field: name, regex: ^spatial$}
                                  - has: {field: alias, pattern: $Q}
                  - all:
                    - {kind: identifier, regex: ^((cKDTree))$, pattern: $F}
                    - inside:
                        stopBy: end
                        kind: module
                        has:
                          stopBy: end
                          any:
                          - kind: import_from_statement
                            all:
                            - has: {field: module_name, regex: ^scipy\.spatial$}
                            - has: {kind: dotted_name, pattern: $F}
                  - all:
                    - {kind: identifier, pattern: $F_AS}
                    - inside:
                        stopBy: end
                        kind: module
                        has:
                          any:
                          - kind: import_from_statement
                            all:
                            - has: {field: module_name, regex: ^scipy\.spatial$}
                            - has:
                                kind: aliased_import
                                all:
                                - has: {field: name, pattern: $F, regex: ^((cKDTree))$}
                                - has: {field: alias, pattern: $F_AS}
            - all:
              - has: {field: object, kind: identifier, pattern: $T}
              - inside:
                  stopBy: end
                  any:
                  - {kind: function_definition}
                  - {kind: module}
                  has:
                    stopBy: end
                    kind: assignment
                    all:
                    - has: {field: left, pattern: $T}
