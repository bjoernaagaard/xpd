                  stopBy: end
                  any:
                  - kind: import_from_statement
                    all:
                    - has: {field: module_name, regex: ^scipy\.integrate$}
                    - has: {kind: dotted_name, pattern: $F}
          - all:
            - {kind: identifier, pattern: $F_AS}
            - inside:
                stopBy: end
                kind: module
                has:
                  any:
                  - kind: import_from_statement
                    all:
                    - has: {field: module_name, regex: ^scipy\.integrate$}
                    - has:
                        kind: aliased_import
                        all:
                        - has: {field: name, pattern: $F, regex: ^(cumulative_trapezoid)$}
                        - has: {field: alias, pattern: $F_AS}
constraints:
  F: {regex: ^cumulative_trapezoid$}
