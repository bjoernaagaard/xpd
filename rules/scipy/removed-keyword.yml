# cumulative_trapezoid raises ValueError for an initial other than 0 or None, scipy/integrate/_quadrature.py line 346.
# No fix, because the message names two rewrites, and the code does not show whether initial was a
# first value or an offset.
id: removed-keyword
language: python
severity: error
message: cumulative_trapezoid raises ValueError for an initial other than 0 or None. Write initial=0, and add the
  start value to the result if it is an offset.
rule:
  kind: keyword_argument
  all:
  - has: {field: name, regex: ^initial$}
  - has:
      field: value
      any:
      - kind: integer
        not: {regex: ^0+$}
      - kind: float
        not: {regex: '^0*\.0*$|^0+\.?0*([eE][-+]?\d+)?$'}
      - {kind: unary_operator}
  inside:
    kind: argument_list
    inside:
      kind: call
      all:
      - has:
          field: function
          any:
          - {regex: ^scipy\.integrate\.(cumulative_trapezoid)$, pattern: scipy.integrate.$F}
          - all:
            - {regex: \.integrate\.(cumulative_trapezoid)$, pattern: $R.integrate.$F}
            - inside:
                stopBy: end
                kind: module
                has:
                  stopBy: end
                  any:
                  - kind: import_statement
                    has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^scipy$}
                      - has: {field: alias, pattern: $R}
          - all:
            - {regex: \.(cumulative_trapezoid)$, pattern: $R.$F}
            - inside:
                stopBy: end
                kind: module
                has:
                  stopBy: end
                  any:
                  - kind: import_statement
                    has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^scipy\.integrate$}
                      - has: {field: alias, pattern: $R}
                  - kind: import_from_statement
                    all:
                    - has: {field: module_name, regex: ^scipy$}
                    - any:
                      - has: {kind: dotted_name, pattern: $R, regex: ^integrate$}
                      - has:
                          kind: aliased_import
                          all:
                          - has: {field: name, regex: ^integrate$}
                          - has: {field: alias, pattern: $R}
          - all:
            - {kind: identifier, regex: ^(cumulative_trapezoid)$, pattern: $F}
