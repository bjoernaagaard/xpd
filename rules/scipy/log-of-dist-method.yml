# Measured at one shape per distribution in research/scipy-rules/digits/runs/dists.jsonl. A
# distribution is listed only where the bar held in a tail and the log method was never 1 digit or
# more worse than the log of the value. binom.logpmf lost up to 3.6 digits more near the mode, so
# binom is not listed. Unsafe. The last bits change, and a subclass can define the two methods
# apart.
id: log-of-dist-method
language: python
severity: warning
message: $R.$M underflows to 0 far in a tail, so np.log of it gives -inf there. In the runs that lost up to all 16 digits, and $R.log$M was never a digit worse. Write $R.log$M($$$A).
rule: { pattern: $NP.log($R.$M($$$A)) }
constraints:
  NP: { regex: '^(np|numpy)$' }
  M: { regex: '^(pdf|pmf)$' }
  R:
    any:
      - all: [{ matches: scipy-dist }, { regex: '(^|\.)(norm|chi2|gamma|expon|logistic|beta|lognorm|cauchy|poisson|geom)$' }]
      - { kind: call, has: { field: function, all: [{ matches: scipy-dist }, { regex: '(^|\.)(norm|chi2|gamma|expon|logistic|beta|lognorm|cauchy|poisson|geom)$' }] } }
fix: $R.log$M($$$A)
metadata: { fix: unsafe }
utils:
  scipy-dist:
    any:
      - { kind: attribute, has: { field: object, matches: stats-module } }
      - matches: stats-name
  stats-module:
    any:
      - { kind: attribute, regex: '^scipy\.stats$' }
      - all:
          - { kind: attribute, pattern: $SCIPY_.stats }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $SCIPY_ } }] } } }
      - all:
          - { kind: identifier, pattern: $MOD_ }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.stats$' } }, { has: { field: alias, pattern: $MOD_ } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $MOD_, regex: '^stats$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^stats$' } }, { has: { field: alias, pattern: $MOD_ } }] }
  stats-name:
    all:
      - { kind: identifier, pattern: $NAME_ }
      - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^scipy\.stats$' } }, { has: { kind: dotted_name, pattern: $NAME_ } }] } }
---
