                            field: alias
                            inside: {kind: import_statement}
                            not:
                              has: {field: name, regex: ^(scipy)$}
                        - inside:
                            kind: dotted_name
                            inside: {kind: import_from_statement, field: name}
                            not:
                              all:
                              - {regex: ^(scipy)$}
                              - &id001
                                inside:
                                  kind: import_from_statement
                                  has: {field: module_name, regex: ^$}
                        - inside:
                            kind: aliased_import
                            field: alias
                            inside: {kind: import_from_statement}
                            not:
                              all:
                              - has: {field: name, regex: ^(scipy)$}
                              - *id001
                      - kind: import_from_statement
                        has: {kind: wildcard_import}
                        not:
                          has: {field: module_name, regex: ^$}
            - all:
              - {regex: \.io\.(hb_read)$, pattern: $R.io.$F}
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: import_statement
                      has:
                        kind: aliased_import
                        all:
                        - has: {field: name, regex: ^scipy$}
                        - has: {field: alias, pattern: $R}
              - not:
                  inside:
                    stopBy: end
                    kind: module
                    has:
                      stopBy: end
                      any:
                      - kind: identifier
                        pattern: $R
                        any:
                        - nthChild: 1
                          inside:
                            kind: dotted_name
                            inside: {kind: import_statement, field: name}
                            not: {regex: ^(scipy)(\.|$)}
                        - inside:
                            kind: aliased_import
                            field: alias
                            inside: {kind: import_statement}
                            not:
                              has: {field: name, regex: ^(scipy)$}
                        - inside:
                            kind: dotted_name
                            inside: {kind: import_from_statement, field: name}
                            not:
                              all:
                              - {regex: ^(scipy)$}
                              - &id002
                                inside:
                                  kind: import_from_statement
                                  has: {field: module_name, regex: ^$}
                        - inside:
                            kind: aliased_import
                            field: alias
                            inside: {kind: import_from_statement}
                            not:
                              all:
                              - has: {field: name, regex: ^(scipy)$}
                              - *id002
                      - kind: import_from_statement
                        has: {kind: wildcard_import}
                        not:
                          has: {field: module_name, regex: ^$}
            - all:
              - {regex: \.(hb_read)$, pattern: $R.$F}
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: import_statement
                      has:
