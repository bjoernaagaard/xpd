# gmres warns DeprecationWarning when callback is set and callback_type is not, and then
# sets callback_type to 'legacy', scipy/sparse/linalg/_isolve/iterative.py lines 680 to 695, so the
# fix keeps the result. safety/default-that-warns.py checks it.
id: default-that-warns
language: python
severity: warning
message: gmres with callback= and no callback_type= warns DeprecationWarning, because the default will change. Write
  callback_type='legacy' to keep today's calls to the callback, or 'pr_norm' or 'x' for the new ones.
rule:
  kind: keyword_argument
  all:
  - has: {field: name, regex: ^callback$}
  - has: {field: value, pattern: $V}
  inside:
    kind: argument_list
    inside:
      kind: call
      all:
      - has:
          field: function
          any:
          - all:
            - {regex: ^scipy\.sparse\.linalg\.(gmres)$, pattern: scipy.sparse.linalg.$F}
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: scipy
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside: {kind: import_statement, field: name}
                          not: {regex: ^(scipy)(\.|$)}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_statement}
                          not:
                            has: {field: name, regex: ^(scipy)$}
                      - inside:
                          kind: dotted_name
                          inside: {kind: import_from_statement, field: name}
                          not:
                            all:
                            - {regex: ^(scipy)$}
                            - &id001
                              inside:
                                kind: import_from_statement
                                has: {field: module_name, regex: ^$}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_from_statement}
                          not:
                            all:
                            - has: {field: name, regex: ^(scipy)$}
                            - *id001
                    - kind: import_from_statement
                      has: {kind: wildcard_import}
                      not:
                        has: {field: module_name, regex: ^$}
          - all:
            - {regex: \.sparse\.linalg\.(gmres)$, pattern: $R.sparse.linalg.$F}
            - inside:
                stopBy: end
                kind: module
                has:
                  stopBy: end
                  any:
                  - kind: import_statement
                    has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^scipy$}
                      - has: {field: alias, pattern: $R}
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $R
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside: {kind: import_statement, field: name}
                          not: {regex: ^(scipy)(\.|$)}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_statement}
                          not:
                            has: {field: name, regex: ^(scipy)$}
                      - inside:
                          kind: dotted_name
                          inside: {kind: import_from_statement, field: name}
                          not:
                            all:
                            - {regex: ^(scipy)$}
                            - &id002
                              inside:
                                kind: import_from_statement
                                has: {field: module_name, regex: ^$}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_from_statement}
                          not:
                            all:
                            - has: {field: name, regex: ^(scipy)$}
                            - *id002
                    - kind: import_from_statement
                      has: {kind: wildcard_import}
                      not:
                        has: {field: module_name, regex: ^$}
          - all:
            - {regex: \.linalg\.(gmres)$, pattern: $R.linalg.$F}
            - inside:
                stopBy: end
                kind: module
                has:
                  stopBy: end
                  any:
                  - kind: import_statement
                    has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^scipy\.sparse$}
                      - has: {field: alias, pattern: $R}
                  - kind: import_from_statement
                    all:
                    - has: {field: module_name, regex: ^scipy$}
                    - any:
                      - has: {kind: dotted_name, pattern: $R, regex: ^sparse$}
                      - has:
                          kind: aliased_import
                          all:
                          - has: {field: name, regex: ^sparse$}
                          - has: {field: alias, pattern: $R}
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $R
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside: {kind: import_statement, field: name}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_statement}
                          not:
                            has: {field: name, regex: ^scipy\.(sparse)$}
                      - inside:
                          kind: dotted_name
                          inside: {kind: import_from_statement, field: name}
                          not:
                            all:
                            - {regex: ^(sparse)$}
                            - &id003
                              inside:
                                kind: import_from_statement
                                has: {field: module_name, regex: ^scipy$}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_from_statement}
                          not:
                            all:
                            - has: {field: name, regex: ^(sparse)$}
                            - *id003
                    - kind: import_from_statement
                      has: {kind: wildcard_import}
                      not:
                        has: {field: module_name, regex: ^scipy$}
          - all:
            - {regex: \.(gmres)$, pattern: $R.$F}
            - inside:
                stopBy: end
                kind: module
                has:
                  stopBy: end
                  any:
                  - kind: import_statement
                    has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^scipy\.sparse\.linalg$}
                      - has: {field: alias, pattern: $R}
                  - kind: import_from_statement
                    all:
                    - has: {field: module_name, regex: ^scipy\.sparse$}
                    - any:
                      - has: {kind: dotted_name, pattern: $R, regex: ^linalg$}
                      - has:
                          kind: aliased_import
                          all:
                          - has: {field: name, regex: ^linalg$}
                          - has: {field: alias, pattern: $R}
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $R
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside: {kind: import_statement, field: name}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_statement}
                          not:
                            has: {field: name, regex: ^scipy\.sparse\.(linalg)$}
                      - inside:
                          kind: dotted_name
                          inside: {kind: import_from_statement, field: name}
                          not:
                            all:
                            - {regex: ^(linalg)$}
                            - &id004
                              inside:
                                kind: import_from_statement
                                has: {field: module_name, regex: ^scipy\.sparse$}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_from_statement}
                          not:
                            all:
                            - has: {field: name, regex: ^(linalg)$}
                            - *id004
                    - kind: import_from_statement
                      has: {kind: wildcard_import}
                      not:
                        has: {field: module_name, regex: ^scipy\.sparse$}
          - all:
            - {kind: identifier, regex: ^(gmres)$, pattern: $F}
            - inside:
                stopBy: end
                kind: module
                has:
                  stopBy: end
                  any:
                  - kind: import_from_statement
                    all:
                    - has: {field: module_name, regex: ^scipy\.sparse\.linalg$}
                    - has: {kind: dotted_name, pattern: $F}
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $F
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside: {kind: import_statement, field: name}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_statement}
                          not:
                            has: {field: name, regex: ^scipy\.sparse\.linalg\.((gmres))$}
                      - inside:
                          kind: dotted_name
                          inside: {kind: import_from_statement, field: name}
                          not:
                            all:
                            - {regex: ^((gmres))$}
                            - &id005
                              inside:
                                kind: import_from_statement
                                has: {field: module_name, regex: ^scipy\.sparse\.linalg$}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_from_statement}
                          not:
                            all:
                            - has: {field: name, regex: ^((gmres))$}
                            - *id005
                    - kind: import_from_statement
                      has: {kind: wildcard_import}
                      not:
                        has: {field: module_name, regex: ^scipy\.sparse\.linalg$}
          - all:
            - {kind: identifier, pattern: $F_AS}
            - inside:
                stopBy: end
                kind: module
                has:
                  any:
                  - kind: import_from_statement
                    all:
                    - has: {field: module_name, regex: ^scipy\.sparse\.linalg$}
                    - has:
                        kind: aliased_import
                        all:
                        - has: {field: name, pattern: $F, regex: ^(gmres)$}
                        - has: {field: alias, pattern: $F_AS}
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $F_AS
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside: {kind: import_statement, field: name}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_statement}
                          not:
                            has: {field: name, regex: ^scipy\.sparse\.linalg\.((gmres))$}
                      - inside:
                          kind: dotted_name
                          inside: {kind: import_from_statement, field: name}
                          not:
                            all:
                            - {regex: ^((gmres))$}
                            - &id006
                              inside:
                                kind: import_from_statement
                                has: {field: module_name, regex: ^scipy\.sparse\.linalg$}
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside: {kind: import_from_statement}
                          not:
                            all:
                            - has: {field: name, regex: ^((gmres))$}
                            - *id006
                    - kind: import_from_statement
                      has: {kind: wildcard_import}
                      not:
                        has: {field: module_name, regex: ^scipy\.sparse\.linalg$}
      - not:
          has:
            field: arguments
            has:
              kind: keyword_argument
              has: {field: name, regex: ^callback_type$}
      - not:
          has:
            field: arguments
            has: {kind: dictionary_splat}
      - has:
          field: function
          any:
          - {kind: identifier, pattern: $ROOT}
          - has:
              stopBy: end
              kind: identifier
              pattern: $ROOT
              inside: {kind: attribute, field: object}
      - not:
          inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              kind: identifier
              pattern: $ROOT
              any:
              - inside:
                  stopBy:
                    not: &id007
                      any:
                      - {kind: pattern_list}
                      - {kind: tuple_pattern}
                      - {kind: list_pattern}
                      - {kind: list_splat_pattern}
                      - {kind: tuple}
                      - {kind: list}
                      - {kind: parenthesized_expression}
                      - {kind: expression_list}
                      - {kind: list_splat}
                  kind: assignment
                  field: left
              - inside:
                  stopBy:
                    not: *id007
                  kind: augmented_assignment
                  field: left
              - inside:
                  stopBy:
                    not: *id007
                  kind: for_statement
                  field: left
              - inside:
                  stopBy:
                    not: *id007
                  kind: for_in_clause
                  field: left
              - inside:
                  stopBy:
                    not: *id007
                  kind: as_pattern_target
              - inside:
                  stopBy:
                    not: *id007
                  kind: delete_statement
              - inside: {kind: named_expression, field: name}
              - inside: {kind: parameters}
              - inside: {kind: lambda_parameters}
              - inside: {kind: typed_parameter}
              - inside: {kind: list_splat_pattern}
              - inside: {kind: dictionary_splat_pattern}
              - inside: {kind: global_statement}
              - inside: {kind: nonlocal_statement}
              - inside: {kind: splat_pattern}
              - inside: {kind: default_parameter, field: name}
              - inside: {kind: typed_default_parameter, field: name}
              - inside: {kind: function_definition, field: name}
              - inside: {kind: class_definition, field: name}
              - inside:
                  kind: as_pattern
                  inside: {kind: case_pattern}
              - inside:
                  kind: dotted_name
                  regex: ^\w+$
                  inside:
                    any:
                    - {kind: case_pattern}
                    - {kind: keyword_pattern}
              - inside:
                  kind: type
                  any:
                  - inside: {kind: type_alias_statement, field: left}
                  - inside: {kind: type_parameter}
constraints:
  F: {regex: ^gmres$}
fix: callback=$V, callback_type='legacy'
metadata: {fix: safe}
