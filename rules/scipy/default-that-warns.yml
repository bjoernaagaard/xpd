# anderson warns FutureWarning without method=, scipy/stats/_morestats.py line 2606. With method= it returns a SignificanceResult with a p-value instead of critical values, so there is no fix.
id: default-that-warns
language: python
severity: warning
message: stats.anderson without method= warns FutureWarning. Pass method='interpolate' or method='monte_carlo',
  and read the p-value from the result instead of comparing with critical_values.
rule:
  kind: call
  all:
  - has:
      field: function
      any:
      - {regex: ^scipy\.stats\.(anderson)$, pattern: scipy.stats.$F}
      - all:
        - {regex: \.stats\.(anderson)$, pattern: $R.stats.$F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_statement
                has:
                  kind: aliased_import
                  all:
                  - has: {field: name, regex: ^scipy$}
                  - has: {field: alias, pattern: $R}
      - all:
        - {regex: \.(anderson)$, pattern: $R.$F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_statement
                has:
                  kind: aliased_import
                  all:
                  - has: {field: name, regex: ^scipy\.stats$}
                  - has: {field: alias, pattern: $R}
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy$}
                - any:
                  - has: {kind: dotted_name, pattern: $R, regex: ^stats$}
                  - has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^stats$}
                      - has: {field: alias, pattern: $R}
      - all:
        - {kind: identifier, regex: ^(anderson)$, pattern: $F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy\.stats$}
                - has: {kind: dotted_name, pattern: $F}
      - all:
        - {kind: identifier, pattern: $F_AS}
        - inside:
            stopBy: end
            kind: module
            has:
              any:
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy\.stats$}
                - has:
                    kind: aliased_import
                    all:
                    - has: {field: name, pattern: $F, regex: ^(anderson)$}
                    - has: {field: alias, pattern: $F_AS}
  - not:
      has:
        field: arguments
        has:
          kind: keyword_argument
          has: {field: name, regex: ^method$}
constraints:
  F: {regex: ^anderson$}
metadata: {since: '1.17'}
