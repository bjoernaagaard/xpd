# hb_read warns DeprecationWarning without spmatrix= and then reads a sparse matrix,
# scipy/io/_harwell_boeing/hb.py line 530, so spmatrix=True keeps the result.
# safety/default-that-warns.py checks it. The deprecated directive dates spmatrix= to 1.18.
id: default-that-warns
language: python
severity: warning
message: hb_read without spmatrix= warns DeprecationWarning, because SciPy 1.20 will return a sparse array. Write
  spmatrix=True to keep the sparse matrix, or spmatrix=False for a sparse array.
rule:
  all:
  - any:
    - {kind: dictionary_splat}
    - {kind: keyword_argument}
    - {kind: list_splat}
    - {kind: parenthesized_expression}
    - {kind: as_pattern}
    - {kind: boolean_operator}
    - {kind: comparison_operator}
    - {kind: conditional_expression}
    - {kind: lambda}
    - {kind: named_expression}
    - {kind: not_operator}
    - {kind: attribute}
    - {kind: await}
    - {kind: binary_operator}
    - {kind: call}
    - {kind: concatenated_string}
    - {kind: dictionary}
    - {kind: dictionary_comprehension}
    - {kind: ellipsis}
    - {kind: 'false'}
    - {kind: float}
    - {kind: generator_expression}
    - {kind: identifier}
    - {kind: integer}
    - {kind: list}
    - {kind: list_comprehension}
    - {kind: none}
    - {kind: set}
    - {kind: set_comprehension}
    - {kind: string}
    - {kind: subscript}
    - {kind: 'true'}
    - {kind: tuple}
    - {kind: unary_operator}
  - inside:
      kind: argument_list
      inside:
        kind: call
        all:
        - has:
            field: function
            any:
            - all:
              - {regex: ^scipy\.io\.(hb_read)$, pattern: scipy.io.$F}
