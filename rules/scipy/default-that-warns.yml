# anderson_ksamp warns UserWarning when variant is not given, scipy/stats/_morestats.py line 2901.
id: default-that-warns
language: python
severity: warning
message: anderson_ksamp without variant= warns UserWarning. Write variant='midrank', today's default, or variant='right'
  or 'continuous', and read the result by attribute because it no longer unpacks as a tuple.
rule:
  kind: call
  all:
  - has:
      field: function
      any:
      - {regex: ^scipy\.stats\.(anderson_ksamp)$, pattern: scipy.stats.$F}
      - all:
        - {regex: \.stats\.(anderson_ksamp)$, pattern: $R.stats.$F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_statement
                has:
                  kind: aliased_import
                  all:
                  - has: {field: name, regex: ^scipy$}
                  - has: {field: alias, pattern: $R}
      - all:
        - {regex: \.(anderson_ksamp)$, pattern: $R.$F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_statement
                has:
                  kind: aliased_import
                  all:
                  - has: {field: name, regex: ^scipy\.stats$}
                  - has: {field: alias, pattern: $R}
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy$}
                - any:
                  - has: {kind: dotted_name, pattern: $R, regex: ^stats$}
                  - has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^stats$}
                      - has: {field: alias, pattern: $R}
      - all:
        - {kind: identifier, regex: ^(anderson_ksamp)$, pattern: $F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy\.stats$}
                - has: {kind: dotted_name, pattern: $F}
      - all:
        - {kind: identifier, pattern: $F_AS}
        - inside:
            stopBy: end
            kind: module
            has:
              any:
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy\.stats$}
                - has:
                    kind: aliased_import
                    all:
                    - has: {field: name, pattern: $F, regex: ^(anderson_ksamp)$}
                    - has: {field: alias, pattern: $F_AS}
  - not:
      has:
        field: arguments
        has:
          kind: keyword_argument
          has: {field: name, regex: ^(variant|midrank)$}
  - not:
      all:
      - has:
          field: arguments
          has:
            nthChild: 2
            not:
              any:
              - {kind: keyword_argument}
              - {kind: list_splat}
              - {kind: dictionary_splat}
      - not:
          has:
            field: arguments
            has: {kind: list_splat}
constraints:
  F: {regex: ^anderson_ksamp$}
metadata: {since: '1.17'}
---
# hb_read warns DeprecationWarning without spmatrix= and then reads a sparse matrix,
# scipy/io/_harwell_boeing/hb.py line 530, so spmatrix=True keeps the result.
# safety/default-that-warns.py checks it. The deprecated directive dates spmatrix= to 1.18.
id: default-that-warns
language: python
severity: warning
message: hb_read without spmatrix= warns DeprecationWarning, because SciPy 1.20 will return a sparse array. Write
  spmatrix=True to keep the sparse matrix, or spmatrix=False for a sparse array.
rule:
  kind: call
  all:
  - has:
      field: function
      any:
      - {regex: ^scipy\.io\.(hb_read)$, pattern: scipy.io.$F}
      - all:
        - {regex: \.io\.(hb_read)$, pattern: $R.io.$F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_statement
                has:
                  kind: aliased_import
                  all:
                  - has: {field: name, regex: ^scipy$}
                  - has: {field: alias, pattern: $R}
      - all:
        - {regex: \.(hb_read)$, pattern: $R.$F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_statement
                has:
                  kind: aliased_import
                  all:
                  - has: {field: name, regex: ^scipy\.io$}
                  - has: {field: alias, pattern: $R}
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy$}
                - any:
                  - has: {kind: dotted_name, pattern: $R, regex: ^io$}
                  - has:
                      kind: aliased_import
                      all:
                      - has: {field: name, regex: ^io$}
                      - has: {field: alias, pattern: $R}
      - all:
        - {kind: identifier, regex: ^(hb_read)$, pattern: $F}
        - inside:
            stopBy: end
            kind: module
            has:
              stopBy: end
              any:
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy\.io$}
                - has: {kind: dotted_name, pattern: $F}
      - all:
        - {kind: identifier, pattern: $F_AS}
        - inside:
            stopBy: end
            kind: module
            has:
              any:
              - kind: import_from_statement
                all:
                - has: {field: module_name, regex: ^scipy\.io$}
                - has:
                    kind: aliased_import
                    all:
                    - has: {field: name, pattern: $F, regex: ^(hb_read)$}
                    - has: {field: alias, pattern: $F_AS}
  - {pattern: $FN($$$A)}
  - not:
      has:
        field: arguments
        has:
          kind: keyword_argument
          has: {field: name, regex: ^spmatrix$}
constraints:
  F: {regex: ^hb_read$}
fix: $FN($$$A, spmatrix=True)
metadata: {fix: safe, since: '1.18'}
---
