# arguments in research/scipy-rules/digits/runs/grid.jsonl, where the old form lost all 16. With
# one argument 2.5 and the other from 1e4 to 1e6 both forms lost up to 5.8 digits. Unsafe. The last
# bits change.
id: log-of-special
language: python
severity: warning
message: $SP.beta($A, $B) underflows to 0 once both arguments pass about 550, so its log is -inf there. At 1e6 and 1e6 that lost all 16 digits where $SP.betaln lost 0.8. Write $SP.betaln($A, $B).
rule: { pattern: '$NP.log($SP.beta($A, $B))' }
constraints:
  NP: { regex: '^(np|numpy)$' }
  SP: { matches: special-module }
