# At 200 np.log(special.factorial) gave inf where gammaln(n + 1) lost no digits, in
# research/scipy-rules/digits/runs/probe.jsonl and research/scipy-rules/digits/runs/grid.jsonl. An
# argument with an operator that binds looser than + is left out, so that $N + 1 keeps its meaning.
# Unsafe. For a negative argument factorial gives 0 and its log -inf, where gammaln gives inf at -1
# and a number at -2.5, in research/scipy-rules/digits/runs/claims.txt.
id: log-of-special
language: python
severity: warning
message: $SP.factorial($N) overflows to inf above 170, so its log is inf there. At 200 that lost all 16 digits where $SP.gammaln($N + 1) lost none. Write $SP.gammaln($N + 1).
rule: { pattern: $NP.log($SP.factorial($N)) }
constraints:
  NP: { regex: '^(np|numpy)$' }
  SP: { matches: special-module }
  N: { not: { any: [{ kind: boolean_operator }, { kind: not_operator }, { kind: comparison_operator }, { kind: conditional_expression }, { kind: lambda }, { kind: binary_operator, has: { field: operator, regex: '^(\||&|\^|<<|>>)$' } }] } }
