# An entry more than 745 below the largest gives -inf, in
# research/scipy-rules/digits/runs/grid.jsonl. For the largest entry both forms lost the same
# digits. log_softmax is new in SciPy 1.5.0. Unsafe. The last bits change.
id: log-of-special
language: python
severity: warning
message: $SP.softmax gives 0 for an entry more than 745 below the largest, so its log is -inf there. With logits 0, -50 and -800 that lost all 16 digits in the last entry where $SP.log_softmax lost none. Write $SP.log_softmax($$$A).
rule: { pattern: $NP.log($SP.softmax($$$A)) }
constraints:
  NP: { regex: '^(np|numpy)$' }
  SP: { matches: special-module }
fix: $SP.log_softmax($$$A)
metadata: { fix: unsafe, since: "1.5" }
utils:
  special-module:
    any:
      - { kind: attribute, regex: '^scipy\.special$' }
      - all:
          - { kind: attribute, pattern: $SCIPY_.special }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $SCIPY_ } }] } } }
      - all:
          - { kind: identifier, pattern: $MOD_ }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.special$' } }, { has: { field: alias, pattern: $MOD_ } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $MOD_, regex: '^special$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^special$' } }, { has: { field: alias, pattern: $MOD_ } }] }
---
# The same forms with the function imported by name. No fix, because the log form is not imported.
# The measurements are those of the documents above.
id: log-of-special
language: python
severity: warning
message: np.log of scipy.special.$F gives inf, -inf or 0 once $F overflows, underflows or rounds to 1, and there that lost all 16 digits where scipy.special.$NEW lost less than 1. Import $NEW and call it instead.
rule: { pattern: $NP.log($F($$$A)) }
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { all: [{ matches: special-name }, { regex: '^(ndtr|gamma|beta|expit|softmax)$' }] }
transform:
  T1: { replace: { source: $F, replace: '^(ndtr|expit|softmax)$', by: 'log_$1' } }
  NEW: { replace: { source: $T1, replace: '^(gamma|beta)$', by: '${1}ln' } }
utils:
  special-name:
    all:
      - { kind: identifier, pattern: $NAME_ }
      - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^scipy\.special$' } }, { has: { kind: dotted_name, pattern: $NAME_ } }] } }
