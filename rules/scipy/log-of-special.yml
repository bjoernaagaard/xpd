# At -40 np.log(special.ndtr) gave -inf where log_ndtr lost 0.15 digits, in
# research/scipy-rules/digits/runs/probe.jsonl, and the bar held for every input below -37.75 in
# research/scipy-rules/digits/runs/grid.jsonl. In the right tail the old form gives 0 above 8.3 and
# log_ndtr lost up to 3 digits, so the message claims only the left tail. Unsafe. The last bits
# change.
id: log-of-special
language: python
severity: warning
message: $SP.ndtr($X) underflows to 0 below about -37.5, so its log is -inf there. At -40 that lost all 16 digits where $SP.log_ndtr lost 0.15. Write $SP.log_ndtr($X).
rule: { pattern: $NP.log($SP.ndtr($X)) }
constraints:
  NP: { regex: '^(np|numpy)$' }
  SP: { matches: special-module }
fix: $SP.log_ndtr($X)
metadata: { fix: unsafe }
utils:
  special-module:
    any:
      - { kind: attribute, regex: '^scipy\.special$' }
      - all:
          - { kind: attribute, pattern: $SCIPY_.special }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $SCIPY_ } }] } } }
      - all:
          - { kind: identifier, pattern: $MOD_ }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.special$' } }, { has: { field: alias, pattern: $MOD_ } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $MOD_, regex: '^special$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^special$' } }, { has: { field: alias, pattern: $MOD_ } }] }
