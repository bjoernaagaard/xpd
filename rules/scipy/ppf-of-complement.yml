# ndtri is odd, so -ndtri(p) is ndtri(1 - p). The old form lost 3 or more digits for p below 5e-7
# in research/scipy-rules/digits/runs/grid.jsonl. The parentheses keep the sign right under ** and
# an attribute. Unsafe. The last bits change.
id: ppf-of-complement
language: python
severity: warning
message: 1 - $P rounds away the digits of a small $P, so $F(1 - $P) lost at least 3 digits for $P below 5e-7 and gives inf below 1.1e-16, where -$F($P) lost none. Write -$F($P).
rule: { any: [{ pattern: $F(1 - $P) }, { pattern: $F(1.0 - $P) }, { pattern: '$F(1. - $P)' }] }
constraints:
  # A probability written as a number is in view. Only one below 5e-7 can lose 3 digits.
  P: { not: { any: [{ kind: integer }, { kind: float, not: { regex: '[eE]-(0?[7-9]|[1-9][0-9])$' } }] } }
  F: { any: [{ kind: attribute, regex: '\.ndtri$', has: { field: object, matches: special-module } }, { all: [{ matches: special-name }, { regex: '^ndtri$' }] }] }
fix: (-$F($P))
metadata: { fix: unsafe }
utils:
  special-module:
    any:
      - { kind: attribute, regex: '^scipy\.special$' }
      - all:
          - { kind: attribute, pattern: $SCIPY_.special }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $SCIPY_ } }] } } }
      - all:
          - { kind: identifier, pattern: $MOD_ }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.special$' } }, { has: { field: alias, pattern: $MOD_ } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $MOD_, regex: '^special$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^special$' } }, { has: { field: alias, pattern: $MOD_ } }] }
  special-name:
    all:
      - { kind: identifier, pattern: $NAME_ }
      - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^scipy\.special$' } }, { has: { kind: dotted_name, pattern: $NAME_ } }] } }
