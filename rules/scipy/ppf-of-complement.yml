# 1 - p keeps only the digits of p above 1e-16. The old form lost 3 or more digits for every p
# below 5e-7, and isf lost less than 1, for each listed distribution in
# research/scipy-rules/digits/runs/ppf.jsonl and research/scipy-rules/digits/runs/grid.jsonl. f is
# not listed because f.isf itself lost 1 or more digits for p from 4e-16 to 1e-3. Discrete
# distributions are not listed, because ppf and isf break ties apart. Unsafe. The last bits change.
id: ppf-of-complement
language: python
severity: warning
message: 1 - $P rounds away the digits of a small $P, so this lost at least 3 digits for $P below 5e-7 and gives the end of the support below 1.1e-16, where $R.isf lost less than 1. Write $R.isf($REST).
rule:
  pattern: $R.ppf($$$ARGS)
  has: { field: arguments, has: { nthChild: 1, any: [{ pattern: 1 - $P }, { pattern: 1.0 - $P }, { pattern: '1. - $P' }] } }
constraints:
  # A probability written as a number is in view. Only one below 5e-7 can lose 3 digits.
  P: { not: { any: [{ kind: integer }, { kind: float, not: { regex: '[eE]-(0?[7-9]|[1-9][0-9])$' } }] } }
  R:
    any:
      - all: [{ matches: scipy-dist }, { regex: '(^|\.)(norm|t|chi2|gamma|expon|logistic|beta|lognorm|cauchy|pareto|laplace)$' }]
      - { kind: call, has: { field: function, all: [{ matches: scipy-dist }, { regex: '(^|\.)(norm|t|chi2|gamma|expon|logistic|beta|lognorm|cauchy|pareto|laplace)$' }] } }
transform:
  REST: { replace: { source: $$$ARGS, replace: '^1(\.0?)?\s*-\s*', by: '' } }
fix: $R.isf($REST)
metadata: { fix: unsafe }
utils:
  scipy-dist:
    any:
      - { kind: attribute, has: { field: object, matches: stats-module } }
      - matches: stats-name
  stats-module:
    any:
      - { kind: attribute, regex: '^scipy\.stats$' }
      - all:
          - { kind: attribute, pattern: $SCIPY_.stats }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $SCIPY_ } }] } } }
      - all:
          - { kind: identifier, pattern: $MOD_ }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.stats$' } }, { has: { field: alias, pattern: $MOD_ } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $MOD_, regex: '^stats$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^stats$' } }, { has: { field: alias, pattern: $MOD_ } }] }
  stats-name:
    all:
      - { kind: identifier, pattern: $NAME_ }
      - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^scipy\.stats$' } }, { has: { kind: dotted_name, pattern: $NAME_ } }] } }
