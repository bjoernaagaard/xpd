# 1 - cdf keeps only the digits of the tail above 1e-16. The bar held in a tail of every listed
# distribution in research/scipy-rules/digits/runs/dists.jsonl, and sf was never 1 digit or more
# worse. For stats.norm the old form lost 3 or more digits above 4.25 and gave 0 above 8.3, in
# research/scipy-rules/digits/runs/grid.jsonl. lognorm, f, poisson, binom and nbinom are not
# listed, because their sf did not meet the bar. Unsafe. The last bits change, and a subclass can
# define sf apart from 1 - cdf.
id: cdf-complement
language: python
severity: warning
message: Subtracting $R.cdf from 1 drops the digits of a small right tail and gives 0 once the cdf rounds to 1. In the runs that lost up to all 16 digits, and $R.sf was never a digit worse. Write $R.sf($$$A).
rule: { all: [{ any: [{ pattern: 1 - $R.cdf($$$A) }, { pattern: 1.0 - $R.cdf($$$A) }, { pattern: '1. - $R.cdf($$$A)' }] }, { not: { has: { stopBy: end, kind: comment } } }] }
constraints:
  R:
    any:
      - all: [{ matches: scipy-dist }, { regex: '(^|\.)(norm|t|chi2|gamma|expon|logistic|beta|cauchy|geom|pareto|laplace)$' }]
      - { kind: call, has: { field: function, all: [{ matches: scipy-dist }, { regex: '(^|\.)(norm|t|chi2|gamma|expon|logistic|beta|cauchy|geom|pareto|laplace)$' }] } }
fix: $R.sf($$$A)
metadata: { fix: unsafe }
utils:
  scipy-dist:
    any:
      - { kind: attribute, has: { field: object, matches: stats-module } }
      - matches: stats-name
  stats-module:
    any:
      - { kind: attribute, regex: '^scipy\.stats$' }
      - all:
          - { kind: attribute, pattern: $SCIPY_.stats }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $SCIPY_ } }] } } }
      - all:
          - { kind: identifier, pattern: $MOD_ }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.stats$' } }, { has: { field: alias, pattern: $MOD_ } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $MOD_, regex: '^stats$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^stats$' } }, { has: { field: alias, pattern: $MOD_ } }] }
  stats-name:
    all:
      - { kind: identifier, pattern: $NAME_ }
      - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^scipy\.stats$' } }, { has: { kind: dotted_name, pattern: $NAME_ } }] } }
---
