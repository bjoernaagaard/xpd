          any: [{ kind: function_definition }, { kind: list }, { kind: tuple }, { kind: dictionary }]
          has: { stopBy: end, kind: identifier, regex: '^((csr|csc|coo|lil|dok|bsr|dia)_array|sparray|eye_array|diags_array|random_array|block_array)$' }
      - inside:
          stopBy: end
          any: [{ kind: if_statement }, { kind: elif_clause }]
          has: { field: condition, regex: 'matrix' }
  from-sparse:
    inside:
      stopBy: end
      kind: module
