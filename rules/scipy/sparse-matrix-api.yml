# The docstring of every sparse matrix class says that SciPy expects to deprecate the sparse
# matrix interface, in research/scipy-rules/src/scipy/scipy/sparse/_csr.py:472 and the same
# warning at _csc.py:299, _coo.py:1820, _lil.py:610, _dok.py:743, _bsr.py:785, _dia.py:628 and
# __init__.py:21. Nothing warns under -W error on 1.18.1, in speed/runs/probe_warn.jsonl. No
# fix, because on a sparse array * and ** work elementwise, a row slice is 1-D, sum(axis=0) is
# 1-D and todense gives an ndarray, in speed/runs/probe_matrix_vs_array.jsonl. The array classes
# carry no versionadded. SciPy 1.7.3 has no csr_array and 1.8.1 has it, in
# research/scipy-rules/runs/since-sparse-arrays.txt.
id: sparse-matrix-api
language: python
severity: info
message: $N builds a sparse matrix, and SciPy's docstring for it says the sparse matrix interface is expected to be deprecated. Write $ARR in new code, and check the code that uses it, because * and ** work elementwise on a sparse array and a row slice of one is 1-D.
rule:
  pattern: $M.$N
  matches: sparse-module
  inside:
    kind: call
    field: function
    not: { matches: chose-matrix }
constraints:
  N: { regex: '^(csr|csc|coo|lil|dok|bsr|dia)_matrix$' }
transform:
  ARR: { replace: { source: $N, replace: '_matrix$', by: _array } }
fix: $M.$ARR
metadata: { since: "1.8", fix: unsafe }
utils:
  chose-matrix:
    any:
      - inside:
          stopBy: end
          any: [{ kind: function_definition }, { kind: list }, { kind: tuple }, { kind: dictionary }]
          has: { stopBy: end, kind: identifier, regex: '^((csr|csc|coo|lil|dok|bsr|dia)_array|sparray|eye_array|diags_array|random_array|block_array)$' }
      - inside:
          stopBy: end
          any: [{ kind: if_statement }, { kind: elif_clause }]
          has: { field: condition, regex: 'matrix' }
  sparse-module:
    any:
      - has: { field: object, regex: '^scipy\.sparse$' }
      - all:
          - has: { field: object, pattern: $S.sparse }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $S } }] } } }
      - inside:
          stopBy: end
          kind: module
          has:
            any:
              - kind: import_statement
                has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.sparse$' } }, { has: { field: alias, pattern: $M } }] }
              - kind: import_from_statement
                all:
                  - has: { field: module_name, regex: '^scipy$' }
                  - any:
                      - has: { kind: dotted_name, pattern: $M, regex: '^sparse$' }
                      - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^sparse$' } }, { has: { field: alias, pattern: $M } }] }
