# Written by research/scipy-rules/removed/gen_rules.py from the probe table in runs/probe.jsonl.
# Every old form here raises under `python -W error` on SciPy 1.18.1, saved in runs/proof.jsonl.
# Code under a SciPy version check, a hasattr check, or a try that catches ImportError or
# AttributeError is left alone, because it exists for old SciPy.
# Each module here lacked an underscore and looked public. SciPy deprecated it, and every name in it
# warns with DeprecationWarning, by R/src/scipy/scipy/_lib/deprecation.py:15 and runs/probe.jsonl.
# The public namespace holds the same object for the names the safe fix covers, by the same_object
# field of runs/probe.jsonl. gen_rules.py writes these documents.
id: deprecated-in-scipy
language: python
severity: warning
message: $PAR.$MOD is a private module that SciPy deprecated, and $PAR.$MOD.$N warns with DeprecationWarning on
  SciPy 1.18.1. Write $PAR.$N, which is the same object.
rule:
  all:
  - kind: attribute
  - has:
      field: object
      kind: attribute
      has:
        field: attribute
        regex: ^(constants|codata)$
  - regex: (^|\.)(codata\.(physical_constants|ConstantWarning|precision|value|find|unit|c)|constants\.(gravitational_constant|convert_temperature|astronomical_unit|degree_Fahrenheit|elementary_charge|Stefan_Boltzmann|fluid_ounce_imp|fine_structure|fluid_ounce_US|kilogram_force|speed_of_light|speed_of_sound|electron_mass|electron_volt|nautical_mile|gas_constant|golden_ratio|neutron_mass|zero_Celsius|Julian_year|atomic_mass|fluid_ounce|pound_force|proton_mass|survey_foot|survey_mile|atmosphere|calorie_IT|calorie_th|gallon_imp|horsepower|light_year|metric_ton|troy_ounce|troy_pound|Boltzmann|arcminute|arcsecond|epsilon_0|gallon_US|lambda2nu|nu2lambda|short_ton|Avogadro|angstrom|long_ton|Rydberg|calorie|hectare|ton_TNT|Btu_IT|Btu_th|Planck|arcmin|arcsec|barrel|degree|gallon|golden|micron|minute|parsec|slinch|alpha|carat|centi|femto|fermi|grain|hecto|liter|litre|micro|milli|ounce|point|pound|sigma|stone|yocto|yotta|zepto|zetta|Wien|acre|atto|blob|deci|deka|dyne|exbi|foot|gibi|giga|gram|hbar|hour|inch|kibi|kilo|knot|mach|mebi|mega|mile|mmHg|mu_0|nano|pebi|peta|pico|slug|tebi|tera|torr|week|yard|year|yobi|zebi|Btu|N_A|atm|bar|bbl|day|dyn|erg|exa|kgf|kmh|lbf|m_e|m_n|m_p|m_u|mil|mph|psi|au|eV|hp|lb|oz|pi|pt|G|R|c|e|g|h|k|u))$
  - pattern: $X.$N
  - has:
      field: object
      kind: attribute
      pattern: $PAR.$MOD
      all:
      - has:
          field: attribute
          regex: ^(constants|codata)$
      - has:
          field: object
          any:
          - all:
            - regex: ^scipy\.constants$
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: scipy
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                          not:
                            regex: ^(scipy)(\.|$)
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^(scipy)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(scipy)$
                            - &id001
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(scipy)$
                            - *id001
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^$
          - all:
            - pattern: $S.constants
              any:
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    any:
                    - kind: import_statement
                      has: &id002
                        stopBy: end
                        any: &id003
                        - kind: aliased_import
                          inside:
                            kind: import_statement
                          all:
                          - has:
                              field: name
                              regex: ^scipy$
                          - has:
                              field: alias
                              pattern: $S
                    - kind: import_from_statement
                      has: *id002
                    - kind: try_statement
                      has: *id002
                    - kind: if_statement
                      has: *id002
              - inside:
                  stopBy: end
                  kind: function_definition
                  has:
                    stopBy: end
                    any: *id003
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $S
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                          not:
                            regex: ^(scipy)(\.|$)
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^(scipy)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(scipy)$
                            - &id004
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(scipy)$
                            - *id004
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^$
          - all:
            - kind: identifier
              pattern: $S
              any:
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    any:
                    - kind: import_statement
                      has: &id006
                        stopBy: end
                        any: &id007
                        - kind: aliased_import
                          inside:
                            kind: import_statement
                          all:
                          - has:
                              field: name
                              regex: ^scipy\.constants$
                          - has:
                              field: alias
                              pattern: $S
                        - kind: dotted_name
                          pattern: $S
                          regex: ^constants$
                          inside:
                            kind: import_from_statement
                            has: &id005
                              field: module_name
                              regex: ^scipy$
                        - kind: aliased_import
                          inside:
                            kind: import_from_statement
                            has: *id005
                          all:
                          - has:
                              field: name
                              regex: ^constants$
                          - has:
                              field: alias
                              pattern: $S
                    - kind: import_from_statement
                      has: *id006
                    - kind: try_statement
                      has: *id006
                    - kind: if_statement
                      has: *id006
              - inside:
                  stopBy: end
                  kind: function_definition
                  has:
                    stopBy: end
                    any: *id007
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $S
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^scipy\.(constants)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(constants)$
                            - &id008
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^scipy$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(constants)$
                            - *id008
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^scipy$
  - not:
      any:
      - &id010
        inside:
          stopBy:
            not: &id009
              any:
              - kind: pattern_list
              - kind: tuple_pattern
              - kind: list_pattern
              - kind: list_splat_pattern
              - kind: tuple
              - kind: list
              - kind: parenthesized_expression
              - kind: expression_list
              - kind: list_splat
          kind: assignment
          field: left
      - &id011
        inside:
          stopBy:
            not: *id009
          kind: augmented_assignment
          field: left
      - &id012
        inside:
          stopBy:
            not: *id009
          kind: for_statement
          field: left
      - &id013
        inside:
          stopBy:
            not: *id009
          kind: for_in_clause
          field: left
      - &id014
        inside:
          stopBy:
            not: *id009
          kind: as_pattern_target
      - &id015
        inside:
          stopBy:
            not: *id009
          kind: delete_statement
  - not:
      matches: compat-code
  - any:
    - kind: identifier
      pattern: $ROOT
    - has:
        stopBy: end
        kind: identifier
        pattern: $ROOT
        inside:
          kind: attribute
          field: object
  - not:
      inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          kind: identifier
          pattern: $ROOT
          any:
          - *id010
          - *id011
          - *id012
          - *id013
          - *id014
          - *id015
          - inside:
              kind: named_expression
              field: name
          - inside:
              kind: parameters
          - inside:
              kind: lambda_parameters
          - inside:
              kind: typed_parameter
          - inside:
              kind: list_splat_pattern
          - inside:
              kind: dictionary_splat_pattern
          - inside:
              kind: global_statement
          - inside:
              kind: nonlocal_statement
          - inside:
              kind: splat_pattern
          - inside:
              kind: default_parameter
              field: name
          - inside:
              kind: typed_default_parameter
              field: name
          - inside:
              kind: function_definition
              field: name
          - inside:
              kind: class_definition
              field: name
          - inside:
              kind: as_pattern
              inside:
                kind: case_pattern
          - inside:
              kind: dotted_name
              regex: ^\w+$
              inside:
                any:
                - kind: case_pattern
                - kind: keyword_pattern
          - inside:
              kind: type
              any:
              - inside:
                  kind: type_alias_statement
                  field: left
              - inside:
                  kind: type_parameter
fix: $PAR.$N
metadata:
  fix: safe

