                          not:
                            all:
                            - regex: ^(io)$
                            - &id008
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^scipy$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(io)$
                            - *id008
                    - kind: import_from_statement
