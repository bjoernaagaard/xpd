          - *id011
          - *id012
          - *id013
          - *id014
          - *id015
          - inside:
              kind: named_expression
              field: name
          - inside:
              kind: parameters
          - inside:
              kind: lambda_parameters
          - inside:
              kind: typed_parameter
          - inside:
              kind: list_splat_pattern
          - inside:
              kind: dictionary_splat_pattern
          - inside:
              kind: global_statement
          - inside:
              kind: nonlocal_statement
          - inside:
              kind: splat_pattern
          - inside:
              kind: default_parameter
              field: name
          - inside:
              kind: typed_default_parameter
              field: name
          - inside:
              kind: function_definition
              field: name
          - inside:
              kind: class_definition
              field: name
          - inside:
              kind: as_pattern
              inside:
                kind: case_pattern
          - inside:
              kind: dotted_name
              regex: ^\w+$
