id: deprecated-in-scipy
language: python
severity: warning
message: $PAR.$MOD is a private module that SciPy deprecated, and $PAR.$MOD.$N warns with DeprecationWarning on
  SciPy 1.18.1. Write $PAR.$N, which is the same object.
rule:
  all:
  - kind: attribute
  - has:
      field: object
      kind: attribute
      has:
        field: attribute
        regex: ^(windows)$
  - regex: (^|\.)(windows\.(general_gaussian|general_hamming|blackmanharris|general_cosine|exponential|get_window|barthann|bartlett|blackman|gaussian|chebwin|flattop|hamming|nuttall|bohman|boxcar|cosine|kaiser|parzen|taylor|triang|tukey|dpss|hann))$
  - pattern: $X.$N
  - has:
      field: object
      kind: attribute
      pattern: $PAR.$MOD
      all:
      - has:
          field: attribute
          regex: ^(windows)$
      - has:
          field: object
          any:
          - all:
            - regex: ^scipy\.signal\.windows$
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: scipy
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                          not:
                            regex: ^(scipy)(\.|$)
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^(scipy)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(scipy)$
                            - &id001
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(scipy)$
                            - *id001
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^$
          - all:
            - pattern: $S.signal.windows
              any:
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    any:
                    - kind: import_statement
                      has: &id002
                        stopBy: end
                        any: &id003
                        - kind: aliased_import
                          inside:
                            kind: import_statement
                          all:
                          - has:
                              field: name
                              regex: ^scipy$
                          - has:
                              field: alias
                              pattern: $S
                    - kind: import_from_statement
                      has: *id002
                    - kind: try_statement
                      has: *id002
                    - kind: if_statement
                      has: *id002
              - inside:
                  stopBy: end
                  kind: function_definition
                  has:
                    stopBy: end
                    any: *id003
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $S
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                          not:
                            regex: ^(scipy)(\.|$)
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^(scipy)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(scipy)$
                            - &id004
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(scipy)$
                            - *id004
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^$
          - all:
            - pattern: $S.windows
              any:
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    any:
                    - kind: import_statement
                      has: &id006
                        stopBy: end
                        any: &id007
                        - kind: aliased_import
                          inside:
                            kind: import_statement
                          all:
                          - has:
                              field: name
                              regex: ^scipy\.signal$
                          - has:
                              field: alias
                              pattern: $S
                        - kind: dotted_name
                          pattern: $S
                          regex: ^signal$
                          inside:
                            kind: import_from_statement
                            has: &id005
                              field: module_name
                              regex: ^scipy$
                        - kind: aliased_import
                          inside:
                            kind: import_from_statement
                            has: *id005
                          all:
                          - has:
                              field: name
                              regex: ^signal$
                          - has:
                              field: alias
                              pattern: $S
                    - kind: import_from_statement
                      has: *id006
                    - kind: try_statement
                      has: *id006
                    - kind: if_statement
                      has: *id006
              - inside:
                  stopBy: end
                  kind: function_definition
                  has:
                    stopBy: end
                    any: *id007
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $S
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^scipy\.(signal)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(signal)$
                            - &id008
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^scipy$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(signal)$
                            - *id008
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^scipy$
          - all:
            - kind: identifier
              pattern: $S
              any:
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    any:
                    - kind: import_statement
                      has: &id010
                        stopBy: end
                        any: &id011
                        - kind: aliased_import
                          inside:
                            kind: import_statement
                          all:
                          - has:
                              field: name
                              regex: ^scipy\.signal\.windows$
                          - has:
                              field: alias
                              pattern: $S
                        - kind: dotted_name
                          pattern: $S
                          regex: ^windows$
                          inside:
                            kind: import_from_statement
                            has: &id009
                              field: module_name
                              regex: ^scipy\.signal$
                        - kind: aliased_import
                          inside:
                            kind: import_from_statement
                            has: *id009
                          all:
                          - has:
                              field: name
                              regex: ^windows$
                          - has:
                              field: alias
                              pattern: $S
                    - kind: import_from_statement
                      has: *id010
                    - kind: try_statement
                      has: *id010
                    - kind: if_statement
                      has: *id010
              - inside:
                  stopBy: end
                  kind: function_definition
                  has:
                    stopBy: end
                    any: *id011
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $S
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^scipy\.signal\.(windows)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(windows)$
                            - &id012
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^scipy\.signal$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(windows)$
                            - *id012
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^scipy\.signal$
  - not:
      any:
      - &id014
        inside:
          stopBy:
            not: &id013
              any:
              - kind: pattern_list
              - kind: tuple_pattern
              - kind: list_pattern
              - kind: list_splat_pattern
              - kind: tuple
              - kind: list
              - kind: parenthesized_expression
              - kind: expression_list
              - kind: list_splat
          kind: assignment
          field: left
      - &id015
        inside:
          stopBy:
            not: *id013
          kind: augmented_assignment
          field: left
      - &id016
        inside:
          stopBy:
            not: *id013
          kind: for_statement
          field: left
      - &id017
        inside:
          stopBy:
            not: *id013
          kind: for_in_clause
          field: left
      - &id018
        inside:
          stopBy:
            not: *id013
          kind: as_pattern_target
      - &id019
        inside:
          stopBy:
            not: *id013
          kind: delete_statement
  - not:
      matches: compat-code
  - any:
    - kind: identifier
      pattern: $ROOT
    - has:
        stopBy: end
        kind: identifier
        pattern: $ROOT
        inside:
          kind: attribute
          field: object
  - not:
      inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          kind: identifier
          pattern: $ROOT
          any:
          - *id014
          - *id015
          - *id016
          - *id017
          - *id018
          - *id019
          - inside:
              kind: named_expression
              field: name
          - inside:
              kind: parameters
