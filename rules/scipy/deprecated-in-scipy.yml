---
id: deprecated-in-scipy
language: python
severity: warning
message: $M is a private module that SciPy deprecated, and every name read from it warns with DeprecationWarning
  or raises AttributeError on SciPy 1.18.1. The public names are in scipy.constants.
rule:
  all:
  - kind: dotted_name
  - regex: ^scipy\.constants\.(constants|codata)$
  - pattern: $M
  - any:
    - inside:
        kind: import_statement
    - inside:
        kind: aliased_import
        inside:
          kind: import_statement
  - not:
      matches: compat-code

---
id: deprecated-in-scipy
language: python
severity: warning
message: scipy.constants.$M is a private module that SciPy deprecated, and every name read from it warns with DeprecationWarning
  or raises AttributeError on SciPy 1.18.1. The public names are in scipy.constants.
rule:
  all:
  - kind: dotted_name
  - regex: ^(constants|codata)$
  - pattern: $M
  - not:
      matches: compat-code
  - any:
    - inside:
        kind: import_from_statement
        has:
          field: module_name
          regex: ^scipy\.constants$
    - inside:
        kind: aliased_import
        field: name
        inside:
          kind: import_from_statement
          has:
            field: module_name
            regex: ^scipy\.constants$

