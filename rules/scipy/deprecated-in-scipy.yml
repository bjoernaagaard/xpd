              - kind: list_pattern
              - kind: list_splat_pattern
              - kind: tuple
              - kind: list
              - kind: parenthesized_expression
              - kind: expression_list
              - kind: list_splat
          kind: assignment
          field: left
      - &id011
        inside:
          stopBy:
            not: *id009
          kind: augmented_assignment
          field: left
      - &id012
        inside:
          stopBy:
            not: *id009
          kind: for_statement
          field: left
      - &id013
        inside:
          stopBy:
            not: *id009
          kind: for_in_clause
          field: left
      - &id014
        inside:
          stopBy:
            not: *id009
          kind: as_pattern_target
      - &id015
        inside:
          stopBy:
            not: *id009
          kind: delete_statement
  - not:
      matches: compat-code
  - any:
    - kind: identifier
      pattern: $ROOT
    - has:
        stopBy: end
        kind: identifier
        pattern: $ROOT
        inside:
