                        - kind: dotted_name
                          pattern: $S
                          regex: ^io$
                          inside:
                            kind: import_from_statement
                            has: &id005
                              field: module_name
                              regex: ^scipy$
                        - kind: aliased_import
                          inside:
                            kind: import_from_statement
                            has: *id005
