id: deprecated-in-scipy
language: python
severity: warning
message: $PAR.$MOD is a private module that SciPy deprecated, and $PAR.$MOD.$N warns with DeprecationWarning on
  SciPy 1.18.1. Write $PAR.$N, which is the same object.
rule:
  all:
  - kind: attribute
  - has:
      field: object
      kind: attribute
      has:
        field: attribute
        regex: ^(harwell_boeing|netcdf|mmio|idl)$
  - regex: (^|\.)(harwell_boeing\.(hb_write|hb_read)|idl\.(readsav)|netcdf\.(netcdf_variable|netcdf_file))$
  - pattern: $X.$N
  - has:
      field: object
      kind: attribute
      pattern: $PAR.$MOD
      all:
      - has:
          field: attribute
          regex: ^(harwell_boeing|netcdf|mmio|idl)$
      - has:
          field: object
          any:
          - all:
            - regex: ^scipy\.io$
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: scipy
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                          not:
                            regex: ^(scipy)(\.|$)
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^(scipy)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(scipy)$
                            - &id001
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(scipy)$
                            - *id001
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^$
          - all:
            - pattern: $S.io
              any:
              - inside:
                  stopBy: end
                  kind: module
                  has:
                    any:
                    - kind: import_statement
                      has: &id002
                        stopBy: end
                        any: &id003
                        - kind: aliased_import
                          inside:
                            kind: import_statement
                          all:
                          - has:
                              field: name
                              regex: ^scipy$
                          - has:
                              field: alias
                              pattern: $S
                    - kind: import_from_statement
                      has: *id002
                    - kind: try_statement
                      has: *id002
                    - kind: if_statement
                      has: *id002
              - inside:
                  stopBy: end
                  kind: function_definition
                  has:
                    stopBy: end
                    any: *id003
            - not:
                inside:
                  stopBy: end
                  kind: module
                  has:
                    stopBy: end
                    any:
                    - kind: identifier
                      pattern: $S
                      any:
                      - nthChild: 1
                        inside:
                          kind: dotted_name
                          inside:
                            kind: import_statement
                            field: name
                          not:
                            regex: ^(scipy)(\.|$)
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_statement
                          not:
                            has:
                              field: name
                              regex: ^(scipy)$
                      - inside:
                          kind: dotted_name
                          inside:
                            kind: import_from_statement
                            field: name
                          not:
                            all:
                            - regex: ^(scipy)$
                            - &id004
                              inside:
                                kind: import_from_statement
                                has:
                                  field: module_name
                                  regex: ^$
                      - inside:
                          kind: aliased_import
                          field: alias
                          inside:
                            kind: import_from_statement
                          not:
                            all:
                            - has:
                                field: name
                                regex: ^(scipy)$
                            - *id004
                    - kind: import_from_statement
                      has:
                        kind: wildcard_import
                      not:
                        has:
                          field: module_name
                          regex: ^$
          - all:
            - kind: identifier
              pattern: $S
