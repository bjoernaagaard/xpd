---
id: removed-in-scipy
language: python
severity: error
message: $OBJ.$N was removed from the scipy namespace and raises AttributeError on SciPy 1.18.1. $HINT
rule:
  all:
  - kind: attribute
  - has:
      field: attribute
      regex: ^(derivative|factorial2|factorial|comb|face|lena|pade)$
  - pattern: $OBJ.$N
  - not:
      inside:
        kind: assignment
        field: left
  - has:
      field: object
      any:
      - regex: ^scipy$
      - kind: identifier
        pattern: $S
        any:
        - inside:
            stopBy: end
            kind: module
            has:
              any:
              - kind: import_statement
                has: &id001
                  stopBy: end
                  any: &id002
                  - kind: aliased_import
                    inside:
                      kind: import_statement
                    all:
                    - has:
                        field: name
                        regex: ^scipy$
                    - has:
                        field: alias
                        pattern: $S
              - kind: import_from_statement
                has: *id001
              - kind: try_statement
                has: *id001
              - kind: if_statement
                has: *id001
        - inside:
            stopBy: end
            kind: function_definition
            has:
              stopBy: end
              any: *id002
  - not:
      matches: compat-code
transform:
  H1:
    replace:
      source: $N
      replace: ^(pade)$
      by: Write mpmath.pade, since scipy.interpolate.pade is deprecated too.
  H2:
    replace:
      source: $H1
      replace: ^(ascent)$
      by: Write scipy.datasets.ascent, which needs the pooch package.
  H3:
    replace:
      source: $H2
      replace: ^(electrocardiogram)$
      by: Write scipy.datasets.electrocardiogram, which needs the pooch package.
  H4:
    replace:
      source: $H3
      replace: ^(face)$
      by: Write scipy.datasets.face, which needs the pooch package.
  H5:
    replace:
      source: $H4
      replace: ^(derivative)$
      by: Write scipy.differentiate.derivative, which takes different arguments.
  H6:
    replace:
      source: $H5
      replace: ^(comb)$
      by: Write scipy.special.comb.
  H7:
    replace:
      source: $H6
      replace: ^(factorial)$
      by: Write scipy.special.factorial.
  H8:
    replace:
      source: $H7
      replace: ^(factorial2)$
      by: Write scipy.special.factorial2.
  H9:
    replace:
      source: $H8
      replace: ^(factorialk)$
      by: Write scipy.special.factorialk.
  H10:
    replace:
      source: $H9
      replace: ^(logsumexp)$
      by: Write scipy.special.logsumexp.
  HINT:
    replace:
      source: $H10
      replace: ^\w+$
      by: SciPy 1.18.1 has no public function of that name.

