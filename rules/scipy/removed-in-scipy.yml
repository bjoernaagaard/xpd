# Written by research/scipy-rules/removed/gen_rules.py from the probe table in runs/probe.jsonl.
# Every old form here raises under `python -W error` on SciPy 1.18.1, saved in runs/proof.jsonl.
# Code under a SciPy version check, a hasattr check, or a try that catches ImportError or
# AttributeError is left alone, because it exists for old SciPy.
# statsmodels replaced `from scipy.integrate import trapz` with `trapezoid` (93f56dc2b2, 410bf74b3e
# in runs/pairs.txt). The old bodies are not in the research material, so the fix is unsafe.
id: removed-in-scipy
language: python
severity: error
message: $OBJ.$N was removed from SciPy and raises AttributeError on SciPy 1.18.1. Write $OBJ.$NEW.
rule:
  all:
  - kind: attribute
  - has:
      field: attribute
      regex: ^(cumtrapz|simps|trapz)$
  - pattern: $OBJ.$N
  - not:
      inside:
        kind: assignment
        field: left
  - has:
      field: object
      any:
      - regex: ^scipy\.integrate$
      - pattern: $S.integrate
        any:
        - inside:
            stopBy: end
            kind: module
            has:
              any:
              - kind: import_statement
                has: &id001
                  stopBy: end
                  any: &id002
                  - kind: aliased_import
                    inside:
                      kind: import_statement
                    all:
                    - has:
                        field: name
                        regex: ^scipy$
                    - has:
                        field: alias
                        pattern: $S
              - kind: import_from_statement
                has: *id001
              - kind: try_statement
                has: *id001
              - kind: if_statement
                has: *id001
        - inside:
            stopBy: end
            kind: function_definition
            has:
              stopBy: end
              any: *id002
      - kind: identifier
        pattern: $S
        any:
        - inside:
            stopBy: end
            kind: module
            has:
              any:
              - kind: import_statement
                has: &id004
                  stopBy: end
                  any: &id005
                  - kind: aliased_import
                    inside:
                      kind: import_statement
                    all:
                    - has:
                        field: name
                        regex: ^scipy\.integrate$
                    - has:
                        field: alias
                        pattern: $S
                  - kind: dotted_name
                    pattern: $S
                    regex: ^integrate$
                    inside:
                      kind: import_from_statement
                      has: &id003
                        field: module_name
                        regex: ^scipy$
                  - kind: aliased_import
                    inside:
                      kind: import_from_statement
                      has: *id003
                    all:
                    - has:
                        field: name
                        regex: ^integrate$
                    - has:
                        field: alias
                        pattern: $S
              - kind: import_from_statement
                has: *id004
              - kind: try_statement
                has: *id004
              - kind: if_statement
                has: *id004
        - inside:
            stopBy: end
            kind: function_definition
            has:
              stopBy: end
              any: *id005
  - not:
      matches: compat-code
transform:
  R1:
    replace:
      source: $N
      replace: ^cumtrapz$
      by: cumulative_trapezoid
  R2:
    replace:
      source: $R1
      replace: ^simps$
      by: simpson
  NEW:
    replace:
      source: $R2
      replace: ^trapz$
      by: trapezoid
fix: $OBJ.$NEW
metadata:
  fix: unsafe

