# The cKDTree docstring says the class is functionally identical to KDTree, kept only for
# backward compatibility, and to prefer KDTree when SciPy older than 1.6 is not a concern, in
# research/scipy-rules/src/scipy/scipy/spatial/_ckdtree.pyx:430 to 435. Building and querying
# ran at the same speed in speed/runs/bench.jsonl. The fix writes KDTree with the same arguments,
# which both classes take in the same order. Unsafe: the default leafsize is 16 for cKDTree and 10
# for KDTree, so a query can return another one of two equally near points, and the tree's node
# classes differ.
id: ckdtree
language: python
severity: info
message: cKDTree is functionally identical to KDTree and SciPy keeps the name only for backward compatibility, as its docstring says. Write KDTree, unless the code must run on SciPy older than 1.6.
rule:
  kind: call
  pattern: $CALL
  has:
    field: function
    any:
      - { pattern: $M.$K, matches: spatial-module }
      - { kind: identifier, pattern: $K, matches: from-spatial }
constraints:
  K: { regex: '^cKDTree$' }
transform:
  NEW: { replace: { source: $CALL, replace: '^([\w.]*?)cKDTree', by: '${1}KDTree' } }
fix: $NEW
metadata: { fix: unsafe, since: "1.6" }
utils:
  spatial-module:
    any:
      - has: { field: object, regex: '^scipy\.spatial$' }
      - all:
          - has: { field: object, pattern: $S.spatial }
          - inside: { stopBy: end, kind: module, has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy$' } }, { has: { field: alias, pattern: $S } }] } } }
      - all:
          - has: { field: object, pattern: $M }
          - inside:
              stopBy: end
              kind: module
              has:
                any:
                  - kind: import_statement
                    has: { kind: aliased_import, all: [{ has: { field: name, regex: '^scipy\.spatial$' } }, { has: { field: alias, pattern: $M } }] }
                  - kind: import_from_statement
                    all:
                      - has: { field: module_name, regex: '^scipy$' }
                      - any:
                          - has: { kind: dotted_name, pattern: $M, regex: '^spatial$' }
                          - has: { kind: aliased_import, all: [{ has: { field: name, regex: '^spatial$' } }, { has: { field: alias, pattern: $M } }] }
  from-spatial:
    inside:
      stopBy: end
      kind: module
      has:
        kind: import_from_statement
        all: [{ has: { field: module_name, regex: '^scipy\.spatial$' } }, { has: { kind: dotted_name, pattern: $K } }]
