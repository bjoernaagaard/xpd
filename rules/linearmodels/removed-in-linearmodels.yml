# Each document finds a form that a release of linearmodels removed. Each was run on the release
# before and the release at the version it names, both installed from PyPI. Code inside a try
# block with an except clause, or inside pytest.raises, is a compatibility path and stays silent.
#
# linearmodels 4.18 split linearmodels.utility into the modules of linearmodels.shared. On 4.17,
# "from linearmodels.utility import MissingValueWarning, AttrDict, WaldTestStatistic" ran, and on
# 4.18 it raised "ModuleNotFoundError: No module named 'linearmodels.utility'", as it does on 7.1.
# The new home of each of the 22 public names of the old module was read from the 7.1 source. The
# names live in five modules, so the rule has no fix.
id: removed-in-linearmodels
language: python
severity: error
message: linearmodels.utility was removed in linearmodels 4.18, and the import raises ModuleNotFoundError. MissingValueWarning and the other warnings are in linearmodels.shared.exceptions, AttrDict is in linearmodels.shared.utility, WaldTestStatistic and InvalidTestStatistic are in linearmodels.shared.hypotheses, and has_constant is in linearmodels.shared.linalg.
rule:
  any:
    - kind: import_from_statement
      has: { field: module_name, regex: '^linearmodels\.utility$' }
    - kind: import_statement
      regex: '^import\s+linearmodels\.utility\b'
  not: { matches: expected-to-raise }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS|IV3SLS|IVSystemGMM|TradedFactorModel|LinearFactorModel|LinearFactorModelGMM)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM|SUR)$' }, { matches: from-linearmodels }] }] }
metadata: { since: "4.18" }
---
# linearmodels 4.12 renamed test_linear_constraint of the instrument results to wald_test and kept
# the old name for a while. On 4.14, OLS(y, x).fit().test_linear_constraint(r, q) returned a
# WaldTestStatistic, and on 4.15 it raised "AttributeError: 'OLSResults' object has no attribute
# 'test_linear_constraint'". The results of OLS, IV2SLS, IVLIML and IVGMM had the method on 4.14
# and not on 4.15, and had wald_test on both, so the rule reads those four classes. The fix turns
# code that raises into code that runs, so it is unsafe.
id: removed-in-linearmodels
language: python
severity: error
message: test_linear_constraint was removed in linearmodels 4.15 and raises AttributeError. It was renamed wald_test, which takes the same restriction and value.
rule:
  kind: attribute
  pattern: $R.test_linear_constraint
  not: { matches: expected-to-raise }
constraints:
  R: { matches: { lm-result: { CLASS: { matches: lm-class } } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(IVLIML)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM)$' }, { matches: from-linearmodels }] }] }
fix: $R.wald_test
metadata: { fix: unsafe, since: "4.15" }
