# Two stage least squares by hand fits the endogenous regressor on the instruments and then the
# outcome on the fitted values. The second regression gives the right coefficient and computes its
# standard errors from residuals that use the fitted values in place of the regressor. On
# linearmodels 7.1 the mroz data gave educ 0.0664 both ways, with an unadjusted standard error of
# 0.0327 by hand and 0.0311 from IV2SLS. Over 2,000 draws of 500 rows with one strong instrument,
# the 95% interval of the hand-made second stage covered the true coefficient in 99.6% of the
# draws and the interval of IV2SLS in 95.7%, and the hand-made standard error was 1.37 times the
# other on average. Which way the error goes depends on the data.
#
# The rule reports a model whose exog argument holds .fitted_values, the name linearmodels gives
# them. The model is OLS or a panel class, or IV2SLS, IVLIML or IVGMM with None for endog and for
# instruments, which is how linearmodels itself runs least squares. A second stage that reads the fitted values from a column it stored earlier is not seen.
# No fix, because the advice is another model in place of the two regressions.
id: manual-two-stage
language: python
severity: warning
message: This linearmodels regression takes the fitted values of another one as a regressor, which is two stage least squares by hand. The coefficient is the one IV2SLS gives, but the standard errors come from the wrong residuals. In a simulation the 95% interval of the second stage covered the true value in 99.6% of 2,000 draws, against 95.7% for IV2SLS. Use IV2SLS(dependent, exog, endog, instruments).
rule:
  kind: call
  all:
    - any:
        - has: { field: function, matches: lm-class }
        # An instrument model with None for endog and for instruments is least squares.
        - all:
            - has: { field: function, matches: iv-class }
            - has: { field: arguments, any: [{ has: { nthChild: { position: 3, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, regex: '^None$' } }, { has: { kind: keyword_argument, regex: '^endog\s*=\s*None$' } }] }
            - has: { field: arguments, any: [{ has: { nthChild: { position: 4, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, regex: '^None$' } }, { has: { kind: keyword_argument, regex: '^instruments\s*=\s*None$' } }] }
    - has:
        field: arguments
        has:
          any:
            - { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { kind: keyword_argument } }
            - { kind: keyword_argument, has: { field: name, regex: '^exog$' } }
          has: { stopBy: end, kind: attribute, has: { field: attribute, regex: '^fitted_values$' } }
utils:
  iv-class: { any: [{ regex: '(^|\.)(IVLIML)$' }, { all: [{ regex: '(^|\.)(IV2SLS|IVGMM)$' }, { matches: from-linearmodels }] }] }
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PooledOLS|PanelOLS|RandomEffects|FirstDifferenceOLS|BetweenOLS)$' }, { all: [{ regex: '(^|\.)(OLS)$' }, { matches: from-linearmodels }] }] }