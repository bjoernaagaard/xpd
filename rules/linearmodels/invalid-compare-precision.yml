# compare of linearmodels.panel and of linearmodels.iv puts one number under each coefficient, and
# precision picks it. On linearmodels 7.1 and 7.0 both functions took "tstats", "std_errors",
# "std-errors" and "pvalues", in any case, and raised "ValueError: Unknown precision value. Must
# be one of 'tstats', 'std_errors' or 'pvalues'." for "se", "stderr", "t", "p", "tstat",
# "std_err", "pvalue", "t-stats" and "bse". The rule reads compare only when the file imports it
# from linearmodels or calls it through the module.
# The names that the error lists were taken as standard errors, t statistics and p-values, and
# the fix writes the name compare takes for each.
# Unsafe: the call raised before the fix.
id: invalid-compare-precision
language: python
severity: error
message: In linearmodels, compare takes "tstats", "std_errors" or "pvalues" for precision, and $P raises ValueError with "Unknown precision value." Write the name that compare takes for the same number, such as precision="std_errors" for "se".
rule:
  kind: call
  all:
    - pattern: $CALL
    - has: { field: function, regex: '(^|\.)compare$', matches: from-linearmodels }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^precision$' } }, { has: { field: value, kind: string, pattern: $P, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '^[a-zA-Z]*["'']+(?i:tstats|std_errors|std-errors|pvalues)["'']+$' } }, { regex: '^[a-zA-Z]*["'']+(?i:se|stderr|std_err|bse|t|tstat|t-stats|p|pvalue)["'']+$' }] } }] } }
    - not: { matches: expected-to-raise }
transform:
  T1: { replace: { source: $CALL, replace: '(precision\s*=\s*[a-zA-Z]*["'']+)(?i:se|stderr|std_err|bse)(["'']+)', by: '${1}std_errors$2' } }
  T2: { replace: { source: $T1, replace: '(precision\s*=\s*[a-zA-Z]*["'']+)(?i:t|tstat|t-stats)(["'']+)', by: '${1}tstats$2' } }
  NEW: { replace: { source: $T2, replace: '(precision\s*=\s*[a-zA-Z]*["'']+)(?i:p|pvalue)(["'']+)', by: '${1}pvalues$2' } }
fix: $NEW
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS|IV3SLS|IVSystemGMM|TradedFactorModel|LinearFactorModel|LinearFactorModelGMM)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM|SUR)$' }, { matches: from-linearmodels }] }] }
---
# Any other name has no fix, because the code does not show which of the three numbers is meant.
id: invalid-compare-precision
language: python
severity: error
message: In linearmodels, compare takes "tstats", "std_errors" or "pvalues" for precision, and $P raises ValueError with "Unknown precision value." Write precision="std_errors" for standard errors under the coefficients.
rule:
  kind: call
  all:
    - has: { field: function, regex: '(^|\.)compare$', matches: from-linearmodels }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^precision$' } }, { has: { field: value, kind: string, pattern: $P, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '^[a-zA-Z]*["'']+(?i:tstats|std_errors|std-errors|pvalues)["'']+$' } }, { not: { regex: '^[a-zA-Z]*["'']+(?i:se|stderr|std_err|bse|t|tstat|t-stats|p|pvalue)["'']+$' } }] } }] } }
    - not: { matches: expected-to-raise }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS|IV3SLS|IVSystemGMM|TradedFactorModel|LinearFactorModel|LinearFactorModelGMM)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM|SUR)$' }, { matches: from-linearmodels }] }] }