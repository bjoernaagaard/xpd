# A first difference removes everything that is constant over time, the intercept included, so
# FirstDifferenceOLS refuses a constant column. On linearmodels 7.1 and 7.0 both forms below raised
# "ValueError: Constants are not allowed in first difference regressions." Code inside
# pytest.raises or a try block with an except clause expects the error and stays silent.
# Unsafe: the call raised before the fix.
id: first-difference-constant
language: python
severity: error
message: FirstDifferenceOLS takes no constant, and $F has a 1 term. linearmodels 7.1 raises ValueError with "Constants are not allowed in first difference regressions." Take the 1 out, because the difference removes the intercept.
rule:
  kind: string
  pattern: $F
  all:
    - not: { has: { kind: interpolation } }
    - regex: '[~+]\s*1\s*([+\[\]}"'']|$)'
    - regex: '[~+]\s*1\s*\+|\+\s*1\s*([+\[\]}"'']|$)'
    - not: { matches: expected-to-raise }
    - any:
        - { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } }
        - { inside: { kind: keyword_argument, has: { field: name, regex: '^formula$' }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } }
        - { inside: { kind: pair, inside: { kind: dictionary, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } } }
transform:
  T1: { replace: { source: $F, replace: '~\s*1\s*\+\s*', by: '~ ' } }
  T2: { replace: { source: $T1, replace: '\+\s*1\s*\+', by: '+' } }
  NEW: { replace: { source: $T2, replace: '\s*\+\s*1(\s*[\]}"''])', by: '$1' } }
fix: $NEW
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(FirstDifferenceOLS)$' }] }
---
# A formula whose only term is the 1 has no fix, because taking it out leaves no regressor.
id: first-difference-constant
language: python
severity: error
message: FirstDifferenceOLS takes no constant, and $F has a 1 term. linearmodels 7.1 raises ValueError with "Constants are not allowed in first difference regressions." Take the 1 out, because the difference removes the intercept.
rule:
  kind: string
  pattern: $F
  all:
    - not: { has: { kind: interpolation } }
    - regex: '[~+]\s*1\s*([+\[\]}"'']|$)'
    - not: { regex: '[~+]\s*1\s*\+|\+\s*1\s*([+\[\]}"'']|$)' }
    - not: { matches: expected-to-raise }
    - any:
        - { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } }
        - { inside: { kind: keyword_argument, has: { field: name, regex: '^formula$' }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } }
        - { inside: { kind: pair, inside: { kind: dictionary, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(FirstDifferenceOLS)$' }] }
---
# The same model built from arrays, with add_constant of statsmodels around exog.
# Unsafe: the call raised before the fix.
id: first-difference-constant
language: python
severity: error
message: FirstDifferenceOLS takes no constant, and add_constant gives exog one. linearmodels 7.1 raises ValueError with "Constants are not allowed in first difference regressions." Pass the regressors without add_constant.
rule:
  kind: call
  all:
    - pattern: $C($$$ARGS)
    - has: { field: function, matches: lm-class }
    - has:
        field: arguments
        has:
          any:
            - { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: call, has: { field: function, regex: '(^|\.)add_constant$' } }
            - { kind: keyword_argument, all: [{ has: { field: name, regex: '^exog$' } }, { has: { field: value, kind: call, has: { field: function, regex: '(^|\.)add_constant$' } } }] }
    - not: { matches: expected-to-raise }
rewriters:
  - id: unwrap
    rule:
      kind: call
      all:
        - has: { field: function, regex: '(^|\.)add_constant$' }
        - has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, pattern: $X, not: { kind: keyword_argument } } }
    fix: "$X, "
  - id: unwrap-exog
    rule:
      kind: keyword_argument
      all:
        - has: { field: name, regex: ^exog$ }
        - has: { field: value, kind: call, all: [{ has: { field: function, regex: '(^|\.)add_constant$' } }, { has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, pattern: $X, not: { kind: keyword_argument } } } }] }
    fix: "exog=$X, "
  - id: keep
    rule: { pattern: $ARG, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [unwrap, unwrap-exog, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(FirstDifferenceOLS)$' }] }