# The options of a covariance go to fit as keywords next to cov_type, and each cov_type takes its
# own. cluster_entity, cluster_time and clusters belong to cov_type="clustered". On linearmodels
# 7.1, fit(cluster_entity=True) with no cov_type raised "ValueError: The keyword argument
# 'cluster_entity' is not accepted with cov_type='unadjusted'" on PanelOLS, and the same error with
# 'robust' on IV2SLS, AbsorbingLS and SUR. 7.0 raised ValueError on the panel models and TypeError
# on the others. Every class but FamaMacBeth and the factor models was run with each of the three
# keywords against no cov_type, "unadjusted", "robust" and "kernel", and each raised.
#
# The rule reads cov_type only when it is absent or written as a string, and it stays silent when
# the call unpacks keywords from a dictionary. Code inside pytest.raises or a try block with an
# except clause expects the error and stays silent.
# Unsafe: the call raised before the fix.
id: cov-option-without-cov-type
language: python
severity: error
message: $K belongs to cov_type="clustered", and this fit call asks for another covariance, so linearmodels raises an error instead of clustering. Add cov_type="clustered".
rule:
  kind: call
  all:
    - pattern: $C($$$ARGS)
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, pattern: $K, regex: '^(cluster_entity|cluster_time|clusters)$' } } }
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cov_type)$' } }] } } }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: list_splat }] } } }
    - not: { matches: expected-to-raise }
rewriters:
  - id: keep
    rule: { pattern: $ARG, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [keep], joinBy: "" }
fix: $C($KEPTcov_type="clustered")
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS|IV3SLS|IVSystemGMM)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM|SUR)$' }, { matches: from-linearmodels }] }] }
---
