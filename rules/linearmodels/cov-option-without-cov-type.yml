# FamaMacBeth.fit names bandwidth and kernel in its signature, so it takes them with any cov_type
# and reads them only with "kernel". On 7.1 and 7.0 the first standard error on the wage panel was
# 0.203664 with no option, with bandwidth=3 and with kernel="parzen", and 0.300158 with
# cov_type="kernel" and bandwidth=3. Its cov_type may also be given by position, and then the rule
# stays silent.
# Unsafe: the fix turns on the kernel covariance, which changes the standard errors on purpose.
id: cov-option-without-cov-type
language: python
severity: error
message: In linearmodels, FamaMacBeth reads $K only with cov_type="kernel", and without it the keyword does nothing. The standard error on the wage panel was 0.2037 with and without bandwidth=3, against 0.3002 with cov_type="kernel", bandwidth=3. Add cov_type="kernel".
rule:
  kind: call
  all:
    - pattern: $C($$$ARGS)
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, pattern: $K, regex: '^(bandwidth|kernel)$' } } }
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cov_type)$' } }] } } }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: list_splat }] } } }
    - not: { has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { kind: keyword_argument } } } }
rewriters:
  - id: keep
    rule: { pattern: $ARG, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [keep], joinBy: "" }
fix: $C($KEPTcov_type="kernel")
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(FamaMacBeth)$' }] }
