# In a formula, x**2 means every interaction of x with itself up to order two, which is x, as in
# patsy and in R. The squared values need I(x**2). On linearmodels 7.1 and 7.0,
# "lwage ~ 1 + exper + exper**2" gave the columns Intercept and exper on IV2SLS and on PooledOLS,
# and "lwage ~ 1 + exper + I(exper**2)" gave three columns. The rule reports a term that is a
# name, ** and a number. It leaves (a + b)**2 alone, which is the use the operator is for.
# Unsafe: the fix squares the values, which changes the model on purpose.
id: formula-power-term
language: python
severity: error
message: A linearmodels formula reads ** as a power of interactions, not of the values, so a term such as exper**2 in $F is exper itself. "lwage ~ 1 + exper + exper**2" gave a model with the columns Intercept and exper, with no error. Write I(exper**2) for the squared values.
rule:
  kind: string
  pattern: $F
  all:
    - not: { has: { kind: interpolation } }
    - regex: '[~+]\s*[A-Za-z_]\w*\s*\*\*\s*\d+\s*([+\[\]}"'']|$)'
    - any:
        - { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } }
        - { inside: { kind: keyword_argument, has: { field: name, regex: '^formula$' }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } }
        - { inside: { kind: pair, inside: { kind: dictionary, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } } }
transform:
  # A match takes the separator after the term, so the second pass wraps the terms that the first
  # one skipped.
  T1: { replace: { source: $F, replace: '([~+]\s*)([A-Za-z_]\w*\s*\*\*\s*\d+)(\s*([+\[\]}"'']|$))', by: '${1}I($2)$3' } }
  NEW: { replace: { source: $T1, replace: '([~+]\s*)([A-Za-z_]\w*\s*\*\*\s*\d+)(\s*([+\[\]}"'']|$))', by: '${1}I($2)$3' } }
fix: $NEW
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS|IV3SLS|IVSystemGMM|TradedFactorModel|LinearFactorModel|LinearFactorModelGMM)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM|SUR)$' }, { matches: from-linearmodels }] }] }