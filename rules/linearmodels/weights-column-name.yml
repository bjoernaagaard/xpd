# statsmodels and R take the weights of a formula model as a column of the data. linearmodels
# takes an array. On 7.1, PooledOLS.from_formula("lwage ~ 1 + exper", data, weights="hours") raised
# "TypeError: weights must be array_like ... Got str. To use a column of a DataFrame, pass the
# values of the column", and IV2SLS.from_formula did the same. On 7.0 both raised
# "AttributeError: 'str' object has no attribute 'ndim'".
# Unsafe: the call raised before the fix. The fix reads the column from the frame that from_formula
# is given as a name.
id: weights-column-name
language: python
severity: error
message: weights takes the values, not the name of a column, and $W raises TypeError on linearmodels 7.1 and AttributeError on 7.0. Write weights=$D[$W], the column itself.
rule:
  kind: call
  all:
    - pattern: $C($$$ARGS)
    - matches: { lm-from-formula: { CLASS: { matches: lm-class } } }
    - { has: { field: arguments, any: [{ has: { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: identifier, pattern: $D } }, { has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^data$' } }, { has: { field: value, kind: identifier, pattern: $D } }] } }] } }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^weights$' } }, { has: { field: value, kind: string, pattern: $W, not: { has: { kind: interpolation } } } }] } }
    - not: { matches: expected-to-raise }
rewriters:
  - id: column
    rule: { kind: keyword_argument, all: [{ has: { field: name, regex: ^weights$ } }, { has: { field: value, kind: string, pattern: $NAME } }] }
    fix: "weights=$D[$NAME], "
  - id: keep
    rule: { pattern: $ARG, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [column, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS|IV3SLS|IVSystemGMM|TradedFactorModel|LinearFactorModel|LinearFactorModelGMM)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM|SUR)$' }, { matches: from-linearmodels }] }] }
---
# A model built from arrays, or a formula whose data is not a name, has no fix, because the frame
# that holds the column is not in the call.
id: weights-column-name
language: python
severity: error
message: weights takes the values, not the name of a column, and $W raises TypeError on linearmodels 7.1 and AttributeError on 7.0. Pass the column itself, such as data[$W].
rule:
  kind: call
  all:
    - matches: { lm-build: { CLASS: { matches: lm-class } } }
    - not: { all: [{ matches: { lm-from-formula: { CLASS: { matches: lm-class } } } }, { has: { field: arguments, any: [{ has: { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: identifier, pattern: $D } }, { has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^data$' } }, { has: { field: value, kind: identifier, pattern: $D } }] } }] } }] }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^weights$' } }, { has: { field: value, kind: string, pattern: $W, not: { has: { kind: interpolation } } } }] } }
    - not: { matches: expected-to-raise }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS|IV3SLS|IVSystemGMM|TradedFactorModel|LinearFactorModel|LinearFactorModelGMM)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM|SUR)$' }, { matches: from-linearmodels }] }] }