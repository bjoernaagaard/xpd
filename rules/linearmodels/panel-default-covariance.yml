# The panel models default to cov_type="unadjusted", the covariance for errors that are
# homoskedastic and unrelated over time. Errors of one entity usually are related, and then the
# default standard errors are too small. On linearmodels 7.1, 1,000 draws of 200 entities over 8
# periods, with an AR(1) regressor and an AR(1) error within each entity, both with coefficient
# 0.8, and a true slope of 0, gave p below 0.05 in 17.3% of the draws for the default, 16.4% for
# cov_type="robust" and 5.7% for cov_type="clustered" with cluster_entity=True, on PanelOLS with
# entity effects.
#
# That is one simulation, and how far the default is off depends on the data, so the rule is info.
# It reports a fit call with no cov_type on PanelOLS, PooledOLS, RandomEffects and
# FirstDifferenceOLS. BetweenOLS has one row for each entity, and FamaMacBeth has its own
# covariance, so both are left alone.
# No fix, because the code does not show whether the errors of one entity are related.
id: panel-default-covariance
language: python
severity: info
message: In linearmodels, PanelOLS, PooledOLS, RandomEffects and FirstDifferenceOLS default to unadjusted covariance, which takes the errors of one entity to be unrelated over time. In a simulation where they were related, it rejected a true coefficient of 0 in 17.3% of 1,000 draws at the 5% level, against 5.7% with cov_type="clustered", cluster_entity=True. Pass those two unless the errors are known to be independent.
rule:
  kind: call
  all:
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cov_type)$' } }] } } }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: list_splat }] } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|FirstDifferenceOLS)$' }] }