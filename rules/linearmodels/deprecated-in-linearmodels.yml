# On 7.1, "from linearmodels import DROP_MISSING" and reading linearmodels.DROP_MISSING raised
# "FutureWarning: linearmodels.DROP_MISSING has no effect and will be removed in linearmodels
# 8.0", and on 7.0 both ran clean. The message takes "has no effect" from that warning.
# No fix, because the name may be used in other places of the file that the match does not reach.
id: deprecated-in-linearmodels
language: python
severity: warning
message: linearmodels.DROP_MISSING has no effect, since observations with missing values are always dropped. 7.1 gives FutureWarning when it is read, and 8.0 removes it. Take it out, and set linearmodels.WARN_ON_MISSING = False to turn off the MissingValueWarning.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+linearmodels\s+import\b[^#]*\bDROP_MISSING\b'
    - kind: attribute
      regex: '^linearmodels\.DROP_MISSING$'
    - kind: attribute
      pattern: $LMMOD.DROP_MISSING
      inside: { kind: module, stopBy: end, has: { stopBy: end, kind: aliased_import, all: [{ has: { field: name, regex: '^linearmodels$' } }, { has: { field: alias, pattern: $LMMOD } }] } }
