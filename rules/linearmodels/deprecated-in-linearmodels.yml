  any:
    - kind: import_from_statement
      regex: '^from\s+linearmodels\.__future__\s+import\s+ordering\s*$'
    - kind: import_statement
      regex: '^import\s+linearmodels\.__future__\.ordering\s*$'
  not: { inside: { kind: module } }
utils:
  # The class names that another library also has count only with proof of the import.
