language: python
severity: warning
message: cov_type="kernel" with no bandwidth and no optimal_bw uses a default that linearmodels 7.1 changed, from nobs - 2 to a bandwidth selected from the data, and 7.1 gives DefaultBandwidthWarning. On the mroz data the first standard error of IVGMM went from 0.3593 on 7.0 to 0.4658 on 7.1. Write optimal_bw=True, which gives the numbers of 7.1 on both releases and no warning. A bandwidth of your own also gives the same numbers on both.
