# absorb takes a frame, and the dtype of each column decides what it does. A categorical column is
# absorbed as one effect for each category. Any other column is taken as a continuous variable and
# partialled out as a single regressor. On linearmodels 7.1, with 200 firms, a firm effect in the
# regressor and a true coefficient of 1.0, absorb with the integer firm id gave 3.397, where no
# absorb at all gave 3.398, and the same column as a category gave 1.022. No error and no warning
# was raised. A text column raises TypeError on 7.1, and 7.0 took it like the integers.
#
# The code does not show a dtype, so the rule is info. It reports an absorb argument only in a
# file that never says category, Categorical or cut, where no column can have been made
# categorical in that file. Data that is categorical when it is loaded is reported without need.
# No fix, because absorb also takes a continuous variable on purpose, and the code does not show which is meant.
id: absorb-not-categorical
language: python
severity: info
message: In linearmodels, AbsorbingLS absorbs a column as fixed effects only when its dtype is categorical. A numeric column is absorbed as one continuous regressor. With an integer firm id the coefficient was 3.397, the same as with no absorb, against 1.022 with the id as a category, where the true value is 1.0. This file never makes a categorical, so check the dtypes, or pass $X.astype("category").
rule:
  kind: call
  all:
    - has: { field: function, matches: lm-class }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^absorb$' } }, { has: { field: value, pattern: $X, not: { regex: '^None$' } } }] } }
    - not: { inside: { kind: module, stopBy: end, regex: 'category|Categorical|\bcut\(' } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(AbsorbingLS)$' }] }