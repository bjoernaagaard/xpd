# A panel model takes a frame with two index levels and reads the first as the entity and the
# second as the time. Nothing checks which is which. On linearmodels 7.1,
# wage_panel.set_index(["year", "nr"]) made PanelOLS report 8 entities and 545 periods, and
# entity_effects=True then gave married 0.1622, which is what time_effects=True gives on the right
# index, where the entity effects estimate is 0.2483. No error and no warning was raised.
#
# The rule reads the names in a set_index call with a list of two strings, and reports when the
# first is a usual name for a time and the second is not. It knows the order only by the names, so
# a frame whose entity column is called year would be reported too. A two level index is also made
# for other uses, so the frame must reach a panel model: the call is an argument of the model, or
# its result is assigned to a name that a panel model in the same function reads. The rule stays
# silent when another statement in that function can change the index of the same name, such as a
# second set_index, swaplevel, a merge or an assignment to .index, when the same chain goes on
# with such a call, as in set_index(["year", "nr"]).swaplevel(), and when a later statement
# assigns the name again. The fix changes the estimates on purpose, so it is unsafe.
id: time-before-entity-index
language: python
severity: warning
message: The panel models read the first level of the index as the entity and the second as the time, and $A is named like a time. With year first, PanelOLS read the wage panel as 8 entities over 545 periods, and entity_effects=True gave married 0.1622, the estimate with year effects, where the worker effects give 0.2483. Put the entity first, as in [$B, $A].
rule:
  kind: list
  pattern: '[$A, $B]'
  nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }
  not: { has: { kind: comment } }
  inside:
    kind: argument_list
    inside:
      kind: call
      pattern: $SET
      all:
        - has: { field: function, kind: attribute, has: { field: attribute, regex: '^set_index$' } }
        # A later call in the same chain that can change the index leaves the order open, as in
        # set_index(["year", "nr"]).swaplevel().
        - not: { inside: { stopBy: { kind: argument_list }, kind: attribute, has: { field: attribute, regex: '^(set_index|reset_index|swaplevel|reorder_levels|stack|unstack|pivot|pivot_table|melt|groupby|merge|join|concat|from_arrays|from_tuples|from_frame|from_product)$' } } }
        - any:
            # The frame goes straight into the model.
            - inside: { stopBy: end, kind: argument_list, inside: { kind: call, matches: { lm-build: { CLASS: { matches: lm-class } } } } }
            # Or it is assigned to a name that a panel model in the same function reads.
            - all:
                - any:
                    - all:
                        - inside: { stopBy: end, kind: assignment, has: { field: left, kind: identifier, pattern: $D } }
                        # A later statement that assigns the name again gives the model another frame.
                        - not: { inside: { stopBy: { kind: function_definition }, not: { any: [{ kind: function_definition }, { kind: module }] }, precedes: { stopBy: end, not: { any: [{ kind: function_definition }, { kind: decorated_definition }, { kind: class_definition }] }, has: { stopBy: end, kind: assignment, has: { field: left, any: [{ pattern: $D }, { any: [{ kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $D } }] } } } } }
                    - all:
                        - has: { field: function, has: { field: object, kind: identifier, pattern: $D } }
                        - has: { field: arguments, has: { kind: keyword_argument, regex: '^inplace\s*=\s*True$' } }
                - inside:
                    stopBy: { kind: function_definition }
                    any: [{ kind: function_definition }, { kind: module }]
                    all:
                      - has: { stopBy: end, kind: call, matches: { lm-build: { CLASS: { matches: lm-class } } }, has: { field: arguments, has: { stopBy: end, kind: identifier, pattern: $D } } }
                      # Another statement that can change the index of the same name leaves the order open.
                      - not: { has: { stopBy: end, kind: call, all: [{ has: { field: function, kind: attribute, regex: '(^|\.)(set_index|reset_index|swaplevel|reorder_levels|stack|unstack|pivot|pivot_table|melt|groupby|merge|join|concat|from_arrays|from_tuples|from_frame|from_product)$' } }, { not: { pattern: $SET } }, { not: { inside: { stopBy: end, pattern: $SET } } }, { any: [{ inside: { stopBy: end, kind: assignment, has: { field: left, pattern: $D } } }, { all: [{ has: { field: function, has: { field: object, pattern: $D } } }, { has: { field: arguments, has: { kind: keyword_argument, regex: '^inplace\s*=\s*True$' } } }] }] }] } }
                      - not: { has: { stopBy: end, kind: assignment, has: { field: left, kind: attribute, regex: '\.index$', has: { field: object, pattern: $D } } } }
constraints:
  A: { kind: string, regex: '(?i)^[a-zA-Z]*["''](year|years|yr|fyear|date|dates|datadate|time|month|quarter|qtr|period|periods|week|day|hour|minute|datetime|timestamp|yearmonth|year_month|yyyymm|ym|wave|season|t)["'']$' }
  B: { kind: string, not: { regex: '(?i)^[a-zA-Z]*["''](year|years|yr|fyear|date|dates|datadate|time|month|quarter|qtr|period|periods|week|day|hour|minute|datetime|timestamp|yearmonth|year_month|yyyymm|ym|wave|season|t)["'']$' } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth)$' }] }
fix: '[$B, $A]'
metadata: { fix: unsafe }
