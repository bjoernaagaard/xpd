# Every panel model parses its formula with the parser of PanelOLS, which takes EntityEffects,
# FixedEffects and TimeEffects out of the formula. Only PanelOLS then uses them. On linearmodels
# 7.1 and 7.0, "lwage ~ 1 + hours + EntityEffects" and "lwage ~ 1 + hours" gave the same
# coefficients on PooledOLS, RandomEffects, BetweenOLS and FamaMacBeth, and so did the two forms
# without the 1 on FirstDifferenceOLS, each for all three effect names. No error and no warning
# was raised, so the reader of the formula sees fixed effects that the model does not have.
# No fix, because the message names two rewrites, PanelOLS or no term, and the code does not show which is meant.
id: effects-outside-panel-ols
language: python
severity: error
message: In linearmodels, only PanelOLS reads EntityEffects, FixedEffects and TimeEffects in a formula, and this model drops the term in $F without an error. On the wage panel PooledOLS, RandomEffects, BetweenOLS, FamaMacBeth and FirstDifferenceOLS each returned the same coefficients with the term as without it. Use PanelOLS.from_formula for the effects, or take the term out.
rule:
  kind: string
  pattern: $F
  all:
    - not: { has: { kind: interpolation } }
    - regex: '\b(EntityEffects|FixedEffects|TimeEffects)\b'
    - any:
        - { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } }
        - { inside: { kind: keyword_argument, has: { field: name, regex: '^formula$' }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } }
        - { inside: { kind: pair, inside: { kind: dictionary, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth)$' }] }