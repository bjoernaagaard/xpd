# The order of linearmodels is dependent, exog, endog, instruments. statsmodels calls the
# dependent variable endog and puts it first, so the two names are easy to cross. Nothing checks
# the roles: on linearmodels 7.1, IV2SLS(lwage, educ, [const, exper], [fatheduc, motheduc]) on the
# mroz data ran without an error and gave educ 0.2021, where the right order gave 0.0664.
#
# The rule knows the roles only from the names. It reports when the second argument has endog in
# its name and the third has exog, and no other case.
# Unsafe: the fix trusts the names, and it changes the estimates on purpose.
id: iv-arguments-swapped
language: python
severity: warning
message: $C takes exog before endog, and $A and $B are named the other way round. The model then instruments the exogenous regressors and treats the endogenous one as exogenous. On the mroz data the coefficient on educ was 0.2021 that way, against 0.0664 in the right order. Write $C($Y, $B, $A, ...).
rule:
  kind: call
  all:
    - pattern: $C($Y, $A, $B, $$$REST)
    - has: { field: function, matches: lm-class }
constraints:
  A: { any: [{ kind: identifier }, { kind: subscript }, { kind: attribute }], regex: '(?i)endog', not: { regex: '(?i)exog' } }
  B: { any: [{ kind: identifier }, { kind: subscript }, { kind: attribute }], regex: '(?i)exog', not: { regex: '(?i)endog' } }
fix: $C($Y, $B, $A, $$$REST)
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(IVLIML|IVGMMCUE|IVJIVE)$' }, { all: [{ regex: '(^|\.)(IV2SLS|IVGMM)$' }, { matches: from-linearmodels }] }] }