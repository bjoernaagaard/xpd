# linearmodels never adds a constant, so IV2SLS(y, None, x, z) is a regression through the origin.
# On linearmodels 7.1, over 2,000 draws of 500 rows from y = 2 + x + error with one instrument, the
# mean estimate of the coefficient on x was 2.002 without exog and 0.990 with a constant as exog.
# On the mroz data the coefficient on educ was 0.0928 without exog and 0.0664 with a constant and
# exper. The rule reports None written as the second argument next to an endogenous regressor.
# No fix, because the column of ones is not in the file.
id: iv-without-exog
language: python
severity: warning
message: exog is None here, so the model has no intercept, because linearmodels adds none. In a simulation with a true coefficient of 1.0 and an intercept of 2.0, the mean estimate was 2.002 without exog and 0.990 with a constant column. Pass a column of ones as exog, such as sm.add_constant, unless the data has mean zero.
rule:
  kind: call
  all:
    - pattern: $C($Y, None, $E, $$$REST)
    - has: { field: function, matches: lm-class }
constraints:
  E: { not: { any: [{ regex: '^None$' }, { kind: keyword_argument }] } }
  Y: { not: { kind: keyword_argument } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(IVLIML|IVGMMCUE|IVJIVE)$' }, { all: [{ regex: '(^|\.)(IV2SLS|IVGMM)$' }, { matches: from-linearmodels }] }] }