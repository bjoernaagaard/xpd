  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FirstDifferenceOLS|FamaMacBeth|IVLIML|IVGMMCUE|IVJIVE|AbsorbingLS)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM)$' }, { matches: from-linearmodels }] }] }
