# The names in this document are the 49 public names of a statsmodels 0.15.0 OLS result that no
# linearmodels 7.1 result has, less the four names above. The list was made by running dir() on
# the statsmodels result and hasattr on a result of each of the 19 model classes of
# linearmodels.__all__. On OLS with the mroz data, cov, resid_ss, s2, f_statistic.stat and
# f_statistic.pval of an unadjusted fit with debiased=True were equal to cov_params(), ssr,
# mse_resid, fvalue and f_pvalue of statsmodels to 1e-11, and loglik of PooledOLS was equal to
# llf.
# ssr, mse_resid, fvalue and f_pvalue have one linearmodels name each on the results of the panel
# models, OLS, IV2SLS, IVLIML, IVGMM, IVGMMCUE, IVJIVE and AbsorbingLS, and the fix writes it.
id: statsmodels-result-name
language: python
severity: error
message: $A is a name of a statsmodels result, and a linearmodels result has none of that name and raises AttributeError. Write the linearmodels name, which is resid_ss for ssr, s2 for mse_resid, f_statistic.stat for fvalue and f_statistic.pval for f_pvalue.
