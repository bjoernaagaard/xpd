  kind: attribute
  all:
    - has: { field: attribute, pattern: $A, regex: '^(f_pvalue|fvalue|mse_resid|ssr)$' }
    - has: { field: object, pattern: $R, matches: lm-result }
    - not: { matches: expected-to-raise }
transform:
  T1: { replace: { source: $A, replace: '^ssr$', by: resid_ss } }
  T2: { replace: { source: $T1, replace: '^mse_resid$', by: s2 } }
  T3: { replace: { source: $T2, replace: '^fvalue$', by: f_statistic.stat } }
  NEW: { replace: { source: $T3, replace: '^f_pvalue$', by: f_statistic.pval } }
fix: $R.$NEW
