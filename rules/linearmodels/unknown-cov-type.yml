# Each model takes its own short list of cov_type names, and none of them is a statsmodels name.
# linearmodels 7.1 raises UnknownOptionError, which is both a ValueError and a KeyError, with the
# list of names the model takes, and 7.0 raised ValueError or KeyError. The lists below were read
# from that error for every class of linearmodels.__all__, and each name on a list was then run on
# its class. "HC0", "HC1", "HC2", "HC3", "HAC", "hac" outside the system models, "nonrobust",
# "cluster", "white" and "newey-west" raised on every class they were tried on.
#
# The message of the document for OLS, IV2SLS, IVLIML and AbsorbingLS says which name gives the
# numbers of a statsmodels name. On OLS with the mroz data the standard errors were equal to 1e-13
# for "HC0" and "robust", for "HC1" and "robust" with debiased=True, for "nonrobust" and
# "unadjusted" with debiased=True, and for "cluster" with groups and "clustered" with the same
# clusters and debiased=True. "HAC" and "kernel" are the same estimator with other defaults for
# the bandwidth, and were not compared.
#
# Since 7.1 the names are not case sensitive, so the rule takes a known name in any case. It reads
# cov_type only when it is written as a string. Code inside pytest.raises or a try block with an
# except clause expects the error and stays silent.
#
# A name has a fix only where the comparison above found the name that gives the same numbers,
# which is "HC0", "HC1" and "nonrobust" on OLS, IV2SLS, IVLIML and AbsorbingLS. The other
# documents have no fix, because the code does not show which of the names the model takes is
# meant.
id: unknown-cov-type
language: python
severity: error
message: In linearmodels, PanelOLS, PooledOLS, RandomEffects and FirstDifferenceOLS take "unadjusted", "robust", "clustered", "kernel" and "ac", so cov_type=$C raises an error at fit. The statsmodels names, such as "HC1", "HAC", "cluster" and "nonrobust", are not among them.
rule:
  kind: call
  all:
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^cov_type$' } }, { has: { field: value, kind: string, pattern: $C, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '^[a-zA-Z]*["'']+(?i:ac|autocorrelated|clustered|conventional|dk|driscoll-kraay|heteroskedastic|homoskedastic|kernel|robust|unadjusted)["'']+$' } }] } }] } }
    - not: { matches: expected-to-raise }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|FirstDifferenceOLS)$' }] }
