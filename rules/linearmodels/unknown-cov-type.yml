# "HC0", "HC1" and "nonrobust" in a call that does not pass debiased get the name and the
# debiased that gave the same numbers. Unsafe: the call raised before the fix.
id: unknown-cov-type
language: python
severity: error
message: In linearmodels, OLS, IV2SLS, IVLIML and AbsorbingLS take "unadjusted", "robust", "kernel" and "clustered", so cov_type=$C raises an error at fit. For the statsmodels names, "HC0" is "robust", "HC1" is "robust" with debiased=True, "nonrobust" is "unadjusted" with debiased=True, "cluster" is "clustered" with clusters= and debiased=True, and "kernel" uses a HAC estimator with different bandwidth defaults.
rule:
  kind: call
  all:
    - pattern: $CALL
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^cov_type$' } }, { has: { field: value, kind: string, pattern: $C, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '^[a-zA-Z]*["'']+(?i:HeteroskedasticCovariance|HomoskedasticCovariance|KernelCovariance|OneWayClusteredCovariance|clustered|hccm|heteroskedastic|homo|homoskedastic|kernel|one-way|robust|unadjusted)["'']+$' } }] } }] } }
    - { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^cov_type$' } }, { has: { field: value, kind: string, regex: '^[a-zA-Z]*["'']+(?i:HC0|HC1|nonrobust)["'']+$' } }] } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^debiased$' } } } }
    - not: { matches: expected-to-raise }
transform:
  T1: { replace: { source: $CALL, replace: '(cov_type\s*=\s*)[a-zA-Z]*["'']+(?i:HC0)["'']+', by: '${1}"robust"' } }
  T2: { replace: { source: $T1, replace: '(cov_type\s*=\s*)[a-zA-Z]*["'']+(?i:HC1)["'']+', by: '${1}"robust", debiased=True' } }
  NEW: { replace: { source: $T2, replace: '(cov_type\s*=\s*)[a-zA-Z]*["'']+(?i:nonrobust)["'']+', by: '${1}"unadjusted", debiased=True' } }
fix: $NEW
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(IVLIML|AbsorbingLS)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS)$' }, { matches: from-linearmodels }] }] }
---
