# PanelOLS takes entity_effects and time_effects, and PanelOLS.from_formula does not. It reads the
# effects from the formula. On linearmodels 7.1 and 7.0,
# PanelOLS.from_formula("lwage ~ 1 + exper", data, entity_effects=True) raised "TypeError:
# PanelOLS.from_formula() got an unexpected keyword argument 'entity_effects'".
# Unsafe: the call raised before the fix. The fix writes the term into a formula written as a
# string, when the call passes entity_effects=True or time_effects=True and not both.
id: effects-keyword-with-formula
language: python
severity: error
message: In linearmodels, PanelOLS.from_formula has no entity_effects argument and raises TypeError, because the formula holds the effects. Write EntityEffects as a term of the formula in place of entity_effects=True, as in "y ~ 1 + x + EntityEffects".
rule:
  kind: call
  all:
    - pattern: $C($$$ARGS)
    - matches: { lm-from-formula: { CLASS: { matches: lm-class } } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, pattern: $K, regex: '^entity_effects$' } } }
    - { has: { field: arguments, has: { kind: keyword_argument, regex: '^entity_effects\s*=\s*True$' } } }
    - { not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^time_effects$' } } } } }
    - { has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: string, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '\b(EntityEffects|FixedEffects)\b' } }] } } }
    - not: { matches: expected-to-raise }
rewriters:
  - id: term
    rule: { kind: string, pattern: $S, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } } }
    transform:
      WITH: { replace: { source: $S, replace: '(["'']+)$', by: ' + EntityEffects$1' } }
    fix: "$WITH, "
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^entity_effects$ } }
    fix: ""
  - id: keep
    rule: { pattern: $ARG, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [term, drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS)$' }] }
---
# The same with time_effects=True and the term TimeEffects.
id: effects-keyword-with-formula
language: python
severity: error
message: In linearmodels, PanelOLS.from_formula has no time_effects argument and raises TypeError, because the formula holds the effects. Write TimeEffects as a term of the formula in place of time_effects=True, as in "y ~ 1 + x + TimeEffects".
rule:
  kind: call
  all:
    - pattern: $C($$$ARGS)
    - matches: { lm-from-formula: { CLASS: { matches: lm-class } } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, pattern: $K, regex: '^time_effects$' } } }
    - { has: { field: arguments, has: { kind: keyword_argument, regex: '^time_effects\s*=\s*True$' } } }
    - { not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^entity_effects$' } } } } }
    - { has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: string, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '\b(TimeEffects)\b' } }] } } }
    - not: { matches: expected-to-raise }
rewriters:
  - id: term
    rule: { kind: string, pattern: $S, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } } }
    transform:
      WITH: { replace: { source: $S, replace: '(["'']+)$', by: ' + TimeEffects$1' } }
    fix: "$WITH, "
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^time_effects$ } }
    fix: ""
  - id: keep
    rule: { pattern: $ARG, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [term, drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)
metadata: { fix: unsafe }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS)$' }] }
---
# Any other call has no fix, because the formula is not a string in the call, the keyword is not
# True, or the call passes both keywords.
id: effects-keyword-with-formula
language: python
severity: error
message: In linearmodels, PanelOLS.from_formula has no $K argument and raises TypeError. The formula holds the effects, so write EntityEffects or TimeEffects as a term, as in "y ~ 1 + x + EntityEffects".
rule:
  kind: call
  all:
    - matches: { lm-from-formula: { CLASS: { matches: lm-class } } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, pattern: $K, regex: '^(entity_effects|time_effects)$' } } }
    - not:
        any:
          - all: [{ has: { field: arguments, has: { kind: keyword_argument, regex: '^entity_effects\s*=\s*True$' } } }, { not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^time_effects$' } } } } }, { has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: string, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '\b(EntityEffects|FixedEffects)\b' } }] } } }]
          - all: [{ has: { field: arguments, has: { kind: keyword_argument, regex: '^time_effects\s*=\s*True$' } } }, { not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^entity_effects$' } } } } }, { has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: string, all: [{ not: { has: { kind: interpolation } } }, { not: { regex: '\b(TimeEffects)\b' } }] } } }]
    - not: { matches: expected-to-raise }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS)$' }] }