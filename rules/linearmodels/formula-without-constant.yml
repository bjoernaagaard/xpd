# A formula of linearmodels has an intercept only when it holds a 1 term. patsy in statsmodels and
# R add the intercept themselves, so "y ~ x" means two different models in the two libraries. On
# linearmodels 7.1 and 7.0, PooledOLS.from_formula("lwage ~ exper", wage_panel) returned exper
# 0.2184 with no intercept, and "lwage ~ 1 + exper" returned 0.0338 with an intercept of 1.4289.
# RandomEffects, BetweenOLS, FamaMacBeth, SUR, IV3SLS and IVSystemGMM did the same.
#
# The instrument models for one equation differ. On linearmodels 7.1, 7.0 and 5.0, IV2SLS, IVLIML,
# IVGMM, IVGMMCUE, IVJIVE and OLS add the intercept to a formula with no block in brackets, so
# from_formula("lwage ~ exper", mroz) returned Intercept and exper. With a block in brackets, as in
# "lwage ~ exper + [educ ~ fatheduc + motheduc]", they returned exper and educ and no intercept.
# The second document reports only that form.
#
# The rule reads a formula written as a string in the from_formula call. It stays silent when the
# formula is a name, an f-string or a concatenation, when it says - 1 or 0 +, when it names a
# column that looks like a constant, such as const, when it has a C() term, whose dummies span the
# intercept, and when a PanelOLS formula has effects, which absorb it. FirstDifferenceOLS takes no
# constant and the factor models have their own formula, so both are left out.
# No fix, because 1 + and - 1 are both right, and the code does not show which model is meant.
id: formula-without-constant
language: python
severity: warning
message: linearmodels adds no intercept to the formula of a panel or system model, where statsmodels and R add one, and $F has no 1 term. On the wage panel PooledOLS gave exper a coefficient of 0.2184 for "lwage ~ exper" and 0.0338 for "lwage ~ 1 + exper". Write 1 + after the tilde, or - 1 to say that no intercept is meant.
rule:
  kind: string
  pattern: $F
  all:
    - not: { has: { kind: interpolation } }
    - regex: '~'
    - not: { regex: '[~+]\s*1\s*([+\[\]}"'']|$)|-\s*1\b|[~+]\s*0\s*([+\[\]}"'']|$)|\b([Cc]onst|[Cc]onstant|[Ii]ntercept|ones|cons|_cons)\b|\b(EntityEffects|FixedEffects|TimeEffects)\b|\bC\(' }
    - not: { inside: { kind: argument_list, has: { kind: keyword_argument, has: { field: name, regex: '^other_effects$' } } } }
    - any:
        - { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } }
        - { inside: { kind: keyword_argument, has: { field: name, regex: '^formula$' }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } }
        - { inside: { kind: pair, inside: { kind: dictionary, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|BetweenOLS|FamaMacBeth|IV3SLS|IVSystemGMM)$' }, { all: [{ regex: '(^|\.)(SUR)$' }, { matches: from-linearmodels }] }] }
transform:
  FIXED:
    replace:
      source: $F
      replace: '^([^~]+~)\s*'
      by: '${1} 1 + '
fix: $FIXED
metadata: { fix: unsafe }
---
# No fix, for the same reason as the first document.
id: formula-without-constant
language: python
severity: warning
message: linearmodels adds no intercept to a formula with an instrument block in brackets, where it adds one to a formula without the block, and $F has no 1 term. On the mroz data IV2SLS gave educ a coefficient of 0.0769 for "lwage ~ exper + [educ ~ fatheduc + motheduc]" and 0.0664 for "lwage ~ 1 + exper + [educ ~ fatheduc + motheduc]". Write 1 + after the tilde, or - 1 to say that no intercept is meant.
rule:
  kind: string
  pattern: $F
  all:
    - not: { has: { kind: interpolation } }
    - regex: '\[[^\]]*~'
    - not: { regex: '[~+]\s*1\s*([+\[\]}"'']|$)|-\s*1\b|[~+]\s*0\s*([+\[\]}"'']|$)|\b([Cc]onst|[Cc]onstant|[Ii]ntercept|ones|cons|_cons)\b|\b(EntityEffects|FixedEffects|TimeEffects)\b|\bC\(' }
    - not: { inside: { kind: argument_list, has: { kind: keyword_argument, has: { field: name, regex: '^other_effects$' } } } }
    - any:
        - { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } }
        - { inside: { kind: keyword_argument, has: { field: name, regex: '^formula$' }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } }
        - { inside: { kind: pair, inside: { kind: dictionary, nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, inside: { kind: argument_list, inside: { kind: call, matches: { lm-from-formula: { CLASS: { matches: lm-class } } } } } } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(IVLIML|IVGMMCUE|IVJIVE)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|IVGMM)$' }, { matches: from-linearmodels }] }] }
transform:
  FIXED:
    replace:
      source: $F
      replace: '^([^~]+~)\s*'
      by: '${1} 1 + '
fix: $FIXED
metadata: { fix: unsafe }