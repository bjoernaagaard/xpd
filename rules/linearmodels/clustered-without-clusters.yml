# A clustered covariance needs to be told the clusters. Without them linearmodels gives every
# observation its own cluster and raises nothing, and the result is the heteroskedasticity robust
# covariance under the name clustered. On linearmodels 7.1 and 7.0, PanelOLS with entity effects
# on the wage panel gave the first standard error 0.041301 for cov_type="clustered", 0.041301 for
# cov_type="robust" and 0.049385 for cov_type="clustered" with cluster_entity=True. PooledOLS,
# RandomEffects and FirstDifferenceOLS gave equal pairs in the same way.
#
# The rule reads cov_type only when it is written as a string, and it stays silent when the call
# unpacks keywords from a dictionary. BetweenOLS is left out: it refuses cluster_entity, and its
# rows are the entities already.
#
# No fix, because the code does not show whether to cluster by entity or by time.
id: clustered-without-clusters
language: python
severity: error
message: For linearmodels PanelOLS, PooledOLS, RandomEffects and FirstDifferenceOLS, cov_type="clustered" with no cluster_entity, cluster_time or clusters puts each observation in a cluster of its own, which is the robust covariance. PanelOLS on the wage panel gave the standard error 0.0413, the same as cov_type="robust", against 0.0494 with cluster_entity=True. Add cluster_entity=True to cluster by entity.
rule:
  kind: call
  all:
    - { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cov_type)$' } }, { has: { field: value, kind: string, regex: '^[a-zA-Z]*["'']+(?i:clustered|one-way)["'']+$' } }] } } }
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cluster_entity|cluster_time|clusters)$' } }] } } }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: list_splat }] } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(PanelOLS|PooledOLS|RandomEffects|FirstDifferenceOLS)$' }] }
---
# The same on OLS, IV2SLS, IVLIML, AbsorbingLS, SUR and IV3SLS, which take the groups as clusters.
# On 7.1 and 7.0 each gave the same first standard error for cov_type="clustered" as for
# cov_type="robust": 0.427716 on IV2SLS, 0.072291 on AbsorbingLS and 0.074153 on SUR.
# No fix, because the group of each observation is not in the file.
id: clustered-without-clusters
language: python
severity: error
message: For linearmodels OLS, IV2SLS, IVLIML, AbsorbingLS, SUR and IV3SLS, cov_type="clustered" with no clusters puts each observation in a cluster of its own, which is the robust covariance. IV2SLS on the mroz data gave the standard error 0.4277, the same as cov_type="robust". Pass clusters= with the group of each observation.
rule:
  kind: call
  all:
    - { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cov_type)$' } }, { has: { field: value, kind: string, regex: '^[a-zA-Z]*["'']+(?i:clustered|one-way)["'']+$' } }] } } }
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cluster_entity|cluster_time|clusters)$' } }] } } }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: list_splat }] } } }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(IVLIML|AbsorbingLS|IV3SLS)$' }, { all: [{ regex: '(^|\.)(OLS|IV2SLS|SUR)$' }, { matches: from-linearmodels }] }] }
---
# IVGMM, IVGMMCUE and IVJIVE raise instead. On 7.1, fit(cov_type="clustered") raised "TypeError:
# OneWayClusteredWeightMatrix.__init__() missing 1 required positional argument: 'clusters'" on
# IVGMM and IVGMMCUE, and a TypeError on IVJIVE. 7.0 raised the same on the two it has.
# No fix, because the group of each observation is not in the file.
id: clustered-without-clusters
language: python
severity: error
message: In linearmodels, IVGMM, IVGMMCUE and IVJIVE require clusters for cov_type="clustered", and without them fit raises TypeError. Pass clusters= with the group of each observation.
rule:
  kind: call
  all:
    - { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cov_type)$' } }, { has: { field: value, kind: string, regex: '^[a-zA-Z]*["'']+(?i:clustered|one-way)["'']+$' } }] } } }
    - matches: { lm-fit: { CLASS: { matches: lm-class } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(cluster_entity|cluster_time|clusters)$' } }] } } }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: list_splat }] } } }
    - not: { matches: expected-to-raise }
utils:
  # The class names that another library also has count only with proof of the import.
  lm-class: { any: [{ regex: '(^|\.)(IVGMMCUE|IVJIVE)$' }, { all: [{ regex: '(^|\.)(IVGMM)$' }, { matches: from-linearmodels }] }] }