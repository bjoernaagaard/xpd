id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.0 removed early_stopping_rounds from estimator fit(). Pass early_stopping(...) in callbacks and supply validation data.
rule:
  pattern: $MODEL.fit($$$ARGS)
  all:
    - has:
        field: arguments
        has: {kind: keyword_argument, has: {field: name, regex: '^early_stopping_rounds$'}}
    - {not: {matches: compatibility-check}}
utils:
  compatibility-check:
    inside:
      stopBy: end
      any:
        - {kind: with_statement, regex: '^with [^\n]*(?:assertRaises|pytest\.(?:raises|warns))'}
        - {kind: try_statement, has: {kind: except_clause}}
        - {kind: if_statement, has: {field: condition, regex: '\b(?:__version__|hasattr)\b'}}
metadata:
  since: '4.0'
  holds:
    MODEL:
      kind: call
      has: {field: function, regex: '(^|\.)LGBM(Classifier|Model|Ranker|Regressor)$'}
