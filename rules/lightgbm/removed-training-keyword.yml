id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.0 removed the $KEY keyword from train() and cv(). Use callbacks for early stopping or logging, and params["objective"] for a custom objective.
rule:
  kind: call
  all:
    - {has: {field: function, pattern: $F}}
    - has:
        field: arguments
        has: {kind: keyword_argument, has: {field: name, pattern: $KEY, regex: '^(early_stopping_rounds|verbose_eval|fobj)$'}}
    - {not: {matches: compatibility-check}}
utils:
  compatibility-check:
    inside:
      stopBy: end
      any:
        - {kind: with_statement, regex: '^with [^\n]*(?:assertRaises|pytest\.(?:raises|warns))'}
        - {kind: try_statement, has: {kind: except_clause}}
        - {kind: if_statement, has: {field: condition, regex: '\b(?:__version__|hasattr)\b'}}
metadata:
  since: '4.0'
  holds:
    F: {regex: '(^|\.)(train|cv)$'}
