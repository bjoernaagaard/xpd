id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.0 removed this keyword from train() and cv(). Omit fobj=None or verbose_eval=False on the current API.
rule:
  all:
    - {matches: lgb-noop-native-keyword}
    - {matches: lgb-removable-argument}
    - inside:
        kind: argument_list
        inside: {kind: call, has: {field: function, pattern: $F}}
    - {not: {matches: lgb-removed-keyword-error}}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["'']3\.["'']$'}}}
fix:
  template: ""
  expandEnd: {regex: '^,$'}
metadata:
  since: '4.0'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  fix: unsafe
  holds:
    F: {regex: '(^|\.)(train|cv)$'}
---
id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.0 removed the $KEY keyword from train() and cv(). Use callbacks for early stopping or logging, and params["objective"] for a custom objective.
rule:
  kind: call
  all:
    - {has: {field: function, pattern: $F}}
    - has:
        field: arguments
        has:
          kind: keyword_argument
          all:
            - {has: {field: name, pattern: $KEY, regex: '^(early_stopping_rounds|verbose_eval|fobj)$'}}
            - not: {all: [{matches: lgb-noop-native-keyword}, {matches: lgb-removable-argument}]}
            - {not: {matches: lgb-removed-keyword-error}}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["'']3\.["'']$'}}}
metadata:
  since: '4.0'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  holds:
    F: {regex: '(^|\.)(train|cv)$'}
---
id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.0 removed evals_result from train(). Pass record_evaluation(evals_result) in callbacks.
rule:
  kind: call
  all:
    - {has: {field: function, pattern: $F}}
    - has:
        field: arguments
        has:
          kind: keyword_argument
          has: {field: name, regex: '^evals_result$'}
          not: {matches: lgb-removed-keyword-error}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["'']3\.["'']$'}}}
metadata:
  since: '4.0'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  holds:
    F: {regex: '(^|\.)train$'}
---
id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.0 removed $KEY from estimator fit(). Use early_stopping(...) with validation data or log_evaluation(...) in callbacks as needed.
rule:
  pattern: $MODEL.fit($$$ARGS)
  all:
    - has:
        field: arguments
        has:
          kind: keyword_argument
          all:
            - {has: {field: name, pattern: $KEY, regex: '^(early_stopping_rounds|verbose)$'}}
            - not:
                all:
                  - {has: {field: name, regex: '^verbose$'}}
                  - {has: {field: value, kind: 'false'}}
                  - {matches: lgb-removable-argument}
            - {not: {matches: lgb-removed-keyword-error}}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["'']3\.["'']$'}}}
metadata:
  since: '4.0'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  holds:
    MODEL: {matches: lgb-estimator}
---
id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.6 removed the $KEY keyword from train() and cv(). Set it when constructing the Dataset.
rule:
  kind: call
  all:
    - {has: {field: function, pattern: $F}}
    - has:
        field: arguments
        has:
          kind: keyword_argument
          has: {field: name, pattern: $KEY, regex: '^(feature_name|categorical_feature)$'}
          not: {matches: lgb-removed-keyword-error}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["''](3\.|4\.[0-5]\.)["'']$'}}}
metadata:
  since: '4.6'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  holds:
    F: {regex: '(^|\.)(train|cv)$'}
---
id: removed-training-keyword
language: python
severity: error
message: LightGBM 4.0 removed verbose from estimator fit(). Omit verbose=False to keep evaluation logging off.
rule:
  kind: keyword_argument
  all:
    - {has: {field: name, regex: '^verbose$'}}
    - {has: {field: value, kind: 'false'}}
    - {matches: lgb-removable-argument}
    - inside:
        kind: argument_list
        inside: {pattern: $MODEL.fit($$$ARGS)}
    - {not: {matches: lgb-removed-keyword-error}}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["'']3\.["'']$'}}}
fix:
  template: ""
  expandEnd: {regex: '^,$'}
metadata:
  since: '4.0'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  fix: unsafe
  holds:
    MODEL: {matches: lgb-estimator}
