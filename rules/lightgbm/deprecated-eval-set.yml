id: deprecated-eval-set
language: python
severity: warning
message: LightGBM 4.7 deprecated eval_set on estimator fit(). Pass both eval_X and eval_y, using parallel tuples for multiple validation sets.
rule:
  pattern: $MODEL.fit($$$ARGS)
  all:
    - has:
        field: arguments
        all:
          - has:
              kind: keyword_argument
              all:
                - {has: {field: name, regex: '^eval_set$'}}
                - {has: {field: value, not: {regex: '^\(*\s*None\s*\)*$'}}}
          - any:
              - {not: {has: {matches: {lgb-simple-eval-set: {DATA: {pattern: '[($X, $Y)]'}}}}}}
              - {has: {matches: manual-migration}}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["''](3\.|4\.[0-6]\.)["'']$'}}}
utils:
  manual-migration:
    any:
      - {kind: dictionary_splat}
      - {kind: list_splat}
      - {kind: keyword_argument, has: {field: name, regex: '^eval_[Xy]$'}}
      - nthChild: {position: 5, ofRule: {not: {any: [{kind: keyword_argument}, {kind: comment}, {kind: line_continuation}]}}}
        not: {any: [{kind: keyword_argument}, {kind: comment}, {kind: line_continuation}]}
metadata:
  since: '4.7'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  holds:
    MODEL: {matches: lgb-estimator}
