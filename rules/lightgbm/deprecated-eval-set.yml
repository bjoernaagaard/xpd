id: deprecated-eval-set
language: python
severity: warning
message: LightGBM 4.7 deprecated the positional eval_set argument on estimator fit(). Use eval_X and eval_y by keyword.
rule:
  pattern: $MODEL.fit($$$ARGS)
  all:
    - has:
        field: arguments
        all:
          - not: {has: {kind: list_splat}}
          - has:
              nthChild: {position: 5, ofRule: {not: {any: [{kind: keyword_argument}, {kind: dictionary_splat}, {kind: comment}, {kind: line_continuation}]}}}
              not:
                any:
                  - {kind: keyword_argument}
                  - {kind: dictionary_splat}
                  - {kind: comment}
                  - {kind: line_continuation}
                  - {regex: '^\(*\s*None\s*\)*$'}
    - matches: {lgb-before-api: {RECEIVER: {pattern: $VERSION_RECEIVER}, VERSION: {regex: '^["''](3\.|4\.[0-6]\.)["'']$'}}}
metadata:
  since: '4.7'
  unlessHolds:
    VERSION_RECEIVER: {kind: identifier}
  holds:
    MODEL:
      any:
        - kind: call
          has: {field: function, regex: '(^|\.)LGBM(Classifier|Regressor)$'}
        - {kind: type, regex: '(^|\.)LGBM(Classifier|Regressor)$'}
