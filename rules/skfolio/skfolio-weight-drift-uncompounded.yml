id: skfolio-weight-drift-uncompounded
language: python
severity: info
message: skfolio weight drift changes period returns. Set compounded=True if you want accumulated wealth. Two drifted
  periods ended at 1.22 with compounding.
rule:
  all:
    - {kind: call}
    - {has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:Portfolio)$'}]}}
    - has:
        field: arguments
        has:
          all:
            - {kind: keyword_argument}
            - {has: {field: name, regex: '^(?:weight_drift)$'}}
            - {has: {field: value, regex: ^True$}}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:compounded)$'}}
                - {has: {field: value, regex: ^False$}}
        - all:
            - not:
                has:
                  field: arguments
                  has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:compounded)$'}}]}
            - not:
                has:
                  field: arguments
                  has:
                    all:
                      - {nthChild: 11}
                      - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                      - {regex: '(?s)^'}
    - not: {has: {field: arguments, has: {any: [{kind: list_splat}, {kind: dictionary_splat}]}}}
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:Portfolio)$'}}}
---
id: skfolio-weight-drift-uncompounded
language: python
severity: info
message: skfolio weight drift changes period returns. Set compounded=True if you want accumulated wealth. Two drifted
  periods ended at 1.22 with compounding.
rule:
  all:
    - {kind: call}
    - has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:MultiPeriodPortfolio)$'}]}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {nthChild: 1}
                - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                - {kind: list}
                - has:
                    all:
                      - {pattern: $CHILD}
                      - &id001 {kind: call}
                      - &id002 {has: {field: function, regex: '(^|\.)(?:Portfolio)$'}}
                      - &id003
                        has:
                          field: arguments
                          has:
                            all:
                              - {kind: keyword_argument}
                              - {has: {field: name, regex: '^(?:weight_drift)$'}}
                              - {has: {field: value, regex: ^True$}}
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:portfolios)$'}}
                - has:
                    field: value
                    all:
                      - {kind: list}
                      - has:
                          all:
                            - {pattern: $CHILD}
                            - *id001
                            - *id002
                            - *id003
    - any:
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:compounded)$'}}
                - {has: {field: value, regex: ^False$}}
        - all:
            - not:
                has:
                  field: arguments
                  has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:compounded)$'}}]}
            - not:
                has:
                  field: arguments
                  has:
                    all:
                      - {nthChild: 7}
                      - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                      - {regex: '(?s)^'}
    - not: {has: {field: arguments, has: {any: [{kind: list_splat}, {kind: dictionary_splat}]}}}
metadata:
  since: 1.14.4
  holds:
    F: {regex: '(^|\.)(?:MultiPeriodPortfolio)$'}
    CHILD:
      all:
        - *id001
        - *id002
        - *id003
