id: deprecated-in-skfolio
language: python
severity: error
message: skfolio raises ValueError when both annualized_factor and annualization_factor are set. Pass annualization_factor
  alone.
rule:
  all:
    - {kind: call}
    - has:
        field: function
        all:
          - {pattern: $F}
          - {regex: '(^|\.)(?:Portfolio|MultiPeriodPortfolio|ImpliedCovariance)$'}
    - has:
        field: arguments
        has:
          all:
            - {kind: keyword_argument}
            - {has: {field: name, regex: '^(?:annualized_factor)$'}}
            - {has: {field: value, any: [{kind: integer}, {kind: float}, {kind: unary_operator}]}}
    - has:
        field: arguments
        has:
          all:
            - {kind: keyword_argument}
            - {has: {field: name, regex: '^(?:annualization_factor)$'}}
            - {has: {field: value, any: [{kind: integer}, {kind: float}, {kind: unary_operator}]}}
    - {not: {matches: skfolio-expected-exception}}
metadata:
  since: 1.14.4
  holds: {F: {regex: '(^|\.)(?:Portfolio|MultiPeriodPortfolio|ImpliedCovariance)$'}}
---
