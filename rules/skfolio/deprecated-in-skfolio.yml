id: deprecated-in-skfolio
language: python
severity: warning
message: The old hierarchical skfolio export raises FutureWarning. Import the optimizer from skfolio.optimization.hierarchical.
rule:
  all:
    - {kind: import_from_statement, pattern: $STMT}
    - {has: {field: module_name, regex: '^skfolio\.optimization\.cluster(?:\.hierarchical)?$'}}
    - has:
        any:
          - all:
              - {kind: dotted_name}
              - regex: (^|\.)(?:HierarchicalRiskParity|SchurComplementary|HierarchicalEqualRiskContribution|NestedClustersOptimization)$
          - all:
              - {kind: aliased_import}
              - has:
                  field: name
                  regex: (^|\.)(?:HierarchicalRiskParity|SchurComplementary|HierarchicalEqualRiskContribution|NestedClustersOptimization)$
    - not:
        has:
          any:
            - all:
                - {kind: dotted_name}
                - regex: (^|\.)BaseHierarchicalOptimization$
            - all:
                - {kind: aliased_import}
                - has:
                    field: name
                    regex: (^|\.)BaseHierarchicalOptimization$
    - {not: {matches: skfolio-expected-exception}}
transform:
  FIXED:
    replace:
      source: $STMT
      replace: 'skfolio\.optimization\.cluster(?:\.hierarchical)?'
      by: skfolio.optimization.hierarchical
fix: $FIXED
metadata: {since: 1.14.4, fix: safe}
