id: deprecated-in-skfolio
language: python
severity: warning
message: skfolio's non_denominated_sort raises FutureWarning. Call non_dominated_sort.
rule:
  all:
    - {pattern: '$MOD.non_denominated_sort($$$ARGS)'}
    - has: {field: function, all: [{pattern: $F}, {has: {field: object, regex: '(^|\.)(?:sorting)$'}}]}
    - {not: {matches: skfolio-expected-exception}}
fix: $MOD.non_dominated_sort($$$ARGS)
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:non_denominated_sort)$'}}, fix: safe}
---
