id: removed-in-skfolio
language: python
severity: error
message: EWMu and EWCovariance raise TypeError for alpha in skfolio 1.0 and later. An alpha of 0.2 corresponds to
  a half_life of about 3.11 observations.
rule:
  all:
    - {kind: call}
    - {has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:EWMu|EWCovariance)$'}]}}
    - has:
        field: arguments
        has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:alpha)$'}}]}
    - {not: {matches: skfolio-expected-exception}}
metadata: {since: '1.0', holds: {F: {regex: '(^|\.)(?:EWMu|EWCovariance)$'}}}
---
id: removed-in-skfolio
language: python
severity: error
message: WalkForward raises TypeError for expend_train. Use expand_train.
rule:
  all:
    - {kind: keyword_argument}
    - {has: {field: name, regex: '^(?:expend_train)$'}}
    - {has: {field: value, pattern: $VALUE}}
    - inside:
        all:
          - {kind: argument_list}
          - inside:
              all:
                - {kind: call}
                - {has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:WalkForward)$'}]}}
                - not:
                    any:
                      - has:
                          field: arguments
                          has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:expand_train)$'}}]}
                      - has:
                          field: arguments
                          has:
                            all:
                              - {nthChild: 6}
                              - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                              - {regex: '(?s)^'}
                      - {has: {field: arguments, has: {any: [{kind: dictionary_splat}, {kind: list_splat}]}}}
    - {not: {matches: skfolio-expected-exception}}
metadata: {since: '1.0', holds: {F: {regex: '(^|\.)(?:WalkForward)$'}}, fix: unsafe}
fix: expand_train=$VALUE
