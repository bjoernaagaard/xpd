id: removed-in-skfolio
language: python
severity: error
message: UncertaintySet raises AttributeError for k or sigma. Read radius and geometry and account for the set norm.
rule:
  all:
    - {kind: attribute}
    - {has: {field: object, pattern: $MODEL}}
    - {has: {field: attribute, regex: '^(?:k|sigma)$'}}
    - {not: {matches: skfolio-expected-exception}}
metadata:
  since: '1.0'
  holds:
    MODEL: {all: [{kind: call}, {has: {field: function, regex: '(^|\.)(?:UncertaintySet)$'}}]}
