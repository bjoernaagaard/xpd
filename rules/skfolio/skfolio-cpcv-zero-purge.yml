id: skfolio-cpcv-zero-purge
language: python
severity: info
message: Both skfolio combinatorial validation gaps are zero. If observations or labels overlap across a fold boundary,
  size purged_size and embargo_size for that overlap.
rule:
  all:
    - {kind: call}
    - has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:CombinatorialPurgedCV)$'}]}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:purged_size)$'}}
                - {has: {field: value, regex: '^0(?:\.0+)?$'}}
        - all:
            - not:
                has:
                  field: arguments
                  has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:purged_size)$'}}]}
            - has:
                field: arguments
                has:
                  all:
                    - {nthChild: 3}
                    - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                    - &id001 {regex: '^0(?:\.0+)?$'}
        - all:
            - not:
                has:
                  field: arguments
                  has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:purged_size)$'}}]}
            - not:
                has:
                  field: arguments
                  has:
                    all:
                      - {nthChild: 3}
                      - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                      - {regex: '(?s)^'}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:embargo_size)$'}}
                - {has: {field: value, regex: '^0(?:\.0+)?$'}}
        - all:
            - not:
                has:
                  field: arguments
                  has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:embargo_size)$'}}]}
            - has:
                field: arguments
                has:
                  all:
                    - {nthChild: 4}
                    - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                    - *id001
        - all:
            - not:
                has:
                  field: arguments
                  has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:embargo_size)$'}}]}
            - not:
                has:
                  field: arguments
                  has:
                    all:
                      - {nthChild: 4}
                      - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                      - {regex: '(?s)^'}
    - not: {has: {field: arguments, has: {any: [{kind: list_splat}, {kind: dictionary_splat}]}}}
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:CombinatorialPurgedCV)$'}}}
