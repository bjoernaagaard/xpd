id: skfolio-shuffled-returns-split
language: python
severity: warning
message: Shuffled folds can train on future skfolio asset returns. All 4 shuffled KFold folds on 20 rows trained
  on observations after the first test row. Use WalkForward for forward evaluation.
rule:
  all:
    - {kind: call}
    - has:
        field: function
        all:
          - {kind: attribute}
          - {has: {field: object, pattern: $SPLITTER}}
          - {has: {field: attribute, regex: '^(?:split)$'}}
    - has:
        stopBy: end
        any:
          - all:
              - {kind: call}
              - has:
                  field: function
                  matches: {skfolio-sklearn-model-selection: {NAME: {regex: '^(?:KFold)$'}}}
              - any:
                  - {has: {field: function, regex: '(^|\.)(?:KFold)$'}}
                  - has:
                      field: function
                      all:
                        - {kind: identifier}
                        - {pattern: $SK_ALIAS}
                        - inside:
                            stopBy: end
                            all:
                              - {kind: module}
                              - has:
                                  stopBy: end
                                  all:
                                    - {kind: aliased_import}
                                    - {has: {field: alias, pattern: $SK_ALIAS}}
                                    - {has: {field: name, regex: '(^|\.)(?:KFold)$'}}
              - has:
                  field: arguments
                  has:
                    all:
                      - {kind: keyword_argument}
                      - {has: {field: name, regex: '^(?:shuffle)$'}}
                      - {has: {field: value, regex: ^True$}}
          - all:
              - {kind: call}
              - has:
                  field: function
                  matches: {skfolio-sklearn-model-selection: {NAME: {regex: '^(?:ShuffleSplit)$'}}}
              - any:
                  - {has: {field: function, regex: '(^|\.)(?:ShuffleSplit)$'}}
                  - has:
                      field: function
                      all:
                        - {kind: identifier}
                        - {pattern: $SK_ALIAS}
                        - inside:
                            stopBy: end
                            all:
                              - {kind: module}
                              - has:
                                  stopBy: end
                                  all:
                                    - {kind: aliased_import}
                                    - {has: {field: alias, pattern: $SK_ALIAS}}
                                    - {has: {field: name, regex: '(^|\.)(?:ShuffleSplit)$'}}
    - has:
        field: arguments
        has:
          all:
            - {nthChild: 1}
            - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
            - {pattern: $DATA}
metadata: {since: 1.14.4, holds: {DATA: {matches: skfolio-return-conversion}}}
