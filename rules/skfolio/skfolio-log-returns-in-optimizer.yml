id: skfolio-log-returns-in-optimizer
language: python
severity: warning
message: A skfolio optimizer averages linear asset returns. In a 59-row example, the portfolio mean was 0.0002523
  from log returns and 0.0003062 from linear returns. Use prices_to_returns with log_returns=False.
rule:
  all:
    - {kind: call}
    - has:
        field: function
        all:
          - {kind: attribute}
          - {has: {field: object, pattern: $MODEL}}
          - {has: {field: attribute, regex: '^(?:fit|partial_fit|predict)$'}}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {nthChild: 1}
                - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                - {pattern: $DATA}
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:X)$'}}
                - {has: {field: value, pattern: $DATA}}
metadata:
  since: 1.14.4
  holds:
    MODEL: {matches: skfolio-optimizer}
    DATA:
      all:
        - {kind: call}
        - {has: {field: function, regex: '(^|\.)(?:prices_to_returns)$'}}
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:log_returns)$'}}
                - {has: {field: value, regex: ^True$}}
