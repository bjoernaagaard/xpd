id: skfolio-grid-search-vs-online
language: python
severity: info
message: Consider skfolio OnlineGridSearch or OnlineRandomizedSearch for an expanding WalkForward search with an
  incrementally updatable estimator.
rule:
  all:
    - {kind: call}
    - has:
        field: function
        matches: {skfolio-sklearn-model-selection: {NAME: {regex: '^(?:GridSearchCV)$'}}}
    - any:
        - {has: {field: function, regex: '(^|\.)(?:GridSearchCV)$'}}
        - has:
            field: function
            all:
              - {kind: identifier}
              - {pattern: $SK_ALIAS}
              - inside:
                  stopBy: end
                  all:
                    - {kind: module}
                    - has:
                        stopBy: end
                        all:
                          - {kind: aliased_import}
                          - {has: {field: alias, pattern: $SK_ALIAS}}
                          - {has: {field: name, regex: '(^|\.)(?:GridSearchCV)$'}}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {nthChild: 1}
                - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                - {pattern: $MODEL}
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:estimator)$'}}
                - {has: {field: value, pattern: $MODEL}}
    - has:
        field: arguments
        has:
          all:
            - {kind: keyword_argument}
            - {has: {field: name, regex: '^(?:cv)$'}}
            - {has: {field: value, pattern: $CV}}
metadata:
  since: 1.14.4
  holds:
    MODEL: {matches: skfolio-online-optimizer}
    CV:
      all:
        - {kind: call}
        - {has: {field: function, regex: '(^|\.)(?:WalkForward)$'}}
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:expand_train)$'}}
                - {has: {field: value, regex: ^True$}}
