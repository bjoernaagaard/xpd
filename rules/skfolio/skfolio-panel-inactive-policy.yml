id: skfolio-panel-inactive-policy
language: python
severity: error
message: skfolio FieldCategorical raises ValueError for InactivePolicy.ZERO because code 0 is a category. Use MISSING
  and encode inactive entries as -1.
rule:
  all:
    - {kind: keyword_argument}
    - {has: {field: name, regex: '^(?:inactive_policy)$'}}
    - has:
        field: value
        all:
          - {pattern: $POLICY}
          - {kind: attribute}
          - {has: {field: object, pattern: $ENUM}}
          - {has: {field: attribute, regex: '^(?:ZERO)$'}}
    - inside:
        all:
          - {kind: argument_list}
          - inside:
              all:
                - {kind: call}
                - {has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:FieldCategorical)$'}]}}
    - {not: {matches: skfolio-expected-exception}}
fix: inactive_policy=$ENUM.MISSING
metadata:
  since: 1.14.4
  fix: unsafe
  holds: {F: {regex: '(^|\.)(?:FieldCategorical)$'}, ENUM: {regex: '(^|\.)(?:InactivePolicy)$'}}
---
id: skfolio-panel-inactive-policy
language: python
severity: error
message: skfolio panel fields raise TypeError for string inactive_policy values. Pass an InactivePolicy member.
rule:
  all:
    - {kind: keyword_argument}
    - {has: {field: name, regex: '^(?:inactive_policy)$'}}
    - {has: {field: value, all: [{kind: string}, {pattern: $VAL}, {regex: '^[''"](zero|missing|ignore)[''"]$'}, {not: {has: {kind: interpolation}}}]}}
    - inside:
        all:
          - {kind: argument_list}
          - inside:
              all:
                - {kind: call}
                - has:
                    field: function
                    all:
                      - {pattern: $F}
                      - {regex: '(^|\.)(?:Field2D|Field3D)$'}
    - {not: {matches: skfolio-expected-exception}}
transform:
  BARE:
    replace: {source: $VAL, replace: "^[\"']|[\"']$", by: ""}
  UPPER:
    convert: {source: $BARE, toCase: upperCase}
fix: inactive_policy=InactivePolicy.$UPPER
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:Field2D|Field3D)$'}}, fix: unsafe}
---
