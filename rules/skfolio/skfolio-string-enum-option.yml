  UPPER:
    convert: {source: $BARE, toCase: upperCase}
fix: objective_function=ObjectiveFunction.$UPPER
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:MeanRisk)$'}}, fix: unsafe}
