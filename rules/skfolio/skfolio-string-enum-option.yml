id: skfolio-string-enum-option
language: python
severity: error
message: A string risk_measure such as 'variance' raises AttributeError during skfolio fit. Pass a RiskMeasure member.
rule:
  all:
    - {kind: keyword_argument}
    - {has: {field: name, regex: '^(?:risk_measure)$'}}
    - {has: {field: value, all: [{kind: string}, {pattern: $VAL}, {regex: '(?i)^[''"](variance|semi_variance|standard_deviation|semi_deviation|mean_absolute_deviation|first_lower_partial_moment|cvar|evar|worst_realization|cdar|maximum_drawdown|average_drawdown|edar|ulcer_index|gini_mean_difference|value_at_risk|drawdown_at_risk|entropic_risk_measure|fourth_central_moment|fourth_lower_partial_moment|annualized_variance|annualized_semi_variance|annualized_standard_deviation|annualized_semi_deviation)[''"]$'}, {not: {has: {kind: interpolation}}}]}}
    - inside:
        all:
          - {kind: argument_list}
          - inside:
              all:
                - {kind: call}
                - has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:MeanRisk|RiskBudgeting)$'}]}
    - {not: {matches: skfolio-expected-exception}}
transform:
  BARE:
    replace: {source: $VAL, replace: "^[\"']|[\"']$", by: ""}
  UPPER:
    convert: {source: $BARE, toCase: upperCase}
fix: risk_measure=RiskMeasure.$UPPER
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:MeanRisk|RiskBudgeting)$'}}, fix: unsafe}
