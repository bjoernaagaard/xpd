id: skfolio-estimator-on-optimizer
language: python
severity: error
message: MeanRisk and RiskBudgeting raise TypeError for direct mu_estimator or covariance_estimator keywords. Configure
  these estimators in a skfolio EmpiricalPrior.
rule:
  all:
    - {kind: keyword_argument}
    - {has: {field: name, all: [{pattern: $KEY}, {regex: '^(?:mu_estimator|covariance_estimator)$'}]}}
    - {has: {field: value, pattern: $VAL}}
    - not:
        follows:
          kind: keyword_argument
          has: {field: name, regex: '^(?:mu_estimator|covariance_estimator)$'}
    - not:
        precedes:
          kind: keyword_argument
          has: {field: name, regex: '^(?:mu_estimator|covariance_estimator)$'}
    - inside:
        all:
          - {kind: argument_list}
          - not:
              has:
                kind: keyword_argument
                has: {field: name, regex: '^(?:prior_estimator)$'}
          - inside:
              all:
                - {kind: call}
                - has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:MeanRisk|RiskBudgeting)$'}]}
    - {not: {matches: skfolio-expected-exception}}
fix: prior_estimator=EmpiricalPrior($KEY=$VAL)
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:MeanRisk|RiskBudgeting)$'}}, fix: unsafe}
---
id: skfolio-estimator-on-optimizer
language: python
severity: error
message: MeanRisk and RiskBudgeting raise TypeError for direct mu_estimator or covariance_estimator keywords. Configure
  these estimators in a skfolio EmpiricalPrior.
rule:
  all:
    - {kind: call}
    - has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:MeanRisk|RiskBudgeting)$'}]}
    - has:
        field: arguments
        has:
          all:
            - {kind: keyword_argument}
            - {has: {field: name, regex: '^(?:mu_estimator|covariance_estimator)$'}}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:prior_estimator)$'}}
        - all:
            - has:
                field: arguments
                has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:mu_estimator)$'}}]}
            - has:
                field: arguments
                has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:covariance_estimator)$'}}]}
    - {not: {matches: skfolio-expected-exception}}
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:MeanRisk|RiskBudgeting)$'}}}
