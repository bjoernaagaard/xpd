id: skfolio-factor-model-class
language: python
severity: error
message: FactorModel is a fitted skfolio container with 13 required inputs. Use TimeSeriesFactorModel as the prior
  estimator.
rule:
  all:
    - {kind: keyword_argument}
    - {has: {field: name, regex: '^(?:prior_estimator)$'}}
    - has:
        field: value
        all:
          - {pattern: '$CONTAINER()'}
          - {has: {field: function, regex: '(^|\.)(?:FactorModel)$'}}
    - inside:
        all:
          - {kind: argument_list}
          - inside:
              all:
                - {kind: call}
                - has:
                    field: function
                    all:
                      - {pattern: $F}
                      - regex: (^|\.)(?:MeanRisk|RiskBudgeting|MaximumDiversification|BenchmarkTracker|DistributionallyRobustCVaR|HierarchicalRiskParity|SchurComplementary|HierarchicalEqualRiskContribution|NestedClustersOptimization|StackingOptimization|EqualWeighted|InverseVolatility|Random)$
    - {not: {matches: skfolio-expected-exception}}
fix: prior_estimator=TimeSeriesFactorModel()
metadata:
  since: 1.14.4
  fix: unsafe
  holds:
    F:
      regex: (^|\.)(?:MeanRisk|RiskBudgeting|MaximumDiversification|BenchmarkTracker|DistributionallyRobustCVaR|HierarchicalRiskParity|SchurComplementary|HierarchicalEqualRiskContribution|NestedClustersOptimization|StackingOptimization|EqualWeighted|InverseVolatility|Random)$
    CONTAINER: {regex: '(^|\.)(?:FactorModel)$'}
