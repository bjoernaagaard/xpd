id: skfolio-factor-model-class
language: python
severity: error
message: A skfolio optimizer with this time-series factor prior needs factors as keyword metadata. A positional
  factor matrix leaves the required factors argument unset.
rule:
  all:
    - {pattern: '$MODEL.fit($X, $FACTORS)'}
    - has:
        field: arguments
        has:
          all:
            - {nthChild: 2}
            - {not: {regex: ^None$}}
    - not:
        has:
          field: arguments
          has: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}, {kind: comment}]}
    - {not: {matches: skfolio-expected-exception}}
fix: $MODEL.fit($X, factors=$FACTORS)
metadata:
  since: 1.14.4
  fix: unsafe
  holds:
    MODEL:
      all:
        - {kind: call}
        - has:
            field: function
            regex: (^|\.)(?:MeanRisk|RiskBudgeting|MaximumDiversification|BenchmarkTracker|DistributionallyRobustCVaR|HierarchicalRiskParity|SchurComplementary|HierarchicalEqualRiskContribution|NestedClustersOptimization|StackingOptimization|EqualWeighted|InverseVolatility|Random)$
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:prior_estimator)$'}}
                - has:
                    field: value
                    all:
                      - {kind: call}
                      - {has: {field: function, regex: '(^|\.)(?:TimeSeriesFactorModel)$'}}
---
