id: skfolio-factor-model-class
language: python
severity: error
message: TimeSeriesFactorModel.fit raises TypeError when the factor matrix is only positional. Pass it as factors=.
rule:
  all:
    - {kind: call}
    - has:
        field: function
        all:
          - {kind: attribute}
          - {has: {field: object, pattern: $MODEL}}
          - {has: {field: attribute, regex: '^(?:fit)$'}}
    - has:
        field: arguments
        has:
          all:
            - {nthChild: 2}
            - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
            - {pattern: $FACTORS}
    - not:
        has:
          field: arguments
          has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:factors)$'}}]}
    - {not: {has: {field: arguments, has: {kind: dictionary_splat}}}}
    - not:
        all:
          - {pattern: '$MODEL.fit($X, $FACTORS)'}
          - not:
              has:
                field: arguments
                has: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}, {kind: comment}]}
    - {not: {matches: skfolio-expected-exception}}
metadata:
  since: 1.14.4
  holds:
    MODEL:
      all:
        - {kind: call}
        - {has: {field: function, regex: '(^|\.)(?:TimeSeriesFactorModel)$'}}
