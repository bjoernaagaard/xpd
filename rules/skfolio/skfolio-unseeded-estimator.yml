id: skfolio-unseeded-estimator
language: python
severity: info
message: Set random_state= explicitly to reproduce this skfolio estimator's random draws.
rule:
  all:
    - {kind: call}
    - {has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:VineCopula)$'}]}}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:random_state)$'}}
                - {has: {field: value, regex: ^None$}}
        - all:
            - not:
                has:
                  field: arguments
                  has: {all: [{kind: keyword_argument}, {has: {field: name, regex: '^(?:random_state)$'}}]}
            - not:
                has:
                  field: arguments
                  has:
                    all:
                      - {nthChild: 12}
                      - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                      - {regex: '(?s)^'}
    - not: {has: {field: arguments, has: {any: [{kind: list_splat}, {kind: dictionary_splat}]}}}
    - not:
        inside:
          all:
            - {kind: keyword_argument}
            - {has: {field: name, regex: '^(?:default)$'}}
            - inside:
                all:
                  - {kind: argument_list}
                  - inside: {all: [{kind: call}, {has: {field: function, regex: '(^|\.)(?:check_estimator)$'}}]}
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:VineCopula)$'}}}
