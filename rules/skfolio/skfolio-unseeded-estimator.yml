id: skfolio-unseeded-estimator
language: python
severity: info
message: For reproducible skfolio SyntheticData, pass a distribution_estimator configured with a seed.
rule:
  all:
    - {kind: call}
    - {has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:SyntheticData)$'}]}}
    - any:
        - has:
            field: arguments
            has:
              all:
                - {kind: keyword_argument}
                - {has: {field: name, regex: '^(?:distribution_estimator)$'}}
                - {has: {field: value, regex: ^None$}}
        - all:
            - not:
                has:
                  field: arguments
                  has:
                    all:
                      - {kind: keyword_argument}
                      - {has: {field: name, regex: '^(?:distribution_estimator)$'}}
            - not:
                has:
                  field: arguments
                  has:
                    all:
                      - {nthChild: 1}
                      - {not: {any: [{kind: keyword_argument}, {kind: list_splat}, {kind: dictionary_splat}]}}
                      - {regex: '(?s)^'}
    - not: {has: {field: arguments, has: {any: [{kind: list_splat}, {kind: dictionary_splat}]}}}
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:SyntheticData)$'}}}
