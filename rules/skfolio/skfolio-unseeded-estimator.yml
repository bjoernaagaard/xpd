id: skfolio-unseeded-estimator
language: python
severity: info
message: skfolio Random uses NumPy's global random state. For reproducibility, seed that state before fit or supply
  deterministic portfolio weights.
rule:
  all:
    - {kind: call}
    - {has: {field: function, all: [{pattern: $F}, {regex: '(^|\.)(?:Random)$'}]}}
    - not:
        inside:
          stopBy: end
          all:
            - {kind: module}
            - has:
                stopBy: end
                all:
                  - {kind: call}
                  - {has: {field: function, regex: \brandom\.seed$}}
metadata: {since: 1.14.4, holds: {F: {regex: '(^|\.)(?:Random)$'}}}
