# The pymoo pack. Every other .yml file in this folder is a rule.

# A fix that writes `np.` applies only in a file with `import numpy as np`. Elsewhere the issue
# has no fix.
aliases:
  np: numpy

# Names a fix may write bare, each with the module it must be imported from. A fix that writes
# `PBI()` applies only in a file with `from pymoo.decomposition.pbi import PBI`.
members:
  PBI: pymoo.decomposition.pbi
  Tchebicheff: pymoo.decomposition.tchebicheff
  WeightedSum: pymoo.decomposition.weighted_sum
  ASF: pymoo.decomposition.asf
  PerpendicularDistance: pymoo.decomposition.perp_dist
  StarmapParallelization: pymoo.parallelization
# The pack has no package check. pymoo 0.6.2 installs what it needs to run, moocore and cma
# among them, and its wheels hold the built functions. autograd, jax, dask, joblib, ray and
# optuna each serve one module that most projects never import.
