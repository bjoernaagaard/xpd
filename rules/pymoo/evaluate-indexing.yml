# A Problem gets the whole population as an array with one row per solution, and an
# ElementwiseProblem gets one solution as an array with one value per variable. Indexing written
# for the other class raises on the first evaluation. Both forms were run on pymoo 0.6.2 with GA
# and 100 solutions of 2 variables.
#
# The class must inherit from the class the file imports from pymoo, and the subscript must be
# on the second parameter of _evaluate.

# x[:, 0] in an ElementwiseProblem raised IndexError, "too many indices for array: array is
# 1-dimensional, but 2 were indexed". A class that passes elementwise=False is left alone.
id: evaluate-indexing
language: python
severity: error
message: An ElementwiseProblem gets one solution, an array with one value per variable, so $X has one dimension and this subscript raises IndexError, "too many indices for array". Write $X[0] for the first variable, or inherit from Problem to get the whole population.
rule:
  kind: subscript
  regex: '^\w+\[\s*:\s*,'
  all:
    - has: { field: value, kind: identifier, pattern: $X }
    - inside:
        stopBy: { kind: function_definition }
        kind: function_definition
        all:
          - has: { field: name, regex: '^_evaluate$' }
          - has: { field: parameters, has: { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: identifier, pattern: $X } }
          - inside:
              stopBy: end
              kind: class_definition
              all:
                - has: { field: superclasses, has: { kind: identifier, regex: '^ElementwiseProblem$' } }
                - not: { has: { stopBy: end, kind: keyword_argument, regex: '^elementwise\s*=\s*False$' } }
                - inside:
                    kind: module
                    stopBy: end
                    has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.core\.problem\s+import\b[^#]*\bElementwiseProblem\b' }
---
# x[0] ** 2 + x[1] ** 2 in a Problem takes the first two solutions, not the first two variables,
# and raised Exception, "Problem Error: F can not be set, expected shape (100, 1) but provided
# (2,)". The method must use the parameter only with whole numbers as subscripts and never loop,
# so a method that takes x[:, 0], x.T or x[i] is left alone, and so is a class that passes
# elementwise=True.
id: evaluate-indexing
language: python
severity: error
message: A Problem gets the whole population, one row per solution, so $X[$I] is one solution and not one variable. With 100 solutions of 2 variables this raised Exception, "Problem Error, F can not be set, expected shape (100, 1) but provided (2,)". Write $X[:, $I] for the variable, or inherit from ElementwiseProblem to get one solution.
rule:
  kind: subscript
  all:
    - has: { field: subscript, kind: integer, pattern: $I }
    - has: { field: value, kind: identifier, pattern: $X }
    - not: { inside: { kind: subscript } }
    - inside:
        stopBy: { kind: function_definition }
        kind: function_definition
        all:
          - has: { field: name, regex: '^_evaluate$' }
          - has: { field: parameters, has: { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: identifier, pattern: $X } }
          - not: { has: { field: body, has: { stopBy: end, any: [{ kind: for_statement }, { kind: while_statement }, { kind: for_in_clause }, { kind: lambda }] } } }
          - not:
              has:
                field: body
                has:
                  stopBy: end
                  kind: identifier
                  pattern: $X
                  not: { inside: { kind: subscript, field: value, has: { field: subscript, kind: integer } } }
          - inside:
              stopBy: end
              kind: class_definition
              all:
                - has: { field: superclasses, has: { kind: identifier, regex: '^Problem$' } }
                - not: { has: { stopBy: end, kind: keyword_argument, regex: '^elementwise(_evaluation)?\s*=\s*True$' } }
                - inside:
                    kind: module
                    stopBy: end
                    has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.core\.problem\s+import\b[^#]*\bProblem\b' }
metadata: { since: "0.6" }
