# minimize without seed builds numpy.random.default_rng(None), so every run starts from another
# state. On pymoo 0.6.2 two runs of NSGA2 on ZDT1 without a seed returned different fronts, and
# two runs with seed=1 returned the same front. A seed does not make a run better, so the rule
# is info.
id: unseeded-run
language: python
severity: info
message: minimize without seed starts from a new random state on every run, and two runs returned different fronts. Pass seed, such as seed=1, to get the same result again.
rule:
  kind: call
  pattern: minimize($$$ARGS)
  all:
    - matches: unseeded-minimize
    - not:
        inside:
          kind: module
          stopBy: end
          has: { stopBy: end, pattern: '$NP.random.seed($$$S)' }
utils:
  unseeded-minimize:
    kind: call
    all:
      - has: { field: function, regex: '^minimize$' }
      - not:
          any:
            - has: { field: arguments, has: { stopBy: end, kind: keyword_argument, has: { field: name, regex: '^seed$' } } }
            - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(random_state|random_seed)$' } } }
            - has: { field: arguments, has: { kind: dictionary_splat } }
            - has: { field: arguments, has: { kind: list_splat } }
      - matches: pymoo-minimize
      - not:
          all:
            - has: { field: arguments, has: { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, kind: identifier, pattern: $SEEDED } }
            - inside:
                kind: module
                stopBy: end
                has:
                  stopBy: end
                  kind: assignment
                  all:
                    - has: { field: left, pattern: $SEEDED }
                    - has: { field: right, has: { stopBy: end, kind: keyword_argument, has: { field: name, regex: '^seed$' } } }
fix: minimize($$$ARGS, seed=1)
metadata: { fix: unsafe }
