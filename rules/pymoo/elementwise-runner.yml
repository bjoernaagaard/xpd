id: elementwise-runner
language: python
severity: error
message: elementwise_runner is called as runner(f, X), and a bare starmap raises TypeError, "ElementwiseEvaluationFunction.__call__() takes 2 positional arguments but 3 were given". Wrap it, as in elementwise_runner=StarmapParallelization($R), with StarmapParallelization from pymoo.core.problem.
rule:
  kind: keyword_argument
  regex: '^elementwise_runner\s*='
  has: { field: value, kind: attribute, pattern: $R, has: { field: attribute, regex: '^starmap$' } }
metadata: { since: "0.6", until: "0.6.1.6" }
---
id: elementwise-runner
language: python
severity: error
message: elementwise_runner is called as runner(f, X), and a bare starmap raises TypeError, "ElementwiseEvaluationFunction.__call__() takes 2 positional arguments but 3 were given". Wrap it, as in elementwise_runner=StarmapParallelization($R), with StarmapParallelization from pymoo.parallelization.
rule:
  kind: keyword_argument
  regex: '^elementwise_runner\s*='
  has: { field: value, kind: attribute, pattern: $R, has: { field: attribute, regex: '^starmap$' } }
fix: elementwise_runner=StarmapParallelization($R)
metadata: { since: "0.6.1.6", fix: unsafe, fixImports: [StarmapParallelization] }
---
# A Problem evaluates the whole population in one call of _evaluate and never calls the runner.
# In 3 generations a Problem given a runner called it 0 times, where an ElementwiseProblem called
# it 3 times. The class must be one the file defines with the Problem it imports from pymoo as
# its base, and without an elementwise keyword in the class or in the call. No fix, because the
# base class and the method are other places than the keyword.
id: elementwise-runner
language: python
severity: error
message: $C inherits from Problem, which evaluates the whole population in one call and never calls elementwise_runner. In 3 generations the runner was called 0 times. Inherit from ElementwiseProblem, whose _evaluate gets one solution, to use the runner.
rule:
  kind: keyword_argument
  regex: '^elementwise_runner\s*='
  inside:
    kind: argument_list
    inside:
      kind: call
      all:
        - has: { field: function, kind: identifier, pattern: $C }
        # The call can turn the flag on itself when the class passes its keywords on.
        - not: { has: { field: arguments, has: { any: [{ kind: keyword_argument, regex: '^elementwise\s*=' }, { kind: dictionary_splat }] } } }
        - inside:
            kind: module
            stopBy: end
            all:
              - has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.core\.problem\s+import\b[^#]*\bProblem\b' }
              - has:
                  stopBy: end
                  kind: class_definition
                  all:
                    - has: { field: name, pattern: $C }
                    - has: { field: superclasses, has: { kind: identifier, regex: '^Problem$' } }
                    - not: { has: { stopBy: end, kind: keyword_argument, regex: '^elementwise\s*=' } }
metadata: { since: "0.6" }
