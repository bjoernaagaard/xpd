# With copy_algorithm=False, minimize sets the algorithm up only when it has no problem yet. A
# second minimize on the same object skips the setup, finds the termination already met, and
# returns the first result. On pymoo 0.6.2 a second call with another problem, ("n_gen", 30) and
# another seed returned the F of the first call, still at generation 11 and still on the first
# problem.
#
# Both calls must be the minimize the file imports from pymoo.optimize, name the same algorithm
# and pass copy_algorithm=False. The first document needs the two calls in one block with no
# assignment to the name after the first. The second needs the call in a loop that never assigns
# the name.
id: reused-algorithm-without-copy
language: python
severity: error
message: $ALG already ran in an earlier minimize with copy_algorithm=False, so this call does not set it up again and returns the earlier result. A second call with another problem, ("n_gen", 30) and another seed returned the F of the first call, still at generation 11. Build a new algorithm for this run, or drop copy_algorithm=False.
rule:
  kind: call
  all:
    - matches: run-in-place
    - inside:
        stopBy: end
        kind: expression_statement
        all:
          - follows: { stopBy: end, kind: expression_statement, has: { stopBy: end, matches: run-in-place } }
          - not:
              follows:
                stopBy: end
                all:
                  - has: { stopBy: end, kind: assignment, has: { field: left, any: [{ pattern: $ALG }, { has: { stopBy: end, kind: identifier, pattern: $ALG } }] } }
                  - follows: { stopBy: end, kind: expression_statement, has: { stopBy: end, matches: run-in-place } }
utils:
  pymoo-minimize:
    kind: call
    all:
      - has: { field: function, regex: '^minimize$' }
      - inside:
          kind: module
          stopBy: end
          all:
            - has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.optimize\s+import\b[^#]*\bminimize\b' }
            - not: { has: { stopBy: end, kind: import_from_statement, regex: '^from\s+scipy(\.\w+)*\s+import\b[^#]*\bminimize\b' } }
  run-in-place:
    kind: call
    all:
      - has: { field: function, regex: '^minimize$' }
      - has: { field: arguments, has: { kind: keyword_argument, regex: '^copy_algorithm\s*=\s*False$' } }
      - has: { field: arguments, has: { nthChild: 2, kind: identifier, pattern: $ALG } }
      - matches: pymoo-minimize
metadata: { since: "0.6" }
---
id: reused-algorithm-without-copy
language: python
severity: error
message: This loop runs $ALG again with copy_algorithm=False, so from the second pass on minimize does not set it up and returns the result of the first pass. A second call with another problem, ("n_gen", 30) and another seed returned the F of the first call, still at generation 11. Build the algorithm inside the loop, or drop copy_algorithm=False.
rule:
  kind: call
  all:
    - matches: run-in-place
    - inside:
        stopBy: end
        any: [{ kind: for_statement }, { kind: while_statement }]
        not: { has: { stopBy: end, kind: assignment, has: { field: left, any: [{ pattern: $ALG }, { has: { stopBy: end, kind: identifier, pattern: $ALG } }] } } }
utils:
  pymoo-minimize:
    kind: call
    all:
      - has: { field: function, regex: '^minimize$' }
      - inside:
          kind: module
          stopBy: end
          all:
            - has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.optimize\s+import\b[^#]*\bminimize\b' }
            - not: { has: { stopBy: end, kind: import_from_statement, regex: '^from\s+scipy(\.\w+)*\s+import\b[^#]*\bminimize\b' } }
  run-in-place:
    kind: call
    all:
      - has: { field: function, regex: '^minimize$' }
      - has: { field: arguments, has: { kind: keyword_argument, regex: '^copy_algorithm\s*=\s*False$' } }
      - has: { field: arguments, has: { nthChild: 2, kind: identifier, pattern: $ALG } }
      - matches: pymoo-minimize
metadata: { since: "0.6" }
