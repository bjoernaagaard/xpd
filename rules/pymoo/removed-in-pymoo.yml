# The termination names that get_termination and the tuple form took up to 0.5.0. Each of the ten
# built a termination on 0.5.0 and raises Exception on 0.6.0 and 0.6.2, with the text
# "Termination not found." The string must be the first argument of get_termination, or the first
# item of a tuple given to the minimize that the file imports from pymoo.optimize. No fix, because
# the message names several replacements, and the tolerance to use is not in the file.
id: removed-in-pymoo
language: python
severity: error
message: $NAME is not a termination name since pymoo 0.6.0, and it raises Exception with the text "Termination not found." The names are n_gen, n_iter, n_eval, n_evals, time, fmin, soo and moo. For a tolerance, build DefaultSingleObjectiveTermination or DefaultMultiObjectiveTermination from pymoo.termination.default, which take xtol, cvtol, ftol, period, n_max_gen and n_max_evals.
rule:
  kind: string
  pattern: $NAME
  regex: '^["''](igd|x_tol|xtol|f_tol|ftol|f_tol_s|ftol_s|default|default_multi|default_single)["'']$'
  nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }
  any:
    - inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '(^|\.)get_termination$' } } }
    - inside:
        kind: tuple
        any:
          - inside: { kind: argument_list, inside: { matches: pymoo-minimize } }
          - inside: { kind: keyword_argument, has: { field: name, regex: '^termination$' }, inside: { kind: argument_list, inside: { matches: pymoo-minimize } } }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|pymoo_version|PYMOO' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
metadata: { since: "0.6" }
---
# An indicator is run with do since 0.5.0, and can be called since 0.6.0. calc raises
# AttributeError on 0.5.0 and on 0.6.2, and calling the object raised TypeError on 0.5.0. The
# object must be built in the same expression, or be a name that the file binds to an indicator
# class and to no other class. The file must import the class from pymoo.indicators,
# pymoo.performance_indicator or pymoo.factory and must not define a class of that name, because
# a project's own IGD may well have a calc method.
id: removed-in-pymoo
language: python
severity: error
message: An indicator has no calc since pymoo 0.5.0, and the call raises AttributeError. Write $I.do($$$A). From pymoo 0.6.0 on the object can also be called, as in $I($$$A).
rule:
  pattern: $I.calc($$$A)
  all:
    - any:
        - has: { field: function, has: { field: object, kind: call, has: { field: function, pattern: $CLS, regex: '(^|\.)(GD|GDPlus|IGD|IGDPlus|HV|Hypervolume|RMetric|get_performance_indicator)$' } } }
        - all:
            - has: { field: function, has: { field: object, kind: identifier, pattern: $I } }
            - inside:
                kind: module
                stopBy: end
                has:
                  stopBy: end
                  kind: assignment
                  all:
                    - has: { field: left, pattern: $I }
                    - has: { field: right, kind: call, has: { field: function, pattern: $CLS, regex: '(^|\.)(GD|GDPlus|IGD|IGDPlus|HV|Hypervolume|RMetric|get_performance_indicator)$' } }
            - not:
                inside:
                  kind: module
                  stopBy: end
                  has:
                    stopBy: end
                    kind: assignment
                    all:
                      - has: { field: left, pattern: $I }
                      - not: { has: { field: right, regex: '^(\w+\.)*(GD|GDPlus|IGD|IGDPlus|HV|Hypervolume|RMetric|get_performance_indicator)\(' } }
    - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.(indicators|performance_indicator|factory)\b[^#]*\bimport\b[^#]*\b(GD|GDPlus|IGD|IGDPlus|HV|Hypervolume|RMetric|get_performance_indicator)\b' } }
    - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: class_definition, has: { field: name, pattern: $CLS } } } }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|pymoo_version|PYMOO' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
fix: $I.do($$$A)
metadata: { fix: unsafe, since: "0.5" }
