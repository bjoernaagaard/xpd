# The functions that built an operator or another object from a name. Each raises an Exception
# when called on 0.6.0, and the module is gone since 0.6.1. The classes named in each message
# were imported on 0.6.2 from the modules given. These documents have no fix, because the class to
# build depends on the name that each call passes, and the calls are other statements.
