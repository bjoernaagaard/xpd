# The same three names in a statement that imports more than one name. No fix, because the fix
# would have to split the statement into one import for each module.
id: removed-in-pymoo
language: python
severity: error
message: pymoo.factory was removed in pymoo 0.6.1, and the import raises ModuleNotFoundError. Import get_problem from pymoo.problems, get_termination from pymoo.termination and get_reference_directions from pymoo.util.ref_dirs.
rule:
  kind: dotted_name
  regex: '^(get_problem|get_termination|get_reference_directions)$'
  inside:
    stopBy: end
    kind: import_from_statement
    has: { field: module_name, regex: '^pymoo\.factory$' }
    not: { regex: '^from\s+pymoo\.factory\s+import\s+\(?\s*(get_problem|get_termination|get_reference_directions)\s*,?\s*\)?$' }
  not:
    any:
      - inside: { kind: aliased_import, field: alias }
      - matches: compat-code
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|pymoo_version|PYMOO' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
metadata: { since: "0.6.1" }
