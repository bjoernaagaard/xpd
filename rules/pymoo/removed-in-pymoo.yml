# Any other name of pymoo.factory, such as the functions that listed the options, and the module
# imported as a whole. No fix, because these names have no replacement.
id: removed-in-pymoo
language: python
severity: error
message: pymoo.factory was removed in pymoo 0.6.1, and the import raises ModuleNotFoundError. Build each object from its class.
rule:
  any:
    - kind: dotted_name
      inside: { stopBy: end, kind: import_from_statement, has: { field: module_name, regex: '^pymoo\.factory$' } }
      not:
        any:
          - regex: '^(get_problem|get_termination|get_reference_directions|get_sampling|get_crossover|get_mutation|get_selection|get_algorithm|get_performance_indicator|get_decision_making|get_decomposition|get_visualization)$'
          - inside: { kind: import_from_statement, field: module_name }
          - inside: { kind: aliased_import, field: alias }
    - kind: wildcard_import
      inside: { kind: import_from_statement, has: { field: module_name, regex: '^pymoo\.factory$' } }
    - kind: dotted_name
      regex: '^pymoo\.factory$'
      any:
        - inside: { kind: import_statement }
        - inside: { kind: aliased_import, inside: { kind: import_statement } }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|pymoo_version|PYMOO' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
metadata: { since: "0.6.1" }
