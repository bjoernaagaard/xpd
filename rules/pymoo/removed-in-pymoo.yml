---
# Every module that pymoo 0.5.0 removed. These are the 89 module files that the release
# before it has and that this release and 0.6.2 do not have. An import that a document above
# rewrites is left to that document. No fix, because these modules have no one replacement for
# every name they held.
id: removed-in-pymoo
language: python
severity: error
message: $M was removed in pymoo 0.5.0, and the import raises ModuleNotFoundError. pymoo.model became pymoo.core, the algorithms moved to pymoo.algorithms.moo and pymoo.algorithms.soo.nonconvex, pymoo.performance_indicator became pymoo.indicators, pymoo.decision_making became pymoo.mcdm, pymoo.configuration became pymoo.config with the class Config, and the operator modules got short names such as sbx, pm, rnd and lhs.
rule:
  kind: dotted_name
  pattern: $M
  regex: '^pymoo\.(algorithms\.ctaea|algorithms\.genetic_algorithm|algorithms\.moead|algorithms\.nsga2|algorithms\.nsga3|algorithms\.rnsga2|algorithms\.rnsga3|algorithms\.so_aco|algorithms\.so_adam|algorithms\.so_brkga|algorithms\.so_cmaes|algorithms\.so_de|algorithms\.so_direct|algorithms\.so_ga_niching|algorithms\.so_genetic_algorithm|algorithms\.so_gradient_descent|algorithms\.so_local_search|algorithms\.so_nelder_mead|algorithms\.so_pattern_search|algorithms\.so_pso|algorithms\.so_random_search|algorithms\.so_sqlp|algorithms\.unsga3|configuration|decision_making|decision_making\.compromise_programming|decision_making\.high_tradeoff|decision_making\.high_tradeoff_inverted|decision_making\.pseudo_weights|model|model\.algorithm|model\.callback|model\.crossover|model\.decision_making|model\.decomposition|model\.duplicate|model\.evaluator|model\.indicator|model\.individual|model\.infill|model\.initialization|model\.mating|model\.mutation|model\.plot|model\.population|model\.problem|model\.repair|model\.replacement|model\.result|model\.sampling|model\.selection|model\.survival|model\.termination|operators\.crossover\.biased_crossover|operators\.crossover\.differental_evolution_crossover|operators\.crossover\.edge_recombination_crossover|operators\.crossover\.exponential_crossover|operators\.crossover\.half_uniform_crossover|operators\.crossover\.nelder_mead_crossover|operators\.crossover\.no_crossover|operators\.crossover\.order_crossover|operators\.crossover\.parent_centric_crossover|operators\.crossover\.point_crossover|operators\.crossover\.simulated_binary_crossover|operators\.crossover\.uniform_crossover|operators\.ensemble_mating|operators\.mutation\.bitflip_mutation|operators\.mutation\.inversion_mutation|operators\.mutation\.no_mutation|operators\.mutation\.polynomial_mutation|operators\.sampling\.latin_hypercube_sampling|operators\.sampling\.random_permutation_sampling|operators\.sampling\.random_sampling|operators\.selection\.random_selection|operators\.selection\.tournament_selection|operators\.survival\.age|performance_indicator|performance_indicator\.distance_indicator|performance_indicator\.gd|performance_indicator\.gd_plus|performance_indicator\.hv|performance_indicator\.igd|performance_indicator\.igd_plus|performance_indicator\.kktpm|performance_indicator\.rmetric|problems\.gradient|util\.approx_grad|util\.mathematics|util\.subset_max_energy)$'
  any:
    - inside: { kind: import_from_statement, field: module_name }
    - inside: { kind: import_statement }
    - inside: { kind: aliased_import, inside: { kind: import_statement } }
  not:
    any:
      - matches: compat-code
      - inside:
          kind: import_from_statement
          field: module_name
          any:
            - regex: '^from\s+pymoo\.algorithms\.ctaea\s+import\s+\(?[\s,]*((CADASurvival|CTAEA|RestrictedMating|comp_by_cv_dom_then_random)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
            - regex: '^from\s+pymoo\.algorithms\.genetic_algorithm\s+import\s+\(?[\s,]*((GeneticAlgorithm)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
            - regex: '^from\s+pymoo\.algorithms\.moead\s+import\s+\(?[\s,]*((MOEAD)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
            - regex: '^from\s+pymoo\.algorithms\.nsga2\s+import\s+\(?[\s,]*((NSGA2|RankAndCrowdingSurvival|binary_tournament)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
