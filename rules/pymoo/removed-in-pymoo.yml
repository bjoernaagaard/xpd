  kind: dotted_name
  pattern: $M
  regex: '^pymoo\.(algorithms\.soo\.nonconvex\.nelder_mead|algorithms\.soo\.nonconvex\.pattern_search|interface|operators\.crossover\.util|operators\.integer_from_float_operator|operators\.mixed_variable_operator|problems\.autodiff|problems\.bounds_as_constr|problems\.constr_as_penalty|problems\.cv_as_obj|problems\.meta|problems\.stun|util\.termination|util\.termination\.collection|util\.termination\.constr_violation|util\.termination\.default|util\.termination\.f_tol|util\.termination\.f_tol_single|util\.termination\.max_eval|util\.termination\.max_gen|util\.termination\.max_time|util\.termination\.min_igd|util\.termination\.no_termination|util\.termination\.sliding_window_termination|util\.termination\.x_tol)$'
