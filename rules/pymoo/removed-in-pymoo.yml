# A statement on one line that imports only names that moved to pymoo.parallelization.joblib. The
# fix writes the new module.
id: removed-in-pymoo
language: python
severity: error
message: $N is not in pymoo.core.problem since pymoo 0.6.1.6, and the import raises ImportError. Import it from pymoo.parallelization.joblib.
rule:
  kind: import_from_statement
  pattern: $S
  regex: '^from[ \t]+pymoo\.core\.problem[ \t]+import[ \t]+((JoblibParallelization)([ \t]+as[ \t]+\w+)?[ \t]*,[ \t]*)*(JoblibParallelization)([ \t]+as[ \t]+\w+)?$'
  has: { stopBy: end, kind: dotted_name, regex: '^(JoblibParallelization)$', pattern: $N }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|pymoo_version|PYMOO' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
transform:
  FIXED: { replace: { source: $S, replace: '^from[ \t]+pymoo\.core\.problem', by: 'from pymoo.parallelization.joblib' } }
fix: $FIXED
metadata: { fix: unsafe, since: "0.6.1.6" }
