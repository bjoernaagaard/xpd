# Each document finds an import or a call that raises on pymoo 0.6.2 because a release removed
# the module, the name or the option. Every list here was read from the installed wheels of the
# eleven releases from 0.4.2.2 to 0.6.2, and each form was run on the last release that has it
# and on the first release without it, which is the release that since names. xpd skips a
# document when the project's venv holds an older pymoo. Code inside a try block that catches the
# error, behind a version check, or inside pytest.raises is a compatibility path and stays silent.
#
# A fix here turns code that raises into code that runs, so no fix can be compared with the old
# form and every fix is unsafe.

# pymoo.factory. The three functions below still worked on 0.6.0, with a DeprecationWarning, and
# the module is gone since 0.6.1. Each fix rewrites a statement that imports that one name.
id: removed-in-pymoo
language: python
severity: error
message: pymoo.factory was removed in pymoo 0.6.1, and the import raises ModuleNotFoundError. Import get_problem from pymoo.problems.
rule:
  kind: import_from_statement
  regex: '^from\s+pymoo\.factory\s+import\s+\(?\s*get_problem\s*,?\s*\)?$'
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|pymoo_version|PYMOO' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
fix: from pymoo.problems import get_problem
metadata: { fix: unsafe, since: "0.6.1" }
