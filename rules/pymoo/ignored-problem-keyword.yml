# pymoo 0.4 kept type_var as an attribute of the problem. Since 0.5.0 Problem has no such
# parameter and only stores the keyword in problem.data, and 0.6.0 added vtype. A problem built
# with type_var=int had vtype None on pymoo 0.6.2. vtype is a hint that some operators and helpers
# read, so the rename can change a run and the document has no fix.
id: ignored-problem-keyword
language: python
severity: warning
message: type_var is not a parameter of Problem since pymoo 0.5.0, which only stores it in problem.data. A problem built with type_var=int had vtype None. Write vtype, the name of the argument since pymoo 0.6.0.
rule:
  kind: keyword_argument
  regex: '^type_var\s*='
  inside: { kind: argument_list, inside: { matches: problem-init } }
utils:
  problem-init:
    kind: call
    all:
      - any:
          - all:
              - has: { field: function, regex: '^(super\(\)|Problem|ElementwiseProblem)\.__init__$' }
              - inside:
                  stopBy: end
                  kind: class_definition
                  has: { field: superclasses, has: { kind: identifier, regex: '^(Problem|ElementwiseProblem)$' } }
          - has: { field: function, regex: '^(Problem|ElementwiseProblem)$' }
      - inside:
          kind: module
          stopBy: end
          has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.core\.problem\s+import\b[^#]*\b(Problem|ElementwiseProblem)\b' }
metadata: { since: "0.6" }
