# Problem.__init__ ends in **kwargs and stores what it does not know in problem.data, so a
# keyword that an older pymoo acted on is accepted and does nothing. Each document names one
# such keyword, and each was run on pymoo 0.6.2.
#
# The keyword must be given to super().__init__ inside a class that inherits from the Problem or
# ElementwiseProblem the file imports from pymoo, or to one of those two classes called by name.

# pymoo 0.4 took elementwise_evaluation=True, 0.5.0 raised an Exception that asked for
# ElementwiseProblem, and 0.6 accepts the keyword and evaluates the whole population at once. A
# method written for one solution, x[0] ** 2 + x[1] ** 2 + x[2] ** 2, then returned
# [0.66, 0.93, 1.26] for three solutions whose values are [0.14, 0.77, 1.94]. With another
# number of solutions the same method raises, because the shape no longer fits.
id: ignored-problem-keyword
language: python
severity: error
message: elementwise_evaluation is not read since pymoo 0.6.0, so _evaluate gets the whole population where the code expects one solution. A method of x[0], x[1] and x[2] returned [0.66, 0.93, 1.26] for three solutions whose values are [0.14, 0.77, 1.94]. Inherit from ElementwiseProblem and drop the keyword.
rule:
  kind: keyword_argument
  regex: '^elementwise_evaluation\s*=\s*True$'
  inside: { kind: argument_list, inside: { matches: problem-init } }
utils:
  problem-init:
    kind: call
    all:
      - any:
          - all:
              - has: { field: function, regex: '^(super\(\)|Problem|ElementwiseProblem)\.__init__$' }
              - inside:
                  stopBy: end
                  kind: class_definition
                  has: { field: superclasses, has: { kind: identifier, regex: '^(Problem|ElementwiseProblem)$' } }
          - has: { field: function, regex: '^(Problem|ElementwiseProblem)$' }
      - inside:
          kind: module
          stopBy: end
          has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.core\.problem\s+import\b[^#]*\b(Problem|ElementwiseProblem)\b' }
metadata: { since: "0.6" }
---
# pymoo 0.4 took parallelization=("starmap", pool.starmap), and on 0.4.2.2 the starmap was called
# 3 times in 3 generations. On pymoo 0.5.0 and on 0.6.2 an ElementwiseProblem given the tuple
# called it 0 times, so the run was sequential. The replacement, elementwise_runner, is from
# 0.6.0, which is what since names.
id: ignored-problem-keyword
language: python
severity: error
message: parallelization is not read since pymoo 0.5.0, so the solutions are evaluated one after the other. A starmap given this way was called 0 times in 3 generations. Pass elementwise_runner=StarmapParallelization(pool.starmap), with StarmapParallelization from pymoo.core.problem.
rule:
  kind: keyword_argument
  regex: '^parallelization\s*='
  inside: { kind: argument_list, inside: { matches: problem-init } }
utils:
  problem-init:
    kind: call
    all:
      - any:
          - all:
              - has: { field: function, regex: '^(super\(\)|Problem|ElementwiseProblem)\.__init__$' }
              - inside:
                  stopBy: end
                  kind: class_definition
                  has: { field: superclasses, has: { kind: identifier, regex: '^(Problem|ElementwiseProblem)$' } }
          - has: { field: function, regex: '^(Problem|ElementwiseProblem)$' }
      - inside:
          kind: module
          stopBy: end
          has: { stopBy: end, kind: import_from_statement, regex: '^from\s+pymoo\.core\.problem\s+import\b[^#]*\b(Problem|ElementwiseProblem)\b' }
metadata: { since: "0.6", until: "0.6.1.6" }
---
