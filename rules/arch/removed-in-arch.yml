      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $B } }, { not: { has: { field: right, matches: resampler-call } } }] } } }
      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ any: [{ kind: parameters }, { kind: lambda_parameters }, { kind: as_pattern_target }, { kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $B } }, { any: [{ kind: for_statement }, { kind: for_in_clause }], has: { field: left, pattern: $B } }, { kind: named_expression, has: { field: name, pattern: $B } }] } } }
