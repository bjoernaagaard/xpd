# A distribution took the RandomState as its one positional argument until arch 8.0. seed is
# keyword only, so a positional argument raises TypeError on 8.0.0 and 9.0.0.
# The fix names the one argument seed, and drops the comments in the call.
# Safe: on arch 7.2.0 a RandomState by position and as seed gave equal distributions and draws.
id: removed-in-arch
language: python
severity: error
message: $C takes no positional argument since arch 8.0, and this call raises TypeError. Write $C(seed=$A), which takes the same RandomState, a Generator or an integer.
rule:
  kind: call
  all:
    - has: { field: function, pattern: $C, matches: distribution-class }
    - has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { any: [{ kind: keyword_argument }, { kind: dictionary_splat }, { kind: list_splat }] }, pattern: $A } }
    - not: { has: { field: arguments, has: { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } } } } }
  not: { matches: compat-code }
utils:
  distribution-class:
    any:
      - kind: attribute
        regex: '^arch\.univariate(\.distribution)?\.(Normal|StudentsT|SkewStudent|GeneralizedError)$'
      - kind: identifier
        regex: '^(Normal|StudentsT|SkewStudent|GeneralizedError)$'
        pattern: $N
        inside:
          kind: module
          stopBy: end
          has:
            kind: import_from_statement
            stopBy: end
            all:
              - has: { field: module_name, regex: '^arch\.univariate(\.distribution)?$' }
              - has: { stopBy: end, kind: identifier, pattern: $N }
fix: $C(seed=$A)
metadata: { fix: safe, since: "8.0" }
