# arch.utility exported cov_nw until arch 8.0. The function is still in arch.utility.cov, which
# every release from 4.19 to 9.0.0 has. The fix rewrites the import when cov_nw is the only name
# it brings in, under its own name or another.
# Safe: on arch 7.2.0 arch.utility.cov_nw is arch.utility.cov.cov_nw.
id: removed-in-arch
language: python
severity: error
message: arch.utility has not exported cov_nw since arch 8.0, and this import raises ImportError. Import it from arch.utility.cov.
rule:
  kind: import_from_statement
  all:
    - has: { field: module_name, regex: '^arch\.utility$' }
    - has: { matches: cov-name, pattern: $COV }
    - not: { has: { matches: other-name } }
  not: { matches: compat-code }
utils:
  cov-name: { any: [{ kind: dotted_name, regex: '^cov_nw$' }, { kind: aliased_import, has: { field: name, regex: '^cov_nw$' } }] }
  other-name: { any: [{ kind: dotted_name, not: { regex: '^(cov_nw|arch\.utility)$' } }, { kind: aliased_import, not: { has: { field: name, regex: '^cov_nw$' } } }] }
fix: from arch.utility.cov import $COV
metadata: { fix: safe, since: "8.0" }
---
# The same import with other names beside cov_nw. The fix keeps the other names in the import,
# drops the comments in it, and imports cov_nw from arch.utility.cov on a line of its own.
# Safe: on arch 7.2.0 arch.utility.cov_nw is arch.utility.cov.cov_nw.
id: removed-in-arch
language: python
severity: error
message: arch.utility has not exported cov_nw since arch 8.0, and this import raises ImportError. Import it from arch.utility.cov.
rule:
  kind: import_from_statement
  pattern: from arch.utility import $$$NAMES
  all:
    - has: { field: module_name, regex: '^arch\.utility$' }
    - has: { matches: cov-name, pattern: $COV }
    - has: { matches: other-name }
  not: { matches: compat-code }
utils:
  cov-name: { any: [{ kind: dotted_name, regex: '^cov_nw$' }, { kind: aliased_import, has: { field: name, regex: '^cov_nw$' } }] }
  other-name: { any: [{ kind: dotted_name, not: { regex: '^(cov_nw|arch\.utility)$' } }, { kind: aliased_import, not: { has: { field: name, regex: '^cov_nw$' } } }] }
rewriters:
  - id: drop
    rule: { matches: cov-name }
    fix: ""
  - id: keep
    rule: { pattern: $N, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$N, "
transform:
  KEPT:
    rewrite: { source: $$$NAMES, rewriters: [drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: |-
  from arch.utility import $REST
  from arch.utility.cov import $COV
metadata: { fix: safe, since: "8.0" }
