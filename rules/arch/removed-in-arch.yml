# The bootstraps took random_state until arch 8.0, with a FutureWarning from 5.0 on. They take
# their data as keyword arguments too, so 8.0.0 and 9.0.0 read random_state as data and raise
# TypeError because a RandomState is not an array. seed takes a RandomState, a Generator or an
# integer. The class names are the ones arch.bootstrap exports on 9.0.0, and no other library
# that was looked at has them.
id: removed-in-arch
language: python
severity: error
message: arch 8.0 removed the random_state keyword of $C, which now reads it as data and raises TypeError. Write seed, which takes the same RandomState, a Generator or an integer.
rule:
  kind: identifier
  regex: '^random_state$'
  inside:
    kind: keyword_argument
    field: name
    inside:
      kind: argument_list
      inside:
        kind: call
        has: { field: function, pattern: $C, regex: '(^|\.)(IIDBootstrap|IndependentSamplesBootstrap|StationaryBootstrap|CircularBlockBootstrap|MovingBlockBootstrap|LocalBlockBootstrap)$' }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|arch_version|ARCH_V' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
fix: seed
metadata: { fix: unsafe, since: "8.0" }
