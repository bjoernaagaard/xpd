# Each document finds a form that arch removed and that raises on arch 9.0.0. Each was run on
# the release before the removal and on the release that made it, both installed from PyPI:
# 7.2.0 and 8.0.0 for the RandomState paths and cov_nw, and 8.0.0 and 9.0.0 for the rest. The
# changelog of 8.0 does not list its removals, so the versions come from those runs. Every
# document carries since, so a project with an older arch in its venv is left alone. Code inside
# a try block that catches the error, or behind a version check, is a compatibility path and
# stays silent, and so does code inside pytest.raises or pytest.warns, which is meant to raise.
#
# A fix here turns code that raises into code that runs. It is safe where the release before the
# removal ran the old and the new form and gave the same object or an equal value, and the
# comment above the document names that release. Every other fix is unsafe.

# arch.__future__.reindexing made reindex=False the default of forecast before arch 6.2 did.
# The import did nothing from 6.2 on, and arch 9.0 removed the module. The fix deletes the
# statement, and a name that it bound, such as arch in import arch.__future__.reindexing, is then
# not bound by that line.
id: removed-in-arch
language: python
severity: error
message: arch 9.0 removed arch.__future__, and this import raises ModuleNotFoundError. It has done nothing since arch 6.2, where forecast got reindex=False as its default. Delete the import.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+arch\.__future__(\.\w+)*\s+import\b'
    - kind: import_statement
      regex: '^import\s+arch\.__future__\b'
  not: { matches: compat-code }
fix: ""
metadata: { fix: unsafe, since: "9.0" }
---
# hedgehog_plot took type until arch 9.0, with a FutureWarning on 8.0.0, and takes plot_type
# with the same values. The fix renames the keyword only on a result that the file gets from
# fit or fix of an arch model.
# Safe: on arch 8.0.0 hedgehog_plot drew the same lines and PNG bytes with type and with plot_type.
id: removed-in-arch
language: python
severity: error
message: arch 9.0 removed the type keyword of hedgehog_plot, and this call raises TypeError. Write plot_type, which takes the same values.
rule:
  kind: identifier
  regex: '^type$'
  inside:
    kind: keyword_argument
    field: name
    inside:
      kind: argument_list
      inside:
        kind: call
        has:
          field: function
          kind: attribute
          all:
            - has: { field: attribute, regex: '^hedgehog_plot$' }
            - has: { field: object, matches: result }
  not: { matches: compat-code }
utils:
  model-call: { kind: call, has: { field: function, regex: '(^|\.)(arch_model|ConstantMean|ZeroMean|ARX|HARX|LS|MAMean|ARCHInMean)$' } }
  model:
    any:
      - matches: model-call
      - kind: identifier
        pattern: $M
        all:
          - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $M } }, { has: { field: right, matches: model-call } }] } }
          - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $M } }, { not: { has: { field: right, matches: model-call } } }] } } }
          - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ any: [{ kind: parameters }, { kind: lambda_parameters }, { kind: as_pattern_target }, { kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $M } }, { any: [{ kind: for_statement }, { kind: for_in_clause }], has: { field: left, pattern: $M } }, { kind: named_expression, has: { field: name, pattern: $M } }] } } }
  fit-call: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(fit|fix)$' } }, { has: { field: object, matches: model } }] } }
  result:
    any:
      - matches: fit-call
      - kind: identifier
        pattern: $R
        all:
          - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $R } }, { has: { field: right, matches: fit-call } }] } }
          - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $R } }, { not: { has: { field: right, matches: fit-call } } }] } } }
          - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ any: [{ kind: parameters }, { kind: lambda_parameters }, { kind: as_pattern_target }, { kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $R } }, { any: [{ kind: for_statement }, { kind: for_in_clause }], has: { field: left, pattern: $R } }, { kind: named_expression, has: { field: name, pattern: $R } }] } } }
fix: plot_type
metadata: { fix: safe, since: "9.0" }
