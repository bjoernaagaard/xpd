# block_size of a block bootstrap and bootstrap of a multiple comparison test are read only
# since arch 9.0, and assigning either raises AttributeError. Both assignments ran on 8.0.0.
id: removed-in-arch
language: python
severity: error
message: $A of this object is read only since arch 9.0, and the assignment raises AttributeError. Create a new object with the value you want.
rule:
  kind: assignment
  has:
    field: left
    kind: attribute
    any:
      - all:
          - has: { field: attribute, pattern: $A, regex: '^block_size$' }
          - has: { field: object, matches: block-bootstrap }
      - all:
          - has: { field: attribute, pattern: $A, regex: '^bootstrap$' }
          - has: { field: object, matches: comparison }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|arch_version|ARCH_V' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
  block-call: { kind: call, has: { field: function, regex: '(^|\.)(StationaryBootstrap|CircularBlockBootstrap|MovingBlockBootstrap|LocalBlockBootstrap)$' } }
  block-bootstrap:
    kind: identifier
    pattern: $B
    all:
      - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $B } }, { has: { field: right, matches: block-call } }] } }
      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $B } }, { not: { has: { field: right, matches: block-call } } }] } } }
      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ any: [{ kind: parameters }, { kind: lambda_parameters }, { kind: as_pattern_target }, { kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $B } }, { any: [{ kind: for_statement }, { kind: for_in_clause }], has: { field: left, pattern: $B } }, { kind: named_expression, has: { field: name, pattern: $B } }] } } }
  comparison-call: { kind: call, has: { field: function, regex: '(^|\.)(SPA|StepM|MCS|RealityCheck)$' } }
  comparison:
    kind: identifier
    pattern: $B
    all:
      - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $B } }, { has: { field: right, matches: comparison-call } }] } }
      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $B } }, { not: { has: { field: right, matches: comparison-call } } }] } } }
      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ any: [{ kind: parameters }, { kind: lambda_parameters }, { kind: as_pattern_target }, { kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $B } }, { any: [{ kind: for_statement }, { kind: for_in_clause }], has: { field: left, pattern: $B } }, { kind: named_expression, has: { field: name, pattern: $B } }] } } }
metadata: { since: "9.0" }
---
# SPA, StepM and RealityCheck took nested=True with studentize=False until arch 9.0, where the
# pair raises ValueError, "nested can only be True when studentize is True". On 8.0.0 it ran and
# gave the p-values of studentize=False. Both values must be written in the call. The names are
# short, so the file must import them from arch.bootstrap.
id: removed-in-arch
language: python
severity: error
message: $C takes nested=True only with studentize=True since arch 9.0, and this call raises ValueError. Drop nested, or drop studentize=False.
rule:
  kind: keyword_argument
  regex: '^nested\s*=\s*True$'
  inside:
    kind: argument_list
    all:
      - has: { kind: keyword_argument, regex: '^studentize\s*=\s*False$' }
      - inside:
          kind: call
          has:
            field: function
            pattern: $C
            any:
              - { kind: attribute, regex: '^arch\.bootstrap(\.multiple_comparison)?\.(SPA|StepM|RealityCheck)$' }
              - kind: identifier
                regex: '^(SPA|StepM|RealityCheck)$'
                inside:
                  kind: module
                  stopBy: end
                  has: { kind: import_from_statement, stopBy: end, all: [{ has: { field: module_name, regex: '^arch\.bootstrap(\.multiple_comparison)?$' } }, { has: { stopBy: end, kind: identifier, pattern: $C } }] }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|arch_version|ARCH_V' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
metadata: { since: "9.0" }
