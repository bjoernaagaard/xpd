# The distributions took random_state until arch 8.0 and take seed, which is keyword only.
# Normal is a name that other libraries have too, so the document asks that the file imports
# the class from arch, or spells it through the arch module.
# Safe: on arch 7.2.0 the four distributions gave equal objects and draws with either keyword.
id: removed-in-arch
language: python
severity: error
message: arch 8.0 removed the random_state keyword of $C, and this call raises TypeError. Write seed, which takes the same RandomState, a Generator or an integer.
rule:
  kind: identifier
  regex: '^random_state$'
  inside:
    kind: keyword_argument
    field: name
    inside:
      kind: argument_list
      inside:
        kind: call
        has: { field: function, pattern: $C, matches: distribution-class }
  not: { matches: compat-code }
utils:
  distribution-class:
    any:
      - kind: attribute
        regex: '^arch\.univariate(\.distribution)?\.(Normal|StudentsT|SkewStudent|GeneralizedError)$'
      - kind: identifier
        regex: '^(Normal|StudentsT|SkewStudent|GeneralizedError)$'
        pattern: $N
        inside:
          kind: module
          stopBy: end
          has:
            kind: import_from_statement
            stopBy: end
            all:
              - has: { field: module_name, regex: '^arch\.univariate(\.distribution)?$' }
              - has: { stopBy: end, kind: identifier, pattern: $N }
fix: seed
metadata: { fix: safe, since: "8.0" }
