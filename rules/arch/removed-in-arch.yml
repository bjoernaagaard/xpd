# seed, get_state and set_state were methods of the bootstraps until arch 8.0, and seed was one
# of SPA, StepM, MCS and RealityCheck. Each raises AttributeError on 8.0.0 and 9.0.0. The object
# is one that the file builds from an arch class and assigns to this name and to nothing else.
# get_state() of a bootstrap becomes the state property, which arch has had since 5.0.
# Safe: on arch 7.2.0 get_state() and state gave equal states for the five bootstraps it has.
id: removed-in-arch
language: python
severity: error
message: arch 8.0 removed get_state from the bootstraps, and this call raises AttributeError. Write $O.state, which holds the state of the bootstrap's generator.
rule:
  kind: call
  pattern: $O.get_state()
  has: { field: function, kind: attribute, has: { field: object, matches: resampler } }
  not: { matches: compat-code }
utils:
  resampler-call: { kind: call, has: { field: function, regex: '(^|\.)(IIDBootstrap|IndependentSamplesBootstrap|StationaryBootstrap|CircularBlockBootstrap|MovingBlockBootstrap)$' } }
  resampler:
    kind: identifier
    pattern: $B
    all:
      - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $B } }, { has: { field: right, matches: resampler-call } }] } }
      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $B } }, { not: { has: { field: right, matches: resampler-call } } }] } } }
      - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ any: [{ kind: parameters }, { kind: lambda_parameters }, { kind: as_pattern_target }, { kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $B } }, { any: [{ kind: for_statement }, { kind: for_in_clause }], has: { field: left, pattern: $B } }, { kind: named_expression, has: { field: name, pattern: $B } }] } } }
fix: $O.state
metadata: { fix: safe, since: "8.0" }
