# hedgehog_plot took type until arch 9.0, with a FutureWarning on 8.0.0, and takes plot_type
# with the same values. The fix renames the keyword only on a result that the file gets from
# fit or fix of an arch model.
id: removed-in-arch
language: python
severity: error
message: arch 9.0 removed the type keyword of hedgehog_plot, and this call raises TypeError. Write plot_type, which takes the same values.
rule:
  kind: identifier
  regex: '^type$'
  inside:
    kind: keyword_argument
    field: name
    inside:
      kind: argument_list
      inside:
        kind: call
        has:
          field: function
          kind: attribute
          all:
            - has: { field: attribute, regex: '^hedgehog_plot$' }
            - has: { field: object, matches: result }
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|arch_version|ARCH_V' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
  model-call: { kind: call, has: { field: function, regex: '(^|\.)(arch_model|ConstantMean|ZeroMean|ARX|HARX|LS|MAMean|ARCHInMean)$' } }
  model:
