# A string option that arch does not have. arch checks each option against a table of accepted
# spellings, without regard to case. A script wrapped that check on arch 9.0.0, called each API
# once and kept the table it was handed, so every list below is the one the installed release
# uses. Each API was then run with every spelling of its table, in lower and in upper case, and
# with 28 other strings, each of which raised ValueError. A value that is a variable, an
# f-string or a constant is not read, so the rule is silent on it. Code inside pytest.raises or
# pytest.warns is meant to raise and stays silent. The class and function names are arch's own,
# and SPA, StepM, MCS and RealityCheck, which are short enough to be another library's, are
# reported only when the file imports them from arch.bootstrap.
#
# Releases before 9.0 took some of these options in one case only, so a value that 9.0.0 accepts
# in another case is not reported, and neither is a value that only 9.0 has, such as "maic".

# arch_model builds one of seven mean models. A moving average mean is the class MAMean and has
# no name here.
id: arch-unknown-option
language: python
severity: error
message: 'arch_model takes mean "zero", "constant", "harx", "har", "ar", "arx" or "ls", in any case. arch 9.0.0 raises ValueError for $V. Build another mean model from its class, such as MAMean.'
rule:
  kind: string
  pattern: $V
  all:
    - regex: '^[rbuRBU]{0,2}(''|")[^''"\\]*(''|")$'
    - not: { regex: '(?i)^[rbu]{0,2}(''|")(zero|constant|harx|har|ar|arx|ls)(''|")$' }
    - not: { has: { kind: interpolation } }
    - inside:
        kind: keyword_argument
        field: value
        has: { field: name, regex: '^mean$' }
        inside:
          kind: argument_list
          inside:
            kind: call
            has: { field: function, pattern: $C, regex: '(^|\.)(arch_model)$' }
  not: { matches: expected-to-raise }
utils:
  expected-to-raise: { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }
