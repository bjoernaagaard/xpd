# On arch 5.0, 6.1.0, 6.2.0 and 8.0.0, method="range" gave the p-values of "max" and not those of
# "R", so a misspelt range statistic was read as the max statistic without a word.
id: arch-unknown-option
language: python
severity: error
message: 'MCS takes method "r" or "max", in any case. arch 9.0.0 raises ValueError for $V. arch 8.0.0 raised nothing, and method="range" gave the p-values of "max" there.'
rule:
  kind: string
  pattern: $V
  all:
    - regex: '^[rbuRBU]{0,2}(''|")[^''"\\]*(''|")$'
    - not: { regex: '(?i)^[rbu]{0,2}(''|")(r|max)(''|")$' }
    - not: { has: { kind: interpolation } }
    - inside:
        kind: keyword_argument
        field: value
        has: { field: name, regex: '^method$' }
        inside:
          kind: argument_list
          inside:
            kind: call
            has:
              field: function
              pattern: $C
              any:
                - { kind: attribute, regex: '^arch\.bootstrap(\.multiple_comparison)?\.(MCS)$' }
                - kind: identifier
                  regex: '^(MCS)$'
                  inside:
                    kind: module
                    stopBy: end
                    has: { kind: import_from_statement, stopBy: end, all: [{ has: { field: module_name, regex: '^arch\.bootstrap(\.multiple_comparison)?$' } }, { has: { stopBy: end, kind: identifier, pattern: $C } }] }
  not: { matches: expected-to-raise }
utils:
  expected-to-raise: { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }
