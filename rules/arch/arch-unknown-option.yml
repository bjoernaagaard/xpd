# The options of fit, forecast and hedgehog_plot are read only on a model that the file builds
# from arch_model or a mean class of arch, and on a result that it gets from fit or fix of such a
# model. The name must be assigned from nothing else in the file.
#
# On arch 4.19, 5.0, 6.1.0, 6.2.0 and 8.0.0, fit(cov_type="mle") ran and gave the standard errors of
# "classic", 0.00843 for omega on 1,500 daily S&P 500 returns where "robust" gave 0.01329.
id: arch-unknown-option
language: python
severity: error
message: 'fit takes cov_type "robust" or "classic", in any case. arch 9.0.0 raises ValueError for $V. arch 8.0.0 raised nothing, and cov_type="mle" gave the standard errors of "classic" there.'
rule:
  kind: string
  pattern: $V
  all:
    - regex: '^[rbuRBU]{0,2}(''|")[^''"\\]*(''|")$'
    - not: { regex: '(?i)^[rbu]{0,2}(''|")(robust|classic)(''|")$' }
    - not: { has: { kind: interpolation } }
    - inside:
        kind: keyword_argument
        field: value
        has: { field: name, regex: '^cov_type$' }
        inside:
          kind: argument_list
          inside:
            kind: call
            has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^fit$' } }, { has: { field: object, matches: model } }] }
  not: { matches: expected-to-raise }
utils:
  expected-to-raise: { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }
  model-call: { kind: call, has: { field: function, regex: '(^|\.)(arch_model|ConstantMean|ZeroMean|ARX|HARX|LS|MAMean|ARCHInMean)$' } }
  model:
    any:
      - matches: model-call
      - kind: identifier
        pattern: $M
        all:
          - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $M } }, { has: { field: right, matches: model-call } }] } }
          - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: assignment, all: [{ has: { field: left, pattern: $M } }, { not: { has: { field: right, matches: model-call } } }] } } }
          - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, any: [{ any: [{ kind: parameters }, { kind: lambda_parameters }, { kind: as_pattern_target }, { kind: pattern_list }, { kind: tuple_pattern }], has: { stopBy: end, kind: identifier, pattern: $M } }, { any: [{ kind: for_statement }, { kind: for_in_clause }], has: { field: left, pattern: $M } }, { kind: named_expression, has: { field: name, pattern: $M } }] } } }
