# hedgehog_plot calls forecast for each origin, with method="analytic" and horizon=10 unless the
# call says otherwise. On arch 9.0.0 and 8.0.0 it raised the same ValueError for vol="egarch",
# and on 9.0.0 for vol="garch" with power=1.0. It ran with horizon=1 and with
# method="simulation". The call is read only when every argument is a keyword.
id: analytic-forecast-horizon
language: python
severity: error
message: This model has no analytic forecast beyond one step, and hedgehog_plot forecasts 10 steps with method="analytic" unless the call says otherwise, so it raises ValueError, "Analytic forecasts not available for horizon > 1". Pass method="simulation" or method="bootstrap".
rule:
  kind: call
  all:
    - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^hedgehog_plot$' } }, { has: { field: object, matches: result } }] }
    - not: { has: { field: arguments, has: { not: { any: [{ kind: keyword_argument }, { kind: comment }, { regex: '^[(),]$' }] } } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^horizon$' } }, { not: { has: { field: value, kind: integer, regex: '^([2-9]|[1-9]\d+)$' } } }] } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^method$' } }, { not: { has: { field: value, kind: string, regex: '(?i)^[rbu]{0,2}(''|")analytic(''|")$' } } }] } } }
  not: { matches: expected-to-raise }
utils:
  expected-to-raise: { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }
  model-call:
