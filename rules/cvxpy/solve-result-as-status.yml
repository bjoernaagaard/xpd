id: solve-result-as-status
language: python
severity: warning
message: CVXPY Problem.solve() returns an objective value. Call it once, then check Problem.status for an acceptable solver status.
rule:
  kind: call
  all:
    - {pattern: '$PROBLEM.solve($$$ARGS)'}
    - any:
        - {matches: cvxpy-test-condition}
        - inside:
            stopBy: {not: {any: [{kind: parenthesized_expression}, {kind: not_operator}]}}
            all:
              - {any: [{kind: parenthesized_expression}, {kind: not_operator}]}
              - {matches: cvxpy-test-condition}
metadata:
  holds:
    PROBLEM: {matches: cvxpy-problem}
utils:
  cvxpy-test-condition:
    any:
      - {inside: {kind: if_statement, field: condition}}
      - {inside: {kind: elif_clause, field: condition}}
      - {inside: {kind: while_statement, field: condition}}
      - all:
          - {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}
          - {inside: {kind: conditional_expression}}
      - all:
          - {nthChild: {position: 1, ofRule: {not: {kind: comment}}}}
          - {inside: {kind: assert_statement}}
      - inside:
          kind: argument_list
          all:
            - {not: {has: {nthChild: {position: 2, ofRule: {not: {kind: comment}}}}}}
            - inside:
                kind: call
                has: {field: function, kind: identifier, regex: '^bool$', not: {matches: shadowed-bool}}
  shadowed-bool:
    matches:
      cvxpy-shadowed-name:
        ALLOWED_IMPORT: {regex: '^$'}
