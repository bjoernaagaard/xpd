id: implicit-reshape-order
language: python
severity: warning
message: Specify order for CVXPY reshape. Use order="F" for column-major order or order="C" for row-major order.
rule:
  all:
    - {kind: call, pattern: '$RECEIVER.reshape($$$ARGS)'}
    - {pattern: $CALL}
    - has:
        field: arguments
        all:
          - not:
              has:
                any:
                  - {kind: comment}
                  - {kind: line_continuation}
                  - {kind: list_splat}
                  - {kind: dictionary_splat}
                  - kind: keyword_argument
                    has: {field: name, not: {regex: '^(shape)$'}}
          - {has: {nthChild: 1}}
          - {not: {has: {nthChild: 2}}}
transform:
  EXPLICIT:
    replace: {source: $CALL, replace: ',?(\s*\))$', by: ', order="F"$1'}
fix: $EXPLICIT
metadata:
  since: "1.6"
  fix: safe
  holds:
    RECEIVER:
      matches:
        cvxpy-leaf:
          SYMBOL: {regex: '^(Variable|Parameter|Constant)$'}
          BINDING: {pattern: $LEAF_IMPORT}
