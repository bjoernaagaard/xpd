id: implicit-reshape-order
language: python
severity: warning
message: Specify order for CVXPY reshape. Use order="F" for column-major order or order="C" for row-major order.
rule:
  all:
    - {kind: call, has: {field: function, pattern: $FUNCTION}}
    - {pattern: $CALL}
    - has:
        field: arguments
        all:
          - not:
              has:
                any:
                  - {kind: comment}
                  - {kind: line_continuation}
                  - {kind: list_splat}
                  - {kind: dictionary_splat}
                  - kind: keyword_argument
                    has: {field: name, not: {regex: '^(expr|shape)$'}}
          - {has: {nthChild: 2}}
          - {not: {has: {nthChild: 3}}}
transform:
  EXPLICIT:
    replace: {source: $CALL, replace: ',?(\s*\))$', by: ', order="F"$1'}
fix: $EXPLICIT
metadata:
  since: "1.6"
  fix: safe
  holds:
    FUNCTION:
      matches:
        cvxpy-imported-symbol:
          MODULE: {regex: '^cvxpy(?:\.atoms(?:\.affine(?:\.reshape)?)?)?$'}
          SYMBOL: {regex: '^reshape$'}
          BINDING: {pattern: $ATOM_IMPORT}
---
