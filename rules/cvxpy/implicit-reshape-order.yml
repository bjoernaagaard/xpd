id: implicit-reshape-order
language: python
severity: warning
message: Specify order for CVXPY flatten. Use order="F" for column-major order or order="C" for row-major order.
rule:
  kind: call
  all:
    - not:
        has:
          field: arguments
          has:
            any:
              - {kind: comment}
              - {kind: line_continuation}
              - {kind: list_splat}
              - {kind: dictionary_splat}
    - any:
        - all:
            - {pattern: $OMITTED}
            - {pattern: '$EXPR.flatten()'}
        - all:
            - {pattern: $DEFAULT}
            - any:
                - {pattern: '$EXPR.flatten(None)'}
                - {pattern: '$EXPR.flatten(order=None)'}
transform:
  INSERTED:
    replace: {source: $OMITTED, replace: '(\s*\))$', by: 'order="F"$1'}
  EXPLICIT:
    replace: {source: $DEFAULT, replace: '\bNone(\s*,?\s*\))$', by: '"F"$1'}
fix: $INSERTED$EXPLICIT
metadata:
  since: "1.6"
  fix: safe
  holds:
    EXPR:
      kind: call
      has: {field: function, regex: '(^|\.)(Variable|Parameter|Constant)$'}
