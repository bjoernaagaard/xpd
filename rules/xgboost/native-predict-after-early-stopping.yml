id: native-predict-after-early-stopping
language: python
severity: warning
message: Native XGBoost prediction uses all retained rounds after early stopping. To predict at the best round, pass iteration_range=(0, $MODEL.best_iteration + 1).
rule:
  all:
    - any:
        - all:
            - { pattern: '$MODEL.predict($$$ARGS)' }
            - not: { has: { field: arguments, has: { matches: ninth-positional } } }
        - all:
            - { pattern: '$MODEL.inplace_predict($$$ARGS)' }
            - not: { has: { field: arguments, has: { matches: second-positional } } }
    - has:
        field: arguments
        not:
          has:
            any:
              - { kind: dictionary_splat }
              - { kind: list_splat }
              - { kind: keyword_argument, has: { field: name, regex: '^iteration_range$' } }
constraints:
  MODEL: { kind: identifier }
metadata:
  holds:
    MODEL:
      kind: call
      has: { field: function, regex: '(^|\.)train$' }
      all:
        - has:
            field: arguments
            has:
              kind: keyword_argument
              all:
                - { has: { field: name, regex: '^early_stopping_rounds$' } }
                - { has: { field: value, kind: integer, regex: '^(?:[1-9][0-9_]*|0[xX][0-9a-fA-F_]*[1-9a-fA-F][0-9a-fA-F_]*|0[oO][0-7_]*[1-7][0-7_]*|0[bB][01_]*1[01_]*)$' } }
        - has:
            field: arguments
            not:
              has:
                any:
                  - { kind: dictionary_splat }
                  - { kind: list_splat }
                  - kind: keyword_argument
                    all:
                      - { has: { field: name, regex: '^callbacks$' } }
                      - { has: { field: value, not: { matches: empty-callbacks } } }
utils:
  ninth-positional:
    nthChild:
      position: 9
      ofRule: { matches: positional }
  second-positional:
    nthChild:
      position: 2
      ofRule: { matches: positional }
  positional:
    not: { any: [{ kind: keyword_argument }, { kind: comment }] }
  empty-callbacks:
    regex: '^(?:\(\s*)*(?:None|\[(?:\s|#[^\n]*\n)*\]|\((?:\s|#[^\n]*\n)*\))(?:\s*\))*$'
