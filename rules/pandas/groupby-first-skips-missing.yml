id: groupby-first-skips-missing
language: python
severity: warning
message: $M() takes the first value that is not missing in each column, so one result row can mix rows. Write $G.$M(skipna=False) for the whole first row.
rule:
  pattern: $G.$M()
  has: { field: function, regex: '\.groupby\(' }
constraints:
  M: { regex: ^(first|last)$ }
  G:
    not:
      any:
        - { kind: subscript, has: { field: subscript, kind: string } }
        - pattern: $FRAME[[$COL]]
          has: { field: subscript, kind: list, not: { has: { kind: list_splat } } }
        - regex: '(^|\.)Series\('
fix: $G.$M(skipna=False)
metadata: { fix: unsafe }
