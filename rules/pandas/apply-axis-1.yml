# No fix, because the column expression depends on what the function does with each row.
id: apply-axis-1
language: python
severity: warning
message: apply(axis=1) calls a Python function once per row. Compute on whole columns instead, such as df["a"] + df["b"].
rule:
  any:
    - pattern: '$DF.apply(lambda $R: $BODY, axis=1)'
    - pattern: '$DF.apply(lambda $R: $BODY, axis="columns")'
    - pattern: "$DF.apply(lambda $R: $BODY, axis='columns')"
  has:
    field: arguments
    has:
      kind: lambda
      has:
        field: body
        kind: binary_operator
        all:
          - has: { stopBy: end, pattern: '$R[$C]' }
          - not:
              has:
                stopBy: end
                not:
                  any:
                    - kind: binary_operator
                    - kind: unary_operator
                    - kind: parenthesized_expression
                    - kind: integer
                    - kind: float
                    - kind: string
                    - kind: string_start
                    - kind: string_content
                    - kind: string_end
                    - { kind: subscript, pattern: '$R[$COL]', has: { field: subscript, kind: string } }
                    - { kind: identifier, pattern: $R, inside: { kind: subscript, field: value, has: { field: subscript, kind: string } } }
                    - regex: '^(\+|-|\*|/|//|%|\*\*|\(|\)|\[|\])$'
constraints:
  R: { regex: '^[A-Za-z_]\w*$' }
  DF: { any: [{ kind: identifier }, { kind: subscript }, { kind: attribute }] }
rewriters:
  - id: row-col
    rule: { kind: subscript, pattern: '$R[$COL]', has: { field: subscript, kind: string } }
    fix: '$DF[$COL]'
transform:
  NEW: { rewrite: { source: $BODY, rewriters: [row-col] } }
fix: ($NEW)
metadata: { fix: unsafe }
---
id: apply-axis-1
language: python
severity: warning
message: apply(axis=1) calls a Python function once per row. Compute on whole columns instead, such as df["a"] + df["b"].
rule:
  pattern: $DF.apply($$$A)
  has:
    field: arguments
    has:
      kind: keyword_argument
      all:
        - has: { field: name, regex: ^axis$ }
        - has: { field: value, regex: '^(1|["'']columns["''])$' }
  not:
    all:
      - any:
          - pattern: '$DF.apply(lambda $R: $BODY, axis=1)'
          - pattern: '$DF.apply(lambda $R: $BODY, axis="columns")'
          - pattern: "$DF.apply(lambda $R: $BODY, axis='columns')"
      - has: { field: function, has: { field: object, any: [{ kind: identifier }, { kind: subscript }, { kind: attribute }] } }
      - has:
          field: arguments
          has:
            kind: lambda
            has:
              field: body
              kind: binary_operator
              all:
                - has: { stopBy: end, pattern: '$R[$C]' }
                - not:
                    has:
                      stopBy: end
                      not:
                        any:
                          - kind: binary_operator
                          - kind: unary_operator
                          - kind: parenthesized_expression
                          - kind: integer
                          - kind: float
                          - kind: string
                          - kind: string_start
                          - kind: string_content
                          - kind: string_end
                          - { kind: subscript, pattern: '$R[$COL]', has: { field: subscript, kind: string } }
                          - { kind: identifier, pattern: $R, inside: { kind: subscript, field: value, has: { field: subscript, kind: string } } }
                          - regex: '^(\+|-|\*|/|//|%|\*\*|\(|\)|\[|\])$'
constraints:
  R: { regex: '^[A-Za-z_]\w*$' }
---
# agg and transform with axis=1 call a function once per row as apply does. A named method, as
# in agg("sum", axis=1), runs on whole columns and is left alone.
# No fix, because the column expression depends on what the function does with each row.
id: apply-axis-1
language: python
severity: warning
message: $M with axis=1 calls the function once per row in Python. Compute on whole columns instead, such as df["a"] + "_" + df["b"].
rule:
  pattern: $DF.$M($F, $$$REST)
  has:
    field: arguments
    has: { kind: keyword_argument, regex: '^axis\s*=\s*(1|["'']columns["''])$' }
constraints:
  M: { regex: '^(agg|aggregate|transform)$' }
  F:
    any:
      - kind: lambda
      - pattern: $SEP.join
