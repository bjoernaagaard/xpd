# No fix, because the message names two rewrites, case_when and pd.cut, and each needs the
# conditions taken apart.
id: nested-np-where
language: python
severity: warning
message: Nested np.where reads inside out and builds an array per level. Use Series.case_when, or pd.cut for numeric bins.
rule:
  pattern: np.where($C, $A, $B)
  has:
    field: arguments
    has: { pattern: np.where($$$) }
