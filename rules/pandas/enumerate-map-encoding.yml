# A dict of codes built from the unique values, and a lookup of every value in it. factorize
# numbers the values in the same order. Unsafe: factorize returns a NumPy array where the lookup
# returned a Series with the index of the column, and it gives a missing value the code -1 where
# the dict gave it a code of its own.
id: enumerate-map-encoding
language: python
severity: warning
message: This builds a dict of codes and looks every value up in it. Write pd.factorize($S)[0], which numbers the values in the same order.
rule:
  any:
    - pattern: "$S.map({$V: $I for $I, $V in enumerate($S.unique())})"
    - pattern: "$S.replace({$V: $I for $I, $V in enumerate($S.unique())})"
    - pattern: "$S.map(dict(zip($S.unique(), range($N))))"
fix: pd.factorize($S)[0]
metadata: { fix: unsafe }
---
# The codes of the sorted values. factorize with sort=True numbers them in sorted order. Unsafe
# for the same reasons.
id: enumerate-map-encoding
language: python
severity: warning
message: This builds a dict of codes and looks every value up in it. Write pd.factorize($S, sort=True)[0], which numbers the values in sorted order.
rule:
  pattern: "$S.map({$V: $I for $I, $V in enumerate(sorted($S.unique()))})"
fix: pd.factorize($S, sort=True)[0]
metadata: { fix: unsafe }
