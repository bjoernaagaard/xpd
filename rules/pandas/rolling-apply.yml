# rolling(...).apply with a lambda that calls one window method gives the same result as the
# method, which runs without Python per window. count is left alone, because rolling count
# counts windows with fewer values than min_periods, and apply skips them.
id: rolling-apply
language: python
severity: warning
message: Call $R.$K($$$W).$F() directly. rolling.apply runs a Python function once per window.
rule:
  pattern: "$R.$K($$$W).apply(lambda $X: $X.$F())"
constraints:
  K: { regex: ^(rolling|expanding)$ }
  F: { regex: ^(min|max|median)$ }
fix: $R.$K($$$W).$F()
metadata: { fix: safe }
---
# sum, mean, std and var: unsafe, because the window methods keep running totals, and on values
# far apart in size, such as 1e16, 1, 1, -1e16, a window sum changes from 0 to 2.
id: rolling-apply
language: python
severity: warning
message: Call $R.$K($$$W).$F() directly. rolling.apply runs a Python function once per window.
rule:
  pattern: "$R.$K($$$W).apply(lambda $X: $X.$F())"
constraints:
  K: { regex: ^(rolling|expanding)$ }
  F: { regex: ^(sum|mean|std|var)$ }
fix: $R.$K($$$W).$F()
metadata: { fix: unsafe }
---
# Any other function passed to rolling(...).apply gets a Series per window unless raw=True. The
# change is not a fix, because the function then receives a numpy array.
id: rolling-apply
language: python
severity: info
message: Without raw=True, rolling.apply builds a Series for every window. Pass raw=True if the function works on a numpy array, or engine="numba" if numba is installed, which was 9 times faster again after a compile of about one second.
rule:
  pattern: $R.$K($$$W).apply($$$A)
  not:
    any:
      - has:
          field: arguments
          has: { kind: keyword_argument, has: { field: name, regex: ^(raw|engine)$ } }
      - pattern: "$R.$K($$$W).apply(lambda $X: $X.$F())"
constraints:
  K: { regex: ^(rolling|expanding)$ }
---
# A NumPy function passed to agg, or to apply with raw=True. Unsafe: the window methods keep
# running totals, and they skip a missing value that the NumPy function returns, when
# min_periods lets a window hold one.
id: rolling-apply
language: python
severity: warning
message: A NumPy function passed to a rolling window runs once per window. Write $X.rolling($$$W).$M().
rule:
  any:
    - pattern: $X.rolling($$$W).agg($NP.$M)
    - pattern: $X.rolling($$$W).aggregate($NP.$M)
    - pattern: $X.rolling($$$W).apply($NP.$M, raw=True)
constraints:
  NP: { regex: '^(np|numpy)$' }
  M: { regex: '^(sum|mean|min|max|median)$' }
fix: $X.rolling($$$W).$M()
metadata: { fix: unsafe }
---
# np.std and np.var. No fix, because they divide by n where the window methods divide by n - 1,
# and the message does not name ddof=0.
id: rolling-apply
language: python
severity: warning
message: A NumPy function passed to a rolling window runs once per window. Call the window method, such as .max().
rule:
  any:
    - pattern: $X.rolling($$$W).agg($NP.$M)
    - pattern: $X.rolling($$$W).aggregate($NP.$M)
    - pattern: $X.rolling($$$W).apply($NP.$M, raw=True)
constraints:
  NP: { regex: '^(np|numpy)$' }
  M: { regex: '^(std|var)$' }
