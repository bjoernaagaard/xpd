# apply-date-part reports a lambda that only reads a date part, such as t.year. This reports a
# lambda that compares a part, or computes with parts.
# No fix, because the message gives an example, and the lambda's name would have to be replaced by
# $S.dt in its body.
id: apply-date-expression
language: python
severity: warning
message: This reads a date part and compares it once per value in Python. Compare the whole column through .dt, as in $S.dt.weekday >= 5.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $LHS in $RHS)"
    - pattern: "$S.map(lambda $X: $LHS in $RHS)"
constraints:
  LHS:
    matches: fixable-date-part
utils:
  fixable-date-part:
    any:
      - matches: fixable-part-attr
      - kind: call
        has: { field: function, matches: fixable-part-attr }
        not: { has: { field: arguments, has: { regex: '^[^(),]' } } }
  fixable-part-attr:
    kind: attribute
    all:
      - has: { field: object, pattern: $X }
      - has: { field: attribute, regex: '^(year|month|day|hour|minute|second|microsecond|quarter|dayofweek|day_of_week|dayofyear|day_of_year|weekday|days_in_month)$' }
rewriters:
  - id: part-call
    rule:
      kind: call
      pattern: $X.$P()
      has: { field: function, has: { field: attribute, regex: '^(year|month|day|hour|minute|second|microsecond|quarter|dayofweek|day_of_week|dayofyear|day_of_year|weekday|days_in_month)$' } }
    fix: $S.dt.$P
  - id: part-attr
    rule:
      kind: attribute
      pattern: $X.$P
      has: { field: attribute, regex: '^(year|month|day|hour|minute|second|microsecond|quarter|dayofweek|day_of_week|dayofyear|day_of_year|weekday|days_in_month)$' }
    fix: $S.dt.$P
transform:
  FIXED_LHS: { rewrite: { source: $LHS, rewriters: [part-call, part-attr] } }
fix: $FIXED_LHS.isin($RHS)
metadata: { fix: unsafe }
