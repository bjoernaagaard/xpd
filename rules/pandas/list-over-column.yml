# Not run on test files: a test's fixture frame has a handful of rows, and a loop that builds
# the expected value row by row is the point of the test.
# x["key"] in a for clause is more often a list inside a dict, such as data["rows"] from JSON,
# than a column: 14 of 23 hits in the held-back files were. So the receiver must be named like a
# frame: df, frame, or a name with one of them as a word.
# No fix, because the column method depends on what the comprehension computes.
id: list-over-column
language: python
severity: warning
ignores: ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
message: A list comprehension over a column runs Python once per value. Use a column method such as .str.upper() instead.
rule:
  kind: list_comprehension
  has:
    kind: for_in_clause
    has: { field: right, pattern: "$DF[$C]" }
constraints:
  C: { kind: string }
  DF: { regex: '(?i)(^|_)(df|frame)(_|\d|$)' }
---
# The statement form: a for loop over a column that appends to a list.
# No fix, because the column expression depends on the body of the loop.
id: list-over-column
language: python
severity: warning
ignores: ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
message: This loop appends one value per row in Python. Compute on the whole column and call tolist() at the end.
rule:
  kind: for_statement
  all:
    - has:
        field: right
        any:
          - pattern: $DF[$C]
          - pattern: $DF[$C].items()
          - pattern: enumerate($DF[$C])
    - has: { field: body, has: { stopBy: end, pattern: '$OUT.append($$$V)' } }
constraints:
  C: { kind: string }
  DF: { regex: '(?i)(^|_)(df|frame)(_|\d|$)' }
