id: apply-condition
language: python
severity: warning
message: A condition per value runs in Python. Use np.where(condition, a, b) on the whole column, or clip for min and max.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $A if $C else $B)"
    - pattern: "$S.map(lambda $X: $A if $C else $B)"
  all:
    - not: { has: { field: arguments, has: { kind: keyword_argument } } }
    - not: { has: { field: arguments, has: { stopBy: end, kind: call, has: { field: function, regex: '\.(all|any|sum|mean|fillna|nunique)$' } } } }
    - has:
        field: arguments
        has:
          kind: lambda
          has:
            field: body
            kind: conditional_expression
            all:
              - has: { nthChild: 2, kind: comparison_operator, all: [{ has: { stopBy: end, kind: identifier, pattern: $X } }, { not: { has: { regex: '^(in|not in|is|is not)$' } } }] }
              - not: { has: { nthChild: 1, any: [{ kind: identifier, pattern: $X }, { has: { stopBy: end, kind: identifier, pattern: $X } }] } }
              - not: { has: { nthChild: 3, any: [{ kind: identifier, pattern: $X }, { has: { stopBy: end, kind: identifier, pattern: $X } }] } }
    - inside:
        stopBy: end
        kind: module
        has: { kind: import_statement, has: { kind: aliased_import, all: [{ has: { field: name, regex: '^numpy$' } }, { has: { field: alias, regex: '^np$' } }] } }
constraints:
  X: { regex: '^[A-Za-z_]\w*$' }
rewriters:
  - id: parameter
    rule: { kind: identifier, pattern: $X }
    fix: $S
transform:
  COND: { rewrite: { source: $C, rewriters: [parameter] } }
fix: pd.Series(np.where($COND, $A, $B), index=$S.index)
metadata: { fix: unsafe }
