# `value in df["a"]` asks whether value is an index label of the column. `key in data["k"]` is
# also how a nested dict or a string is tested: all 19 hits in the held-back files of 23 projects
# were one of those. So the receiver must be named like a frame: df, frame, or a name with one of
# them as a word. The fixes are unsafe, because such a name can still hold a dict.
id: in-column
language: python
severity: error
message: The in operator on a column checks its index labels, not its values. Write ($DF[$COL] == $V).any(), or $DF[$COL].isin(values) for many values.
rule: { pattern: "$V in $DF[$COL]" }
constraints:
  COL: { kind: string }
  DF: { regex: '(?i)(^|_)(df|frame)(_|\d|$)' }
fix: ($DF[$COL] == $V).any()
metadata: { fix: unsafe }
---
id: in-column
language: python
severity: error
message: The not in operator on a column checks its index labels, not its values. Write not ($DF[$COL] == $V).any().
rule: { pattern: "$V not in $DF[$COL]" }
constraints:
  COL: { kind: string }
  DF: { regex: '(?i)(^|_)(df|frame)(_|\d|$)' }
fix: not ($DF[$COL] == $V).any()
metadata: { fix: unsafe }
