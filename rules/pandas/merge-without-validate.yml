# A cross merge pairs every row with every row on purpose, and validate= checks nothing there,
# so how="cross" is left alone.
# No fix, because the relation of the keys, such as one_to_one or many_to_one, is not in the file.
id: merge-without-validate
language: python
severity: warning
message: merge without validate= can silently duplicate rows.
rule:
  any:
    - pattern: $A.merge($$$ARGS)
    - pattern: pd.merge($$$ARGS)
  # Only the call's own arguments count, so validate= inside a nested call doesn't hide it.
  not:
    has:
      field: arguments
      has:
        kind: keyword_argument
        any:
          - has: { field: name, regex: ^validate$ }
          - all:
              - has: { field: name, regex: ^how$ }
              - has: { field: value, regex: '^["'']cross["'']$' }
