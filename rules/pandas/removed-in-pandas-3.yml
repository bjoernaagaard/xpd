# pandas 3 uses zoneinfo and raises ValueError for an ambiguous or nonexistent time, also when
# the zone is a pytz object. The pytz errors are not ValueErrors, so a handler that names only
# them stops catching. The try block must hold a pandas call, such as tz_localize, .dt. or pd.,
# and a block that calls pytz's own localize is left alone, because pytz still raises its errors
# there.
#
# The fix adds ValueError beside the one error the handler names, or after the last one of a
# tuple. Unsafe: the handler then also catches a ValueError of another cause.
id: removed-in-pandas-3
language: python
severity: error
message: pandas 3 raises ValueError for an ambiguous or nonexistent time, and no longer the pytz error, so this handler does not catch it. Write ($E, ValueError).
rule:
  pattern: $E
  all: [{ matches: pytz-error }, { matches: pandas-handler }]
utils:
  pytz-error:
    any:
      - kind: attribute
        regex: '^pytz\.(exceptions\.)?(AmbiguousTimeError|NonExistentTimeError|InvalidTimeError)$'
      - kind: identifier
        regex: '^(AmbiguousTimeError|NonExistentTimeError|InvalidTimeError)$'
        not: { inside: { kind: attribute } }
  # Inside the handler, with the errors alone or before "as name".
  pandas-handler:
    any:
      - inside: { kind: except_clause, matches: pandas-try }
      - inside: { kind: as_pattern, inside: { kind: except_clause, matches: pandas-try } }
  pandas-try:
    not: { regex: '^except[^:]*\b(ValueError|Exception|BaseException)\b' }
    inside:
      kind: try_statement
      has: { field: body, regex: 'tz_localize|tz_convert|\b(pd|pandas)\.|\.dt\.|\.(floor|ceil|round|shift|resample|normalize)\(' }
      not: { has: { field: body, regex: '\.localize\(' } }
fix: ($E, ValueError)
metadata: { fix: unsafe }
