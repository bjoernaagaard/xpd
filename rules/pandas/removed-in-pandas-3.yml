# Each document finds one API that pandas 3 removed. The forms raise on pandas 3.0 and 3.1.

id: removed-in-pandas-3
language: python
severity: error
message: DataFrame.applymap was removed in pandas 3. Use map, which takes the same arguments.
rule: { pattern: $X.applymap($$$A) }
fix: $X.map($$$A)
metadata: { fix: safe }
---
# fillna(method="ffill") whose other arguments are limit, axis or inplace, which ffill takes too.
# Unsafe: on a group-by, ffill() labels and orders the rows differently from what
# fillna(method="ffill") gave on pandas 2.3.
id: removed-in-pandas-3
language: python
severity: error
message: fillna(method=) was removed in pandas 3. Call ffill() instead.
rule:
  pattern: $X.fillna($$$ARGS)
  has:
    field: arguments
    has:
      kind: keyword_argument
      all:
        - has: { field: name, regex: ^method$ }
        - has: { field: value, regex: '^["''](ffill|pad)["'']$' }
  not: { has: { field: arguments, has: { not: { matches: movable } } } }
utils:
  # The brackets and commas of the argument list, comments, and the keywords ffill takes.
  movable:
    any:
      - regex: ^[(),]$
      - kind: comment
      - kind: keyword_argument
        has: { field: name, regex: ^(method|limit|axis|inplace)$ }
rewriters:
  - id: drop-method
    rule: { kind: keyword_argument, has: { field: name, regex: ^method$ } }
    fix: ""
  - id: keep-argument
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^method$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop-method, keep-argument], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $X.ffill($REST)
metadata: { fix: unsafe }
---
# Unsafe: on a group-by, bfill() labels and orders the rows differently from what
# fillna(method="bfill") gave on pandas 2.3.
id: removed-in-pandas-3
language: python
severity: error
message: fillna(method=) was removed in pandas 3. Call bfill() instead.
rule:
  pattern: $X.fillna($$$ARGS)
  has:
    field: arguments
    has:
      kind: keyword_argument
      all:
        - has: { field: name, regex: ^method$ }
        - has: { field: value, regex: '^["''](bfill|backfill)["'']$' }
  not: { has: { field: arguments, has: { not: { matches: movable } } } }
utils:
  # The brackets and commas of the argument list, comments, and the keywords bfill takes.
  movable:
    any:
      - regex: ^[(),]$
      - kind: comment
      - kind: keyword_argument
        has: { field: name, regex: ^(method|limit|axis|inplace)$ }
rewriters:
  - id: drop-method
    rule: { kind: keyword_argument, has: { field: name, regex: ^method$ } }
    fix: ""
  - id: keep-argument
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^method$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop-method, keep-argument], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $X.bfill($REST)
metadata: { fix: unsafe }
---
# Any other fillna(method=), such as one with a value or with a method held in a name, has no fix,
# because ffill and bfill take no value, and a name does not say which of the two is meant.
id: removed-in-pandas-3
language: python
severity: error
message: fillna(method=) was removed in pandas 3. Call ffill() or bfill() instead.
rule:
  pattern: $X.fillna($$$ARGS)
  has:
    field: arguments
    has: { kind: keyword_argument, has: { field: name, regex: ^method$ } }
  not:
    all:
      - has:
          field: arguments
          has:
            kind: keyword_argument
            all:
              - has: { field: name, regex: ^method$ }
              - has: { field: value, regex: '^["''](ffill|pad|bfill|backfill)["'']$' }
      - not: { has: { field: arguments, has: { not: { matches: movable } } } }
utils:
  movable:
    any:
      - regex: ^[(),]$
      - kind: comment
      - kind: keyword_argument
        has: { field: name, regex: ^(method|limit|axis|inplace)$ }
---
# A frequency alias that pandas 3 removed, where the call takes only datetimes, or where the
# alias means the same for periods. Inside resample, asfreq and shift, "M", "Q" and "Y" remain
# valid for periods, and "A" becomes "Y" for periods but "YE" for datetimes, so the documents
# below handle them.
id: removed-in-pandas-3
language: python
severity: error
message: The frequency $S was removed in pandas 3. Write $NEW.
rule:
  pattern: $S
  kind: string
  matches: old-alias
  any:
    - matches: datetime-argument
    - all:
        - matches: either-argument
        - not: { matches: period-alias }
        - not: { matches: year-alias }
utils:
  old-alias:
    regex: '^["''](\d*)(C?B?[MQY]|SM|B?AS?|C?B?H|[TSLUN])(-[A-Z]{3})?["'']$'
  period-alias:
    regex: '^["'']\d*[MQY](-[A-Z]{3})?["'']$'
  year-alias:
    regex: '^["'']\d*A(-[A-Z]{3})?["'']$'
  # Calls that take only datetimes: the first argument or freq= of these.
  datetime-argument:
    any:
      - nthChild: 1
        inside:
          kind: argument_list
          # to_offset(is_period=True) is how pandas itself asks for a period alias.
          not: { has: { kind: keyword_argument, has: { field: name, regex: ^is_period$ } } }
          inside: { kind: call, has: { field: function, regex: '(\.(floor|ceil|round|rolling|snap)|(^|\.)to_offset)$' } }
      - inside:
          kind: keyword_argument
          has: { field: name, regex: ^(freq|window)$ }
          inside:
            kind: argument_list
            inside:
              kind: call
              has: { field: function, regex: '(^|\.)(date_range|bdate_range|timedelta_range|interval_range|DatetimeIndex|TimedeltaIndex|Grouper|floor|ceil|round|rolling|snap)$' }
  # Calls that take datetimes or periods.
  either-argument:
    any:
      - nthChild: 1
        inside:
          kind: argument_list
          inside: { kind: call, has: { field: function, regex: '\.(resample|asfreq)$' } }
      - nthChild: 2
        inside:
          kind: argument_list
          inside: { kind: call, has: { field: function, regex: '\.shift$' } }
      - inside:
          kind: keyword_argument
          has: { field: name, regex: ^(freq|rule)$ }
          inside:
            kind: argument_list
            inside: { kind: call, has: { field: function, regex: '\.(resample|asfreq|shift|pct_change)$' } }
transform:
  YEAR: { replace: { source: $S, replace: '^(.\d*B?)A(S?.*)$', by: '${1}Y${2}' } }
  END: { replace: { source: $YEAR, replace: '^(.\d*)(C?B?[MQY]|SM)(-[A-Z]{3})?(.)$', by: '${1}${2}E${3}${4}' } }
  HOUR: { replace: { source: $END, replace: '^(.\d*)H(.)$', by: '${1}h${2}' } }
  BHOUR: { replace: { source: $HOUR, replace: '^(.\d*)BH(.)$', by: '${1}bh${2}' } }
  CBHOUR: { replace: { source: $BHOUR, replace: '^(.\d*)CBH(.)$', by: '${1}cbh${2}' } }
  MINUTE: { replace: { source: $CBHOUR, replace: '^(.\d*)T(.)$', by: '${1}min${2}' } }
  SECOND: { replace: { source: $MINUTE, replace: '^(.\d*)S(.)$', by: '${1}s${2}' } }
  MILLI: { replace: { source: $SECOND, replace: '^(.\d*)L(.)$', by: '${1}ms${2}' } }
  MICRO: { replace: { source: $MILLI, replace: '^(.\d*)U(.)$', by: '${1}us${2}' } }
  NEW: { replace: { source: $MICRO, replace: '^(.\d*)N(.)$', by: '${1}ns${2}' } }
fix: $NEW
metadata: { fix: safe }
---
# "M", "Q" and "Y" inside resample or shift. They raise on a DatetimeIndex and remain valid on a
# PeriodIndex, where the fix would break the call. asfreq("M") is left alone for the same reason.
id: removed-in-pandas-3
language: python
severity: error
message: The frequency $S was removed in pandas 3 for datetimes, and it remains valid for periods. Write $NEW if the index holds datetimes.
rule:
  pattern: $S
  kind: string
  regex: '^["'']\d*[MQY](-[A-Z]{3})?["'']$'
  any:
    - nthChild: 1
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '\.resample$' } }
    - nthChild: 2
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '\.shift$' } }
    - inside:
        kind: keyword_argument
        has: { field: name, regex: ^(freq|rule)$ }
        inside:
          kind: argument_list
          inside: { kind: call, has: { field: function, regex: '\.(resample|shift|pct_change)$' } }
transform:
  NEW: { replace: { source: $S, replace: '^(.\d*[MQY])(-[A-Z]{3})?(.)$', by: '${1}E${2}${3}' } }
fix: $NEW
metadata: { fix: unsafe }
---
# "A" inside resample, asfreq or shift. It raises for datetimes and for periods, and the new
# alias differs between them, so there is no fix.
id: removed-in-pandas-3
language: python
severity: error
message: The frequency $S was removed in pandas 3. Write "YE" for datetimes or "Y" for periods, with the same number and month.
rule:
  pattern: $S
  kind: string
  regex: '^["'']\d*A(-[A-Z]{3})?["'']$'
  any:
    - nthChild: 1
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '\.(resample|asfreq)$' } }
    - nthChild: 2
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '\.shift$' } }
    - inside:
        kind: keyword_argument
        has: { field: name, regex: ^(freq|rule)$ }
        inside:
          kind: argument_list
          inside: { kind: call, has: { field: function, regex: '\.(resample|asfreq|shift|pct_change)$' } }
---
# A frequency alias where the call takes periods: to_period, period_range, Period and
# PeriodIndex. "M", "Q" and "Y" remain valid there, and "A" becomes "Y".
id: removed-in-pandas-3
language: python
severity: error
message: The frequency $S was removed in pandas 3. Write $NEW.
rule:
  pattern: $S
  kind: string
  regex: '^["''](\d*)([HTSLUN]|A(-[A-Z]{3})?)["'']$'
  any:
    - nthChild: 1
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '\.to_period$' } }
    - nthChild: 2
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.Period$' } }
    - inside:
        kind: keyword_argument
        has: { field: name, regex: ^freq$ }
        inside:
          kind: argument_list
          inside: { kind: call, has: { field: function, regex: '(\.to_period|^(pd|pandas)\.(period_range|Period|PeriodIndex))$' } }
transform:
  YEAR: { replace: { source: $S, replace: '^(.\d*)A(.*)$', by: '${1}Y${2}' } }
  HOUR: { replace: { source: $YEAR, replace: '^(.\d*)H(.)$', by: '${1}h${2}' } }
  MINUTE: { replace: { source: $HOUR, replace: '^(.\d*)T(.)$', by: '${1}min${2}' } }
  SECOND: { replace: { source: $MINUTE, replace: '^(.\d*)S(.)$', by: '${1}s${2}' } }
  MILLI: { replace: { source: $SECOND, replace: '^(.\d*)L(.)$', by: '${1}ms${2}' } }
  MICRO: { replace: { source: $MILLI, replace: '^(.\d*)U(.)$', by: '${1}us${2}' } }
  NEW: { replace: { source: $MICRO, replace: '^(.\d*)N(.)$', by: '${1}ns${2}' } }
fix: $NEW
metadata: { fix: safe }
---
# infer_freq and freqstr return the new alias, so a comparison with the old one is False on
# pandas 2.2 and later. "M" is compared only with infer_freq, because the freqstr of a monthly
# PeriodIndex is still "M". Unsafe: the comparison can now be True, which is the point.
id: removed-in-pandas-3
language: python
severity: error
message: pandas returns the new alias here, so this comparison with $S is never equal. Write $NEW.
rule:
  pattern: $S
  kind: string
  any:
    - all:
        - regex: '^["'']\d*[HTSM]["'']$'
        - any:
            - inside: { pattern: $F($$$A) == $S }
            - inside: { pattern: $F($$$A) != $S }
    - all:
        - regex: '^["'']\d*[HTS]["'']$'
        - any:
            - inside: { pattern: $X.freqstr == $S }
            - inside: { pattern: $X.freqstr != $S }
constraints:
  F: { regex: '^((pd|pandas)\.(tseries\.frequencies\.)?)?infer_freq$' }
transform:
  END: { replace: { source: $S, replace: '^(.\d*)M(.)$', by: '${1}ME${2}' } }
  HOUR: { replace: { source: $END, replace: '^(.\d*)H(.)$', by: '${1}h${2}' } }
  MINUTE: { replace: { source: $HOUR, replace: '^(.\d*)T(.)$', by: '${1}min${2}' } }
  NEW: { replace: { source: $MINUTE, replace: '^(.\d*)S(.)$', by: '${1}s${2}' } }
fix: $NEW
metadata: { fix: unsafe }
---
# delim_whitespace=True, when the call does not also set sep or delimiter.
id: removed-in-pandas-3
language: python
severity: error
message: The delim_whitespace argument was removed in pandas 3. Write sep=r"\s+" instead.
rule:
  pattern: $KW
  kind: keyword_argument
  all:
    - has: { field: name, regex: ^delim_whitespace$ }
    - has: { field: value, regex: ^True$ }
  inside:
    kind: argument_list
    inside: { kind: call, has: { field: function, regex: '(^|\.)(read_csv|read_table)$' } }
    not:
      has: { kind: keyword_argument, has: { field: name, regex: ^(sep|delimiter)$ } }
fix: sep=r"\s+"
metadata: { fix: safe }
---
# delim_whitespace=False is what the default did. The fix takes it out with the comma before it.
# Unsafe: the old call raises TypeError on pandas 3.
id: removed-in-pandas-3
language: python
severity: error
message: The delim_whitespace argument was removed in pandas 3, and False was its default. Drop delim_whitespace=False.
rule:
  kind: keyword_argument
  regex: '^delim_whitespace\s*=\s*False$'
  follows: { regex: '^,$' }
  inside:
    kind: argument_list
    inside: { kind: call, has: { field: function, regex: '(^|\.)(read_csv|read_table)$' } }
fix:
  template: ''
  expandStart: { regex: ',' }
metadata: { fix: unsafe }
---
# No fix for delim_whitespace=True beside sep, because only the author knows which separator is
# meant, for a value held in a name, or for False with no comma before it, which taking out
# would leave a comma with nothing before it.
id: removed-in-pandas-3
language: python
severity: error
message: The delim_whitespace argument was removed in pandas 3. Pass sep=r"\s+" and drop delim_whitespace.
rule:
  kind: keyword_argument
  has: { field: name, regex: ^delim_whitespace$ }
  inside:
    kind: argument_list
    inside: { kind: call, has: { field: function, regex: '(^|\.)(read_csv|read_table)$' } }
  not:
    any:
      - all:
          - has: { field: value, regex: ^True$ }
          - inside:
              kind: argument_list
              not:
                has: { kind: keyword_argument, has: { field: name, regex: ^(sep|delimiter)$ } }
      - all:
          - regex: '^delim_whitespace\s*=\s*False$'
          - follows: { regex: '^,$' }
---
# Unsafe: isocalendar().week has dtype UInt32, and dt.week had int32.
id: removed-in-pandas-3
language: python
severity: error
message: Series.dt.week was removed in pandas 3. Use dt.isocalendar().week.
rule: { pattern: $X.dt.$W }
constraints:
  W: { regex: ^(week|weekofyear)$ }
fix: $X.dt.isocalendar().week
metadata: { fix: unsafe }
---
# Arguments and names that pandas 2.0 to 3.0 removed. Each raises on pandas 3.1.
# verbose, infer_datetime_format and mangle_dupe_cols=True changed nothing in the frame, so the
# fix takes the argument out with the comma before it. Unsafe: the old call raises TypeError on
# pandas 3, and verbose=True printed the parse times.
id: removed-in-pandas-3
language: python
severity: error
message: read_csv no longer takes this argument and raises TypeError on pandas 3. Drop it.
rule:
  kind: keyword_argument
  has: { field: name, regex: '^(verbose|infer_datetime_format|mangle_dupe_cols)$' }
  follows: { regex: '^,$' }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.read_(csv|table)$' } } }
fix:
  template: ''
  expandStart: { regex: ',' }
metadata: { fix: unsafe }
---
# No fix for the same arguments with no comma before them, because taking one out would leave a
# comma with nothing before it.
id: removed-in-pandas-3
language: python
severity: error
message: read_csv no longer takes this argument and raises TypeError on pandas 3. Drop it.
rule:
  kind: keyword_argument
  has: { field: name, regex: '^(verbose|infer_datetime_format|mangle_dupe_cols)$' }
  not: { follows: { regex: '^,$' } }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.read_(csv|table)$' } } }
---
# No fix, because error_bad_lines and warn_bad_lines together decide between on_bad_lines="skip"
# and on_bad_lines="warn", and keep_date_col and prefix need code around the call.
id: removed-in-pandas-3
language: python
severity: error
message: read_csv no longer takes this argument and raises TypeError on pandas 3. For bad lines, pass on_bad_lines="skip".
rule:
  kind: keyword_argument
  has: { field: name, regex: '^(error_bad_lines|warn_bad_lines|keep_date_col|prefix)$' }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.read_(csv|table)$' } } }
---
# squeeze=True returned a Series when the file had one column. The fix builds the argument list
# again without squeeze and calls squeeze("columns") on the result, which does the same. It
# rewrites the whole call, so it applies only to a call on one line, where the call and the
# argument are reported on the same line. Unsafe: the old call raises TypeError on pandas 3.
id: removed-in-pandas-3
language: python
severity: error
message: $PD.$R no longer takes squeeze and raises TypeError on pandas 3. Write $PD.$R($REST).squeeze("columns").
rule:
  pattern: $PD.$R($$$ARGS)
  regex: '^[^\n]*$'
  has: { field: arguments, has: { kind: keyword_argument, regex: '^squeeze\s*=\s*True$' } }
  not: { has: { field: arguments, has: { kind: dictionary_splat } } }
constraints:
  PD: { regex: '^(pd|pandas)$' }
  R: { regex: '^read_(csv|table|excel)$' }
rewriters:
  - id: drop-squeeze
    rule: { kind: keyword_argument, has: { field: name, regex: ^squeeze$ } }
    fix: ""
  - id: keep-argument
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: line_continuation
          - kind: keyword_argument
            has: { field: name, regex: ^squeeze$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop-squeeze, keep-argument], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $PD.$R($REST).squeeze("columns")
metadata: { fix: unsafe }
---
# squeeze=False is what the default did, so the fix takes it out with the comma before it.
# Unsafe: the old call raises TypeError on pandas 3.
id: removed-in-pandas-3
language: python
severity: error
message: read_csv and read_excel no longer take squeeze, and False was its default. Drop squeeze=False.
rule:
  kind: keyword_argument
  regex: '^squeeze\s*=\s*False$'
  follows: { regex: '^,$' }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.read_(csv|table|excel)$' } } }
fix:
  template: ''
  expandStart: { regex: ',' }
metadata: { fix: unsafe }
---
# No fix for squeeze=True in a call over several lines, where the fix would move the report to
# the line of the call, for squeeze=False with no comma before it, or for a value held in a name.
id: removed-in-pandas-3
language: python
severity: error
message: read_csv and read_excel no longer take squeeze and raise TypeError on pandas 3. Call .squeeze("columns") on the result.
rule:
  kind: keyword_argument
  has: { field: name, regex: '^squeeze$' }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.read_(csv|table|excel)$' } } }
  not:
    any:
      - all:
          - regex: '^squeeze\s*=\s*True$'
          - inside:
              kind: argument_list
              inside:
                kind: call
                regex: '^[^\n]*$'
                not: { has: { field: arguments, has: { kind: dictionary_splat } } }
      - all:
          - regex: '^squeeze\s*=\s*False$'
          - follows: { regex: '^,$' }
---
id: removed-in-pandas-3
language: python
severity: error
message: line_terminator was renamed and raises TypeError on pandas 3. Write lineterminator.
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: '^line_terminator$' }
    - has: { field: value, pattern: $V }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '\.to_csv$' } } }
fix: lineterminator=$V
metadata: { fix: safe }
---
# The fix takes encoding out with the comma before it. Unsafe: the old call raises TypeError on
# pandas 3.
id: removed-in-pandas-3
language: python
severity: error
message: to_excel no longer takes encoding and raises TypeError on pandas 3. Drop the argument.
rule:
  kind: keyword_argument
  has: { field: name, regex: '^encoding$' }
  follows: { regex: '^,$' }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '\.to_excel$' } } }
fix:
  template: ''
  expandStart: { regex: ',' }
metadata: { fix: unsafe }
---
# No fix with no comma before the argument, because taking it out would leave a comma with
# nothing before it.
id: removed-in-pandas-3
language: python
severity: error
message: to_excel no longer takes encoding and raises TypeError on pandas 3. Drop the argument.
rule:
  kind: keyword_argument
  has: { field: name, regex: '^encoding$' }
  not: { follows: { regex: '^,$' } }
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '\.to_excel$' } } }
---
id: removed-in-pandas-3
language: python
severity: error
message: The separator is keyword-only and a second positional argument raises TypeError on pandas 3. Write sep=$SEP.
rule:
  pattern: $PD.$R($P, $SEP)
constraints:
  PD: { regex: '^(pd|pandas)$' }
  R: { regex: '^read_(csv|table)$' }
  SEP: { kind: string }
fix: $PD.$R($P, sep=$SEP)
metadata: { fix: safe }
---
id: removed-in-pandas-3
language: python
severity: error
message: to_csv takes only the path by position and a second positional argument raises TypeError on pandas 3. Write sep=$SEP.
rule:
  pattern: $DF.to_csv($P, $SEP)
constraints:
  SEP: { kind: string }
fix: $DF.to_csv($P, sep=$SEP)
metadata: { fix: safe }
---
id: removed-in-pandas-3
