# A year and a month as two keys. On 2,000,000 quarter-hourly rows in Europe/Copenhagen the two keys
# took 89 ms and one monthly key took 14 ms on pandas 3.1.1. No fix: the result gets one timestamp
# per month in place of a year and a month, and it also holds the months without rows.
id: date-part-key
language: python
severity: warning
message: A year and a month are two keys for one month. Group on pd.Grouper(key=..., freq="MS"), or on pd.Grouper(freq="MS") for the index. The result has one timestamp per month and also holds the months without rows.
rule:
  any:
    - pattern: $DF.groupby([$X.dt.year, $X.dt.month])
    - pattern: $DF.groupby([$X.dt.year, $X.dt.month], $$$A)
    - pattern: $DF.groupby([$X.index.year, $X.index.month])
    - pattern: $DF.groupby([$X.index.year, $X.index.month], $$$A)
