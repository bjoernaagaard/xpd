id: date-part-key
language: python
severity: warning
message: A year and a month are two keys for one month. Group on pd.Grouper(key=..., freq="MS"), or on pd.Grouper(freq="MS") for the index. The result has one timestamp per month and also holds the months without rows.
rule:
  any:
    - pattern: $DF.groupby([$DF[$C].dt.year, $DF[$C].dt.month])
    - pattern: $DF.groupby([$DF[$C].dt.year, $DF[$C].dt.month], $$$A)
transform:
  SUFFIX: { replace: { source: $$$A, replace: '(?s)^(.+)$', by: ', $1' } }
fix: $DF.groupby(pd.Grouper(key=$C, freq="MS")$SUFFIX)
metadata: { fix: unsafe, fixImports: [pd] }
