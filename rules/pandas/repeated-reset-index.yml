id: repeated-reset-index
language: python
severity: warning
message: This function calls reset_index three times or more. Keep the keys as columns from the start, with groupby(keys, as_index=False), merge, and ignore_index=True, so that no index has to be reset.
rule:
  kind: function_definition
  regex: '(?s)\.reset_index\(.*\.reset_index\(.*\.reset_index\('
  not:
    any:
      - has:
          stopBy: end
          kind: function_definition
          regex: '(?s)\.reset_index\(.*\.reset_index\(.*\.reset_index\('
      - has:
          field: body
          all:
            - has:
                stopBy: { kind: function_definition }
                matches: independent-tuple-return
            - not:
                has:
                  stopBy: { kind: function_definition }
                  kind: call
                  has:
                    field: function
                    kind: attribute
                    has: { field: attribute, regex: '^reset_index$' }
                  not:
                    inside:
                      stopBy: { kind: function_definition }
                      matches: independent-tuple-return
utils:
  independent-tuple-return:
    kind: return_statement
    has:
      any: [{ kind: tuple }, { kind: expression_list }]
      not:
        has:
          regex: '(?s)\.reset_index\(.*\.reset_index\('
