id: rename-after-agg
language: python
severity: warning
message: Name the result columns in agg itself, as in agg(b_mean=("b", "mean")), instead of renaming them afterwards.
rule:
  pattern: '$G.$AGG({$C1: $F1, $C2: $F2}).rename(columns={$C1: $N1, $C2: $N2})'
