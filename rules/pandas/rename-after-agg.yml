---
id: rename-after-agg
language: python
severity: warning
message: Name the result columns in agg itself, as in agg(b_mean=("b", "mean")), instead of renaming them afterwards.
rule:
  pattern: $G.$AGG($D).rename($$$R)
  has:
    field: arguments
    has: { kind: keyword_argument, has: { field: name, regex: ^columns$ } }
  not:
    any:
      - all:
          - pattern: '$G.$AGG({$C1: $F1}).rename(columns={$C1: $N1})'
          - has: { field: arguments, has: { kind: keyword_argument, has: { field: value, has: { kind: pair, has: { field: value, kind: string, regex: '^["''][A-Za-z_][A-Za-z0-9_]*["'']$' } } } } }
      - all:
          - pattern: '$G.$AGG({$C1: $F1, $C2: $F2}).rename(columns={$C1: $N1, $C2: $N2})'
          - has: { field: arguments, has: { kind: keyword_argument, has: { field: value, not: { has: { kind: pair, has: { field: value, not: { kind: string, regex: '^["''][A-Za-z_][A-Za-z0-9_]*["'']$' } } } } } } }
constraints:
  AGG: { regex: ^(agg|aggregate)$ }
  D: { kind: dictionary }
