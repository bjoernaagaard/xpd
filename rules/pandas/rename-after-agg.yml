# No fix, because each new name in rename has to be paired with its key in the agg dict, which no
# ast-grep transform does.
id: rename-after-agg
language: python
severity: warning
message: Name the result columns in agg itself, as in agg(b_mean=("b", "mean")), instead of renaming them afterwards.
rule:
  pattern: '$G.$AGG({$C1: $F1}).rename(columns={$C1: $N1})'
constraints:
  AGG: { regex: ^(agg|aggregate)$ }
  C1: { kind: string }
  F1: { kind: string }
  N1:
    kind: string
    regex: '^["''][A-Za-z_][A-Za-z0-9_]*["'']$'
    not: { regex: '^["''](and|as|assert|async|await|break|class|continue|def|del|elif|else|except|False|finally|for|from|global|if|import|in|is|lambda|None|nonlocal|not|or|pass|raise|return|True|try|while|with|yield)["'']$' }
transform:
  ID1: { replace: { source: $N1, replace: '^["''](.+)["'']$', by: '$1' } }
fix: '$G.$AGG($ID1=($C1, $F1))'
metadata: { fix: unsafe }
