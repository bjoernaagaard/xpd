# A call with no argument is left alone: it returns text, and it is also how a project's own
# to_csv() method is called. So is a call that forwards **options, which may hold index.
# No fix, because only the author knows whether the index holds data, so index=False and index=True
# are both possible.
id: to-csv-index
language: python
severity: warning
message: 'to_csv writes the index as a first column, and when the index has no name read_csv returns it as "Unnamed: 0". Pass index=False, or index=True if the index holds data.'
rule:
  pattern: $X.to_csv($$$ARGS)
  all:
    - has: { field: arguments, has: { not: { regex: '^[(),]$' } } }
    - not:
        has:
          field: arguments
          has:
            any:
              - { kind: keyword_argument, has: { field: name, regex: ^index$ } }
              - kind: dictionary_splat
              - kind: list_splat
              - kind: comment
              - kind: line_continuation
fix: $X.to_csv($$$ARGS, index=False)
metadata: { fix: unsafe }
