# No fix, because the message names three rewrites, and the period depends on the format.
id: text-time-key
language: python
severity: warning
message: Grouping on formatted text is slow. Group on dt.to_period("M") or dt.floor("h") instead. On a column with a time zone to_period drops the zone and warns, so group on pd.Grouper(key=..., freq="MS") there.
rule:
  pattern: $X.dt.strftime($F)
  inside:
    stopBy: end
    kind: argument_list
    inside: { kind: call, has: { field: function, regex: '\.groupby$' } }
constraints:
  F: { regex: '^["''](%Y|%Y-%m)["'']$' }
transform:
  T1: { replace: { source: $F, replace: '^["'']%Y["'']$', by: '"Y"' } }
  FREQ: { replace: { source: $T1, replace: '^["'']%Y-%m["'']$', by: '"M"' } }
fix: $X.dt.to_period($FREQ)
metadata: { fix: unsafe }
