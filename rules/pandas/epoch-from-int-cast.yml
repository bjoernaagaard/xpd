---
# The integer values of an index, and a cast of .values to float. Unsafe for the same reasons,
# and the fix returns an Index or a Series where the old code returned a NumPy array.
id: epoch-from-int-cast
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this no longer counts nanoseconds. Write ($X - pd.Timestamp("1970-01-01")) // $UNIT.
rule:
  any:
    - pattern: $X.asi8 // $D
    - pattern: $X.values.astype($T) // $D
constraints:
  D: { regex: '^(10\s*\*\*\s*[369]|1e[369]|1_?000(_?000){0,2})$' }
  # A cast to an integer type is the document above.
  T: { regex: '^(float|["'']float(64)?["'']|np\.float64|["'']f8["''])$' }
transform:
  SECONDS: { replace: { source: $D, replace: '^(10\s*\*\*\s*9|1e9|1_?000_?000_?000)$', by: 'pd.Timedelta("1s")' } }
  MILLIS: { replace: { source: $SECONDS, replace: '^(10\s*\*\*\s*6|1e6|1_?000_?000)$', by: 'pd.Timedelta("1ms")' } }
  UNIT: { replace: { source: $MILLIS, replace: '^(10\s*\*\*\s*3|1e3|1_?000)$', by: 'pd.Timedelta("1us")' } }
fix: ($X - pd.Timestamp("1970-01-01")) // $UNIT
metadata: { fix: unsafe }
