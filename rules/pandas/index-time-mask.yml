# index.time builds a Python time object for every row. On 2,000,000 quarter-hourly rows the
# mask took 241 ms and at_time took 25 ms on pandas 3.1.1, with an equal result.
id: index-time-mask
language: python
severity: warning
message: index.time builds a Python time object for every row. Write $X.at_time($T).
rule:
  any:
    - pattern: $X[$X.index.time == $T]
    - pattern: $X.loc[$X.index.time == $T]
constraints:
  # A time object only. Text such as "12:00" never equals a time, so that mask selects nothing,
  # and at_time would read the text as a time.
  T: { regex: '^((datetime\.|dt\.)?time\(.*\)|.*\.time\(\))$' }
fix: $X.at_time($T)
metadata: { fix: safe }
---
# Whole hours as two masks. On 2,000,000 rows the masks took 51 ms and between_time took 28 ms
# on pandas 3.1.1, with an equal result. Unsafe: when the first hour is later than the second,
# the masks select nothing and between_time selects the hours across midnight.
id: index-time-mask
language: python
severity: warning
message: between_time selects a part of the day in one call. Write $X.between_time("$A:00", "$B:00", inclusive="left").
rule:
  any:
    - pattern: $X[($X.index.hour >= $A) & ($X.index.hour < $B)]
    - pattern: $X.loc[($X.index.hour >= $A) & ($X.index.hour < $B)]
constraints:
  A: { regex: '^(\d|1\d|2[0-3])$' }
  B: { regex: '^([1-9]|1\d|2[0-3])$' }
fix: $X.between_time("$A:00", "$B:00", inclusive="left")
metadata: { fix: unsafe }
