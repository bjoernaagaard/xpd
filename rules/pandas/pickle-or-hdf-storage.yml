# read_pickle runs what the file tells it to call. A file whose pickle named print made
# pd.read_pickle print a line on pandas 3.1.1 (research/modern-pandas/probes/pickle_runs_code.txt),
# and the pandas documentation warns that loading a pickle from an untrusted source can be unsafe.
# Parquet holds data only. On 1,000,000 rows to_parquet and read_parquet returned a frame equal to
# the one written, with every dtype, and the pickle file was 49.0 MB where the Parquet file was
# 14.7 MB (research/modern-pandas/probes/storage.txt). The rule has no fix, because it changes the
# file on disk.
id: pickle-or-hdf-storage
language: python
severity: info
message: read_pickle runs what the file tells it to call, so a pickle from someone else can run any code. Parquet holds data only. to_parquet and read_parquet returned a frame equal to the one written, with every dtype, in a file 3.3 times smaller than the pickle, on 1,000,000 rows.
rule:
  any:
    - pattern: $X.to_pickle($$$A)
    - pattern: $PD.read_pickle($$$A)
constraints:
  PD: { regex: '^(pd|pandas)$' }
---
# to_hdf and read_hdf need the PyTables package. On pandas 3.1.1 without it, to_hdf raised
# ImportError "`Import pytables` failed" (research/modern-pandas/probes/storage.txt). Parquet
# needs pyarrow, which the missing-pyarrow check of this pack already asks for.
id: pickle-or-hdf-storage
language: python
severity: info
message: HDF needs the PyTables package, and without it this call raised ImportError. to_parquet and read_parquet need only pyarrow, and returned a frame equal to the one written, with every dtype, on 1,000,000 rows.
rule:
  any:
    - pattern: $X.to_hdf($$$A)
    - pattern: $PD.read_hdf($$$A)
    - pattern: $PD.HDFStore($$$A)
constraints:
  PD: { regex: '^(pd|pandas)$' }
