# Each document finds one API that raises Pandas4Warning on pandas 3.0 and 3.1.

id: deprecated-in-pandas-3
language: python
severity: warning
message: Timestamp.utcnow is deprecated. Write $PD.Timestamp.now("UTC"), which returns the same time.
rule: { pattern: $PD.Timestamp.utcnow() }
constraints:
  PD: { regex: '^_?(pd|pandas)$' }
fix: $PD.Timestamp.now("UTC")
metadata: { fix: safe }
---
id: deprecated-in-pandas-3
language: python
severity: warning
message: Timestamp.utcfromtimestamp is deprecated. Write $PD.Timestamp.fromtimestamp($T, "UTC"), which returns the same time.
rule: { pattern: $PD.Timestamp.utcfromtimestamp($T) }
constraints:
  PD: { regex: '^_?(pd|pandas)$' }
fix: $PD.Timestamp.fromtimestamp($T, "UTC")
metadata: { fix: safe }
---
# "H" and "S" in Timedelta text, in Timedelta, to_timedelta and offset= of resample and Grouper.
# removed-in-pandas-3 reports "T", "L", "U" and "N", which raise.
id: deprecated-in-pandas-3
language: python
severity: warning
message: The unit in $S is deprecated in Timedelta text. Write $NEW.
rule:
  pattern: $S
  kind: string
  regex: '^["'']\s*\d+\s*[HS]["'']$'
  any:
    - nthChild: 1
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.(Timedelta|to_timedelta)$' } }
    - inside:
        kind: keyword_argument
        has: { field: name, regex: ^offset$ }
        inside:
          kind: argument_list
          inside: { kind: call, has: { field: function, regex: '(\.resample|(^|\.)Grouper)$' } }
transform:
  HOUR: { replace: { source: $S, replace: 'H(.)$', by: 'h${1}' } }
  NEW: { replace: { source: $HOUR, replace: 'S(.)$', by: 's${1}' } }
fix: $NEW
metadata: { fix: safe }
---
# The unit of Timedelta and to_timedelta, by keyword or as the second argument.
id: deprecated-in-pandas-3
language: python
severity: warning
message: The unit $S is deprecated. Write $NEW.
rule:
  pattern: $S
  kind: string
  regex: '^["''][HS]["'']$'
  any:
    - nthChild: 2
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.(Timedelta|to_timedelta)$' } }
    - inside:
        kind: keyword_argument
        has: { field: name, regex: ^unit$ }
        inside:
          kind: argument_list
          inside: { kind: call, has: { field: function, regex: '^(pd|pandas)\.(Timedelta|to_timedelta)$' } }
transform:
  HOUR: { replace: { source: $S, replace: 'H(.)$', by: 'h${1}' } }
  NEW: { replace: { source: $HOUR, replace: 'S(.)$', by: 's${1}' } }
fix: $NEW
metadata: { fix: safe }
---
# The fix deletes the statement, so it applies only at the top level of the file, where an
# empty file is still valid. Inside a block it is reported without a fix.
# Unsafe: pd.get_option reads the value back, so code that reads the option sees the default
# once the line is gone.
id: deprecated-in-pandas-3
language: python
severity: warning
message: Copy-on-write is always on in pandas 3, and this option is deprecated. Delete the line.
rule:
  matches: copy-on-write-option
  inside: { kind: module }
utils:
  copy-on-write-option:
    kind: expression_statement
    has:
      any:
        - pattern: pd.set_option("mode.copy_on_write", $V)
        - pattern: pd.set_option('mode.copy_on_write', $V)
        - pattern: pd.options.mode.copy_on_write = $V
fix: ""
metadata: { fix: unsafe }
---
# Inside a block that holds another statement, which keeps the block valid once the line is
# gone. Unsafe for the same reason as at the top level.
id: deprecated-in-pandas-3
language: python
severity: warning
message: Copy-on-write is always on in pandas 3, and this option is deprecated. Delete the line.
rule:
  matches: copy-on-write-option
  not: { inside: { kind: module } }
  inside: { kind: block, has: { not: { any: [{ kind: comment }, { matches: copy-on-write-option }] } } }
utils:
  copy-on-write-option:
    kind: expression_statement
    has:
      any:
        - pattern: pd.set_option("mode.copy_on_write", $V)
        - pattern: pd.set_option('mode.copy_on_write', $V)
        - pattern: pd.options.mode.copy_on_write = $V
fix: ""
metadata: { fix: unsafe }
---
# The only statement of its block. No fix, because the block would be empty without it.
id: deprecated-in-pandas-3
language: python
severity: warning
message: Copy-on-write is always on in pandas 3, and this option is deprecated. Delete the line.
rule:
  matches: copy-on-write-option
  not:
    any:
      - inside: { kind: module }
      - inside: { kind: block, has: { not: { any: [{ kind: comment }, { matches: copy-on-write-option }] } } }
utils:
  copy-on-write-option:
    kind: expression_statement
    has:
      any:
        - pattern: pd.set_option("mode.copy_on_write", $V)
        - pattern: pd.set_option('mode.copy_on_write', $V)
        - pattern: pd.options.mode.copy_on_write = $V
---
# copy= on the methods where pandas 3 deprecated it. Copy-on-write decides when data is copied,
# so the keyword changes nothing. to_numpy and the constructors keep their copy keyword.
id: deprecated-in-pandas-3
language: python
severity: warning
message: The copy keyword is deprecated, because copy-on-write decides when pandas copies data. Drop copy=.
rule:
  pattern: $F($$$ARGS)
  has:
    field: arguments
    has: { kind: keyword_argument, has: { field: name, regex: ^copy$ } }
constraints:
  F: { regex: '\.(rename|rename_axis|merge|reindex|reindex_like|set_axis|infer_objects|align|tz_localize|tz_convert|transpose|to_timestamp|to_period|concat)$' }
rewriters:
  - id: drop-copy
    rule: { kind: keyword_argument, has: { field: name, regex: ^copy$ } }
    fix: ""
  - id: keep-argument
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^copy$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop-copy, keep-argument], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $F($REST)
metadata: { fix: safe }
---
# copy= on astype. NumPy's astype has the same keyword and it is not deprecated: 6 of 7 hits in
# the held-back files were arrays. So the receiver must be a column taken by a label or a name
# like a frame's. Unsafe: such a receiver can still be an array, where astype(copy=False) can
# return the same array, so a later write reaches both names.
id: deprecated-in-pandas-3
language: python
severity: warning
message: The copy keyword is deprecated, because copy-on-write decides when pandas copies data. Drop copy=.
rule:
  pattern: $O.astype($$$ARGS)
  has:
    field: arguments
    has: { kind: keyword_argument, has: { field: name, regex: ^copy$ } }
constraints:
  O:
    any:
      - { kind: subscript, has: { field: subscript, any: [{ kind: string }, { kind: identifier }] }, not: { has: { field: value, kind: attribute } } }
      - regex: '(?i)(^|_)(df|frame)(_|\d|$)'
rewriters:
  - id: drop-copy
    rule: { kind: keyword_argument, has: { field: name, regex: ^copy$ } }
    fix: ""
  - id: keep-argument
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^copy$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop-copy, keep-argument], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $O.astype($REST)
metadata: { fix: unsafe }
