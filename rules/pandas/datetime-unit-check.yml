# is_datetime64_any_dtype is True for every unit, with a time zone or without one, as
# is_datetime64_ns_dtype was for nanoseconds.
id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this test for a nanosecond dtype no longer holds for them. Write pd.api.types.is_datetime64_any_dtype($$$A).
rule:
  pattern: $F($$$A)
  not: { matches: makes-nanoseconds }
constraints:
  F: { regex: '(^|\.)is_datetime64_ns_dtype$' }
utils:
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
fix: pd.api.types.is_datetime64_any_dtype($$$A)
metadata: { fix: unsafe }
---
# No fix for the text of a dtype with a time zone, because the zone has to be compared apart, or
# for the dtypes of a frame, because the comparison gives a Series of booleans.
id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this test for a nanosecond dtype no longer holds for them. Call pd.api.types.is_datetime64_any_dtype, or is_datetime64_dtype for columns without a time zone.
rule:
  any:
    - pattern: str($X.dtype) == $D
    - pattern: str($X.dtype) != $D
    - pattern: $X.dtype.name == $D
    - pattern: $X.dtype.name != $D
    - pattern: $Y.dtypes == $E
    - pattern: $Y.dtypes != $E
  not: { matches: makes-nanoseconds }
constraints:
  X: { any: [{ kind: subscript, not: { has: { field: value, regex: '\.(values|array)$' } } }, { regex: '(?i)(^|_)(df|frame|series|ser|col|column|index|idx)(_|\d|$)' }] }
  D: { regex: '^["'']datetime64\[ns, [^"'']+\]["'']$' }
  E: { regex: '^["''](datetime64\[ns(, [^"'']+)?\]|<?M8\[ns\])["'']$' }
utils:
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
---
# A nanosecond dtype passed to select_dtypes, alone or in a list. "datetime64" selects the
# columns without a time zone of every unit.
id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so select_dtypes with a nanosecond dtype selects none of them. Write "datetime64".
rule:
  kind: string
  regex: '^["''](datetime64\[ns\]|<?M8\[ns\])["'']$'
  matches: select-argument
  not: { matches: makes-nanoseconds }
utils:
  select-argument:
    inside:
      stopBy: { kind: call }
      kind: argument_list
      inside: { kind: call, has: { field: function, regex: \.select_dtypes$ } }
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
fix: '"datetime64"'
metadata: { fix: unsafe }
---
# "datetimetz" selects the columns of every zone and every unit. Unsafe: it also selects columns
# of another zone than the one named.
id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so select_dtypes with a nanosecond dtype selects none of them. Write "datetimetz", which selects every column with a time zone.
rule:
  kind: string
  regex: '^["'']datetime64\[ns, [^"'']+\]["'']$'
  matches: select-argument
  not: { matches: makes-nanoseconds }
utils:
  select-argument:
    inside:
      stopBy: { kind: call }
      kind: argument_list
      inside: { kind: call, has: { field: function, regex: \.select_dtypes$ } }
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
fix: '"datetimetz"'
metadata: { fix: unsafe }
