# The dtype as text, the dtypes of a frame, and is_datetime64_ns_dtype. The text of a dtype
# without a time zone gets the fix of the first document.
id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this test for a nanosecond dtype no longer holds for them. Write pd.api.types.is_datetime64_dtype($X), which is True for every unit.
rule:
  any:
    - pattern: str($X.dtype) == $D
    - pattern: $X.dtype.name == $D
  not: { matches: makes-nanoseconds }
constraints:
  X: { any: [{ kind: subscript, not: { has: { field: value, regex: '\.(values|array)$' } } }, { regex: '(?i)(^|_)(df|frame|series|ser|col|column|index|idx)(_|\d|$)' }] }
  D: { regex: '^["''](datetime64\[ns\]|<?M8\[ns\])["'']$' }
utils:
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
fix: pd.api.types.is_datetime64_dtype($X)
metadata: { fix: unsafe }
