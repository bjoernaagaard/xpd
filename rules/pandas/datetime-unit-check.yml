# Datetime columns default to microseconds in pandas 3, so a check against a nanosecond dtype is
# False for them and select_dtypes selects none of them. The fixes are unsafe: they are True for
# a column of any unit, which is the point of the change. A file that calls as_unit("ns") or
# astype("datetime64[ns]") makes nanosecond columns itself, so it is left alone. A NumPy array
# keeps the unit it was made with, so a dtype is compared only on a column taken by a label or
# on a name like a frame's, a column's or an index's, and never on .values or .array.

id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this comparison with a nanosecond dtype is False for them. Write pd.api.types.is_datetime64_dtype($X), which is True for every unit.
rule:
  pattern: $X.dtype == $D
  not: { matches: makes-nanoseconds }
constraints:
  X: { any: [{ kind: subscript, not: { has: { field: value, regex: '\.(values|array)$' } } }, { regex: '(?i)(^|_)(df|frame|series|ser|col|column|index|idx)(_|\d|$)' }] }
  D: { matches: naive-nanoseconds }
utils:
  naive-nanoseconds: { regex: '^(["''](datetime64\[ns\]|<?M8\[ns\])["'']|(np|numpy)\.dtype\(["''](datetime64\[ns\]|<?M8\[ns\])["'']\))$' }
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
fix: pd.api.types.is_datetime64_dtype($X)
metadata: { fix: unsafe }
---
id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this comparison with a nanosecond dtype is True for them. Write not pd.api.types.is_datetime64_dtype($X).
rule:
  pattern: $X.dtype != $D
  not: { matches: makes-nanoseconds }
constraints:
  X: { any: [{ kind: subscript, not: { has: { field: value, regex: '\.(values|array)$' } } }, { regex: '(?i)(^|_)(df|frame|series|ser|col|column|index|idx)(_|\d|$)' }] }
  D: { matches: naive-nanoseconds }
utils:
  naive-nanoseconds: { regex: '^(["''](datetime64\[ns\]|<?M8\[ns\])["'']|(np|numpy)\.dtype\(["''](datetime64\[ns\]|<?M8\[ns\])["'']\))$' }
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
fix: not pd.api.types.is_datetime64_dtype($X)
metadata: { fix: unsafe }
---
# A dtype with a time zone. The fix tests for a zone of any unit and compares the zone by its
# name. Unsafe: it is True for a column of any unit, which is the point of the change.
id: datetime-unit-check
language: python
severity: error
message: Datetimes default to microseconds in pandas 3, so this comparison with a nanosecond dtype no longer holds for them. Write (isinstance($X.dtype, pd.DatetimeTZDtype) and str($X.dtype.tz) == "$TZ").
rule:
  pattern: $X.dtype == $D
  not: { matches: makes-nanoseconds }
constraints:
  X: { any: [{ kind: subscript, not: { has: { field: value, regex: '\.(values|array)$' } } }, { regex: '(?i)(^|_)(df|frame|series|ser|col|column|index|idx)(_|\d|$)' }] }
  D: { regex: '^["'']datetime64\[ns, [^"'']+\]["'']$' }
utils:
  makes-nanoseconds: { inside: { kind: module, stopBy: end, regex: 'as_unit\(["'']ns["'']\)|astype\(["'']datetime64\[ns\]["'']\)' } }
transform:
  TZ: { replace: { source: $D, replace: '^["'']datetime64\[ns, ([^"'']+)\]["'']$', by: '$1' } }
fix: (isinstance($X.dtype, pd.DatetimeTZDtype) and str($X.dtype.tz) == "$TZ")
metadata: { fix: unsafe }
