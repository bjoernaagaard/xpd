# apply-date-part reports a lambda that reads an attribute such as t.year. This reports one that
# calls a Timestamp or Timedelta method. round is left out, because lambda v: v.round(2) is more
# often a number, and strftime belongs to apply-on-dates.

# Unsafe: the result dtype can change, and a column of Python datetimes has no such method.
id: apply-date-method
language: python
severity: warning
message: This calls $M once per value. Write $S.dt.$M(...) on the whole column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.$M($$$A))"
    - pattern: "$S.map(lambda $X: $X.$M($$$A))"
  # The arguments must not use the value.
  not:
    has:
      field: arguments
      has: { kind: lambda, has: { field: body, has: { field: arguments, has: { stopBy: end, pattern: $X } } } }
constraints:
  M: { regex: ^(floor|ceil|normalize|tz_localize|tz_convert|day_name|month_name|to_period|total_seconds)$ }
fix: $S.dt.$M($$$A)
metadata: { fix: unsafe }
---
# Unsafe: dt.weekday is int32, and the lambda gave int64.
id: apply-date-method
language: python
severity: warning
message: This calls weekday once per value. Write $S.dt.weekday on the whole column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.weekday())"
    - pattern: "$S.map(lambda $X: $X.weekday())"
fix: $S.dt.weekday
metadata: { fix: unsafe }
---
# replace(tzinfo=None) drops the zone and keeps the local time, as dt.tz_localize(None) does. On
# 200,000 rows the lambda took 746 ms and the column form 2.3 ms on pandas 3.1.1. A zone passed
# to replace is left alone, because replace skips the daylight saving check of tz_localize.
id: apply-date-method
language: python
severity: warning
message: This calls replace once per value. Write $S.dt.tz_localize(None) on the whole column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.replace(tzinfo=None))"
    - pattern: "$S.map(lambda $X: $X.replace(tzinfo=None))"
fix: $S.dt.tz_localize(None)
metadata: { fix: unsafe }
---
# Unsafe: a column of Python datetimes has astimezone and no .dt.tz_convert, and a missing
# value raised in the lambda where dt.tz_convert keeps it.
id: apply-date-method
language: python
severity: warning
message: This calls astimezone once per value. Write $S.dt.tz_convert($Z) on the whole column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.astimezone($Z))"
    - pattern: "$S.map(lambda $X: $X.astimezone($Z))"
  not:
    has:
      field: arguments
      has: { kind: lambda, has: { field: body, has: { field: arguments, has: { stopBy: end, pattern: $X } } } }
constraints:
  Z: { not: { kind: keyword_argument } }
fix: $S.dt.tz_convert($Z)
metadata: { fix: unsafe }
---
# date, isocalendar, timestamp and toordinal. The first two have a .dt form. The last two are a
# subtraction of a start date.
id: apply-date-method
language: python
severity: warning
message: This calls date once per value. Call $S.dt.date, or $S.dt.normalize() to keep a datetime column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.date())"
    - pattern: "$S.map(lambda $X: $X.date())"
fix: $S.dt.date
metadata: { fix: unsafe }
---
id: apply-date-method
language: python
severity: warning
message: This calls isocalendar once per value. Call $S.dt.isocalendar().week.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.isocalendar()[1])"
    - pattern: "$S.map(lambda $X: $X.isocalendar()[1])"
    - pattern: "$S.apply(lambda $X: $X.isocalendar().week)"
    - pattern: "$S.map(lambda $X: $X.isocalendar().week)"
fix: $S.dt.isocalendar().week
metadata: { fix: unsafe }
---
# Unsafe: a column with a time zone raises TypeError, because the epoch has none, and the
# division can differ from timestamp() in the last bit.
id: apply-date-method
language: python
severity: warning
message: This calls timestamp once per value. Write ($S - pd.Timestamp("1970-01-01")) / pd.Timedelta("1s") on the whole column.
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.timestamp())"
    - pattern: "$S.map(lambda $X: $X.timestamp())"
fix: ($S - pd.Timestamp("1970-01-01")) / pd.Timedelta("1s")
metadata: { fix: unsafe }
---
# No fix, because toordinal counts days from the year 1, and the message names no start date for
# it.
id: apply-date-method
language: python
severity: warning
message: This calls toordinal once per value. Subtract a start date from the whole column and divide by a Timedelta, as in ($S - pd.Timestamp("1970-01-01")) / pd.Timedelta("1D").
rule:
  any:
    - pattern: "$S.apply(lambda $X: $X.toordinal())"
    - pattern: "$S.map(lambda $X: $X.toordinal())"
