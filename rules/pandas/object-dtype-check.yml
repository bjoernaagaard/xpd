# is_object_dtype, a dtype tested with in, dtype.name, and select_dtypes with object by position.
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3, so is_object_dtype is False for them. Write pd.api.types.is_string_dtype($X).
rule:
  pattern: $F($X)
constraints:
  F: { regex: '(^|\.)is_object_dtype$' }
fix: pd.api.types.is_string_dtype($X)
metadata: { fix: unsafe }
