# The object dtype alone as the first argument of select_dtypes.
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3. select_dtypes still matches them with object, but it warns that this will stop. Write ["object", "str"] to keep selecting both, or "str" for text columns only.
rule:
  pattern: $DF.select_dtypes($FIRST, $$$REST)
constraints:
  FIRST: { regex: '^(object|["'']object["'']|["'']O["'']|np\.object_)$' }
fix: $DF.select_dtypes(["object", "str"], $$$REST)
metadata: { fix: unsafe }
---
# The object dtype in a list or tuple as the first argument. The fix writes "str" after it.
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3. select_dtypes still matches them with object, but it warns that this will stop. Write "str" beside object to keep selecting both, or "str" for text columns only.
rule:
  pattern: $DF.select_dtypes($FIRST, $$$REST)
constraints:
  FIRST:
    any: [{ kind: list }, { kind: tuple }]
    regex: '(object|["'']object["'']|["'']O["'']|np\.object_)\s*[,\])]'
    not: { regex: '["'']str(ing)?["'']' }
transform:
  NEW: { replace: { source: $FIRST, replace: '(object|["'']object["'']|["'']O["'']|np\.object_)(\s*[,\])])', by: '${1}, "str"${2}' } }
fix: $DF.select_dtypes($NEW, $$$REST)
metadata: { fix: unsafe }
