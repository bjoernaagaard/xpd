---
# No fix for any other first argument that names object, such as np.dtype("O"), because the
# fixes above write "str" only beside a plain object dtype.
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3. select_dtypes still matches them with object, but it warns that this will stop. Write ["object", "str"] to keep selecting both, or "str" for text columns only.
rule:
  any:
    - pattern: $DF.select_dtypes($FIRST, $$$REST)
    - pattern: $DF.select_dtypes($FIRST)
constraints:
  FIRST:
    regex: '\bobject\b|["'']O["'']'
    not:
      any:
        - kind: keyword_argument
        - regex: '["'']str(ing)?["'']'
        - regex: '^(object|["'']object["'']|["'']O["'']|np\.object_)$'
        - all:
            - any: [{ kind: list }, { kind: tuple }]
            - regex: '(object|["'']object["'']|["'']O["'']|np\.object_)\s*[,\])]'
