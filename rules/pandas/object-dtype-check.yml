# Text columns have dtype str in pandas 3, so a check against object is False for them. The fixes
# are unsafe: is_string_dtype is False for an object column of mixed values. In select_dtypes the
# fix adds "str" beside object, which selects the same columns on pandas 3 without the warning,
# and raises TypeError on pandas 2, where "str" is not allowed.

id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3, so this comparison with object is False for them. Write pd.api.types.is_string_dtype($X).
rule: { pattern: $X.dtype == $O }
constraints:
  O: { matches: object-dtype }
utils:
  object-dtype: { regex: '^(object|["'']object["'']|["'']O["'']|np\.object_|np\.dtype\(["'']O["'']\))$' }
fix: pd.api.types.is_string_dtype($X)
metadata: { fix: unsafe }
---
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3, so this comparison with object is True for them. Write not pd.api.types.is_string_dtype($X).
rule: { pattern: $X.dtype != $O }
constraints:
  O: { matches: object-dtype }
utils:
  object-dtype: { regex: '^(object|["'']object["'']|["'']O["'']|np\.object_|np\.dtype\(["'']O["'']\))$' }
fix: not pd.api.types.is_string_dtype($X)
metadata: { fix: unsafe }
---
# No fix, because select_dtypes returns a frame where the comparison returns a Series of booleans.
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3, so comparing dtypes with object leaves them out. Select text columns with select_dtypes(include="str").
rule:
  any:
    - pattern: $X.dtypes == $O
    - pattern: $X.dtypes != $O
constraints:
  O: { matches: object-dtype }
utils:
  object-dtype: { regex: '^(object|["'']object["'']|["'']O["'']|np\.object_|np\.dtype\(["'']O["'']\))$' }
---
# The object dtype alone in include= or exclude= of select_dtypes.
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3. select_dtypes still matches them with object, but it warns that this will stop. Write ["object", "str"] to keep selecting both, or "str" for text columns only.
rule:
  all:
    - any: [{ kind: string }, { kind: identifier }, { kind: attribute }]
    - matches: object-dtype
    - matches: select-argument
utils:
  object-dtype: { regex: '^(object|["'']object["'']|["'']O["'']|np\.object_)$' }
  select-argument:
    inside:
      kind: keyword_argument
      has: { field: name, regex: ^(include|exclude)$ }
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: \.select_dtypes$ } }
fix: '["object", "str"]'
metadata: { fix: unsafe }
---
# The object dtype in a list or tuple of include= or exclude=. The fix writes "str" after it.
id: object-dtype-check
language: python
severity: error
message: Text columns have dtype str in pandas 3. select_dtypes still matches them with object, but it warns that this will stop. Write $E, "str" to keep selecting both, or "str" for text columns only.
rule:
  pattern: $E
  all:
    - any: [{ kind: string }, { kind: identifier }, { kind: attribute }]
    - matches: object-dtype
    - inside: { any: [{ kind: list }, { kind: tuple }], matches: select-argument }
    # With "str" beside it the call names both and does not warn.
    - not: { inside: { any: [{ kind: list }, { kind: tuple }], has: { regex: '^["'']str(ing)?["'']$' } } }
utils:
  object-dtype: { regex: '^(object|["'']object["'']|["'']O["'']|np\.object_)$' }
  select-argument:
    inside:
      kind: keyword_argument
      has: { field: name, regex: ^(include|exclude)$ }
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: \.select_dtypes$ } }
fix: $E, "str"
metadata: { fix: unsafe }
