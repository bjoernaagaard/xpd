id: assign-drops-alignment
language: python
severity: warning
message: This drops the index of $O, so its rows are paired with $DF by position. With the same rows in another order, all 4 values landed on the wrong row. Write $DF.loc[:, $A] = $O[$B], which pairs the rows by index label, or merge the two frames on a key column.
rule:
  any:
    - pattern: $DF.loc[:, $A] = $O[$B].values
    - pattern: $DF.loc[:, $A] = $O[$B].to_numpy()
    - pattern: $DF.loc[:, $A] = $O[$B].tolist()
constraints:
  DF: { kind: identifier }
  O: { kind: identifier, not: { pattern: $DF } }
fix: $DF.loc[:, $A] = $O[$B]
metadata: { fix: unsafe }
---
id: assign-drops-alignment
language: python
severity: warning
message: This drops the index of $O, so its rows are paired with $DF by position. With the same rows in another order, all 4 values landed on the wrong row. Write $K=$O[$B], which pairs the rows by index label, or merge the two frames on a key column.
rule:
  kind: keyword_argument
  all:
    - has: { field: name, pattern: $K }
    - has:
        field: value
        any:
          - pattern: $O[$B].values
          - pattern: $O[$B].to_numpy()
          - pattern: $O[$B].tolist()
  inside:
    kind: argument_list
    inside: { kind: call, pattern: $DF.assign($$$ARGS) }
constraints:
  DF: { kind: identifier }
  O: { kind: identifier, not: { pattern: $DF } }
fix: $K=$O[$B]
metadata: { fix: unsafe }
