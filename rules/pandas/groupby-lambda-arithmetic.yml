# Arithmetic of a group column with one of its own reductions can use transform with the name of
# the reduction. Unsafe: rows whose key is missing get a missing result in both forms, but the
# sums use compensated summation, and the result name can change.
id: groupby-lambda-arithmetic
language: python
severity: warning
message: Divide the column by transform("sum") instead. A lambda in transform runs in Python once per group.
rule: { pattern: "$DF.groupby($$$K)[$C].transform(lambda $X: $X / $X.sum())" }
fix: $DF[$C] / $DF.groupby($$$K)[$C].transform("sum")
metadata: { fix: unsafe }
---
id: groupby-lambda-arithmetic
language: python
severity: warning
message: Compute the z-score from transform("mean") and transform("std") instead. A lambda in transform runs in Python once per group.
rule: { pattern: "$DF.groupby($$$K)[$C].transform(lambda $X: ($X - $X.mean()) / $X.std())" }
fix: ($DF[$C] - $DF.groupby($$$K)[$C].transform("mean")) / $DF.groupby($$$K)[$C].transform("std")
metadata: { fix: unsafe }
---
id: groupby-lambda-arithmetic
language: python
severity: warning
message: Fill the gaps from transform("mean") instead. A lambda in transform runs in Python once per group.
rule: { pattern: "$DF.groupby($$$K)[$C].transform(lambda $X: $X.fillna($X.mean()))" }
fix: $DF[$C].fillna($DF.groupby($$$K)[$C].transform("mean"))
metadata: { fix: unsafe }
---
# Subtraction of a reduction, division by one other than sum, and min-max scaling.
id: groupby-lambda-arithmetic
language: python
severity: warning
message: This lambda runs in Python once per group. Subtract the group value from the whole column.
rule:
  pattern: "$DF.groupby($$$K)[$C].transform(lambda $X: $X - $X.$A())"
constraints:
  A: { regex: '^(mean|median|min|max)$' }
fix: $DF[$C] - $DF.groupby($$$K)[$C].transform("$A")
metadata: { fix: unsafe }
---
id: groupby-lambda-arithmetic
language: python
severity: warning
message: This lambda runs in Python once per group. Divide the whole column by the group value.
rule:
  pattern: "$DF.groupby($$$K)[$C].transform(lambda $X: $X / $X.$A())"
constraints:
  A: { regex: '^(mean|median|min|max|std|count)$' }
fix: $DF[$C] / $DF.groupby($$$K)[$C].transform("$A")
metadata: { fix: unsafe }
---
# Unsafe: the fix reads the frame and runs the group-by three times, so code in them with side
# effects runs again, and transform("min") raises on a dtype that the lambda could still compare.
id: groupby-lambda-arithmetic
language: python
severity: warning
message: This lambda runs in Python once per group. Take the group minimum and maximum with transform("min") and transform("max") and scale the whole column, as in ($DF[$C] - $G.transform("min")) / ($G.transform("max") - $G.transform("min")).
rule:
  pattern: "$G.transform(lambda $X: ($X - $X.min()) / ($X.max() - $X.min()))"
  has: { field: function, has: { field: object, pattern: "$DF.groupby($$$K)[$C]" } }
fix: ($DF[$C] - $G.transform("min")) / ($G.transform("max") - $G.transform("min"))
metadata: { fix: unsafe }
---
# A group-by that does not select one column of a frame by name. No fix, because the column to
# scale is not apart in the code.
id: groupby-lambda-arithmetic
language: python
severity: warning
message: This lambda runs in Python once per group. Take the group minimum and maximum with transform("min") and transform("max") and scale the whole column.
rule:
  pattern: "$G.transform(lambda $X: ($X - $X.min()) / ($X.max() - $X.min()))"
  not: { has: { field: function, has: { field: object, pattern: "$DF.groupby($$$K)[$C]" } } }
