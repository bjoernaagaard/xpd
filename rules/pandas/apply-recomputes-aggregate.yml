# The lambda computes a reduction of a whole column again for every row, so the time grows with
# the square of the row count.
# No fix, because the lambda's name would have to be replaced by the column in its body.
id: apply-recomputes-aggregate
language: python
severity: warning
message: This lambda computes $O.$A() again for every row. Compute it once and use it on the whole column, as in $S - $O.$A().
rule:
  any:
    - pattern: "$S.apply(lambda $X: $BODY)"
    - pattern: "$S.map(lambda $X: $BODY)"
  has:
    stopBy: end
    kind: lambda
    all:
      - has:
          field: body
          any: [{ kind: binary_operator }, { kind: comparison_operator }]
          not: { has: { stopBy: end, any: [{ kind: conditional_expression }, { kind: boolean_operator }, { kind: lambda }] } }
      - has:
          stopBy: end
          pattern: $O.$A()
          not: { has: { stopBy: end, pattern: $X } }
constraints:
  X: { regex: '^[A-Za-z_]\w*$' }
  O: { kind: subscript, has: { field: subscript, kind: string } }
  A: { regex: '^(mean|median|sum|min|max|std|var|count|nunique)$' }
rewriters:
  - id: parameter
    rule: { kind: identifier, pattern: $X }
    fix: $S
transform:
  NEW: { rewrite: { source: $BODY, rewriters: [parameter] } }
fix: $NEW
metadata: { fix: unsafe }
