# The slow form is a frame that grows inside a loop: `out = pd.concat([out, part])` copies every
# earlier row on each pass. A concat inside a loop that builds a frame from other objects, such
# as `panel = pd.concat(parts_of_this_month)`, copies each row once and is left alone. So is a
# concat with axis=1: on pandas 3 it shares the columns it already has and copies no row.
# No fix, because the list and the one concat after the loop change the loop and the code after it.
id: concat-in-loop
language: python
severity: warning
message: $OUT grows by one concat per pass, and each concat copies every earlier row. Collect the frames in a list and concat once after the loop.
rule:
  kind: assignment
  all:
    - has: { field: left, pattern: $OUT }
    - has:
        field: right
        any:
          - pattern: pd.concat($$$ARGS)
          - pattern: pandas.concat($$$ARGS)
          - pattern: concat($$$ARGS)
          - pattern: pd.concat($$$ARGS).$M($$$REST)
        has:
          stopBy: end
          field: arguments
          has: { stopBy: end, pattern: $OUT }
    - not:
        has:
          field: right
          stopBy: end
          kind: keyword_argument
          all:
            - has: { field: name, regex: ^axis$ }
            - has: { field: value, regex: '^(1|["'']columns["''])$' }
    - inside:
        stopBy: end
        any: [{ kind: for_statement }, { kind: while_statement }]
constraints:
  OUT: { any: [{ kind: identifier }, { kind: attribute }] }
