defaultCategory: models
categoryPrefixes:
  sklego.datasets: data
  sklego.decomposition: features
  sklego.feature_selection: features
  sklego.metrics: evaluation
  sklego.model_selection: evaluation
  sklego.pandas_utils: data
  sklego.pipeline: workflow
  sklego.preprocessing: features
  sklego.testing: evaluation

# The scikit-lego pack, for files that import sklego. Every other .yml file in this folder is a
# rule.

# No fix in this pack writes a short name such as `np.`, so the pack lists no alias.
aliases: {}

# Names a fix may write bare, each with the module it must be imported from. A fix that writes
# `FunctionTransformer()` applies only in a file with
# `from sklearn.preprocessing import FunctionTransformer`.
members:
  FunctionTransformer: sklearn.preprocessing
  log_step: sklego.pandas_utils

# The pack has no package checks. cvxpy, umap-learn and formulaic are extras that only some
# estimators need, and a package check cannot see which estimators a project uses, so a check
# would warn projects that never use them. scikit-lego itself raises an ImportError that names
# the extra when one is missing.
packages: []
