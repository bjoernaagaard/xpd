id: zero-inflated-roles
language: python
severity: error
message: ZeroInflatedRegressor takes the classifier first and the regressor second, and fit raises ValueError "`regressor` has to be a regressor" on $M. Pass a regressor there.
rule:
  pattern: $F($$$A)
  all:
    - has: { field: function, regex: '(^|\.)ZeroInflatedRegressor$' }
    - has:
        field: arguments
        any:
          - has: { nthChild: 2, matches: classifier }
          - has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^regressor$' } }, { has: { field: value, matches: classifier } }] }
    - not:
        all:
          - pattern: $F($REG, $CLF)
          - has:
              field: arguments
              all:
                - has: { nthChild: 1, matches: regressor }
                - has: { nthChild: 2, matches: classifier }
                - not: { has: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }, { kind: comment }] } }
utils:
  regressor:
    kind: call
    has:
      field: function
      any: [{ kind: attribute, has: { field: attribute, regex: '^(\w*Regressor|LinearRegression|\w*Ridge(CV)?|Lasso(CV)?|ElasticNet(CV)?|SVR|NuSVR|LinearSVR)$' } }, { regex: '^(\w*Regressor|LinearRegression|\w*Ridge(CV)?|Lasso(CV)?|ElasticNet(CV)?|SVR|NuSVR|LinearSVR)$' }]
  classifier:
    kind: call
    has:
      field: function
      any: [{ kind: attribute, has: { field: attribute, pattern: $M } }, { pattern: $M }]
constraints:
  M: { regex: '^(\w*Classifier|LogisticRegression(CV)?|SVC|NuSVC|LinearSVC|\w+NB)$' }
