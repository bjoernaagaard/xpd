# ColumnSelector, ColumnDropper and TypeSelector have get_feature_names but neither
# get_feature_names_out nor set_output. A pipeline that holds one raises ValueError "Unable to
# configure output for ColumnSelector(...) because `set_output` is not available." on
# set_output, and AttributeError "Estimator columnselector does not provide
# get_feature_names_out" on get_feature_names_out. A ColumnTransformer with "passthrough" on the
# same columns did both.

# No fix, because the advice is another step.
id: selector-without-feature-names
language: python
severity: error
message: $C has no set_output and no get_feature_names_out, so this call on a pipeline that holds it raises ValueError or AttributeError. Select the columns with a ColumnTransformer and "passthrough", which has both.
rule:
  pattern: $P.$M($$$B)
  all:
    - has: { field: function, has: { field: object, kind: call, matches: holds-selector } }
constraints:
  M: { regex: '^(set_output|get_feature_names_out)$' }
utils:
  holds-selector:
    all:
      - has: { field: function, regex: '(^|\.)(make_pipeline|Pipeline|make_debug_pipeline|DebugPipeline)$' }
      - has: { field: arguments, has: { stopBy: end, kind: call, has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $C } }, { pattern: $C }], regex: '(^|\.)(ColumnSelector|ColumnDropper|TypeSelector|PandasTypeSelector)$' } } }
---
# The same call on a name that the file assigns such a pipeline to. fit returns the pipeline,
# so a call chained after fit counts too.
# No fix, because the advice is another step.
id: selector-without-feature-names
language: python
severity: error
message: $C has no set_output and no get_feature_names_out, so this call on a pipeline that holds it raises ValueError or AttributeError. Select the columns with a ColumnTransformer and "passthrough", which has both.
rule:
  any:
    - pattern: $V.fit($$$D).$M($$$B)
    - pattern: $V.$M($$$B)
  inside:
    stopBy: end
    kind: module
    has:
      stopBy: end
      kind: assignment
      all:
        - has: { field: left, pattern: $V }
        - has: { field: right, kind: call, matches: holds-selector }
constraints:
  M: { regex: '^(set_output|get_feature_names_out)$' }
  V: { kind: identifier }
utils:
  holds-selector:
    all:
      - has: { field: function, regex: '(^|\.)(make_pipeline|Pipeline|make_debug_pipeline|DebugPipeline)$' }
      - has: { field: arguments, has: { stopBy: end, kind: call, has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $C } }, { pattern: $C }], regex: '(^|\.)(ColumnSelector|ColumnDropper|TypeSelector|PandasTypeSelector)$' } } }
