# add_lags shifts by the negative of the lag, so lag 1 puts the value of the next row on each
# row, and lag -1 the value of the row before. pandas shift(1) goes the other way. On a frame
# with sales 10 to 50, add_lags(df, "sales", 1) gave sales1 = 20, 30, 40, 50. On a series of
# pure noise, the column from lag 1 predicted the sign of the next row with accuracy 0.996, and
# the column from lag -1 predicted the sign of its own row with accuracy 0.474.
#
# A positive lag is right when the column is the target of a forecast, so the rule is a warning.
#
# A range holds a positive lag when it starts at 1 or more, or when it counts up to a stop of 2
# or more. range(0, -3, -1) holds 0, -1 and -2 and is left alone, as is a range whose numbers
# are not written out.

# No fix, because the code does not show whether the column is the target of a forecast.
id: add-lags-positive
language: python
severity: warning
message: add_lags with a positive lag copies the value of a later row, so lag 1 is the next row and not the row before. On pure noise that column predicted the next row's sign with accuracy 0.996, where lag -1 scored 0.474. Use negative lags for features from the past.
rule:
  pattern: $F($$$A)
  all:
    - has: { field: function, regex: '(^|\.)add_lags$' }
    - has:
        field: arguments
        any:
          - has: { nthChild: 3, matches: later-rows }
          - has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^lags$' } }, { has: { field: value, matches: later-rows } }] }
utils:
  later-rows:
    any:
      - { kind: integer, regex: '^[1-9]' }
      - { any: [{ kind: list }, { kind: tuple }], has: { kind: integer, regex: '^[1-9]' } }
      - { matches: positive-range }
      - { kind: call, all: [{ has: { field: function, regex: '^(list|tuple)$' } }, { has: { field: arguments, has: { nthChild: 1, matches: positive-range } } }] }
  positive-range:
    kind: call
    all:
      - has: { field: function, regex: '^range$' }
      - has:
          field: arguments
          any:
            # range(1, n) and range(3, 0, -1): every lag it holds is positive.
            - all: [{ has: { nthChild: 1, kind: integer, regex: '^[1-9]' } }, { has: { nthChild: 2 } }]
            # range(3) and range(-2, 3): it counts up to 2 or more.
            - all: [{ has: { nthChild: { position: 1, reverse: true }, kind: integer, regex: '^([2-9]|[1-9]\d+)$' } }, { not: { has: { nthChild: 3 } } }]
            # range(0, 6, 2): the same with a step that counts up.
            - all: [{ has: { nthChild: 2, kind: integer, regex: '^([2-9]|[1-9]\d+)$' } }, { has: { nthChild: 3, kind: integer } }]
