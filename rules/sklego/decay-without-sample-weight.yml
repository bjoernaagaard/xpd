# DecayEstimator passes its weights to the inner model as fit(X, y, sample_weight=...). A
# scikit-learn Pipeline takes no sample_weight and raises ValueError "Pipeline.fit does not
# accept the sample_weight parameter". The estimators named in the second document have no
# sample_weight in fit on scikit-learn 1.9.1, and DecayEstimator raises TypeError "Model
# KNeighborsRegressor.fit() does not have 'sample_weight'" for them. The list is every
# classifier and regressor of sklearn.utils.all_estimators() on scikit-learn 1.9.1 that takes
# no argument to build and whose fit raised that TypeError inside a DecayEstimator, 22 in all.

id: decay-without-sample-weight
language: python
severity: error
message: DecayEstimator passes sample_weight to the model's fit, and a Pipeline raises ValueError "Pipeline.fit does not accept the sample_weight parameter". Put the DecayEstimator around the last step, inside the pipeline.
rule:
  pattern: $F($PIPE($FIRST, $LAST))
  all:
    - has: { field: function, regex: '(^|\.)DecayEstimator$' }
    - has:
        field: arguments
        has:
          nthChild: 1
          all:
            - has: { field: function, regex: '(^|\.)(make_pipeline|make_debug_pipeline)$' }
            - not: { has: { field: arguments, has: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }, { kind: comment }] } } }
fix: $PIPE($FIRST, $F($LAST))
metadata: { fix: unsafe }
---
id: decay-without-sample-weight
language: python
severity: error
message: DecayEstimator passes sample_weight to the model's fit, and a Pipeline raises ValueError "Pipeline.fit does not accept the sample_weight parameter". Put the DecayEstimator around the last step, inside the pipeline.
rule:
  pattern: $F($$$A)
  all:
    - has: { field: function, regex: '(^|\.)DecayEstimator$' }
    - has:
        field: arguments
        any:
          - has: { nthChild: 1, matches: pipeline }
          - has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^model$' } }, { has: { field: value, matches: pipeline } }] }
    - not:
        all:
          - pattern: $F($PIPE($FIRST, $LAST))
          - has:
              field: arguments
              has:
                nthChild: 1
                all:
                  - has: { field: function, regex: '(^|\.)(make_pipeline|make_debug_pipeline)$' }
                  - not: { has: { field: arguments, has: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }, { kind: comment }] } } }
utils:
  pipeline:
    kind: call
    has: { field: function, regex: '(^|\.)(make_pipeline|Pipeline|make_debug_pipeline|DebugPipeline)$' }
---
# No fix, because the advice is another model.
id: decay-without-sample-weight
language: python
severity: error
message: DecayEstimator passes sample_weight to the model's fit, which $M does not take, so fit raises TypeError "does not have 'sample_weight'". Use a model that takes sample_weight.
rule:
  pattern: $F($$$A)
  all:
    - has: { field: function, regex: '(^|\.)DecayEstimator$' }
    - has:
        field: arguments
        any:
          - has: { nthChild: 1, matches: unweighted }
          - has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^model$' } }, { has: { field: value, matches: unweighted } }] }
utils:
  unweighted:
    kind: call
    has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $M } }, { pattern: $M }] }
constraints:
  M: { regex: '^(ARDRegression|CCA|GaussianProcessClassifier|GaussianProcessRegressor|KNeighborsClassifier|KNeighborsRegressor|LabelPropagation|LabelSpreading|Lars|LassoLars|LassoLarsIC|LinearDiscriminantAnalysis|NearestCentroid|OrthogonalMatchingPursuit|PassiveAggressiveClassifier|PassiveAggressiveRegressor|PLSCanonical|PLSRegression|QuadraticDiscriminantAnalysis|RadiusNeighborsClassifier|RadiusNeighborsRegressor|TheilSenRegressor)$' }
