# The outlier detectors each read threshold in their own way, and two of the readings fail.
#
# PCAOutlierDetection and UMAPOutlierDetection default to threshold=None and raise ValueError
# "The `threshold` value cannot be `None`." in fit. A call inside a search is left alone, because
# the search may set the threshold.
#
# GMMOutlierDetector and BayesianGMMOutlierDetector with the default method="quantile" read
# threshold as the share of training rows to keep, so the default 0.99 flags 1 percent. A small
# number, written as if it were the share of outliers, flags most rows: 0.05 flagged 380 of 400
# training rows, 0.4 flagged 240, 0.5 flagged 200 and 0.95 flagged 20. A number above 1 raises
# ValueError. method="stddev" reads threshold as a count of standard deviations, so the two
# documents about the share run only when the call leaves method out or writes
# method="quantile". A method given as a variable may be "stddev".

# No fix, because the threshold is not in the file.
id: outlier-threshold
language: python
severity: error
message: $C has no default threshold, and fit raises ValueError "The `threshold` value cannot be `None`." Pass threshold=.
rule:
  pattern: $F($$$A)
  all:
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $C } }, { pattern: $C }] }
    - not: { has: { field: arguments, has: { any: [{ kind: keyword_argument, has: { field: name, regex: '^threshold$' } }, { kind: dictionary_splat }, { kind: list_splat }] } } }
    - not: { has: { field: arguments, has: { nthChild: 2, not: { kind: keyword_argument } } } }
    - not: { inside: { stopBy: end, kind: call, has: { field: function, regex: '(SearchCV|clone)$' } } }
constraints:
  C: { regex: '^(PCAOutlierDetection|UMAPOutlierDetection)$' }
---
id: outlier-threshold
language: python
severity: error
message: $C with method="quantile" keeps the share threshold of the training rows as inliers, so a threshold below 0.5 flags more than half of them. 0.05 flagged 380 of 400 training rows, where 0.95 flagged 20. Pass 1 minus the share of outliers.
rule:
  pattern: $F($$$A)
  all:
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $C } }, { pattern: $C }] }
    - has:
        field: arguments
        has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^threshold$' } }, { has: { field: value, matches: small-share } }] }
    - matches: quantile-method
constraints:
  C: { regex: '^(GMMOutlierDetector|BayesianGMMOutlierDetector)$' }
rewriters:
  - id: invert-threshold
    rule:
      kind: keyword_argument
      all:
        - has: { field: name, regex: '^threshold$' }
        - has: { field: value, pattern: $V, matches: small-share }
    fix: threshold=1 - $V
transform:
  FIXED: { rewrite: { source: $A, rewriters: [invert-threshold] } }
fix: $F($FIXED)
metadata: { fix: unsafe }
utils:
  small-share: { kind: float, regex: '^0?\.[0-4]\d*$' }
  quantile-method:
    has:
      field: arguments
      not:
        has:
          any:
            - { kind: keyword_argument, all: [{ has: { field: name, regex: '^method$' } }, { not: { has: { field: value, regex: '^["'']quantile["'']$' } } }] }
            - { nthChild: 2, not: { any: [{ kind: keyword_argument }, { regex: '^["'']quantile["'']$' }] } }
            - { kind: dictionary_splat }
            - { kind: list_splat }
---
id: outlier-threshold
language: python
severity: error
message: $C with method="quantile" keeps the share threshold of the training rows as inliers, so a threshold below 0.5 flags more than half of them. 0.05 flagged 380 of 400 training rows, where 0.95 flagged 20. Pass 1 minus the share of outliers.
rule:
  pattern: $F($V, $$$REST)
  all:
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $C } }, { pattern: $C }] }
    - has: { field: arguments, has: { nthChild: 1, matches: small-share } }
    - matches: quantile-method
constraints:
  C: { regex: '^(GMMOutlierDetector|BayesianGMMOutlierDetector)$' }
fix: $F(1 - $V, $$$REST)
metadata: { fix: unsafe }
utils:
  small-share: { kind: float, regex: '^0?\.[0-4]\d*$' }
  quantile-method:
    has:
      field: arguments
      not:
        has:
          any:
            - { kind: keyword_argument, all: [{ has: { field: name, regex: '^method$' } }, { not: { has: { field: value, regex: '^["'']quantile["'']$' } } }] }
            - { nthChild: 2, not: { any: [{ kind: keyword_argument }, { regex: '^["'']quantile["'']$' }] } }
            - { kind: dictionary_splat }
            - { kind: list_splat }
