# No fix, because the message names two rewrites, and the share is not in the file.
id: outlier-threshold
language: python
severity: error
message: $C with method="quantile" reads threshold as a share between 0 and 1, and fit raises ValueError on a larger number. Pass a share, or method="stddev" to count standard deviations.
rule:
  pattern: $F($$$A)
  all:
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $C } }, { pattern: $C }] }
    - has:
        field: arguments
        any:
          - has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^threshold$' } }, { has: { field: value, matches: above-one } }] }
          - has: { nthChild: 1, matches: above-one }
    - matches: quantile-method
constraints:
  C: { regex: '^(GMMOutlierDetector|BayesianGMMOutlierDetector)$' }
utils:
  quantile-method:
    has:
      field: arguments
      not:
        has:
          any:
            - { kind: keyword_argument, all: [{ has: { field: name, regex: '^method$' } }, { not: { has: { field: value, regex: '^["'']quantile["'']$' } } }] }
            - { nthChild: 2, not: { any: [{ kind: keyword_argument }, { regex: '^["'']quantile["'']$' }] } }
            - { kind: dictionary_splat }
            - { kind: list_splat }
  above-one:
    any:
      - { kind: integer, regex: '^([2-9]|[1-9]\d+)$' }
      - { kind: float, regex: '^([2-9]|[1-9]\d+)\.\d*$|^1\.\d*[1-9]\d*$' }
