# GroupedEstimator was renamed to GroupedPredictor in 0.5.2 and the old name went away in 0.8.0.
id: removed-in-sklego
language: python
severity: error
message: GroupedEstimator was removed in scikit-lego 0.8.0, and the import raises ImportError. Use GroupedPredictor, or GroupedRegressor and GroupedClassifier.
rule:
  kind: identifier
  regex: ^GroupedEstimator$
  inside:
    stopBy: end
    kind: module
    has: { stopBy: end, kind: import_from_statement, regex: '^from\s+sklego\.meta\s+import\b[^#]*\bGroupedEstimator\b' }
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
fix: GroupedPredictor
metadata: { fix: unsafe, since: "0.8" }
---
# OutlierRemover moved from sklego.meta to sklego.preprocessing. The fix covers the import that
# names nothing else.
id: removed-in-sklego
language: python
severity: error
message: OutlierRemover left sklego.meta in scikit-lego 0.8.0, and the import raises ImportError. Import it from sklego.preprocessing.
rule:
  kind: import_from_statement
  regex: '^from\s+sklego\.meta\s+import\s+OutlierRemover\s*$'
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
fix: from sklego.preprocessing import OutlierRemover
metadata: { fix: unsafe, since: "0.8" }
---
# An import that names other names as well has no fix, because the name has to move to a second import.
id: removed-in-sklego
language: python
severity: error
message: OutlierRemover left sklego.meta in scikit-lego 0.8.0, and the import raises ImportError. Import it from sklego.preprocessing.
rule:
  kind: dotted_name
  regex: ^OutlierRemover$
  inside:
    stopBy: end
    kind: import_from_statement
    all:
      - regex: '^from\s+sklego\.meta\s+import\b'
      - not: { regex: '^from\s+sklego\.meta\s+import\s+OutlierRemover\s*$' }
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
metadata: { since: "0.8" }
