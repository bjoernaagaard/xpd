# Each document finds a scikit-lego form that raises on 0.9.10: a name or module that a release
# removed, or a keyword that a signature no longer has. Code inside a try block that catches the
# error is a compatibility path and stays silent.
#
# A fix here turns code that raises into code that runs. It is safe only where an older release
# ran the old and the new form and gave an equal value, and unsafe everywhere else.

# No fix, because every use of the name has to change too, and formulaic reads some formulas in another way.
id: removed-in-sklego
language: python
severity: error
message: PatsyTransformer was removed in scikit-lego 0.8.0, and the import raises ImportError. Use FormulaicTransformer, which reads the formula with formulaic, and check the formula, because formulaic is not patsy.
rule:
  kind: dotted_name
  regex: ^PatsyTransformer$
  inside:
    stopBy: end
    kind: import_from_statement
    regex: '^from\s+sklego\.preprocessing(\.patsytransformer)?\s+import\b'
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
metadata: { since: "0.8" }
---
# FairClassifier was a subclass of DemographicParityClassifier that added nothing, so the new
# name takes the same arguments. The fix renames the import and every use in the file.
id: removed-in-sklego
language: python
severity: error
message: FairClassifier was removed in scikit-lego 0.8.0, and the import raises ImportError. It was another name for DemographicParityClassifier, which takes the same arguments.
rule:
  kind: identifier
  regex: ^FairClassifier$
  inside:
    stopBy: end
    kind: module
    has: { stopBy: end, kind: import_from_statement, regex: '^from\s+sklego\.linear_model\s+import\b[^#]*\bFairClassifier\b' }
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
fix: DemographicParityClassifier
metadata: { fix: unsafe, since: "0.8" }
