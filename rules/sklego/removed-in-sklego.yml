utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
fix: sklego.preprocessing
metadata: { fix: unsafe, since: "0.8" }
---
# The other modules that went away with those names.
# No fix, because the names imported from these modules changed too.
id: removed-in-sklego
language: python
severity: error
message: $M was removed in scikit-lego 0.8.0, and the import raises ModuleNotFoundError. GroupedPredictor is in sklego.meta, and FormulaicTransformer in sklego.preprocessing replaces PatsyTransformer.
rule:
  kind: dotted_name
  pattern: $M
  regex: '^sklego\.(meta\.grouped_estimator|preprocessing\.patsytransformer)$'
  any: [{ inside: { kind: import_from_statement, field: module_name } }, { inside: { kind: import_statement } }, { inside: { kind: aliased_import, inside: { kind: import_statement } } }]
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
metadata: { since: "0.8" }
---
# The dataset loaders renamed give_pandas= to as_frame= and dropped the old keyword in 0.6.6.
# Safe: on scikit-lego 0.6.3 each loader gave equal pickles with give_pandas and with as_frame.
id: removed-in-sklego
language: python
severity: error
message: $F no longer takes give_pandas= and raises TypeError since scikit-lego 0.6.6. Pass as_frame= instead.
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: ^give_pandas$ }
    - has: { field: value, pattern: $V }
  inside:
    kind: argument_list
    inside:
      kind: call
      has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $F } }, { pattern: $F }] }
  not: { matches: compat-code }
constraints:
  F: { regex: '^(load_(penguins|arrests|chicken|abalone|heroes|hearts)|make_simpleseries)$' }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
fix: as_frame=$V
metadata: { fix: safe, since: "0.6.6" }
---
# DecayEstimator took decay= until 0.7.0, which built the weights decay ** (n - i). The
# exponential decay function now takes that number as decay_rate through decay_kwargs.
id: removed-in-sklego
language: python
severity: error
message: 'DecayEstimator no longer takes decay= and raises TypeError since scikit-lego 0.7.0. Pass decay_kwargs={"decay_rate": $V}, which gives the same weights to rounding with the default decay_func.'
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: ^decay$ }
    - has: { field: value, pattern: $V }
  inside:
    kind: argument_list
    not: { has: { kind: keyword_argument, has: { field: name, regex: '^(decay_func|decay_kwargs)$' } } }
    inside:
      kind: call
      has: { field: function, regex: '(^|\.)DecayEstimator$' }
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
fix: 'decay_kwargs={"decay_rate": $V}'
metadata: { fix: unsafe, since: "0.7" }
---
# No fix, because the old setting has to go into the decay_kwargs or decay_func that the call already has.
id: removed-in-sklego
language: python
severity: error
message: DecayEstimator no longer takes decay= and raises TypeError since scikit-lego 0.7.0. Pass the settings of the decay function in decay_kwargs.
rule:
  kind: keyword_argument
  has: { field: name, regex: ^decay$ }
  inside:
    kind: argument_list
    has: { kind: keyword_argument, has: { field: name, regex: '^(decay_func|decay_kwargs)$' } }
    inside:
      kind: call
      has: { field: function, regex: '(^|\.)DecayEstimator$' }
  not: { matches: compat-code }
utils:
  compat-code: { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|Exception))' } } }
metadata: { since: "0.7" }
