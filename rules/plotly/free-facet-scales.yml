# Tufte on small multiples, vdqi.md line 6842, printed page 170: "The design remains constant
# through all the frames, so that attention is devoted entirely to shifts in the data." Line 1863
# gives the principle: "Show data variation, not design variation."
#
# px draws facets on one shared scale: with facet_col the second y axis resolved to matches="y" on
# plotly 7.1.0, and both panels got the range (0.38, 10.62). update_yaxes(matches=None) frees
# them. The panels then got (0.62, 6.88) and (0.38, 10.62), and a tip of 5 was drawn at 0.70 of
# the height of one panel and at 0.45 of the other (runs/behavior.txt). The reader compares
# heights across panels, so the rule is info.
#
# Unsafe: the fixed panels share one scale again, and free scales are sometimes meant, for panels
# in different units. The fix drops the comments inside the parentheses.
id: free-facet-scales
language: python
severity: info
message: matches=None gives each facet its own scale, so the same value sits at a different height in each panel. A value of 5 was drawn at 0.70 of one panel and at 0.45 of the next. Tufte's small multiples keep one design in every frame so that only the data varies. Drop matches=None to keep the shared axes that px draws, unless the panels have different units.
rule:
  kind: call
  pattern: $FN($$$ARGS)
  all:
    - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_[xy]axes$' } }, { has: { field: object, matches: figure } }] }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^matches$' } }, { has: { field: value, kind: none } }] } }
utils:
  # A px figure with facets.
  new-figure:
    kind: call
    all:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(area|bar|box|choropleth|density_contour|density_heatmap|ecdf|funnel|histogram|imshow|line|line_geo|pie|scatter|scatter_geo|strip|timeline|violin)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
      - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(facet_col|facet_row|facet_col_wrap)$' } } }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-figure
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-figure }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
rewriters:
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^matches$ } }
    fix: ""
  - id: keep
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: line_continuation
          - kind: keyword_argument
            has: { field: name, regex: ^matches$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $FN($REST)
metadata: { fix: unsafe, holds: { FIG: { matches: figure-expr } } }
---
# The same free scales from make_subplots, which gives every cell its own y axis unless it is told
# to share them. On plotly 7.1.0 make_subplots(rows=1, cols=2) with a bar of 5 in one cell and a
# bar of 10 in the other resolved the two y axes to the ranges (0, 5.26) and (0, 10.53) with no
# matches, so the bar of 5 was drawn as tall as the bar of 10. With shared_yaxes="all" both axes
# got (0, 10.53) (runs/v2/A/probe_a.txt).
#
# The rule reads the one form where the code shows that the panels hold the same measure: a loop
# that adds a trace whose y is the same written column, such as y=group["sales"], to a cell whose
# row or col changes with the loop. A column named value or values is left alone, because that is
# the name pd.melt gives the column of a long table, which holds a different measure in each
# panel. A make_subplots that names shared_yaxes is left alone, and so is a file that names
# matches, a y axis range or shared_yaxes anywhere, because it may set the scales afterwards. It
# has no fix, because shared_yaxes goes to make_subplots, which is another statement than the
# add_trace that the rule reports.
id: free-facet-scales
language: python
severity: info
message: make_subplots gives each panel its own y scale, and this loop draws $Y in every panel, so the same value sits at a different height in each one. A bar of 5 next to a bar of 10 was drawn just as tall. Tufte's small multiples keep one design in every frame so that only the data varies. Pass shared_yaxes="all" to make_subplots.
rule:
  kind: call
  all:
    - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^add_trace$' } }, { has: { field: object, matches: figure } }] }
    - has:
        field: arguments
        has:
          nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }
          kind: call
          all:
            - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Scatter|Scattergl|Bar|Box|Violin)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
            - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^y$' } }, { has: { field: value, kind: subscript, pattern: $Y, has: { field: subscript, kind: string, not: { regex: '(?i)^[rbu]*["'']values?["'']$' } } } }] } }
            - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(yaxis)$' } } } }
    - matches: loop-cell
    - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(secondary_y)$' } } } }
    - not: { inside: { stopBy: end, kind: module, regex: 'matches|shared_yaxes|yaxis[0-9]*_range|update_yaxes\([^)]*range' } }
utils:
  # A call that makes a figure with subplots.
  new-figure:
    kind: call
    all:
      - has: { field: function, regex: '(^|\.)make_subplots$' }
      - inside: { stopBy: end, kind: module, has: { stopBy: end, any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'plotly\.(subplots|tools)|from plotly import [^\n]*(subplots|tools)' } }
      - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^shared_yaxes$' } } } }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-figure
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-figure }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
  # A call that puts its trace in a cell that changes with the loop around it: row or col, as a
  # keyword or as the second or third argument, names a variable that the loop binds, in its
  # target or by an assignment in its body.
  loop-cell:
    kind: call
    has:
      field: arguments
      has:
        all:
          - any:
              - { kind: keyword_argument, has: { field: name, regex: '^(row|col)$' } }
              - { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }, { kind: keyword_argument }] } } } }
              - { nthChild: { position: 3, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }, { kind: keyword_argument }] } } } }
          - any: [{ matches: cell-var }, { has: { stopBy: end, matches: cell-var } }]
  cell-var:
    kind: identifier
    pattern: $V
    not: { inside: { kind: keyword_argument, field: name } }
    inside:
      stopBy: end
      kind: for_statement
      any:
        - has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] }
        - has: { field: body, has: { stopBy: end, kind: assignment, has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] } } }
metadata: { holds: { FIG: { matches: figure-expr } } }
