# Tufte, vdqi.md line 3707, printed page 92: "Above all else show the data."
#
# A spline draws a smooth curve through the points, and the curve passes through values that the
# data does not hold. On plotly 7.1.0, the values 0, 0, 10, 10, 0, 0 drawn with
# go.Scatter(line_shape="spline") at the default size and with the automatic y range reached 10.55
# at the top and -0.37 at the bottom, and px.line(line_shape="spline") reached 10.51 and -0.34,
# read from the drawn path. The straight line stayed between 0 and 10. plotly computes the spline
# in pixels, so the same values with the y axis set to -5 to 15 at 700 by 500 pixels reached 10.8
# and -0.53 (runs/behavior.txt). How far the curve leaves the data depends on the data, on the
# axis range and on the size of the figure, so the rule is info.
#
# The fix is unsafe: "linear" draws straight segments between the same points, so the figure looks
# different.
#
# This document reads line_shape="spline" in the four px functions that take line_shape and the
# five go traces whose line.shape takes "spline" (runs/lists.txt).
id: spline-line
language: python
severity: info
message: This setting selects spline interpolation. When the trace draws a line, its curve can pass through values the data does not hold. A markers-only trace draws no curve. For the values 0, 0, 10, 10, 0, 0 a go.Scatter line at the default size rose to 10.55 and fell to -0.37. Tufte asks above all else to show the data. Use line_shape="linear" when a line should join measured points with straight segments.
rule:
  kind: string
  regex: '^["'']spline["'']$'
  inside:
    kind: keyword_argument
    all:
      - has: { field: name, regex: '^line_shape$' }
      - inside:
          kind: argument_list
          inside:
            kind: call
            any:
              - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(area|line|line_polar|line_ternary)$' } }, { has: { field: object, matches: px } }] }
              - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Scatter|Scattercarpet|Scatterpolar|Scattersmith|Scatterternary)$' } }, { has: { field: object, matches: go } }] }
              - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_traces$' } }, { has: { field: object, matches: figure } }] }
utils:
  # A file that makes plotly the plotting backend of pandas and names no other backend. There
  # df.plot.bar(...) returned the same figure as px.bar(df, ...) on pandas 3.1.1 with plotly 7.1.0.
  pandas-draws-with-plotly:
    kind: module
    all:
      - has:
          stopBy: end
          any:
            - kind: assignment
              all:
                - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                - has: { field: right, kind: string, regex: '^["'']plotly["'']$' }
            - kind: call
              all:
                - has: { field: function, regex: '(^|\.)set_option$' }
                - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' }
      - not:
          has:
            stopBy: end
            any:
              - kind: assignment
                all:
                  - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                  - not: { has: { field: right, kind: string, regex: '^["'']plotly["'']$' } }
              - kind: call
                all:
                  - has: { field: function, regex: '(^|\.)set_option$' }
                  - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']' }
                  - not: { has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' } }
              - kind: keyword_argument
                all:
                  - has: { field: name, regex: '^backend$' }
                  - not: { has: { field: value, kind: string, regex: '^["'']plotly["'']$' } }
  # The name the file binds to plotly.express: the dotted module itself, the alias of its import,
  # or the plot accessor of pandas in a file that draws with plotly.
  px:
    any:
      - { kind: attribute, regex: '^plotly\.express$' }
      - kind: attribute
        all:
          - has: { field: attribute, regex: '^plot$' }
          - inside: { stopBy: end, matches: pandas-draws-with-plotly }
          # px.bar takes the frame first, and df.plot.bar does not, so an argument given by position
          # is another argument in the two. Only a call with every argument named is read.
          - not: { inside: { kind: attribute, inside: { kind: call, has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { any: [{ kind: keyword_argument }, { kind: dictionary_splat }] } } } } } }
      - kind: identifier
        pattern: $PX
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PX }
              - any:
                  - has: { field: name, regex: '^plotly\.express$' }
                  - all: [{ has: { field: name, regex: '^express$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # The name the file binds to plotly.graph_objects or plotly.graph_objs: the dotted module itself, or the alias of its import.
  go:
    any:
      - { kind: attribute, regex: '^plotly\.graph_obj(ect)?s$' }
      - kind: identifier
        pattern: $GO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $GO }
              - any:
                  - has: { field: name, regex: '^plotly\.graph_obj(ect)?s$' }
                  - all: [{ has: { field: name, regex: '^graph_obj(ect)?s$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # A call that makes a plotly figure.
  new-figure:
    kind: call
    any:
      - has: { field: function, kind: attribute, has: { field: object, matches: px } }
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^Figure(Widget)?$' } }, { has: { field: object, matches: go } }] }
      - all:
          - has: { field: function, regex: '(^|\.)make_subplots$' }
          - inside: { stopBy: end, kind: module, has: { stopBy: end, any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'plotly\.(subplots|tools)|from plotly import [^\n]*(subplots|tools)' } }
  # An annotation that names the class of a plotly figure, as in `fig: go.Figure`.
  figure-type:
    kind: type
    has: { kind: attribute, all: [{ has: { field: attribute, regex: '^Figure(Widget)?$' } }, { has: { field: object, matches: go } }] }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-figure
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-figure }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
fix: '"linear"'
metadata: { fix: unsafe, holds: { FIG: { any: [{ matches: figure-expr }, { matches: figure-type }] } } }
---
# The same shape inside the line argument of a go trace: line=dict(shape="spline") or
# line={"shape": "spline"}.
id: spline-line
language: python
severity: info
message: This setting selects spline interpolation. When the trace draws a line, its curve can pass through values the data does not hold. A markers-only trace draws no curve. For the values 0, 0, 10, 10, 0, 0 a go.Scatter line at the default size rose to 10.55 and fell to -0.37. Tufte asks above all else to show the data. Use shape="linear" when a line should join measured points with straight segments.
rule:
  kind: string
  regex: '^["'']spline["'']$'
  inside:
    any: [{ kind: keyword_argument, has: { field: name, regex: '^shape$' } }, { kind: pair, has: { field: key, regex: '^["'']shape["'']$' } }]
    inside:
      any: [{ kind: argument_list, inside: { kind: call, has: { field: function, regex: '^dict$' } } }, { kind: dictionary }]
      inside:
        stopBy: { kind: argument_list }
        kind: keyword_argument
        all:
          - has: { field: name, regex: '^line$' }
          - inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Scatter|Scattercarpet|Scatterpolar|Scattersmith|Scatterternary)$' } }, { has: { field: object, matches: go } }] } } }
utils:
  # The name the file binds to plotly.graph_objects or plotly.graph_objs: the dotted module itself, or the alias of its import.
  go:
    any:
      - { kind: attribute, regex: '^plotly\.graph_obj(ect)?s$' }
      - kind: identifier
        pattern: $GO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $GO }
              - any:
                  - has: { field: name, regex: '^plotly\.graph_obj(ect)?s$' }
                  - all: [{ has: { field: name, regex: '^graph_obj(ect)?s$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
fix: '"linear"'
metadata: { fix: unsafe }
