defaultCategory: visualization
categoryPrefixes:
  plotly.callbacks: workflow
  plotly.data: data
  plotly.express.trendline_functions: models

# The plotly pack. Every other .yml file in this folder is a rule, and utils/ holds the utility
# rules that the rules share.
#
# The rules apply Edward Tufte's "The Visual Display of Quantitative Information", second
# edition, to plotly figures. Each rule file quotes the book with the line of the quote in the
# Markdown copy of the book that the research used, vdqi.md.

# The short names the plotly documentation imports its modules by. A fix that writes `px.`,
# `go.` or `pio.` applies only in a file that imports the module under that name, and elsewhere
# the issue has no fix. No fix of this pack writes one of them, because each fix rewrites one
# value the code already has.
aliases:
  px: plotly.express
  go: plotly.graph_objects
  pio: plotly.io

# The pack has no package check. plotly draws every figure of these rules without a second
# package.

# pandas draws df.plot with plotly in a file that makes plotly its plotting backend and names no
# other backend. The pack also runs on such a file, which need not import plotly, and df.plot
# stands for plotly.express there: df.plot.bar(x="team", y="score") returned the same figure as
# px.bar(df, x="team", y="score") on pandas 3.1.1 with plotly 7.1.0.
alsoOn:
  setting: { matches: pandas-draws-with-plotly }
  standIn:
    kind: attribute
    has: { field: attribute, regex: '^plot$' }
