id: redundant-color
language: python
severity: info
message: The marker color $C repeats the values or categories used for coordinate $A. Color can repeat a bar length or a category position. Tufte asks to erase redundant data-ink within reason. Use one color unless the category colors serve another purpose, such as matching another chart.
rule:
  kind: call
  all:
    - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Bar)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
    - any:
        - all:
            - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(marker_color)$' } }, { has: { field: value, pattern: $C } }] } }
            - has: { field: arguments, has: { any: [{ kind: comment }, { kind: line_continuation }] } }
        - has:
            field: arguments
            has:
              kind: keyword_argument
              all:
                - has: { field: name, regex: '^marker$' }
                - has:
                    field: value
                    any:
                      - kind: call
                        all:
                          - has: { field: function, regex: '^dict$' }
                          - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(color)$' } }, { has: { field: value, pattern: $C } }] } }
                      - kind: dictionary
                        has: { kind: pair, all: [{ has: { field: key, regex: '^["'']color["'']$' } }, { has: { field: value, pattern: $C } }] }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, pattern: $A, regex: '^[xy]$' } }, { has: { field: value, pattern: $C } }] } }
    - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
constraints:
  C: { not: { any: [{ kind: string }, { kind: integer }, { kind: float }, { kind: none }, { kind: 'true' }, { kind: 'false' }] } }
metadata: { style: house }
