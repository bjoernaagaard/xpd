# Tufte, vdqi.md line 1525, printed page 56: "The representation of numbers, as physically
# measured on the surface of the graphic itself, should be directly proportional to the numerical
# quantities represented." Line 1533, printed page 57, defines the Lie Factor.
#
# A bar shows its value by its length. plotly 7.1.0 ranges a bar axis from zero by itself: bars of
# 95 and 100 got the y range (0, 105.26) and were drawn 324.9 and 342.0 pixels long, the ratio of
# the values. An explicit range is kept as written. With [90, 101] the same bars were 163.6 and
# 327.3 pixels long (runs/behavior.txt). The data grows by 5.3 percent and the bar by 100 percent,
# a Lie Factor of 19. px.histogram behaved the same on counts of 95 and 100.
#
# The rule reads the range only when both ends are numbers above zero. It has no fix, because the
# honest chart is either the same bars from zero or another chart type, and that is the author's
# choice.
#
# This document reads range_y on upright bars. A call with orientation or log_y is left alone, and
# so is a px.histogram without x, whose bars lie along x. A call with base is left alone too: each
# bar then starts at its base and not at zero, and bars from 91 to 95 and from 93 to 100 lay whole
# inside range_y=[90, 101] with lengths in the ratio of their values.
id: bar-axis-without-zero
language: python
severity: warning
message: range_y=$R starts the bar axis above zero, so the length of a bar no longer follows its value. With [90, 101], bars for 95 and 100 were drawn 163.6 and 327.3 pixels long, a Lie Factor of 19 by Tufte's measure. Let the axis start at 0, or show the values as points with px.scatter.
rule:
  kind: call
  all:
    - any:
        - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(bar)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
        - all:
            - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(histogram)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
            - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(x)$' } } }
            - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(y)$' } } } }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(range_y)$' } }, { has: { field: value, pattern: $R, matches: cut-range } }] } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|log_y|base)$' } } } }
    - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
---
# The same cut on bars that lie down: orientation="h" with range_x. The bars for 95 and 100 were
# drawn 245.4 and 490.9 pixels long with range_x=[90, 101].
id: bar-axis-without-zero
language: python
severity: warning
message: range_x=$R starts the bar axis above zero, so the length of a bar no longer follows its value. With [90, 101], bars for 95 and 100 were drawn 245.4 and 490.9 pixels long, a Lie Factor of 19 by Tufte's measure. Let the axis start at 0, or show the values as points with px.scatter.
rule:
  kind: call
  all:
    - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(bar)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(orientation)$' } }, { has: { field: value, regex: '^["'']h["'']$'  } }] } }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(range_x)$' } }, { has: { field: value, pattern: $R, matches: cut-range } }] } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(log_x|base)$' } } } }
    - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
---
# The same cut set on the figure afterwards: update_yaxes(range=...), update_layout with
# yaxis_range=... or with yaxis=dict(range=...). The figure must be one of upright bars, by the
# call that made it, and a file that names a log axis anywhere is left alone.
id: bar-axis-without-zero
language: python
severity: warning
message: The range $R starts the bar axis above zero, so the length of a bar no longer follows its value. With [90, 101], bars for 95 and 100 were drawn 163.6 and 327.3 pixels long, a Lie Factor of 19 by Tufte's measure. Let the axis start at 0, or show the values as points with px.scatter.
rule:
  all:
    - any:
        - kind: keyword_argument
          all:
            - has: { field: name, regex: '^range$' }
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_yaxes$' } }, { has: { field: object, matches: figure } }] } } }
        - kind: keyword_argument
          all:
            - has: { field: name, regex: '^yaxis_range$' }
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_layout$' } }, { has: { field: object, matches: figure } }] } } }
        - any: [{ kind: keyword_argument, has: { field: name, regex: '^range$' } }, { kind: pair, has: { field: key, regex: '^["'']range["'']$' } }]
          all:
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside:
                any: [{ kind: argument_list, inside: { kind: call, has: { field: function, regex: '^dict$' } } }, { kind: dictionary }]
                inside:
                  stopBy: { kind: argument_list }
                  kind: keyword_argument
                  all:
                    - has: { field: name, regex: '^yaxis$' }
                    - inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_layout$' } }, { has: { field: object, matches: figure } }] } } }
    - not: { inside: { stopBy: end, kind: module, regex: '\blog(_y)?\b' } }
utils:
  # A figure of upright bars: px.bar or px.histogram without orientation, log_y and base, or a
  # go.Figure whose own arguments hold a go.Bar without orientation and base.
  new-bar-figure:
    kind: call
    any:
      - all:
          - any:
              - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(bar)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
              - all:
                  - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(histogram)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
                  - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(x)$' } } }
                  - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(y)$' } } } }
          - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|log_y|base)$' } } } }
          - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
      - matches: go-bar-figure
  # A go.Figure whose own arguments hold a go.Bar without orientation and base.
  go-bar-figure:
    kind: call
    all:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Figure|FigureWidget)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
      - has:
          stopBy: end
          kind: call
          all:
            - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Bar)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
            - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|base)$' } } } }
            - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-bar-figure
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-bar-figure }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
metadata: { holds: { FIG: { matches: figure-expr } } }
---
# The same cut on bars added after the figure is made: fig = go.Figure(), then
# fig.add_trace(go.Bar(...)) or fig.add_bar(...), then a range set as in the third document. On
# plotly 7.1.0 bars of 95 and 100 added that way to an empty go.Figure() kept the range
# update_yaxes(range=[90, 101]) as written and were drawn 145.4 and 290.9 pixels long, the same as
# bars given to go.Figure itself, and 288.8 and 304.0 pixels long without the range
# (runs/v2/A/probe_a.txt). add_bar with update_layout(yaxis_range=[90, 101]) drew the same. The
# bar must be added to the same variable after its assignment and before the range, with no
# assignment of the name in between. A bar with orientation, base or yaxis is left alone, and so
# is a go.Figure that holds bars of its own, which the third document reads.
id: bar-axis-without-zero
language: python
severity: warning
message: The range $R starts the bar axis above zero, so the length of a bar no longer follows its value. With [90, 101], bars for 95 and 100 added to a go.Figure were drawn 145.4 and 290.9 pixels long, a Lie Factor of 19 by Tufte's measure. Let the axis start at 0, or show the values as points with go.Scatter.
rule:
  all:
    - any:
        - kind: keyword_argument
          all:
            - has: { field: name, regex: '^range$' }
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_yaxes$' } }, { has: { field: object, matches: bar-built } }] } } }
        - kind: keyword_argument
          all:
            - has: { field: name, regex: '^yaxis_range$' }
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_layout$' } }, { has: { field: object, matches: bar-built } }] } } }
        - any: [{ kind: keyword_argument, has: { field: name, regex: '^range$' } }, { kind: pair, has: { field: key, regex: '^["'']range["'']$' } }]
          all:
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside:
                any: [{ kind: argument_list, inside: { kind: call, has: { field: function, regex: '^dict$' } } }, { kind: dictionary }]
                inside:
                  stopBy: { kind: argument_list }
                  kind: keyword_argument
                  all:
                    - has: { field: name, regex: '^yaxis$' }
                    - inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_layout$' } }, { has: { field: object, matches: bar-built } }] } } }
    - not: { inside: { stopBy: end, kind: module, regex: '\blog(_y)?\b' } }
utils:
  # A go.Figure that holds no go.Bar of its own, so its bars come from add_trace or add_bar.
  new-figure-without-bars:
    kind: call
    all:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Figure|FigureWidget)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
      - not: { matches: go-bar-figure }
  # An upright bar on the first y axis.
  upright-bar:
    kind: call
    all:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Bar)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
      - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|base|yaxis)$' } } } }
      - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
  # A statement after `$FIG = go.Figure()` that adds an upright bar to $FIG, in itself or in a
  # loop or a condition around it.
  bar-added:
    all:
      - has:
          stopBy: end
          kind: call
          any:
            - all:
                - has: { field: function, kind: attribute, all: [{ has: { field: object, pattern: $FIG } }, { has: { field: attribute, regex: '^add_traces?$' } }] }
                - has: { field: arguments, has: { stopBy: end, matches: upright-bar } }
            - all:
                - has: { field: function, kind: attribute, all: [{ has: { field: object, pattern: $FIG } }, { has: { field: attribute, regex: '^add_bar$' } }] }
                - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|base|yaxis)$' } } } }
                - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
  # $FIG where the statement around it, or a block around that statement, comes after a
  # statement that added a bar, with no assignment of $FIG in between.
  bar-built:
    kind: identifier
    pattern: $FIG
    inside:
      stopBy: { kind: block, inside: { kind: function_definition } }
      all: [{ not: { matches: holds-binder } }, { follows: { stopBy: { matches: holds-binder }, matches: bar-added } }]
  # A go.Figure whose own arguments hold a go.Bar without orientation and base.
  go-bar-figure:
    kind: call
    all:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Figure|FigureWidget)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
      - has:
          stopBy: end
          kind: call
          all:
            - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Bar)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
            - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|base)$' } } } }
            - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-figure-without-bars
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-figure-without-bars }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
  fig-target:
    any:
      - pattern: $FIG
      - any: [{ kind: pattern_list }, { kind: tuple_pattern }, { kind: list_pattern }]
        has: { stopBy: end, pattern: $FIG, not: { inside: { any: [{ kind: attribute }, { kind: subscript }] } } }
  binder:
    any:
      - any: [{ kind: assignment }, { kind: augmented_assignment }, { kind: for_statement }, { kind: for_in_clause }]
        has: { field: left, matches: fig-target }
      - { kind: as_pattern_target, has: { stopBy: end, pattern: $FIG } }
      - { kind: named_expression, has: { field: name, pattern: $FIG } }
  holds-binder: { any: [{ matches: binder }, { has: { stopBy: end, matches: binder } }] }
metadata: { holds: { FIG: { matches: figure-expr } } }
---
# The same cut written in the constructor: go.Figure(data=[go.Bar(...)], layout=...) with
# yaxis=dict(range=...) in go.Layout, in dict or in a dictionary, or with layout_yaxis_range=....
# go.Figure with a go.Bar and layout=go.Layout(yaxis=dict(range=[90, 101])) resolved to the y
# range (90, 101), as update_yaxes does.
id: bar-axis-without-zero
language: python
severity: warning
message: The range $R starts the bar axis above zero, so the length of a bar no longer follows its value. With [90, 101], bars for 95 and 100 were drawn 145.4 and 290.9 pixels long, a Lie Factor of 19 by Tufte's measure. Let the axis start at 0, or show the values as points with px.scatter.
rule:
  all:
    - any:
        - kind: keyword_argument
          all:
            - has: { field: name, regex: '^layout_yaxis_range$' }
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside: { kind: argument_list, inside: { matches: go-bar-figure } }
        - any: [{ kind: keyword_argument, has: { field: name, regex: '^range$' } }, { kind: pair, has: { field: key, regex: '^["'']range["'']$' } }]
          all:
            - has: { field: value, pattern: $R, matches: cut-range }
            - inside:
                any: [{ kind: argument_list, inside: { kind: call, has: { field: function, regex: '^(dict|(\w+\.)+YAxis)$' } } }, { kind: dictionary }]
                inside:
                  stopBy: { kind: argument_list }
                  any: [{ kind: keyword_argument, has: { field: name, regex: '^yaxis$' } }, { kind: pair, has: { field: key, regex: '^["'']yaxis["'']$' } }]
            - inside:
                stopBy: end
                kind: keyword_argument
                all:
                  - has: { field: name, regex: '^layout$' }
                  - inside: { kind: argument_list, inside: { matches: go-bar-figure } }
    - not: { inside: { stopBy: end, kind: module, regex: '\blog(_y)?\b' } }
utils:
  # A figure of upright bars: px.bar or px.histogram without orientation, log_y and base, or a
  # go.Figure whose own arguments hold a go.Bar without orientation and base.
  new-bar-figure:
    kind: call
    any:
      - all:
          - any:
              - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(bar)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
              - all:
                  - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(histogram)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
                  - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(x)$' } } }
                  - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(y)$' } } } }
          - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|log_y|base)$' } } } }
          - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
      - matches: go-bar-figure
  # A go.Figure whose own arguments hold a go.Bar without orientation and base.
  go-bar-figure:
    kind: call
    all:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Figure|FigureWidget)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
      - has:
          stopBy: end
          kind: call
          all:
            - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Bar)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
            - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(orientation|base)$' } } } }
            - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-bar-figure
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-bar-figure }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
metadata: { holds: { FIG: { matches: figure-expr } } }
