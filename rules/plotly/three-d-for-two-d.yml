  # A value written as the same number for every point.
  constant: { any: [{ pattern: '[$C] * $D' }, { pattern: '$D * [$C]' }, { regex: '^(np|numpy)\.(zeros|ones|zeros_like|ones_like|full)\(' }] }
constraints:
  NP: { regex: '^(np|numpy)$' }
  N: { any: [{ kind: integer }, { kind: float }] }
