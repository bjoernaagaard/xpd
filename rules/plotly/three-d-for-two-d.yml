# Tufte, vdqi.md line 2816, printed page 71: "The number of information-carrying (variable)
# dimensions depicted should not exceed the number of dimensions in the data."
#
# A 3D scatter without z has data for two axes only. plotly 7.1.0 does not draw it at all:
# px.scatter_3d, px.line_3d and go.Scatter3d with x and y resolved to visible=False, with an empty
# scene whose z axis runs from -1 to 1 (runs/behavior.txt). The figure is empty, so the rule is an
# error. A call with a ** argument, or with z as the fourth positional argument of the px
# functions, is left alone. So is a file that sets z on an object afterwards: go.Scatter3d with x
# and y followed by trace.z = [3, 1, 2] resolved to visible=True with that z.
id: three-d-for-two-d
language: python
severity: error
message: This 3D trace has x and y but no z, and plotly draws nothing for it. The trace resolved to visible=False in an empty scene. Tufte asks that a chart show no more dimensions than the data has. Draw two variables with px.scatter or px.line.
rule:
  kind: call
  all:
    - any:
        - all:
            - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(scatter_3d|line_3d)$' } }, { has: { field: object, matches: px } }] }
            - not: { has: { field: arguments, has: { nthChild: { position: 4, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { kind: keyword_argument } } } }
        - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Scatter3d)$' } }, { has: { field: object, matches: go } }] }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(x)$' } } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(y)$' } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(z)$' } } } }
    - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
    # A file that sets z afterwards, as in trace.z = values or update_traces(z=values), draws the trace.
    - not:
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            any:
              - { kind: assignment, has: { field: left, kind: attribute, has: { field: attribute, regex: '^z$' } } }
              - { kind: assignment, has: { field: left, kind: subscript, has: { field: subscript, regex: '^["'']z["'']$' } } }
              - { kind: keyword_argument, has: { field: name, regex: '^z$' }, inside: { kind: argument_list, inside: { kind: call, has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_traces|update|restyle)$' } } } } }
utils:
  # A file that makes plotly the plotting backend of pandas and names no other backend. There
  # df.plot.bar(...) returned the same figure as px.bar(df, ...) on pandas 3.1.1 with plotly 7.1.0.
  pandas-draws-with-plotly:
    kind: module
    all:
      - has:
          stopBy: end
          any:
            - kind: assignment
              all:
                - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                - has: { field: right, kind: string, regex: '^["'']plotly["'']$' }
            - kind: call
              all:
                - has: { field: function, regex: '(^|\.)set_option$' }
                - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' }
      - not:
          has:
            stopBy: end
            any:
              - kind: assignment
                all:
                  - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                  - not: { has: { field: right, kind: string, regex: '^["'']plotly["'']$' } }
              - kind: call
                all:
                  - has: { field: function, regex: '(^|\.)set_option$' }
                  - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']' }
                  - not: { has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' } }
              - kind: keyword_argument
                all:
                  - has: { field: name, regex: '^backend$' }
                  - not: { has: { field: value, kind: string, regex: '^["'']plotly["'']$' } }
  # The name the file binds to plotly.express: the dotted module itself, the alias of its import,
  # or the plot accessor of pandas in a file that draws with plotly.
  px:
    any:
      - { kind: attribute, regex: '^plotly\.express$' }
      - kind: attribute
        all:
          - has: { field: attribute, regex: '^plot$' }
          - inside: { stopBy: end, matches: pandas-draws-with-plotly }
          # px.bar takes the frame first, and df.plot.bar does not, so an argument given by position
          # is another argument in the two. Only a call with every argument named is read.
          - not: { inside: { kind: attribute, inside: { kind: call, has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { any: [{ kind: keyword_argument }, { kind: dictionary_splat }] } } } } } }
      - kind: identifier
        pattern: $PX
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PX }
              - any:
                  - has: { field: name, regex: '^plotly\.express$' }
                  - all: [{ has: { field: name, regex: '^express$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # The name the file binds to plotly.graph_objects or plotly.graph_objs: the dotted module itself, or the alias of its import.
  go:
    any:
      - { kind: attribute, regex: '^plotly\.graph_obj(ect)?s$' }
      - kind: identifier
        pattern: $GO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $GO }
              - any:
                  - has: { field: name, regex: '^plotly\.graph_obj(ect)?s$' }
                  - all: [{ has: { field: name, regex: '^graph_obj(ect)?s$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
---
# A z that is written as one constant, such as [0] * n or np.zeros(n), puts every point on one
# plane. go.Scatter3d with z=[0, 0, 0] drew the points in a scene whose z axis ran from -1 to 1
# (runs/behavior.txt), so the third axis and the perspective carry no data. The rule reads only
# constants it can see in the call.
id: three-d-for-two-d
language: python
severity: warning
message: $A=$Z is the same for every point, so the points lie on one plane and the third axis shows no data. Tufte asks that a chart show no more dimensions than the data has. Draw the two variables with px.scatter or go.Scatter.
rule:
  kind: call
  all:
    - any:
        - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(scatter_3d|line_3d)$' } }, { has: { field: object, matches: px } }] }
        - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Scatter3d)$' } }, { has: { field: object, matches: go } }] }
    - has:
        field: arguments
        has:
          kind: keyword_argument
          all:
            - has: { field: name, regex: '^[xyz]$', pattern: $A }
            - has:
                field: value
                pattern: $Z
                any:
                  - pattern: '[$N] * $M'
                  - pattern: '$M * [$N]'
                  - pattern: $NP.zeros($$$)
                  - pattern: $NP.ones($$$)
                  - pattern: $NP.zeros_like($$$)
                  - pattern: $NP.ones_like($$$)
                  - pattern: $NP.full($$$)
utils:
  # A file that makes plotly the plotting backend of pandas and names no other backend. There
  # df.plot.bar(...) returned the same figure as px.bar(df, ...) on pandas 3.1.1 with plotly 7.1.0.
  pandas-draws-with-plotly:
    kind: module
    all:
      - has:
          stopBy: end
          any:
            - kind: assignment
              all:
                - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                - has: { field: right, kind: string, regex: '^["'']plotly["'']$' }
            - kind: call
              all:
                - has: { field: function, regex: '(^|\.)set_option$' }
                - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' }
      - not:
          has:
            stopBy: end
            any:
              - kind: assignment
                all:
                  - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                  - not: { has: { field: right, kind: string, regex: '^["'']plotly["'']$' } }
              - kind: call
                all:
                  - has: { field: function, regex: '(^|\.)set_option$' }
                  - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']' }
                  - not: { has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' } }
              - kind: keyword_argument
                all:
                  - has: { field: name, regex: '^backend$' }
                  - not: { has: { field: value, kind: string, regex: '^["'']plotly["'']$' } }
  # The name the file binds to plotly.express: the dotted module itself, the alias of its import,
  # or the plot accessor of pandas in a file that draws with plotly.
  px:
    any:
      - { kind: attribute, regex: '^plotly\.express$' }
      - kind: attribute
        all:
          - has: { field: attribute, regex: '^plot$' }
          - inside: { stopBy: end, matches: pandas-draws-with-plotly }
          # px.bar takes the frame first, and df.plot.bar does not, so an argument given by position
          # is another argument in the two. Only a call with every argument named is read.
          - not: { inside: { kind: attribute, inside: { kind: call, has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { any: [{ kind: keyword_argument }, { kind: dictionary_splat }] } } } } } }
      - kind: identifier
        pattern: $PX
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PX }
              - any:
                  - has: { field: name, regex: '^plotly\.express$' }
                  - all: [{ has: { field: name, regex: '^express$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # The name the file binds to plotly.graph_objects or plotly.graph_objs: the dotted module itself, or the alias of its import.
  go:
    any:
      - { kind: attribute, regex: '^plotly\.graph_obj(ect)?s$' }
      - kind: identifier
        pattern: $GO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $GO }
              - any:
                  - has: { field: name, regex: '^plotly\.graph_obj(ect)?s$' }
                  - all: [{ has: { field: name, regex: '^graph_obj(ect)?s$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
constraints:
  NP: { regex: '^(np|numpy)$' }
  N: { any: [{ kind: integer }, { kind: float }] }
