      - not: { has: { nthChild: { position: 21, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } } } }
      - not: { has: { nthChild: { position: 1, ofRule: { not: { any: [{ matches: number }, { kind: comment }, { kind: line_continuation }] } } } } }
  number:
