    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(values)$' } }, { has: { field: value, pattern: $V, matches: few-numbers } }] } }
    - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
    - not: { any: [{ has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(text|texttemplate|textinfo|text_auto)$' } } } }, { inside: { stopBy: end, kind: module, regex: 'textinfo|texttemplate|text_auto|textposition' } }] }
