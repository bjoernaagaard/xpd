language: python
severity: info
message: This pie shows $V, a few numbers written in the code, as angles and writes them as percentages at most. Four values drawn with go.Pie wrote their shares and none of the values, where go.Table wrote all four. Tufte writes that tables usually beat graphics for small data sets of 20 numbers or less. Show them with go.Table(cells=dict(values=[names, values])).
