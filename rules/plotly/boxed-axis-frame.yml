# Tufte, vdqi.md line 3979, printed page 103, on a redrawn chart: "with only the frame lines
# remaining as pure non-information". Line 5176, printed page 131: "the range-frame should replace
# the non-data-bearing frame in many graphical applications."
#
# showline=True with mirror=True draws the axis line a second time on the far side of the plot,
# which closes a box around it. On plotly 7.1.0 the x axis line had one segment with showline
# alone and two with mirror=True (runs/behavior.txt). mirror without showline drew no line under
# the default template, so the rule reads the two together, on a plotly figure. It has no fix,
# because a box is sometimes house style.
id: boxed-axis-frame
language: python
severity: info
message: mirror=$M repeats the axis line on the far side of the plot, which closes a box around the data. The x axis line went from one segment to two. Tufte counts frame lines as ink that shows no data. Keep showline=True for the two axis lines and drop mirror.
rule:
  any:
    - kind: keyword_argument
      all:
        - has: { field: name, regex: '^(mirror)$' }
        - has: { field: value, pattern: $M, any: [{ kind: 'true' }, { kind: string, regex: '^["''](all|ticks|allticks)["'']$' }] }
        - inside:
            kind: argument_list
            inside:
              kind: call
              any:
                - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_[xy]axes$' } }, { has: { field: object, matches: figure } }] }
                - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^[XY]Axis$' } }, { has: { field: object, kind: attribute, has: { field: object, matches: go } } }] }
        - inside: { any: [{ kind: argument_list }, { kind: dictionary }], has: { any: [{ kind: keyword_argument, all: [{ has: { field: name, regex: '(^|_)(showline)$' } }, { has: { field: value, kind: 'true' } }] }, { kind: pair, all: [{ has: { field: key, regex: '^["''](showline)["'']$' } }, { has: { field: value, kind: 'true' } }] }] } }
    - any: [{ kind: keyword_argument, has: { field: name, regex: '^(mirror)$' } }, { kind: pair, has: { field: key, regex: '^["''](mirror)["'']$' } }]
      all:
        - has: { field: value, pattern: $M, any: [{ kind: 'true' }, { kind: string, regex: '^["''](all|ticks|allticks)["'']$' }] }
        - inside:
            any: [{ kind: argument_list, inside: { kind: call, has: { field: function, regex: '^dict$' } } }, { kind: dictionary }]
            inside:
              stopBy: { kind: argument_list }
              any: [{ kind: keyword_argument, has: { field: name, regex: '^[xy]axis[0-9]*$' } }, { kind: pair, has: { field: key, regex: '^["''][xy]axis[0-9]*["'']$' } }]
              inside: { stopBy: end, matches: layout-call }
        - inside: { any: [{ kind: argument_list }, { kind: dictionary }], has: { any: [{ kind: keyword_argument, all: [{ has: { field: name, regex: '(^|_)(showline)$' } }, { has: { field: value, kind: 'true' } }] }, { kind: pair, all: [{ has: { field: key, regex: '^["''](showline)["'']$' } }, { has: { field: value, kind: 'true' } }] }] } }
utils:
  # An annotation that names the class of a plotly figure, as in `fig: go.Figure`.
  figure-type:
    kind: type
    has: { kind: attribute, all: [{ has: { field: attribute, regex: '^Figure(Widget)?$' } }, { has: { field: object, matches: go } }] }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-figure
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-figure }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
  # A call that sets layout: update_layout on a plotly figure, go.Layout or go.Figure.
  layout-call:
    kind: call
    any:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_layout$' } }, { has: { field: object, matches: figure } }] }
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Layout|Figure|FigureWidget)$' } }, { has: { field: object, matches: go } }] }
metadata: { holds: { FIG: { any: [{ matches: figure-expr }, { matches: figure-type }] } } }
