# Several pies. px.pie with facet_col="sex" drew two pie traces side by side, and four with
# facet_row as well (runs/behavior.txt). A facet given as None is left to the first document.
id: pie-chart
language: python
severity: warning
message: px.pie with $F draws one pie for each group, and Tufte calls several pies the only design worse than one pie, because shares must be compared within and between them. Draw px.bar with the same facet, where every panel shares one scale.
rule:
  kind: call
  all:
    - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(pie)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
    - has: { field: arguments, has: { kind: keyword_argument, pattern: $F, all: [{ has: { field: name, regex: '^(facet_col|facet_row)$' } }, { not: { has: { field: value, kind: none } } }] } }
---
# Several go.Pie traces in one figure: two or more in the data list of go.Figure or of add_traces,
# a pie added with add_trace next to another add_trace of a pie on the same figure, or a pie added
# in a loop to a cell whose row or col changes with the loop, as into the cells of type "domain"
# of make_subplots. On plotly 7.1.0 make_subplots(rows=1, cols=2) with two cells of type "domain"
# and a go.Pie added to each resolved to two traces of type "pie" with the domains x (0, 0.45) and
# (0.55, 1) (runs/v2/A/probe_a.txt). Each pie is reported once, by this document instead of the
# first.
id: pie-chart
language: python
severity: warning
message: This pie is one of several in the figure, and Tufte calls several pies the only design worse than one pie, because the reader compares shares within and between them. Draw the groups as bars on one shared scale, with px.bar and facet_col or color, or put the numbers in a go.Table.
rule:
  matches: several-pies
utils:
  # A call that makes a plotly figure.
  new-figure:
    kind: call
    any:
      - has: { field: function, kind: attribute, has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^Figure(Widget)?$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
      - all:
          - has: { field: function, regex: '(^|\.)make_subplots$' }
          - inside: { stopBy: end, kind: module, has: { stopBy: end, any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'plotly\.(subplots|tools)|from plotly import [^\n]*(subplots|tools)' } }
  # An annotation that names the class of a plotly figure, as in `fig: go.Figure`.
  figure-type:
    kind: type
    has: { kind: attribute, all: [{ has: { field: attribute, regex: '^Figure(Widget)?$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: new-figure
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: new-figure }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
  # A call that puts its trace in a cell that changes with the loop around it: row or col, as a
  # keyword or as the second or third argument, names a variable that the loop binds, in its
  # target or by an assignment in its body.
  loop-cell:
    kind: call
    has:
      field: arguments
      has:
        all:
          - any:
              - { kind: keyword_argument, has: { field: name, regex: '^(row|col)$' } }
              - { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }, { kind: keyword_argument }] } } } }
              - { nthChild: { position: 3, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }, { kind: keyword_argument }] } } } }
          - any: [{ matches: cell-var }, { has: { stopBy: end, matches: cell-var } }]
  cell-var:
    kind: identifier
    pattern: $V
    not: { inside: { kind: keyword_argument, field: name } }
    inside:
      stopBy: end
      kind: for_statement
      any:
        - has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] }
        - has: { field: body, has: { stopBy: end, kind: assignment, has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] } } }
  # A go.Pie call.
  pie:
    kind: call
    has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Pie)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
  # A statement that adds a pie to $FIG.
  pie-added:
    has:
      stopBy: end
      kind: call
      any:
        - all:
            - has: { field: function, kind: attribute, all: [{ has: { field: object, pattern: $FIG } }, { has: { field: attribute, regex: '^add_traces?$' } }] }
            - has: { field: arguments, has: { stopBy: end, matches: pie } }
        - has: { field: function, kind: attribute, all: [{ has: { field: object, pattern: $FIG } }, { has: { field: attribute, regex: '^add_pie$' } }] }
  # A go.Pie that shares its figure with another pie.
  several-pies:
    matches: pie
    any:
      # Two pies in one written list of traces, for go.Figure or for add_traces.
      - any: [{ precedes: { stopBy: end, matches: pie } }, { follows: { stopBy: end, matches: pie } }]
        inside:
          kind: list
          any:
            - inside: { kind: argument_list, inside: { matches: takes-traces } }
