# Tufte, vdqi.md line 7166, printed page 178: "A table is nearly always better than a dumb pie
# chart; the only worse design than a pie chart is several of them, for then the viewer is asked
# to compare quantities located in spatial disarray both within and between pies ... Given their
# low data-density and failure to order numbers along a visual dimension, pie charts should never
# be used."
#
# px.pie and go.Pie resolve to a trace of type "pie" on plotly 7.1.0, with or without hole
# (runs/behavior.txt). The rule has no fix, because a bar chart or a table is another figure.
id: pie-chart
language: python
severity: warning
message: A pie chart puts no numbers along a common scale, so the reader compares angles. Tufte writes that pie charts should never be used and that a table is nearly always better. Show the shares as a sorted px.bar, or as a go.Table when they are few.
rule:
  kind: call
  any:
    - all:
        - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(pie)$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] }
        - not: { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^(facet_col|facet_row)$' } }, { not: { has: { field: value, kind: none } } }] } } }
    - all:
        - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Pie)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
        - not: { matches: several-pies }
utils:
  # An annotation that names the class of a plotly figure, as in `fig: go.Figure`.
  figure-type:
    kind: type
    has: { kind: attribute, all: [{ has: { field: attribute, regex: '^Figure(Widget)?$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: { new-figure: { PX: { matches: { px: { ALIAS: { pattern: $PX } } } }, GO: { matches: { go: { ALIAS: { pattern: $GO } } } } } }
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: { new-figure: { PX: { matches: { px: { ALIAS: { pattern: $PX } } } }, GO: { matches: { go: { ALIAS: { pattern: $GO } } } } } } }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
  # A call that puts its trace in a cell that changes with the loop around it: row or col, as a
  # keyword or as the second or third argument, names a variable that the loop binds, in its
  # target or by an assignment in its body.
  loop-cell:
    kind: call
    has:
      field: arguments
      has:
        all:
          - any:
              - { kind: keyword_argument, has: { field: name, regex: '^(row|col)$' } }
              - { nthChild: { position: 2, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }, { kind: keyword_argument }] } } } }
              - { nthChild: { position: 3, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }, { kind: keyword_argument }] } } } }
          - any: [{ matches: cell-var }, { has: { stopBy: end, matches: cell-var } }]
  cell-var:
    kind: identifier
    pattern: $V
    not: { inside: { kind: keyword_argument, field: name } }
    inside:
      stopBy: end
      kind: for_statement
      any:
        - has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] }
        - has: { field: body, has: { stopBy: end, kind: assignment, has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] } } }
  # A go.Pie call.
  pie:
    kind: call
    has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Pie)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
  # A statement that adds a pie to $FIG.
  pie-added:
    has:
      stopBy: end
      kind: call
      any:
        - all:
            - has: { field: function, kind: attribute, all: [{ has: { field: object, pattern: $FIG } }, { has: { field: attribute, regex: '^add_traces?$' } }] }
            - has: { field: arguments, has: { stopBy: end, matches: pie } }
        - has: { field: function, kind: attribute, all: [{ has: { field: object, pattern: $FIG } }, { has: { field: attribute, regex: '^add_pie$' } }] }
  # A go.Pie that shares its figure with another pie.
  several-pies:
    matches: pie
    any:
      # Two pies in one written list of traces, for go.Figure or for add_traces.
      - any: [{ precedes: { stopBy: end, matches: pie } }, { follows: { stopBy: end, matches: pie } }]
        inside:
          kind: list
          any:
            - inside: { kind: argument_list, inside: { matches: takes-traces } }
            - inside: { kind: keyword_argument, has: { field: name, regex: '^data$' }, inside: { kind: argument_list, inside: { matches: takes-traces } } }
      # A pie added to a figure that gets another pie, with no assignment of the name in
      # between, or that is added in a loop over the cells.
      - inside:
          kind: argument_list
          inside:
            kind: call
            all:
              - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^add_trace$' } }, { has: { field: object, kind: identifier, pattern: $FIG, matches: figure } }] }
              - any:
                  - matches: loop-cell
                  - inside:
                      stopBy: end
                      kind: expression_statement
                      any:
                        - follows: { stopBy: { matches: holds-binder }, matches: pie-added }
                        - precedes: { stopBy: { matches: holds-binder }, matches: pie-added }
  takes-traces:
    kind: call
    any:
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Figure|FigureWidget)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
      - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^add_traces$' } }, { has: { field: object, matches: figure } }] }
  fig-target:
    any:
      - pattern: $FIG
      - any: [{ kind: pattern_list }, { kind: tuple_pattern }, { kind: list_pattern }]
        has: { stopBy: end, pattern: $FIG, not: { inside: { any: [{ kind: attribute }, { kind: subscript }] } } }
  binder:
    any:
      - any: [{ kind: assignment }, { kind: augmented_assignment }, { kind: for_statement }, { kind: for_in_clause }]
        has: { field: left, matches: fig-target }
      - { kind: as_pattern_target, has: { stopBy: end, pattern: $FIG } }
      - { kind: named_expression, has: { field: name, pattern: $FIG } }
  holds-binder: { any: [{ matches: binder }, { has: { stopBy: end, matches: binder } }] }
metadata: { holds: { FIG: { any: [{ matches: figure-expr }, { matches: figure-type }] } } }
