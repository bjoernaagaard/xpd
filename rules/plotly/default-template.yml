# Tufte, vdqi.md line 3829, printed page 96: "Erase non-data-ink, within reason." Line 4531,
# printed page 112: "the grid should usually be muted or completely suppressed so that its
# presence is only implicit".
#
# plotly 7.1.0 draws with the template "plotly" unless told otherwise. A scatter plot resolved to
# plot_bgcolor #E5ECF6 with white grid lines on both axes, 10 lines in the drawn figure, no axis
# lines and no ticks. With template="simple_white" the same plot resolved to a white plot area,
# showgrid=False, 0 grid lines, axis lines and outside ticks (runs/behavior.txt).
#
# The template is a choice for the whole file, so the rule reports once, on the first import of
# plotly.express, in a file that calls a px function and never names a template or a plot_bgcolor.
# hovertemplate and texttemplate are other attributes and do not count as a template. The px
# function must be one that draws a plot area: px.pie, treemap, sunburst, icicle, funnel_area and
# the two parallel plots drew no tint and no grid line with either template. A file that names
# streamlit is left alone, because st.plotly_chart draws with the theme of Streamlit unless it is
# told not to. A module that the file imports can set the default for it, so the rule is also
# silent when one of them assigns pio.templates.default or px.defaults.template: the __init__.py
# of a package the file is in, a module of the project that the file imports, or a module that one
# of those imports. A module that imports this file is not read. The rule has no fix, because the
# template changes how every figure looks.
id: default-template
language: python
severity: info
message: 'This file sets no template, and plotly then draws with its default "plotly", which fills the plot area with #E5ECF6 and drew 10 white grid lines on a scatter plot. That ink shows no data, and Tufte asks to erase non-data-ink. Set pio.templates.default = "simple_white" once, which drew a white plot area with axis lines and no grid, or pass template="simple_white" to each figure.'
rule:
  any: [{ kind: import_statement }, { kind: import_from_statement }]
  all:
    - any:
        - has: { stopBy: end, kind: dotted_name, regex: '^plotly\.express$' }
        - all: [{ has: { field: module_name, regex: '^plotly$' } }, { has: { stopBy: end, kind: dotted_name, regex: '^express$' } }]
    - not: { follows: { stopBy: end, any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'plotly\.express|from plotly import [^\n]*express' } }
    - inside:
        kind: module
        all:
          - not: { regex: '(^|[^-a-zA-Z])template|plot_bgcolor|streamlit' }
          # A figure with no plot area, such as a treemap or a pie, shows neither the tint nor the grid.
          - has: { stopBy: end, kind: call, has: { field: function, kind: attribute, all: [{ has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }, { has: { field: attribute, regex: '^[a-z]', not: { regex: '^(pie|treemap|sunburst|icicle|funnel_area|parallel_coordinates|parallel_categories|get_trendline_results|set_mapbox_access_token)$' } } }] } }
utils:
  # The name the file binds to plotly.io: the dotted module itself, or the alias of its import.
  pio:
    any:
      - { kind: attribute, regex: '^plotly\.io$' }
      - kind: identifier
        pattern: $PIO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PIO }
              - any:
                  - has: { field: name, regex: '^plotly\.io$' }
                  - all: [{ has: { field: name, regex: '^io$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # A statement that sets the template of the figures that the process draws from then on.
  sets-template:
    kind: assignment
    has:
      field: left
      kind: attribute
      any:
        - all: [{ has: { field: attribute, regex: '^default$' } }, { has: { field: object, kind: attribute, all: [{ has: { field: attribute, regex: '^templates$' } }, { has: { field: object, matches: pio } }] } }]
        - all: [{ has: { field: attribute, regex: '^template$' } }, { has: { field: object, kind: attribute, all: [{ has: { field: attribute, regex: '^defaults$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] } }]
metadata: { unlessImported: { matches: sets-template } }
---
# The same report for a file that builds its figures with go.Figure and does not import
# plotly.express. It is reported on the import of plotly.graph_objects. A module that the file
# imports silences it by assigning pio.templates.default. px.defaults.template does not, because a
# go.Figure still resolved to #E5ECF6 with it.
id: default-template
language: python
severity: info
message: 'This file sets no template, and plotly then draws with its default "plotly", which fills the plot area with #E5ECF6 and drew 10 white grid lines on a scatter plot. That ink shows no data, and Tufte asks to erase non-data-ink. Set pio.templates.default = "simple_white" once, which drew a white plot area with axis lines and no grid, or pass layout_template="simple_white" to each go.Figure.'
rule:
  any: [{ kind: import_statement }, { kind: import_from_statement }]
  all:
    - any:
        - has: { stopBy: end, kind: dotted_name, regex: '^plotly\.graph_obj(ect)?s$' }
        - all: [{ has: { field: module_name, regex: '^plotly$' } }, { has: { stopBy: end, kind: dotted_name, regex: '^graph_obj(ect)?s$' } }]
    - not: { follows: { stopBy: end, any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'plotly\.graph_obj(ect)?s|from plotly import [^\n]*graph_obj(ect)?s' } }
    - inside:
        kind: module
        all:
          - not: { regex: '(^|[^-a-zA-Z])template|plot_bgcolor|streamlit' }
          - not: { has: { stopBy: end, any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'plotly\.express|from plotly import [^\n]*express' } }
          - has: { stopBy: end, kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Figure|FigureWidget)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] } }
          # A file whose only go traces have no plot area, such as a treemap or a pie, is left alone.
          - not:
              all:
                - has: { stopBy: end, kind: attribute, all: [{ has: { field: attribute, regex: '^(Pie|Treemap|Sunburst|Icicle|Funnelarea|Parcoords|Parcats|Sankey|Table|Indicator)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
                - not: { has: { stopBy: end, kind: attribute, all: [{ has: { field: attribute, regex: '^[A-Z]', not: { regex: '^(Pie|Treemap|Sunburst|Icicle|Funnelarea|Parcoords|Parcats|Sankey|Table|Indicator|Figure|FigureWidget|Layout|Frame)$' } } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] } }
                - not: { has: { stopBy: end, kind: attribute, has: { field: attribute, regex: '^add_', not: { regex: '^add_(annotation|shape|layout_image|trace|traces|vline|hline|vrect|hrect)$' } } } }
utils:
  # The name the file binds to plotly.io: the dotted module itself, or the alias of its import.
  pio:
    any:
      - { kind: attribute, regex: '^plotly\.io$' }
      - kind: identifier
        pattern: $PIO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PIO }
              - any:
                  - has: { field: name, regex: '^plotly\.io$' }
                  - all: [{ has: { field: name, regex: '^io$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # A statement that sets the template of the figures that the process draws from then on.
  sets-template:
    kind: assignment
    has:
      field: left
      kind: attribute
      any:
        - all: [{ has: { field: attribute, regex: '^default$' } }, { has: { field: object, kind: attribute, all: [{ has: { field: attribute, regex: '^templates$' } }, { has: { field: object, matches: pio } }] } }]
metadata: { unlessImported: { matches: sets-template } }
---
# The same report for a file that draws through pandas and imports no plotly module. It is
# reported on the statement that makes plotly the plotting backend, in a file that calls a plot
# method of the accessor, as in df.plot.bar(...). On pandas 3.1.1 with plotly 7.1.0,
# df.plot.bar(x="team", y="score") was equal to px.bar(df, x="team", y="score") as JSON, so it
# carries the same default template, and with template="simple_white" it resolved to the template
# that px.bar resolved to (research/modern-pandas/probes/backend.txt).
id: default-template
language: python
severity: info
message: 'pandas draws with plotly in this file and sets no template, and plotly then draws with its default "plotly", which fills the plot area with #E5ECF6 and drew 10 white grid lines on a scatter plot. That ink shows no data, and Tufte asks to erase non-data-ink. Pass template="simple_white" to each call, as in df.plot.bar(x="team", y="score", template="simple_white"), or set plotly.io.templates.default = "simple_white" once.'
rule:
  any: [{ kind: assignment }, { kind: call }]
  all:
    - any:
        - all:
            - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
            - has: { field: right, kind: string, regex: '^["'']plotly["'']$' }
        - all:
            - has: { field: function, regex: '(^|\.)set_option$' }
            - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' }
    - inside:
        stopBy: end
        kind: module
        all:
          - matches: pandas-draws-with-plotly
          - not: { regex: '(^|[^-a-zA-Z])template|plot_bgcolor|streamlit' }
          - not: { has: { stopBy: end, any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'plotly' } }
          - has: { stopBy: end, kind: call, has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(line|bar|barh|area|scatter|box|hist)$' } }, { has: { field: object, kind: attribute, has: { field: attribute, regex: '^plot$' } } }] } }
utils:
  # The name the file binds to plotly.io: the dotted module itself, or the alias of its import.
  pio:
    any:
      - { kind: attribute, regex: '^plotly\.io$' }
      - kind: identifier
        pattern: $PIO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PIO }
              - any:
                  - has: { field: name, regex: '^plotly\.io$' }
                  - all: [{ has: { field: name, regex: '^io$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # A statement that sets the template of the figures that the process draws from then on.
  sets-template:
    kind: assignment
    has:
      field: left
      kind: attribute
      any:
        - all: [{ has: { field: attribute, regex: '^default$' } }, { has: { field: object, kind: attribute, all: [{ has: { field: attribute, regex: '^templates$' } }, { has: { field: object, matches: pio } }] } }]
        - all: [{ has: { field: attribute, regex: '^template$' } }, { has: { field: object, kind: attribute, all: [{ has: { field: attribute, regex: '^defaults$' } }, { has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }] } }]
metadata: { unlessImported: { matches: sets-template } }
---
# Three named templates draw the same tinted panel. On plotly 7.1.0 "plotly" resolved to the
# plot_bgcolor #E5ECF6, "ggplot2" to rgb(237,237,237) and "seaborn" to rgb(234,234,242), each with
# white grid lines, 10 of them on a scatter plot (runs/behavior.txt). The other eight templates
# resolved to a white or a dark plot area and are left alone. The rule reads the template only as
# a string, in a px call, in go.Layout, in update_layout on a plotly figure and in
# pio.templates.default.
#
# The fix is unsafe: "simple_white" also changes the colors of the marks and adds axis lines.
id: default-template
language: python
severity: info
message: The template $T fills the plot area with a tint and drew 10 white grid lines on a scatter plot. That ink shows no data, and Tufte asks to erase non-data-ink. template="simple_white" drew the same plot on a white plot area with axis lines and no grid.
rule:
  kind: string
  pattern: $T
  regex: '^["''](plotly|ggplot2|seaborn)["'']$'
  any:
    - inside:
        kind: keyword_argument
        all:
          - has: { field: name, regex: '^(layout_)?template$' }
          - inside:
              kind: argument_list
              inside:
                kind: call
                any:
                  - has: { field: function, kind: attribute, has: { field: object, matches: { px: { ALIAS: { pattern: $PX } } } } }
                  - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(Layout|Figure|FigureWidget)$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
                  - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^update_layout$' } }, { has: { field: object, matches: figure } }] }
    - inside:
        kind: assignment
        field: right
        has: { field: left, kind: attribute, all: [{ has: { field: attribute, regex: '^default$' } }, { has: { field: object, kind: attribute, all: [{ has: { field: attribute, regex: '^templates$' } }, { has: { field: object, matches: pio } }] } }] }
utils:
  # The name the file binds to plotly.io: the dotted module itself, or the alias of its import.
  pio:
    any:
      - { kind: attribute, regex: '^plotly\.io$' }
      - kind: identifier
        pattern: $PIO
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PIO }
              - any:
                  - has: { field: name, regex: '^plotly\.io$' }
                  - all: [{ has: { field: name, regex: '^io$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
  # An annotation that names the class of a plotly figure, as in `fig: go.Figure`.
  figure-type:
    kind: type
    has: { kind: attribute, all: [{ has: { field: attribute, regex: '^Figure(Widget)?$' } }, { has: { field: object, matches: { go: { ALIAS: { pattern: $GO } } } } }] }
  # The figure, with any of its own methods called on it, as in px.bar(...).update_traces(...).
  figure-expr:
    any:
      - matches: { new-figure: { PX: { matches: { px: { ALIAS: { pattern: $PX } } } }, GO: { matches: { go: { ALIAS: { pattern: $GO } } } } } }
      - kind: call
        all:
          - has: { field: function, kind: attribute, has: { field: attribute, regex: '^(update_|add_|for_each_)' } }
          - has: { stopBy: { not: { any: [{ kind: call }, { kind: attribute }] } }, matches: { new-figure: { PX: { matches: { px: { ALIAS: { pattern: $PX } } } }, GO: { matches: { go: { ALIAS: { pattern: $GO } } } } } } }
  # What a method is called on: the figure itself, or a variable. xpd keeps a match on a
  # variable only when `holds` in the metadata of this document proves what it holds: the
  # nearest earlier statement that binds $FIG is `$FIG = <figure>`, however far back, or $FIG is
  # a parameter and every call of its function in the file passes a figure. Any other binding
  # of the name on the way, such as a loop variable, a `with ... as` or an import, ends the
  # proof, so the rule is silent there.
  figure:
    any:
      - matches: figure-expr
      - { kind: identifier, pattern: $FIG }
fix: '"simple_white"'
metadata: { fix: unsafe, holds: { FIG: { any: [{ matches: figure-expr }, { matches: figure-type }] } } }
