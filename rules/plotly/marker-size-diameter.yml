---
# px.scatter(size=...) sets sizemode="area", which is why the px functions are left alone above. A
# file that then writes sizemode="diameter" on the traces turns that back: after
# update_traces(marker_sizemode="diameter") the px bubble chart resolved to sizemode "diameter"
# (runs/behavior.txt), so the size column is drawn as the diameter. The file must call a px
# function with size=.
id: marker-size-diameter
language: python
severity: error
message: sizemode="diameter" makes plotly read the size column of this px figure as the diameter of each marker, where px set the area, so the area grows with the square of the value. Markers of size 10 and 20 were drawn with areas of 78.5 and 314.2 square pixels, which is a Lie Factor of 3 in Tufte's terms. Drop the sizemode to keep the area that px set.
rule:
  any:
    - { kind: keyword_argument, has: { field: name, regex: '^(marker_sizemode|sizemode)$' } }
    - { kind: pair, has: { field: key, regex: '^["'']sizemode["'']$' } }
  all:
    - has: { field: value, kind: string, regex: '^[rbuRBU]*["'']diameter["'']$' }
    - inside: { stopBy: end, kind: call, has: { field: function, kind: attribute, has: { field: attribute, regex: '^update_traces$' } } }
    - inside:
        stopBy: end
        kind: module
        has:
          stopBy: end
          kind: call
          all:
            - has: { field: function, kind: attribute, all: [{ has: { field: attribute, regex: '^(scatter|scatter_3d|scatter_geo|scatter_map|scatter_mapbox|scatter_matrix|scatter_polar|scatter_ternary)$' } }, { has: { field: object, matches: px } }] }
            - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^size$' } } }
utils:
  # A file that makes plotly the plotting backend of pandas and names no other backend. There
  # df.plot.bar(...) returned the same figure as px.bar(df, ...) on pandas 3.1.1 with plotly 7.1.0.
  pandas-draws-with-plotly:
    kind: module
    all:
      - has:
          stopBy: end
          any:
            - kind: assignment
              all:
                - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                - has: { field: right, kind: string, regex: '^["'']plotly["'']$' }
            - kind: call
              all:
                - has: { field: function, regex: '(^|\.)set_option$' }
                - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' }
      - not:
          has:
            stopBy: end
            any:
              - kind: assignment
                all:
                  - has: { field: left, kind: attribute, regex: '(^|\.)options\.plotting\.backend$' }
                  - not: { has: { field: right, kind: string, regex: '^["'']plotly["'']$' } }
              - kind: call
                all:
                  - has: { field: function, regex: '(^|\.)set_option$' }
                  - has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']' }
                  - not: { has: { field: arguments, regex: '^\(\s*["'']plotting\.backend["'']\s*,\s*["'']plotly["'']\s*\)$' } }
              - kind: keyword_argument
                all:
                  - has: { field: name, regex: '^backend$' }
                  - not: { has: { field: value, kind: string, regex: '^["'']plotly["'']$' } }
  # The name the file binds to plotly.express: the dotted module itself, the alias of its import,
  # or the plot accessor of pandas in a file that draws with plotly.
  px:
    any:
      - { kind: attribute, regex: '^plotly\.express$' }
      - kind: attribute
        all:
          - has: { field: attribute, regex: '^plot$' }
          - inside: { stopBy: end, matches: pandas-draws-with-plotly }
          # px.bar takes the frame first, and df.plot.bar does not, so an argument given by position
          # is another argument in the two. Only a call with every argument named is read.
          - not: { inside: { kind: attribute, inside: { kind: call, has: { field: arguments, has: { nthChild: { position: 1, ofRule: { not: { any: [{ kind: comment }, { kind: line_continuation }] } } }, not: { any: [{ kind: keyword_argument }, { kind: dictionary_splat }] } } } } } }
      - kind: identifier
        pattern: $PX
        inside:
          stopBy: end
          kind: module
          has:
            stopBy: end
            kind: aliased_import
            all:
              - has: { field: alias, pattern: $PX }
              - any:
                  - has: { field: name, regex: '^plotly\.express$' }
                  - all: [{ has: { field: name, regex: '^express$' } }, { inside: { kind: import_from_statement, has: { field: module_name, regex: '^plotly$' } } }]
