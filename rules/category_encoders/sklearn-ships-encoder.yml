# scikit-learn has its own OneHotEncoder, OrdinalEncoder and, since 1.3, TargetEncoder. On 4 text
# columns of 50 levels each, as the median of 7 runs on one thread at 10,000 and 100,000 rows,
# fit_transform ran 4.51 and 2.68 times faster with the scikit-learn OneHotEncoder, 1.94 and
# 1.67 times faster with its OrdinalEncoder, and 2.83 and 2.14 times faster with its
# TargetEncoder. The two libraries differ in what they return, so the rule is info and has no
# fix. It reports a call only when every keyword is one of cols, verbose, return_df and
# use_cat_names, because any other keyword asks for something the scikit-learn class does in
# another way or not at all, such as mapping, hierarchy, handle_missing or smoothing. An encoder
# handed to PolynomialWrapper or NestedCVWrapper is left alone, because the wrappers take only
# the encoders of this library. An encoder without cols inside a ColumnTransformer is left to
# cols-left-to-dtype, which names the scikit-learn class as well.
#
# All three names exist in scikit-learn too, so each document needs proof that the class comes
# from category_encoders: the module in front of it, an alias of the module, or an import of
# the name from category_encoders in the same file. That import test reads the whole file, so
# the class name is tested first in all, which keeps its order.
id: sklearn-ships-encoder
language: python
severity: info
message: scikit-learn ships a OneHotEncoder that ran fit_transform 2.7 to 4.5 times faster on 10,000 and 100,000 rows. Use sklearn.preprocessing.OneHotEncoder(handle_unknown="ignore", sparse_output=False) in a ColumnTransformer, unless you need what only this class does.
rule:
  kind: call
  all:
    - has: { field: function, regex: '(^|\.)OneHotEncoder$' }
    - not: { has: { field: arguments, has: { kind: keyword_argument, not: { has: { field: name, regex: '^(cols|verbose|return_df|use_cat_names)$' } } } } }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: list_splat }] } } }
    - not: { inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '(^|\.)(PolynomialWrapper|NestedCVWrapper)$' } } } }
    - not: { all: [{ inside: { kind: tuple, inside: { stopBy: end, kind: call, has: { field: function, regex: '(^|\.)(ColumnTransformer|make_column_transformer)$' } } } }, { not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^cols$' } } } } }] }
    - matches: from-category-encoders
utils:
  from-category-encoders:
    any:
      - has: { field: function, kind: attribute, regex: '^category_encoders\.' }
      - all:
          - has: { field: function, kind: attribute, has: { field: object, pattern: $MOD } }
          - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: aliased_import, all: [{ has: { field: name, regex: '^category_encoders(\.|$)' } }, { has: { field: alias, pattern: $MOD } }] } }
      - all:
          - has: { field: function, kind: identifier, pattern: $CLS }
          - inside:
              kind: module
              stopBy: end
              has:
                stopBy: end
                kind: import_from_statement
                all:
                  - has: { field: module_name, regex: '^category_encoders(\.|$)' }
                  - any: [{ has: { kind: dotted_name, pattern: $CLS } }, { has: { kind: wildcard_import } }]
          # A second import of the same name from another library leaves open which class a call builds.
          - not: { inside: { kind: module, stopBy: end, has: { stopBy: end, kind: import_from_statement, all: [{ not: { has: { field: module_name, regex: '^category_encoders(\.|$)' } } }, { has: { kind: dotted_name, pattern: $CLS } }] } } }
