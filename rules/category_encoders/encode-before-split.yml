id: encode-before-split
language: python
severity: error
message: The category_encoders TargetEncoder learned from the target on every row before cross-validation, so each fold was scored on rows whose labels are in their codes. It scored 0.650 AUC on data with no signal. Put the encoder and the model in one Pipeline and cross-validate the Pipeline.
rule:
  pattern: $V = TargetEncoder($$$A).fit_transform($X, $Y)
  all:
    - inside:
        kind: expression_statement
        precedes:
          stopBy: end
          has:
            stopBy: end
            kind: call
            all:
              - has: { field: function, regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
              - has: { field: arguments, has: { nthChild: 2, pattern: $V } }
    - matches: imported-from-category-encoders
constraints:
  V: { kind: identifier, not: { regex: '^(y|Y|target|targets|label|labels)(_|$)' } }
  Y: { not: { kind: keyword_argument } }
utils:
  imported-from-category-encoders:
    inside:
      kind: module
      stopBy: end
      has:
        stopBy: end
        kind: import_from_statement
        all:
          - has: { field: module_name, regex: '^category_encoders(\.|$)' }
          - any: [{ has: { kind: dotted_name, regex: '^TargetEncoder$' } }, { has: { kind: wildcard_import } }]
      # A second import of TargetEncoder from another library leaves open which class a call builds.
      not: { has: { stopBy: end, kind: import_from_statement, all: [{ not: { has: { field: module_name, regex: '^category_encoders(\.|$)' } } }, { has: { kind: dotted_name, regex: '^TargetEncoder$' } }] } }
---
id: encode-before-split
language: python
severity: error
message: The category_encoders TargetEncoder learned from the target on every row before cross-validation, so each fold was scored on rows whose labels are in their codes. It scored 0.650 AUC on data with no signal. Put the encoder and the model in one Pipeline and cross-validate the Pipeline.
rule:
  any:
    - pattern: $CV($M, TargetEncoder($$$A).fit_transform($X, $Y), $$$C)
    - pattern: $CV($M, TargetEncoder($$$A).fit_transform($X, $Y))
  matches: imported-from-category-encoders
constraints:
  CV: { regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
  Y: { not: { kind: keyword_argument } }
utils:
  imported-from-category-encoders:
    inside:
      kind: module
      stopBy: end
      has:
        stopBy: end
        kind: import_from_statement
        all:
          - has: { field: module_name, regex: '^category_encoders(\.|$)' }
          - any: [{ has: { kind: dotted_name, regex: '^TargetEncoder$' } }, { has: { kind: wildcard_import } }]
      # A second import of TargetEncoder from another library leaves open which class a call builds.
      not: { has: { stopBy: end, kind: import_from_statement, all: [{ not: { has: { field: module_name, regex: '^category_encoders(\.|$)' } } }, { has: { kind: dotted_name, regex: '^TargetEncoder$' } }] } }
