---
# utils.get_obj_cols was replaced by get_categorical_cols in 2.6.3. The wheels of 2.6.0, 2.6.1
# and 2.6.2 still define it, and the call ran there.
# Unsafe: get_obj_cols named the object columns, and get_categorical_cols also names columns
# of the category and string dtypes.
id: removed-in-category-encoders
language: python
severity: error
message: get_obj_cols was removed from category_encoders.utils in 2.6.3 and raises AttributeError. Call get_categorical_cols, which also names category and string columns.
rule:
  kind: identifier
  regex: '^get_obj_cols$'
  not:
    any:
      - inside: { kind: function_definition, field: name }
      - inside: { kind: with_statement, stopBy: end, regex: '^with [^\n]*(assertRaises|pytest\.raises)' }
      - inside: { kind: try_statement, stopBy: end, has: { kind: except_clause } }
      - inside: { kind: module, stopBy: end, has: { stopBy: end, kind: function_definition, has: { field: name, regex: '^get_obj_cols$' } } }
fix: get_categorical_cols
metadata: { fix: unsafe, since: "2.6.3" }
---
# The mixin of the supervised encoders was renamed in 2.5 and the old name was dropped in 2.8.0.
id: removed-in-category-encoders
language: python
severity: error
message: TransformerWithTargetMixin was removed from category_encoders.utils in 2.8 and raises AttributeError or ImportError. Use SupervisedTransformerMixin.
rule:
  kind: identifier
  regex: '^TransformerWithTargetMixin$'
  not: { any: [{ inside: { kind: class_definition, field: name } }, { inside: { kind: with_statement, stopBy: end, regex: '^with [^\n]*(assertRaises|pytest\.raises)' } }, { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause } } }] }
fix: SupervisedTransformerMixin
metadata: { fix: unsafe, since: "2.8" }
---
# Until 2.6 the four contrast encoders added a column named intercept that holds 1 on every
# row, and code dropped it by name. 2.7 stopped adding it, so the drop raises "KeyError:
# ['intercept'] not found in axis". The rule needs a contrast encoder named in the same file.
# A frame that the file gives a column of that name itself, with frame["intercept"] = ... or
# frame.insert, holds its own column, and a drop on that frame is left alone. assign returns a
# new frame under a name the rule cannot follow, so a file with assign(intercept=...) is left
# alone as a whole.
# No fix, because the drop may name other columns, and taking out the call changes the statement
# around it.
id: removed-in-category-encoders
language: python
severity: error
message: The contrast encoders stopped adding the intercept column in category_encoders 2.7, so this drop raises KeyError. Remove the drop.
rule:
  # The patterns come first in `all`, so that $DF is bound before the file is searched for it.
  all:
    - any:
        - pattern: $DF.drop($$$A)
        - pattern: del $DF["intercept"]
        - pattern: $DF.pop("intercept")
    - any:
        - regex: '^del |\.pop\('
        - has: { field: arguments, has: { stopBy: end, kind: string, regex: '^["'']intercept["'']$' } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, regex: '^errors\s*=\s*["'']ignore["'']$' } } }
    - not: { any: [{ inside: { kind: with_statement, stopBy: end, regex: '^with [^\n]*(assertRaises|pytest\.raises)' } }, { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause } } }] }
    - inside: { kind: module, stopBy: end, regex: '(BackwardDifference|Helmert|Polynomial|Sum)Encoder' }
    - not:
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            any:
              - { kind: assignment, has: { field: left, kind: subscript, all: [{ has: { field: value, pattern: $DF } }, { has: { field: subscript, regex: '^["'']intercept["'']$' } }] } }
              - { kind: call, all: [{ has: { field: function, kind: attribute, all: [{ has: { field: object, pattern: $DF } }, { has: { field: attribute, regex: '^insert$' } }] } }, { has: { field: arguments, has: { kind: string, regex: '^["'']intercept["'']$' } } }] }
              - { kind: call, all: [{ has: { field: function, regex: '\.assign$' } }, { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^intercept$' } } } }] }
metadata: { since: "2.7" }
---
# feature_names_out_ was a list until 2.6 and is a NumPy array since 2.7, which has no list
# methods: "AttributeError: 'numpy.ndarray' object has no attribute 'index'".
# feature_names_in_ is still a list. No scikit-learn estimator has feature_names_out_.
# Safe: on category_encoders 2.6.4 feature_names_out_ is a list, and index and count gave the
# same values on it and on list() of it.
id: removed-in-category-encoders
language: python
severity: error
message: feature_names_out_ is a NumPy array since category_encoders 2.7 and has no $M method, so this raises AttributeError. Call list($E.feature_names_out_) first.
rule:
  pattern: $E.feature_names_out_.$M($$$A)
  not: { any: [{ inside: { kind: with_statement, stopBy: end, regex: '^with [^\n]*(assertRaises|pytest\.raises)' } }, { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause } } }] }
constraints:
  M: { regex: '^(index|count)$' }
fix: list($E.feature_names_out_).$M($$$A)
metadata: { fix: safe, since: "2.7" }

