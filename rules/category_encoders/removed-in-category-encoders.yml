# Each document finds a form that category_encoders 2.11.2 raises on because a release removed
# it. The release was found by reading the constructor of every class in the wheels of 1.3.0,
# 2.2.2, 2.5.1, 2.6.4, 2.7.0, 2.8.0, 2.8.1, 2.9.0, 2.10.0 and 2.11.2, and the exception was
# raised on 2.11.2. The two documents whose change came inside the 2.6 series were dated from
# utils.py in the wheels of 2.6.0, 2.6.1, 2.6.2, 2.6.3 and 2.6.4. Code inside assertRaises, pytest.raises or a try block with an except clause
# expects the error or handles both releases, and stays silent.

# impute_missing was a keyword of every encoder until 2.0, which replaced it with
# handle_missing. On 2.11.2: "TypeError: OneHotEncoder.__init__() got an unexpected keyword
# argument 'impute_missing'". No other library has the keyword.
# Unsafe: the call raised before the fix, which writes handle_missing="value" for
# impute_missing=True in a call that has no handle_missing.
id: removed-in-category-encoders
language: python
severity: error
message: impute_missing was removed in category_encoders 2.0, and $C raises TypeError on it. Use handle_missing="value", the default, in place of impute_missing=True, or handle_missing="return_nan" to keep the missing value.
rule:
  kind: call
  pattern: $C($$$ARGS)
  all:
    - has: { field: function, regex: 'Encoder$' }
    - not: { any: [{ inside: { kind: with_statement, stopBy: end, regex: '^with [^\n]*(assertRaises|pytest\.raises)' } }, { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause } } }] }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^impute_missing$' } } }
    - { has: { field: arguments, has: { kind: keyword_argument, regex: '^impute_missing\s*=\s*True$' } } }
    - not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^handle_missing$' } } } }
metadata: { fix: unsafe, since: "2.0" }
rewriters:
  - id: value
    rule: { kind: keyword_argument, regex: '^impute_missing\s*=\s*True$' }
    fix: 'handle_missing="value", '
  - id: keep
    rule: { pattern: $ARG, not: { any: [{ kind: comment }, { kind: line_continuation }] } }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [value, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)

---
# Any other value, or a call that also has handle_missing, has no fix, because the code does not
# show which handle_missing is meant.
id: removed-in-category-encoders
language: python
severity: error
message: impute_missing was removed in category_encoders 2.0, and $C raises TypeError on it. Use handle_missing="value", the default, in place of impute_missing=True, or handle_missing="return_nan" to keep the missing value.
rule:
  kind: call
  pattern: $C($$$ARGS)
  all:
    - has: { field: function, regex: 'Encoder$' }
    - not: { any: [{ inside: { kind: with_statement, stopBy: end, regex: '^with [^\n]*(assertRaises|pytest\.raises)' } }, { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause } } }] }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^impute_missing$' } } }
    - not: { all: [{ has: { field: arguments, has: { kind: keyword_argument, regex: '^impute_missing\s*=\s*True$' } } }, { not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^handle_missing$' } } } } }] }
metadata: { since: "2.0" }
---
# LeaveOneOutEncoder(randomized=True, sigma=0.05) was the 1.x way to add noise. Since 2.0 sigma
# alone turns the noise on. The other encoders with noise still take randomized.
# Unsafe: the call raised before the fix, which drops randomized when the call has sigma or says
# randomized=False.
id: removed-in-category-encoders
language: python
severity: error
message: LeaveOneOutEncoder(randomized=) was removed in category_encoders 2.0 and raises TypeError. Pass sigma alone, such as sigma=0.05, to add the noise.
rule:
  kind: call
  pattern: $C($$$ARGS)
  all:
    - has: { field: function, regex: '(^|\.)LeaveOneOutEncoder$' }
    - not: { any: [{ inside: { kind: with_statement, stopBy: end, regex: '^with [^\n]*(assertRaises|pytest\.raises)' } }, { inside: { kind: try_statement, stopBy: end, has: { kind: except_clause } } }] }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^randomized$' } } }
    - { has: { field: arguments, any: [{ has: { kind: keyword_argument, has: { field: name, regex: '^sigma$' } } }, { has: { kind: keyword_argument, regex: '^randomized\s*=\s*False$' } }] } }
metadata: { fix: unsafe, since: "2.0" }
rewriters:
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^randomized$ } }
    fix: ""
  - id: keep
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: line_continuation
          - kind: keyword_argument
            has: { field: name, regex: ^randomized$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)

