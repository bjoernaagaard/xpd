# The 0.x metrics took the two bounds as two arrays. On the same bounds, the fixed call on 1.6.0
# gave the value that the old call gave on MAPIE 0.9.2.
id: removed-in-mapie
language: python
severity: error
message: regression_coverage_score takes the intervals as one array since MAPIE 1.0, as predict_interval returns them, and the two bounds as two arguments raise TypeError. Pass the intervals, and read the value of one level with [0].
rule:
  pattern: $F($Y, $LOW, $UP)
  not: { matches: expected-to-raise }
constraints:
  Y: { not: { kind: keyword_argument } }
  LOW: { not: { kind: keyword_argument } }
  UP: { not: { kind: keyword_argument } }
  F: { regex: '(^|\.)regression_coverage_score$' }
fix: $F($Y, np.column_stack([$LOW, $UP]))[0]
metadata: { fix: unsafe, since: "1.0" }
---
id: removed-in-mapie
language: python
severity: error
message: regression_mean_width_score takes the intervals as one array of shape (rows, 2, levels) since MAPIE 1.0, as predict_interval returns them, and the two bounds as two arguments raise TypeError. Pass the intervals, and read the value of one level with [0].
rule:
  pattern: $F($LOW, $UP)
  not: { matches: expected-to-raise }
constraints:
  LOW: { not: { kind: keyword_argument } }
  UP: { not: { kind: keyword_argument } }
  F: { regex: '(^|\.)regression_mean_width_score$' }
fix: $F(np.column_stack([$LOW, $UP])[:, :, np.newaxis])[0]
metadata: { fix: unsafe, since: "1.0" }
---
# alpha became confidence_level in these two metrics. The fix writes 1 - alpha, which is right
# for a number and for a name that holds one. Any other value, such as a list of levels or a
# conditional expression, is reported by the next document, without a fix: 1 - [0.05, 0.2]
# raises TypeError.
id: removed-in-mapie
language: python
severity: error
message: $F takes confidence_level since MAPIE 1.0, and alpha raises TypeError. Pass confidence_level=1 - $A.
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: '^alpha$' }
    - has: { field: value, pattern: $A, any: [{ kind: float }, { kind: integer }, { kind: identifier }, { kind: attribute }] }
    - inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, pattern: $F, regex: '(^|\.)(regression_mwi_score|coverage_width_based)$' } }
  not: { matches: expected-to-raise }
fix: confidence_level=1 - $A
metadata: { fix: unsafe, since: "1.0" }
---
