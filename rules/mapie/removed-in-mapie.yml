# The same import with names from more than one module, or with a name that is gone, such as
# regression_coverage_score_v2. The four modules of the package itself still import.
id: removed-in-mapie
language: python
severity: error
message: mapie.metrics is a package since MAPIE 1.0, and this import raises ImportError. Import each function from mapie.metrics.regression, mapie.metrics.classification or mapie.metrics.calibration. The _v2 functions are gone, and regression_coverage_score and classification_coverage_score now do what they did.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+mapie\.metrics\s+import\b'
      not:
        any:
          - regex: '^from\s+mapie\.metrics\s+import\s+\(?[\s,]*((coverage_width_based|hsic|regression_coverage_score|regression_mean_width_score|regression_mwi_score|regression_ssc|regression_ssc_score)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
