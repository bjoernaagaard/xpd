# The cross classes and the jackknife class fit and conformalize in one call, so they have no
# fit: "AttributeError: 'CrossConformalRegressor' object has no attribute 'fit'". The object is
# a name the file binds to one of the three classes and to nothing else.
# CrossConformalizedQuantileRegressor has a fit of its own and is left alone.
id: removed-in-mapie
language: python
severity: error
message: A cross conformal or jackknife class of MAPIE 1 has no fit, and the call raises AttributeError. Call fit_conformalize, which fits on the folds or samples and conformalizes on the rows each one leaves out.
rule:
  kind: attribute
  pattern: $M.fit
  all:
    - inside: { kind: call, field: function }
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          kind: assignment
          all:
            - has: { field: left, pattern: $M }
            - has: { field: right, regex: '^(\w+\.)*(CrossConformal(Regressor|Classifier)|JackknifeAfterBootstrapRegressor)\(' }
    - not:
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            kind: assignment
            all:
              - has: { field: left, pattern: $M }
              - not: { has: { field: right, regex: '^(\w+\.)*(CrossConformal(Regressor|Classifier)|JackknifeAfterBootstrapRegressor)\(' } }
  not: { matches: expected-to-raise }
constraints:
  M: { kind: identifier }
metadata: { since: "1.0" }
