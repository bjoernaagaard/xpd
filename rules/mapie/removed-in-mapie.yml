  kind: dotted_name
  pattern: $M
  regex: '^mapie\.(quantile_regression|time_series_regression|multi_label_classification|control_risk(\.\w+)*|conformity_scores\.residual_conformity_scores|estimator\.estimator)$'
  any:
    - inside: { kind: import_from_statement, field: module_name, not: { regex: '\b(Mapie\w+|MondrianCP|ConformityScore)\b' } }
