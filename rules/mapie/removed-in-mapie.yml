          - regex: '^from\s+mapie\.metrics\s+import\s+\(?[\s,]*((add_jitter|cumulative_differences|expected_calibration_error|kolmogorov_smirnov_cdf|kolmogorov_smirnov_p_value|kolmogorov_smirnov_statistic|kuiper_cdf|kuiper_p_value|kuiper_statistic|length_scale|sort_xy_by_y|spiegelhalter_p_value|spiegelhalter_statistic|top_label_ece)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
