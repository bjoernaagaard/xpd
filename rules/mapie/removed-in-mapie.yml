# Each document finds a form of the MAPIE 0.x API that raises on MAPIE 1.6.0: a class or module
# that 1.0 removed, a keyword the new signatures no longer have, or a value they refuse. Each was
# run on 1.6.0, and the message gives the replacement from the v1 release notes. Every document
# carries since, so a project that still has MAPIE 0.9 in its venv is left alone. Code inside a
# try block that catches the error, or behind a version check, is a compatibility path and stays
# silent, and so does code inside pytest.raises or pytest.warns, which is meant to raise.
#
# A fix here turns code that raises into code that runs, so no fix can be compared with the old
# form and every fix is unsafe.

id: removed-in-mapie
language: python
severity: error
message: MapieRegressor was removed in MAPIE 1.0, and the import raises ImportError. Use SplitConformalRegressor for cv="split" and cv="prefit", CrossConformalRegressor for a number of folds or a splitter, and JackknifeAfterBootstrapRegressor for a Subsample. Pass confidence_level, which is 1 - alpha, to the constructor, and read the intervals from predict_interval.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+mapie(\.\w+)*\s+import\b[^#]*\bMapieRegressor\b'
    - kind: attribute
      regex: '^mapie\.regression\.MapieRegressor$'
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|mapie_version|MAPIE' } } }, { inside: { kind: with_statement, stopBy: end, has: { kind: with_clause, regex: '\b(raises|warns|assertRaises|assertRaisesRegex|assertWarns|assertWarnsRegex)\b' } } }] }
metadata: { since: "1.0" }
