# MAPIE 0.x took alpha, the share of rows an interval may miss. MAPIE 1 takes confidence_level,
# the share it must cover, which is 1 - alpha. An alpha given as confidence_level runs without a
# warning and gives intervals that cover almost nothing.

# A literal below 0.5. Over 30 seeds on MAPIE 1.6.0, confidence_level=0.1 covered 0.101 of the
# test rows with a mean width of 0.289, against 0.905 and 3.854 for confidence_level=0.9. A level
# below 0.5 can be meant, as in a plot of coverage against the level, so this is a warning. It
# reads the constructors of the conformal classes and TimeSeriesRegressor.predict. A risk
# controller is left alone, because its confidence_level is 1 - delta and a low one is a choice.
id: alpha-as-confidence-level
language: python
severity: warning
message: confidence_level is the share of rows to cover, which is 1 - alpha, and $V looks like an alpha. With confidence_level=0.1 the intervals covered 0.101 of the test rows, against 0.905 with 0.9. Pass 1 - alpha, such as 0.9 for alpha=0.1.
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: '^confidence_level$' }
    - has:
        field: value
        pattern: $V
        any:
          - kind: float
            regex: '^0?\.[0-4]\d*$'
          - kind: list
            regex: '^\[\s*(0?\.[0-4]\d*\s*,?\s*)+\]$'
    - inside:
        kind: argument_list
        inside:
          kind: call
          has:
            field: function
            any:
              - regex: '(^|\.)((Split|Cross)Conformal(Regressor|Classifier)|JackknifeAfterBootstrapRegressor|(Cross)?ConformalizedQuantileRegressor|ConditionalSplitConformal(Regressor|Classifier))$'
              - kind: attribute
                has: { field: attribute, regex: '^predict$' }
---
# A variable named alpha or delta.
id: alpha-as-confidence-level
language: python
severity: warning
message: confidence_level is the share of rows to cover, and $V is named as the share to miss. With confidence_level=0.1 the intervals covered 0.101 of the test rows, against 0.905 with 0.9. Pass 1 - $V for one value, or one minus each value of a list.
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: '^confidence_level$' }
    - has: { field: value, pattern: $V, kind: identifier, regex: '^(alphas?|ALPHAS?|alpha_\w+|ALPHA_\w+|deltas?|DELTAS?)$' }
---
# The two metrics that take the level as a positional argument, where 0.x took alpha.
id: alpha-as-confidence-level
language: python
severity: warning
message: $F takes confidence_level here since MAPIE 1.0, where 0.x took alpha, and $V looks like an alpha. Pass 1 - alpha, so that the score is computed for the level the intervals were built for.
rule:
  any:
    - pattern: $F($Y, $P, $V)
    - pattern: $F($Y, $LOW, $UP, $ETA, $V)
constraints:
  F: { regex: '(^|\.)(regression_mwi_score|coverage_width_based)$' }
  V:
    any:
      - kind: float
        regex: '^0?\.[0-4]\d*$'
      - kind: identifier
        regex: '^(alphas?|ALPHAS?|alpha_\w+|ALPHA_\w+)$'
---
# A percent. MAPIE 1.6.0 raises "Invalid confidence_level or alpha. Allowed values are between 0
# and 1" from predict_interval or predict_set, after the fit, and a risk controller raises "delta
# must be in (0, 1]". Code inside pytest.raises or pytest.warns is meant to raise and stays silent.
id: alpha-as-confidence-level
language: python
severity: error
message: confidence_level is a share between 0 and 1, and $V raises ValueError, on a conformal class only once predict_interval or predict_set runs. Write the share, such as 0.9 for 90 percent.
rule:
  kind: keyword_argument
  all:
    - has: { field: name, regex: '^confidence_level$' }
    - has:
        field: value
        pattern: $V
        any:
          - kind: integer
            regex: '^([2-9]|[1-9]\d+)$'
          - kind: float
            regex: '^([2-9]|[1-9]\d+)\.\d*$'

  not: { matches: expected-to-raise }