# confidence_level takes a list, and one fit then serves every level: the intervals come back
# with one column per level. A loop that builds one object per level fits the model once per
# level. On MAPIE 1.6.0, on one thread and as the median of 5 runs with 3 levels, one seeded
# CrossConformalRegressor per level took 2.87 times as long as one for the list on 1,000 rows
# and 2.95 times on 5,000, and SplitConformalRegressor took 2.99 and 3.01 times. The intervals
# were bit equal in both. ConformalizedQuantileRegressor takes one level only and is left alone.
id: refit-per-confidence-level
language: python
severity: warning
message: This builds one $C per value of $V, so the model is fitted once per level. Pass the list as confidence_level and fit once. The intervals or sets then have one column per level, with the same values, and three levels measured 2.87 times faster.
rule:
  kind: call
  all:
    - has: { field: function, pattern: $C, regex: '(^|\.)((Split|Cross)Conformal(Regressor|Classifier)|JackknifeAfterBootstrapRegressor|CrossConformalizedQuantileRegressor)$' }
    - has:
        field: arguments
        has:
          kind: keyword_argument
          all:
            - has: { field: name, regex: '^confidence_level$' }
            - has: { field: value, pattern: $V, kind: identifier }
    - inside:
        stopBy: end
        any:
          - kind: for_statement
            has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] }
          - any: [{ kind: list_comprehension }, { kind: dictionary_comprehension }, { kind: generator_expression }]
            has: { kind: for_in_clause, has: { field: left, any: [{ pattern: $V }, { has: { stopBy: end, pattern: $V } }] } }
