id: removed-tsa-arguments
language: python
severity: error
message: Statsmodels 0.15 rejects nlags=None in kpss. Use nlags="auto" for the automatic lag selection previously used for None.
rule:
  kind: none
  inside:
    kind: keyword_argument
    all:
      - {has: {field: name, regex: '^nlags$'}}
      - inside:
          kind: argument_list
          inside: {kind: call, has: {field: function, pattern: $F}}
fix: '"auto"'
metadata:
  since: '0.15'
  fix: unsafe
  holds:
    F: {regex: '(^|\.)kpss$'}
