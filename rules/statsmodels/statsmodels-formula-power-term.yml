id: statsmodels-formula-power-term
language: python
severity: warning
message: In a statsmodels OLS formula, x**2 expands interactions and does not square x. Write I(x**2) for a quadratic term.
rule:
  kind: string
  pattern: $FORMULA
  all:
    - not: {regex: '@\{|\}@'}
    - regex: >-
        (?x)^[rRuU]?["']{1,3}\s*[A-Za-z_]\w*\s*~\s*
        (?:
          (?: [01] | [A-Za-z_]\w*(?:\s*\*\*\s*[0-9]+)?
          | (?:[A-Za-z_]\w*\s*)?\((?:[^()"'\\]|\([^()"'\\]*\))*\)(?:\s*\*\*\s*[0-9]+)? )
          \s*\+\s*
        )*
        [A-Za-z_]\w*\s*\*\*\s*(?:[2-9]|[1-9][0-9]+)
        (?:
          \s*\+\s*
          (?: [01] | [A-Za-z_]\w*(?:\s*\*\*\s*[0-9]+)?
          | (?:[A-Za-z_]\w*\s*)?\((?:[^()"'\\]|\([^()"'\\]*\))*\)(?:\s*\*\*\s*[0-9]+)? )
        )*
        \s*["']{1,3}$
    - any:
        - all:
            - nthChild: {position: 1, ofRule: {not: {any: [{kind: comment}, {kind: line_continuation}]}}}
            - inside: &formula-arguments
                kind: argument_list
                inside: {kind: call, has: {field: function, pattern: $F}}
        - inside:
            kind: keyword_argument
            has: {field: name, regex: '^formula$'}
            inside: *formula-arguments
transform:
  MARKED:
    replace:
      source: $FORMULA
      replace: '(\((?:[^()"'']|\([^()"'']*\))*\))|\b([A-Za-z_]\w*\s*\*\*\s*(?:[2-9]|[1-9][0-9]+))\b'
      by: '${1}@{${2}}@'
  STANDALONE:
    replace: {source: $MARKED, replace: '@\{\}@', by: ''}
  NUMERIC:
    replace: {source: $STANDALONE, replace: '(?s)@\{(.*?)\}@', by: 'I($1)'}
fix: $NUMERIC
metadata:
  fix: unsafe
  holds:
    F: {regex: '(^|\.)(OLS\.from_formula|ols)$'}
