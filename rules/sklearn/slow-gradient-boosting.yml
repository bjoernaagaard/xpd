# HistGradientBoosting bins the features and grows each tree on the bins. It is another model,
# so no speed proof applies, and the rule is info. A file that reads an attribute the hist
# models lack, or asks for the huber loss they lack, is left alone.
id: slow-gradient-boosting
language: python
severity: info
message: $C grows each tree on the exact feature values. Hist$C bins them, and over 20 seeds it fitted 3 times faster on 2,000 rows and 18 to 20 times faster on 20,000 rows with a score 0.003 to 0.026 higher. It is another model with other names for some settings, such as max_iter for n_estimators, so compare the scores on your data.
rule:
  pattern: $C($$$A)
  not:
    inside:
      kind: module
      stopBy: end
      regex: 'feature_importances_|estimators_|oob_improvement_|train_score_|init_|huber'
constraints:
  C: { regex: '(^|\.)GradientBoosting(Classifier|Regressor)$' }
