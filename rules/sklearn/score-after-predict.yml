# score predicts the rows again. The rule names only the classes whose predict costs more than
# the metric. LogisticRegression and LinearRegression measured 1.4 times the metric alone, and
# DecisionTreeClassifier 1.45 at 1,000 rows, below the bar, so they are left alone. A name the
# file also binds to another class is left alone, because the rule cannot tell which binding the
# call sees.
# A classifier scores accuracy and a regressor R2, so the class that the file binds to the name
# picks the metric.
# Unsafe: code between the two lines can change $P, $X or the fitted model.
id: score-after-predict
language: python
severity: warning
message: $M.score($X, $Y) predicts $X again, and $P already holds those predictions. Write accuracy_score($Y, $P), which gives the same number and measured at least 1.6 times faster on 1,000 and 10,000 rows.
rule:
  pattern: $M.score($X, $Y)
  all:
    - inside:
        stopBy: end
        kind: expression_statement
        follows: { stopBy: end, has: { stopBy: end, any: [{ pattern: $P = $M.predict($X) }, { pattern: $P = $M.fit($$$).predict($X) }] } }
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          kind: assignment
          all:
            - has: { field: left, pattern: $M }
            - has: { field: right, regex: '^(\w+\.)*((RandomForest|ExtraTrees|GradientBoosting|HistGradientBoosting|AdaBoost|Bagging|KNeighbors|MLP)Classifier|SVC|NuSVC|GaussianNB)\(' }
    - not:
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            kind: assignment
            all:
              - has: { field: left, pattern: $M }
              - has: { field: right, regex: '^(\w+\.)*[A-Z]\w*\(' }
              - not: { has: { field: right, regex: '^(\w+\.)*((RandomForest|ExtraTrees|GradientBoosting|HistGradientBoosting|AdaBoost|Bagging|KNeighbors|MLP)Classifier|SVC|NuSVC|GaussianNB)\(' } }
fix: accuracy_score($Y, $P)
metadata: { fix: unsafe }
