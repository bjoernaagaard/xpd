# LinearSVC solves the linear problem without a kernel matrix. It uses the squared hinge loss and
# penalizes the intercept, so it is another model, no speed proof applies, and the rule is info.
# A file that needs probabilities or the support vectors, which LinearSVC lacks, is left alone.
id: svc-linear-kernel
language: python
severity: info
message: SVC with a linear kernel builds a kernel matrix over the training rows. LinearSVC fits the same kind of boundary without it, and over 20 seeds it fitted 20 times faster on 1,000 rows and 105 times faster on 4,000 rows with a mean accuracy 0.003 lower. It is another model, so compare the scores on your data.
rule:
  pattern: $C($$$A)
  has: { field: arguments, has: { kind: keyword_argument, regex: '^kernel\s*=\s*.linear.$' } }
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, regex: '^probability\s*=\s*True$' } }
      - inside:
          kind: module
          stopBy: end
          regex: 'support_vectors_|support_|dual_coef_|n_support_'
constraints:
  C: { regex: '(^|\.)SVC$' }
