# With warm_start=True these classes keep the fitted trees and grow only the new ones, and they draw
# the seeds of all trees from random_state in the same order, so a model grown from 10 to 100 trees
# is bit equal to one fitted with 100. A model passed to a cross-validation function is cloned
# there, so warm_start cannot help it, and that loop is left alone. So is a loop over n_estimators
# with another loop inside it, where another setting changes between fits, and a loop that reads
# a clock, because it times each fit and warm_start would change what it measures. AdaBoost has
# no warm_start. Neither document has a fix, because the model moves out of the loop, which changes
# other statements.
id: refit-per-n-estimators
language: python
severity: warning
message: Each pass of this loop fits $C again from scratch. Create it once before the loop with warm_start=True and call set_params(n_estimators=$N) before fit, which keeps the trees already grown, gives the same model while $N grows, and measured at least 1.6 times faster for 10, 20, 50 and 100 trees and at least 3.5 times faster for 10 to 100 trees in steps of 10.
rule:
  pattern: $V = $C($$$A)
  all:
    - has: { field: right, has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^n_estimators$' } }, { has: { field: value, pattern: $N } }] } } }
    - inside:
        stopBy: { kind: for_statement }
        kind: for_statement
        all:
          - has: { field: left, pattern: $N }
          - has: { field: body, has: { stopBy: end, pattern: $V.fit($$$F) } }
          - not: { has: { field: body, has: { stopBy: end, kind: call, regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|GridSearchCV|RandomizedSearchCV|learning_curve|validation_curve|clone)\(\s*', has: { field: arguments, has: { nthChild: 1, pattern: $V } } } } }
          - not: { has: { field: body, has: { stopBy: end, kind: call, has: { field: function, regex: '(^|\.)(time|time_ns|perf_counter|perf_counter_ns|process_time|monotonic|default_timer|timeit|now)$' } } } }
constraints:
  C: { regex: '(^|\.)(RandomForest(Classifier|Regressor)|ExtraTrees(Classifier|Regressor)|GradientBoosting(Classifier|Regressor)|Bagging(Classifier|Regressor)|IsolationForest)$' }
