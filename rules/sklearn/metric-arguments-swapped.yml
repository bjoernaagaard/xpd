# scikit-learn metrics take the true values first. Swapped, precision becomes recall. The rule
# reads the names of the two arguments. accuracy_score, f1_score, matthews_corrcoef,
# cohen_kappa_score, jaccard_score and the error metrics such as mean_squared_error return the
# same number in either order, so they are left alone. Unsafe: a name can mislead.
id: metric-arguments-swapped
language: python
severity: error
message: $F takes the true values first and the predictions second. In this order the precision it gives is the recall, which scored 0.47 on data with no signal where the honest precision was 0.29.
rule:
  pattern: $F($P, $T)
constraints:
  F: { regex: '(^|\.)(precision_score|classification_report|precision_recall_fscore_support)$' }
  P: { regex: '(?i)pred|y_?hat' }
  T: { regex: '(?i)(true|test|val|actual|target|label|^y$)', not: { regex: '(?i)pred|hat' } }
fix: $F($T, $P)
metadata: { fix: unsafe }
