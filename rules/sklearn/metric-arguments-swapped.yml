---
# These return another number with the two swapped, but on data with no signal the swapped
# number is not above the honest one, so no proof can show it, and the documents are info.
id: metric-arguments-swapped
language: python
severity: info
message: $F takes the true values first and the predictions second. In this order it returns another number.
rule:
  pattern: $F($P, $T)
constraints:
  F: { regex: '(^|\.)(recall_score|fbeta_score|balanced_accuracy_score|confusion_matrix|multilabel_confusion_matrix|class_likelihood_ratios|r2_score|explained_variance_score|mean_absolute_percentage_error|mean_poisson_deviance|mean_gamma_deviance|d2_absolute_error_score|d2_pinball_score|d2_tweedie_score|roc_auc_score|average_precision_score)$' }
  P: { regex: '(?i)pred|y_?hat', not: { regex: '(?i)prob|score' } }
  T: { regex: '(?i)(true|test|val|actual|target|label|^y$)', not: { regex: '(?i)pred|hat' } }
fix: $F($T, $P)
metadata: { fix: unsafe }
