# fit on CountVectorizer and TfidfVectorizer runs fit_transform and drops the matrix, so a
# transform of the same documents tokenizes them a second time. Unsafe: fit_transform leaves the
# column indices of each row unsorted where transform sorts them, and TfidfVectorizer values can
# differ in the last bit, so a model fitted on the matrix can differ in the last bits.
id: vectorizer-fit-then-transform
language: python
severity: warning
message: fit already builds the matrix of these documents and drops it, so transform reads them a second time. Call $C($$$A).fit_transform($X), which measured 1.6 to 2.5 times faster.
rule:
  pattern: $C($$$A).fit($X).transform($X)
constraints:
  C: { regex: '(^|\.)(CountVectorizer|TfidfVectorizer)$' }
fix: $C($$$A).fit_transform($X)
metadata: { fix: unsafe }
---
id: vectorizer-fit-then-transform
language: python
severity: warning
message: fit already builds the matrix of these documents and drops it, so transform reads them a second time. Call $V.fit_transform($X), which measured 1.6 to 2.5 times faster.
rule:
  pattern: $V.fit($X).transform($X)
  inside:
    kind: module
    stopBy: end
    has:
      stopBy: end
      kind: assignment
      all:
        - has: { field: left, pattern: $V }
        - has: { field: right, kind: call, has: { field: function, regex: '(^|\.)(CountVectorizer|TfidfVectorizer)$' } }
fix: $V.fit_transform($X)
metadata: { fix: unsafe }
---
# The fit and the transform are two statements, so the rewrite removes a line and has no fix.
id: vectorizer-fit-then-transform
language: python
severity: warning
message: fit already builds the matrix of $X and drops it, so $V.transform($X) reads the documents a second time. Write $V.fit_transform($X) in place of the two calls, which measured 1.6 to 2.5 times faster.
rule:
  pattern: $V.fit($X)
  all:
    - inside:
        kind: expression_statement
        precedes: { stopBy: end, has: { stopBy: end, pattern: $V.transform($X) } }
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          kind: assignment
          all:
            - has: { field: left, pattern: $V }
            - has: { field: right, kind: call, has: { field: function, regex: '(^|\.)(CountVectorizer|TfidfVectorizer)$' } }
