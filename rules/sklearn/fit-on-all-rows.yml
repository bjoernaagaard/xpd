# A model fitted on every row after the split has trained on the test rows, so scoring it on
# them is a score on rows it has seen. A random forest fitted this way scored 1.000 AUC on noise.
# The rule needs the split, the fit on the names that were split, and a score or predict on the
# test name, in that order in one block.
id: fit-on-all-rows
language: python
severity: error
message: $M is fitted on all of $X, which holds the rows of $XT, and then scored on $XT. A forest fitted this way scored 1.000 AUC on data with no signal. Fit $M on the training part.
rule:
  pattern: $M.fit($X, $$$F)
  inside:
    kind: expression_statement
    all:
      - follows:
          stopBy: end
          has:
            pattern: '$A, $XT, $$$R = train_test_split($X, $$$B)'
            # X_train, X_val, y_train, y_val = train_test_split(X_train, y_train) rebinds X_train.
            not: { has: { field: left, has: { pattern: $X } } }
      - precedes:
          stopBy: end
          has:
            stopBy: end
            any:
              - pattern: $M.score($XT, $$$S)
              - pattern: $M.predict($XT)
              - pattern: $M.predict_proba($XT)
              - pattern: $M.decision_function($XT)
constraints:
  X: { kind: identifier }
  XT: { kind: identifier }
