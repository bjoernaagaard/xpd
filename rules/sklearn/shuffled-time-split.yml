# Rows sorted by a date, or given lag features with shift, are in time order. Rows next to each
# other in time look alike and share a target, so a shuffled split scores the model on the
# neighbours of its training rows. The rule reports a split made after df = df.sort_values(date),
# a sort with inplace=True, or a lag column made with shift, in the same function or at the top of
# the file. A sort inside a loop, kept under another name or passed to another call is not
# counted, because its rows are not the ones split. The by= forms come first in each list, because
# a list stops at its first matching pattern. The search for the sort reads every statement before
# the call, so a rule that starts from every call tests the splitter name first in all, which keeps
# its order. ast-grep checks constraints only after the whole rule.
id: shuffled-time-split
language: python
severity: error
message: The rows were sorted by $T, and train_test_split shuffles them by default, so the test rows sit between training rows from the same days. On data with no signal this scored 0.75 where shuffle=False scored 0.52. Pass shuffle=False.
rule:
  pattern: train_test_split($$$ARGS)
  not: { has: { field: arguments, has: { any: [{ kind: keyword_argument, has: { field: name, regex: '^shuffle$' } }, { kind: dictionary_splat }] } } }
  inside:
    stopBy: end
    follows:
      stopBy: end
      kind: expression_statement
      has:
        any:
          - kind: assignment
            has: { field: left, pattern: $D }
            all:
              - has:
                  field: right
                  stopBy: end
                  any: [{ pattern: '$D.sort_values(by=$T, $$$R)' }, { pattern: '$D.sort_values($$$S, by=$T, $$$R)' }, { pattern: '$D.sort_values($T)' }, { pattern: '$D.sort_values($T, $$$S)' }]
                  not: { inside: { stopBy: end, kind: argument_list } }
          - any: [{ pattern: '$D.sort_values(by=$T, $$$R)' }, { pattern: '$D.sort_values($$$S, by=$T, $$$R)' }, { pattern: '$D.sort_values($T, $$$S)' }]
            has: { field: arguments, has: { kind: keyword_argument, regex: '^inplace\s*=\s*True$' } }
constraints:
  T: { regex: '(?i)date|time|year|month|week|day|hour', not: { kind: keyword_argument } }
---
id: shuffled-time-split
language: python
severity: error
message: Lag features from shift put the rows in time order, and train_test_split shuffles them by default, so the test rows sit between training rows from the same days. On data with no signal this scored 0.62 where shuffle=False scored 0.52. Pass shuffle=False.
rule:
  pattern: train_test_split($$$ARGS)
  not: { has: { field: arguments, has: { any: [{ kind: keyword_argument, has: { field: name, regex: '^shuffle$' } }, { kind: dictionary_splat }] } } }
  inside:
    stopBy: end
    follows:
      stopBy: end
      kind: expression_statement
      has:
        kind: assignment
        has: { field: right, stopBy: end, pattern: '$D.shift($N)' }
constraints:
  N: { regex: '^\+?[1-9][0-9]*$' }
---
id: shuffled-time-split
language: python
severity: error
message: The rows are in time order, and $K shuffles them into the folds, so each test fold sits between training rows from the same days. On data with no signal this scored 0.76 where TimeSeriesSplit scored 0.51. Use TimeSeriesSplit.
rule:
  pattern: $K($$$ARGS)
  all:
    - has: { field: function, regex: '(^|\.)(KFold|StratifiedKFold|ShuffleSplit|StratifiedShuffleSplit)$' }
    - any:
        - has: { field: arguments, has: { kind: keyword_argument, regex: '^shuffle\s*=\s*True$' } }
        - not: { regex: '^(\w+\.)?(KFold|StratifiedKFold)\(' }
    - inside:
        stopBy: end
        follows:
          stopBy: end
          kind: expression_statement
          has:
            any:
              - kind: assignment
                has: { field: left, pattern: $D }
                all:
                  - has:
                      field: right
                      stopBy: end
                      any: [{ pattern: '$D.sort_values(by=$T, $$$R)' }, { pattern: '$D.sort_values($$$S, by=$T, $$$R)' }, { pattern: '$D.sort_values($T)' }, { pattern: '$D.sort_values($T, $$$S)' }]
                      not: { inside: { stopBy: end, kind: argument_list } }
              - any: [{ pattern: '$D.sort_values(by=$T, $$$R)' }, { pattern: '$D.sort_values($$$S, by=$T, $$$R)' }, { pattern: '$D.sort_values($T, $$$S)' }]
                has: { field: arguments, has: { kind: keyword_argument, regex: '^inplace\s*=\s*True$' } }
              - kind: assignment
                has: { field: right, stopBy: end, pattern: '$E.shift($N)' }
constraints:
  T: { regex: '(?i)date|time|year|month|week|day|hour', not: { kind: keyword_argument } }
  N: { regex: '^\+?[1-9][0-9]*$' }
