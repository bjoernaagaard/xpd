# The keywords below are the ones the three methods take on 1.9.1. Any other keyword was a
# matplotlib argument, which these methods no longer pass on. The fix holds only without label=,
# which the message moves to name= instead.
id: removed-metric-api
language: python
severity: error
message: $F no longer passes $KW= on to matplotlib, so this raises. Write the matplotlib arguments as curve_kwargs={...}.
rule:
  kind: call
  pattern: $FN($$$ARGS)
  all:
    - has: { field: function, regex: '(^|\.)RocCurveDisplay\.(from_estimator|from_predictions|from_cv_results)$|^RocCurveDisplay\(.*\)\.plot$', pattern: $F }
    - has:
        field: arguments
        has:
          kind: keyword_argument
          has:
            field: name
            pattern: $KW
            not: { regex: '^(estimator|X|y|y_true|y_score|y_pred|sample_weight|drop_intermediate|response_method|pos_label|name|ax|curve_kwargs|plot_chance_level|chance_level_kw|chance_level_kwargs|despine|cv_results)$' }
    - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^curve_kwargs$ } }, { kind: keyword_argument, has: { field: name, regex: ^label$ } }] } } }
rewriters:
  - id: move
    rule:
      kind: keyword_argument
      all:
        - has: { field: name, pattern: $K, not: { regex: '^(estimator|X|y|y_true|y_score|y_pred|sample_weight|drop_intermediate|response_method|pos_label|name|ax|curve_kwargs|plot_chance_level|chance_level_kw|chance_level_kwargs|despine|cv_results)$' } }
        - has: { field: value, pattern: $V }
    fix: '"$K": $V, '
  - id: skip-moved
    rule: { kind: keyword_argument, has: { field: name, not: { regex: '^(estimator|X|y|y_true|y_score|y_pred|sample_weight|drop_intermediate|response_method|pos_label|name|ax|curve_kwargs|plot_chance_level|chance_level_kw|chance_level_kwargs|despine|cv_results)$' } } }
    fix: ""
  - id: skip-kept
    rule: { pattern: $ARG }
    fix: ""
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }] }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [skip-moved, keep], joinBy: "" }
  MOVED:
    rewrite: { source: $$$ARGS, rewriters: [move, skip-kept], joinBy: "" }
  DICT:
    replace: { source: $MOVED, replace: ", $", by: "" }
fix: $FN($KEPTcurve_kwargs={$DICT})
metadata: { fix: unsafe, since: "1.7" }
---
# No fix, because label= goes to name= and the rest to curve_kwargs, or curve_kwargs is already
# passed, or ** can hold it.
id: removed-metric-api
language: python
severity: error
message: $F no longer passes $KW= on to matplotlib, so this raises. Pass name= for the legend label, and the other matplotlib arguments as curve_kwargs={...}.
rule:
  kind: call
  all:
    - has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^curve_kwargs$ } }, { kind: keyword_argument, has: { field: name, regex: ^label$ } }] } }
    - has: { field: function, regex: '(^|\.)RocCurveDisplay\.(from_estimator|from_predictions|from_cv_results)$|^RocCurveDisplay\(.*\)\.plot$', pattern: $F }
  has:
    field: arguments
    has:
      kind: keyword_argument
      has:
        field: name
        pattern: $KW
        not: { regex: '^(estimator|X|y|y_true|y_score|y_pred|sample_weight|drop_intermediate|response_method|pos_label|name|ax|curve_kwargs|plot_chance_level|chance_level_kw|chance_level_kwargs|despine|cv_results)$' }
metadata: { since: "1.7" }
