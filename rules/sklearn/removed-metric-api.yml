id: removed-metric-api
language: python
severity: error
message: make_scorer passes needs_threshold= on to the metric, which raises when the scorer runs, so a search scores every fold as nan. Drop it, and pass response_method=("decision_function", "predict_proba") where it was True.
rule:
  kind: call
  all:
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^needs_threshold$ } } }
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $F } }, { pattern: $F }], matches: from-sklearn-metrics }
constraints:
  F: { regex: ^make_scorer$ }
utils:
  from-sklearn-metrics:
    any:
      - kind: attribute
        has: { field: object, regex: '^(sklearn\.)?metrics$' }
      - kind: identifier
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            kind: import_from_statement
            has: { field: module_name, regex: '^sklearn\.metrics$' }
            any:
              - has: { stopBy: end, kind: identifier, pattern: $F }
              - has: { kind: wildcard_import }
metadata: { since: "1.4" }
