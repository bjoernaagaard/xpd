# Each document finds one metric API that scikit-learn removed. Every form raises on 1.9.1. The
# forms have no fix, because a fix needs a case that runs before and after it.
id: removed-metric-api
language: python
severity: error
message: SCORERS was removed from sklearn.metrics, so this raises. Call sklearn.metrics.get_scorer_names() for the names and get_scorer(name) for a scorer.
rule:
  any:
    - kind: import_from_statement
      all:
        - has: { field: module_name, regex: '^sklearn\.metrics(\.scorer)?$' }
        - has: { stopBy: end, kind: identifier, regex: ^SCORERS$ }
    - { kind: attribute, regex: '^(sklearn\.)?metrics\.SCORERS$' }
---
# The Display classes took over in scikit-learn 1.0.
id: removed-metric-api
language: python
severity: error
message: $NAME was removed from sklearn.metrics, so this raises. Call from_estimator on the matching Display class, such as ConfusionMatrixDisplay.from_estimator(model, X, y).
rule:
  any:
    - kind: import_from_statement
      all:
        - has: { field: module_name, regex: '^sklearn\.metrics$' }
        - has: { stopBy: end, kind: identifier, regex: '^plot_(confusion_matrix|roc_curve|precision_recall_curve|det_curve)$', pattern: $NAME, not: { inside: { kind: aliased_import, field: alias } } }
    - kind: attribute
      regex: '^(sklearn\.)?metrics\.plot_'
      has: { field: attribute, regex: '^plot_(confusion_matrix|roc_curve|precision_recall_curve|det_curve)$', pattern: $NAME }
metadata: { since: "1.0" }
---
id: removed-metric-api
language: python
severity: error
message: jaccard_similarity_score was removed from sklearn.metrics, so this raises. Call jaccard_score, with average= when there are more than two classes.
rule:
  any:
    - kind: import_from_statement
      all:
        - has: { field: module_name, regex: '^sklearn\.metrics$' }
        - has: { stopBy: end, kind: identifier, regex: ^jaccard_similarity_score$ }
    - { kind: attribute, regex: '^(sklearn\.)?metrics\.jaccard_similarity_score$' }
---
# from-sklearn-metrics reads the whole file for a bare name, so each document that uses it tests
# the keyword first in all, which keeps its order. ast-grep checks the name in constraints only
# after the whole rule.
id: removed-metric-api
language: python
severity: error
message: $F no longer takes squared=, so this raises. Call root_$F for the root, or drop squared=True.
rule:
  kind: call
  all:
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^squared$ } } }
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $F } }, { pattern: $F }], matches: from-sklearn-metrics }
constraints:
  F: { regex: '^(mean_squared_error|mean_squared_log_error)$' }
utils:
  from-sklearn-metrics:
    any:
      - kind: attribute
        has: { field: object, regex: '^(sklearn\.)?metrics$' }
      - kind: identifier
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            kind: import_from_statement
            has: { field: module_name, regex: '^sklearn\.metrics$' }
            any:
              - has: { stopBy: end, kind: identifier, pattern: $F }
              - has: { kind: wildcard_import }
metadata: { since: "1.4" }
---
# make_scorer passes every keyword it does not know to the metric when the scorer runs.
id: removed-metric-api
language: python
severity: error
message: make_scorer passes squared= on to $METRIC, which no longer takes it, so the scorer raises and a search scores every fold as nan. Use scoring="neg_root_mean_squared_error", or make_scorer(root_mean_squared_error, greater_is_better=False).
rule:
  kind: call
  all:
    - has: { field: arguments, has: { nthChild: 1, regex: '^((sklearn\.)?metrics\.)?(mean_squared_error|mean_squared_log_error)$', pattern: $METRIC } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^squared$ } } }
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $F } }, { pattern: $F }], matches: from-sklearn-metrics }
constraints:
  F: { regex: ^make_scorer$ }
utils:
  from-sklearn-metrics:
    any:
      - kind: attribute
        has: { field: object, regex: '^(sklearn\.)?metrics$' }
      - kind: identifier
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            kind: import_from_statement
            has: { field: module_name, regex: '^sklearn\.metrics$' }
            any:
              - has: { stopBy: end, kind: identifier, pattern: $F }
              - has: { kind: wildcard_import }
metadata: { since: "1.4" }
