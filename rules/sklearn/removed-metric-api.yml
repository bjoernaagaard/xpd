# Each document finds one metric API that scikit-learn removed. Every form raises on 1.9.1, so no
# fix is bit equal to the old form and every fix is unsafe.
# No fix, because the message names two calls, one for the names and one for a scorer.
id: removed-metric-api
language: python
severity: error
message: SCORERS was removed from sklearn.metrics, so this raises. Call sklearn.metrics.get_scorer_names() for the names and get_scorer(name) for a scorer.
rule:
  any:
    - kind: import_from_statement
      all:
        - has: { field: module_name, regex: '^sklearn\.metrics(\.scorer)?$' }
        - has: { stopBy: end, kind: identifier, regex: ^SCORERS$ }
    - { kind: attribute, regex: '^(sklearn\.)?metrics\.SCORERS$' }
---
# The Display classes took over in scikit-learn 1.0. Each removed function took the arguments of
# from_estimator on its class, in the same order.
# Unsafe: the old form raises on 1.9.1.
id: removed-metric-api
language: python
severity: error
message: $NAME was removed from sklearn.metrics, so this raises. Write $NEW, which takes the same arguments.
rule:
  kind: attribute
  pattern: $A
  regex: '^(sklearn\.)?metrics\.plot_'
  has: { field: attribute, regex: '^plot_(confusion_matrix|roc_curve|precision_recall_curve|det_curve)$', pattern: $NAME }
transform:
  CM:
    replace: { source: $A, replace: 'plot_confusion_matrix$', by: 'ConfusionMatrixDisplay.from_estimator' }
  ROC:
    replace: { source: $CM, replace: 'plot_roc_curve$', by: 'RocCurveDisplay.from_estimator' }
  PR:
    replace: { source: $ROC, replace: 'plot_precision_recall_curve$', by: 'PrecisionRecallDisplay.from_estimator' }
  NEW:
    replace: { source: $PR, replace: 'plot_det_curve$', by: 'DetCurveDisplay.from_estimator' }
fix: $NEW
metadata: { fix: unsafe, since: "1.0" }
---
# No fix, because the code that calls the imported name is elsewhere.
id: removed-metric-api
language: python
severity: error
message: $NAME was removed from sklearn.metrics, so this raises. Call from_estimator on the matching Display class, such as ConfusionMatrixDisplay.from_estimator(model, X, y).
rule:
  kind: import_from_statement
  all:
    - has: { field: module_name, regex: '^sklearn\.metrics$' }
    - has: { stopBy: end, kind: identifier, regex: '^plot_(confusion_matrix|roc_curve|precision_recall_curve|det_curve)$', pattern: $NAME, not: { inside: { kind: aliased_import, field: alias } } }
metadata: { since: "1.0" }
---
# No fix, because average= depends on the number of classes, which the file does not show.
id: removed-metric-api
language: python
severity: error
message: jaccard_similarity_score was removed from sklearn.metrics, so this raises. Call jaccard_score, with average= when there are more than two classes.
rule:
  any:
    - kind: import_from_statement
      all:
        - has: { field: module_name, regex: '^sklearn\.metrics$' }
        - has: { stopBy: end, kind: identifier, regex: ^jaccard_similarity_score$ }
    - { kind: attribute, regex: '^(sklearn\.)?metrics\.jaccard_similarity_score$' }
---
# from-sklearn-metrics reads the whole file for a bare name, so each document that uses it tests
# the keyword first in all, which keeps its order. ast-grep checks the name in constraints only
# after the whole rule.
id: removed-metric-api
language: python
severity: error
message: $F no longer takes squared=, so this raises. Write root_$F without squared=False, which returns the root.
rule:
  kind: call
  all:
    - has: { field: arguments, has: { kind: keyword_argument, regex: '^squared\s*=\s*False$' } }
    - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
    - has: { field: function, any: [{ kind: attribute, has: { field: attribute, pattern: $F } }, { pattern: $F }], matches: from-sklearn-metrics }
    - pattern: $FN($$$ARGS)
constraints:
  F: { regex: '^(mean_squared_error|mean_squared_log_error)$' }
utils:
  from-sklearn-metrics:
    any:
      - kind: attribute
        has: { field: object, regex: '^(sklearn\.)?metrics$' }
      - kind: identifier
        inside:
          kind: module
          stopBy: end
          has:
            stopBy: end
            kind: import_from_statement
            has: { field: module_name, regex: '^sklearn\.metrics$' }
            any:
              - has: { stopBy: end, kind: identifier, pattern: $F }
              - has: { kind: wildcard_import }
rewriters:
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^(squared)$ } }
    fix: ""
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }, { kind: keyword_argument, has: { field: name, regex: ^(squared)$ } }] }
    fix: "$ARG, "
transform:
  ROOT:
    replace: { source: $FN, replace: '(mean_squared(_log)?_error)$', by: 'root_$1' }
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $ROOT($REST)
metadata: { fix: unsafe, since: "1.4" }
