id: removed-metric-api
language: python
severity: error
message: RocCurveDisplay no longer takes estimator_name=, so this raises. Pass name= instead.
rule:
  kind: call
  all:
    - has: { field: function, regex: '(^|\.)RocCurveDisplay$' }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^estimator_name$ } } }
metadata: { since: "1.7" }
---
id: removed-metric-api
language: python
severity: error
message: RocCurveDisplay.from_predictions no longer takes y_pred=, so this raises. Pass the scores as y_score=.
rule:
  kind: call
  all:
    - has: { field: function, regex: '(^|\.)RocCurveDisplay\.from_predictions$' }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^y_pred$ } } }
metadata: { since: "1.7" }
---
# The keywords below are the ones the three methods take on 1.9.1. Any other keyword was a
# matplotlib argument, which these methods no longer pass on.
id: removed-metric-api
language: python
severity: error
message: $F no longer passes $KW= on to matplotlib, so this raises. Pass name= for the legend label, and the other matplotlib arguments as curve_kwargs={...}.
rule:
  kind: call
  all:
    - has: { field: function, regex: '(^|\.)RocCurveDisplay\.(from_estimator|from_predictions|from_cv_results)$|^RocCurveDisplay\(.*\)\.plot$', pattern: $F }
  has:
    field: arguments
    has:
      kind: keyword_argument
      has:
        field: name
        pattern: $KW
        not: { regex: '^(estimator|X|y|y_true|y_score|y_pred|sample_weight|drop_intermediate|response_method|pos_label|name|ax|curve_kwargs|plot_chance_level|chance_level_kw|chance_level_kwargs|despine|cv_results)$' }
metadata: { since: "1.7" }
