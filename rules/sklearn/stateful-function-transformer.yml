id: stateful-function-transformer
language: python
severity: info
message: This function takes statistics of the rows it gets, so at predict time it scales by the test rows, and a prediction changes with the other rows in the batch. Use StandardScaler or MinMaxScaler, which learn the statistics at fit.
rule:
  any:
    - pattern: "$F(lambda $X: ($X - $X.mean($$$M)) / $X.std($$$S))"
    - pattern: "$F(func=lambda $X: ($X - $X.mean($$$M)) / $X.std($$$S))"
    - pattern: "$F(lambda $X: ($X - $NP.mean($X, $$$M)) / $NP.std($X, $$$S))"
    - pattern: "$F(func=lambda $X: ($X - $NP.mean($X, $$$M)) / $NP.std($X, $$$S))"
  has:
    field: arguments
    has:
      kind: lambda
      has:
        field: body
        not: { regex: 'axis\s*=\s*(1|-1)' }
constraints:
  F: { regex: '(^|\.)FunctionTransformer$' }
  NP: { regex: '^(np|numpy)$' }
  X: { regex: '^[A-Za-z_]\w*$' }
fix: StandardScaler()
metadata: { fix: unsafe, fixImports: [StandardScaler] }
---
id: stateful-function-transformer
language: python
severity: info
message: This function takes statistics of the rows it gets, so at predict time it scales by the test rows, and a prediction changes with the other rows in the batch. Use StandardScaler or MinMaxScaler, which learn the statistics at fit.
rule:
  any:
    - pattern: "$F(lambda $X: ($X - $X.min($$$M)) / ($X.max($$$MX) - $X.min($$$M2)))"
    - pattern: "$F(func=lambda $X: ($X - $X.min($$$M)) / ($X.max($$$MX) - $X.min($$$M2)))"
    - pattern: "$F(lambda $X: ($X - $NP.min($X, $$$M)) / ($NP.max($X, $$$MX) - $NP.min($X, $$$M2)))"
    - pattern: "$F(func=lambda $X: ($X - $NP.min($X, $$$M)) / ($NP.max($X, $$$MX) - $NP.min($X, $$$M2)))"
  has:
    field: arguments
    has:
      kind: lambda
      has:
        field: body
        not: { regex: 'axis\s*=\s*(1|-1)' }
constraints:
  F: { regex: '(^|\.)FunctionTransformer$' }
  NP: { regex: '^(np|numpy)$' }
  X: { regex: '^[A-Za-z_]\w*$' }
fix: MinMaxScaler()
metadata: { fix: unsafe, fixImports: [MinMaxScaler] }
---
id: stateful-function-transformer
language: python
severity: info
message: This function takes statistics of the rows it gets, so at predict time it scales by the test rows, and a prediction changes with the other rows in the batch. Use StandardScaler or MinMaxScaler, which learn the statistics at fit.
rule:
  pattern: $F($$$A)
  all:
    - has:
        field: arguments
        any:
          - has: { nthChild: 1, matches: batch-lambda }
          - has: { kind: keyword_argument, all: [{ has: { field: name, regex: ^func$ } }, { has: { field: value, matches: batch-lambda } }] }
    - not:
        any:
          - pattern: "$F(lambda $X: ($X - $X.mean($$$M)) / $X.std($$$S))"
          - pattern: "$F(func=lambda $X: ($X - $X.mean($$$M)) / $X.std($$$S))"
          - pattern: "$F(lambda $X: ($X - $NP.mean($X, $$$M)) / $NP.std($X, $$$S))"
          - pattern: "$F(func=lambda $X: ($X - $NP.mean($X, $$$M)) / $NP.std($X, $$$S))"
          - pattern: "$F(lambda $X: ($X - $X.min($$$M)) / ($X.max($$$MX) - $X.min($$$M2)))"
          - pattern: "$F(func=lambda $X: ($X - $X.min($$$M)) / ($X.max($$$MX) - $X.min($$$M2)))"
          - pattern: "$F(lambda $X: ($X - $NP.min($X, $$$M)) / ($NP.max($X, $$$MX) - $NP.min($X, $$$M2)))"
          - pattern: "$F(func=lambda $X: ($X - $NP.min($X, $$$M)) / ($NP.max($X, $$$MX) - $NP.min($X, $$$M2)))"
constraints:
  F: { regex: '(^|\.)FunctionTransformer$' }
  NP: { regex: '^(np|numpy)$' }
  X: { regex: '^[A-Za-z_]\w*$' }
utils:
  batch-lambda:
    kind: lambda
    has:
      field: body
      regex: '\.(mean|std|var|min|max|median|quantile)\(|\b(np|numpy)\.(mean|std|var|min|max|median|percentile|quantile|nanmean|nanstd|nanmin|nanmax|amin|amax|ptp)\('
      not: { regex: 'axis\s*=\s*(1|-1)' }
