# A step that learns from the target, fitted on every row before cross-validation or a search,
# has seen the labels of every fold. A Pipeline fits the step again inside each fold. A step
# fitted on the rows alone, such as a scaler, is left alone, because it moved the mean fold AUC
# by less than 0.001.
id: cross-val-on-fitted-data
language: python
severity: error
message: $S learned from the target on every row before cross-validation, so each fold was scored on rows whose labels chose the features. Put $S and the model in one Pipeline and cross-validate the Pipeline.
rule:
  pattern: $V = $S.fit_transform($X, $Y)
  inside:
    kind: expression_statement
    precedes:
      stopBy: end
      has:
        stopBy: end
        kind: call
        all:
          - has: { field: function, regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
          - has: { field: arguments, has: { nthChild: 2, pattern: $V } }
constraints:
  V: { kind: identifier, not: { regex: '^(y|Y|target|targets|label|labels)(_|$)' } }
  S: { not: { regex: '(?i)label|^le$|scal|standard|minmax|norm|imput|pca|svd|poly|vectori|tfidf|preprocess|pipe|column|^TargetEncoder\(' } }
  Y: { not: { any: [{ kind: none }, { kind: keyword_argument }] } }
---
id: cross-val-on-fitted-data
language: python
severity: error
message: $S learned from the target on every row before cross-validation, so each fold was scored on rows whose labels chose the features. Put $S and the model in one Pipeline and cross-validate the Pipeline.
rule:
  any:
    - pattern: $CV($M, $S.fit_transform($X, $Y), $$$C)
    - pattern: $CV($M, $S.fit_transform($X, $Y))
constraints:
  CV: { regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
  S: { not: { regex: '(?i)label|^le$|scal|standard|minmax|norm|imput|pca|svd|poly|vectori|tfidf|preprocess|pipe|column|^TargetEncoder\(' } }
  Y: { not: { any: [{ kind: none }, { kind: keyword_argument }] } }
---
# RandomUnderSampler drops rows at random and makes no copy. Run on every row before the
# cross-validation, it scored 0.519 AUC on data with no signal against
# 0.511 when it ran inside each training part, over 30 seeds, so it is left
# alone when it is built in the same expression, assigned in the same block or named rus.
# NearMiss and TomekLinks also only drop rows. They scored 0.448 and 0.516 before the split,
# which did not pass the proof, so they are left alone too. EditedNearestNeighbours scored
# 0.678 and stays reported.
id: cross-val-on-fitted-data
language: python
severity: error
message: The rows were resampled before cross-validation, so copies and neighbours of each test fold are in its training folds. Put the resampler and the model in an imblearn Pipeline and cross-validate that.
rule:
  pattern: $V, $W = $S.fit_resample($$$A)
  not: { matches: random-under-sampler }
  inside:
    kind: expression_statement
    precedes:
      stopBy: end
      has:
        stopBy: end
        kind: call
        all:
          - has: { field: function, regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
          - has: { field: arguments, has: { nthChild: 2, pattern: $V } }
constraints:
  V: { kind: identifier }
utils:
  random-under-sampler:
    any:
      - has: { field: right, has: { field: function, has: { field: object, any: [{ kind: call, regex: '^[\w.]*(RandomUnderSampler|NearMiss|TomekLinks)\(' }, { regex: '^rus$' }] } } }
      - inside:
          kind: expression_statement
          inside:
            any: [{ kind: block }, { kind: module }]
            has: { kind: expression_statement, has: { kind: assignment, all: [{ has: { field: left, pattern: $S } }, { has: { field: right, kind: call, regex: '^[\w.]*(RandomUnderSampler|NearMiss|TomekLinks)\(' } }] } }
---
# A search scores each setting by cross-validation, so it leaks in the same way. The search is
# named in the same file, as in grid = GridSearchCV(...) and grid.fit(X_picked, y).
id: cross-val-on-fitted-data
language: python
severity: error
message: $S learned from the target on every row before the search, so best_score_ was measured on folds whose labels chose the features. Put $S and the model in one Pipeline and search over the Pipeline.
rule:
  all:
    - pattern: $V = $S.fit_transform($X, $Y)
    - inside:
        kind: expression_statement
        precedes: { stopBy: end, has: { stopBy: end, pattern: '$G.fit($V, $$$F)' } }
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          kind: assignment
          all:
            - has: { field: left, pattern: $G }
            - has: { field: right, kind: call, has: { field: function, regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV)$' } }
constraints:
  V: { kind: identifier, not: { regex: '^(y|Y|target|targets|label|labels)(_|$)' } }
  S: { not: { regex: '(?i)label|^le$|scal|standard|minmax|norm|imput|pca|svd|poly|vectori|tfidf|preprocess|pipe|column|^TargetEncoder\(' } }
  Y: { not: { any: [{ kind: none }, { kind: keyword_argument }] } }
---
id: cross-val-on-fitted-data
language: python
severity: error
message: The rows were resampled before the search, so copies and neighbours of each test fold are in its training folds and best_score_ is too high. Put the resampler and the model in an imblearn Pipeline and search over that.
rule:
  all:
    - pattern: $V, $W = $S.fit_resample($$$A)
    - not: { matches: random-under-sampler }
    - inside:
        kind: expression_statement
        precedes: { stopBy: end, has: { stopBy: end, pattern: '$G.fit($V, $$$F)' } }
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          kind: assignment
          all:
            - has: { field: left, pattern: $G }
            - has: { field: right, kind: call, has: { field: function, regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV)$' } }
constraints:
  V: { kind: identifier }
utils:
  random-under-sampler:
    any:
      - has: { field: right, has: { field: function, has: { field: object, any: [{ kind: call, regex: '^[\w.]*(RandomUnderSampler|NearMiss|TomekLinks)\(' }, { regex: '^rus$' }] } } }
      - inside:
          kind: expression_statement
          inside:
            any: [{ kind: block }, { kind: module }]
            has: { kind: expression_statement, has: { kind: assignment, all: [{ has: { field: left, pattern: $S } }, { has: { field: right, kind: call, regex: '^[\w.]*(RandomUnderSampler|NearMiss|TomekLinks)\(' } }] } }
