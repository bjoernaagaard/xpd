# Each document finds a scikit-learn form that raises on 1.9.1: a module or name that was
# removed, a keyword that the signature no longer has, a value that parameter validation refuses,
# or a positional argument that the signature takes only by keyword. Code inside a try block that
# catches the error, or behind a version check, is a compatibility path and stays silent.
#
# A fix here turns code that raises into code that runs, so no fix is bit equal to the old form
# and every fix is unsafe. Where the source documents a keyword as renamed, the message says so.
# The long name lists come from scikit-learn 1.9.1 itself: its public modules, the names each
# subpackage exports, and the signatures that take arguments only by keyword.

id: removed-in-sklearn
language: python
severity: error
message: $M was removed, and its names are in sklearn.model_selection. Import them from there.
rule:
  kind: dotted_name
  pattern: $M
  regex: '^sklearn\.(cross_validation|grid_search|learning_curve)$'
  inside:
    kind: import_from_statement
    field: module_name
    regex: '^from\s+sklearn\.(cross_validation|grid_search|learning_curve)\s+import\s+\(?[\s,]*((BaseCrossValidator|BaseShuffleSplit|FixedThresholdClassifier|GridSearchCV|GroupKFold|GroupShuffleSplit|HalvingGridSearchCV|HalvingRandomSearchCV|KFold|LearningCurveDisplay|LeaveOneGroupOut|LeaveOneOut|LeavePGroupsOut|LeavePOut|ParameterGrid|ParameterSampler|PredefinedSplit|RandomizedSearchCV|RepeatedKFold|RepeatedStratifiedKFold|ShuffleSplit|StratifiedGroupKFold|StratifiedKFold|StratifiedShuffleSplit|TimeSeriesSplit|TunedThresholdClassifierCV|ValidationCurveDisplay|check_cv|cross_val_predict|cross_val_score|cross_validate|learning_curve|permutation_test_score|train_test_split|validation_curve)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } } }] }
fix: sklearn.model_selection
metadata: { fix: unsafe }
---
# The same modules, where a name has no twin in sklearn.model_selection, such as LabelKFold, or
# where the module itself is imported.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.cross_validation, sklearn.grid_search and sklearn.learning_curve were removed. Import from sklearn.model_selection, and check each name there, because some were renamed.
rule:
  all:
    - any:
        - kind: import_from_statement
          regex: '^from\s+sklearn\.(cross_validation|grid_search|learning_curve)\s+import\b'
          not: { regex: '^from\s+sklearn\.(cross_validation|grid_search|learning_curve)\s+import\s+\(?[\s,]*((BaseCrossValidator|BaseShuffleSplit|FixedThresholdClassifier|GridSearchCV|GroupKFold|GroupShuffleSplit|HalvingGridSearchCV|HalvingRandomSearchCV|KFold|LearningCurveDisplay|LeaveOneGroupOut|LeaveOneOut|LeavePGroupsOut|LeavePOut|ParameterGrid|ParameterSampler|PredefinedSplit|RandomizedSearchCV|RepeatedKFold|RepeatedStratifiedKFold|ShuffleSplit|StratifiedGroupKFold|StratifiedKFold|StratifiedShuffleSplit|TimeSeriesSplit|TunedThresholdClassifierCV|ValidationCurveDisplay|check_cv|cross_val_predict|cross_val_score|cross_validate|learning_curve|permutation_test_score|train_test_split|validation_curve)(\s+as\s+\w+)?[\s,]*)+\)?\s*$' }
        - kind: import_statement
          has: { regex: '^sklearn\.(cross_validation|grid_search|learning_curve)\b' }
        - kind: import_from_statement
          regex: '^from\s+sklearn\s+import\b[^#]*\b(cross_validation|grid_search|learning_curve)\b'
    - not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } } }] }
---
# joblib is a dependency of scikit-learn, listed in its pyproject.toml, so it is installed.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.joblib was removed. Import joblib itself, which scikit-learn depends on.
rule:
  kind: import_from_statement
  regex: '^from\s+sklearn\.externals\s+import\s+joblib\s*$'
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } } }] }
fix: import joblib
metadata: { fix: unsafe }
---
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.joblib was removed. Import joblib itself, which scikit-learn depends on.
