      - regex: '^(sklearn\.base|sklearn\.calibration|sklearn\.callback|sklearn\.cluster|sklearn\.compose|sklearn\.covariance|sklearn\.cross_decomposition|sklearn\.datasets|sklearn\.datasets\.data|sklearn\.datasets\.descr|sklearn\.datasets\.images|sklearn\.decomposition|sklearn\.discriminant_analysis|sklearn\.dummy|sklearn\.ensemble|sklearn\.exceptions|sklearn\.experimental|sklearn\.experimental\.enable_halving_search_cv|sklearn\.experimental\.enable_hist_gradient_boosting|sklearn\.experimental\.enable_iterative_imputer|sklearn\.externals|sklearn\.externals\.array_api_compat|sklearn\.externals\.array_api_extra|sklearn\.externals\.conftest|sklearn\.feature_extraction|sklearn\.feature_extraction\.image|sklearn\.feature_extraction\.text|sklearn\.feature_selection|sklearn\.frozen|sklearn\.gaussian_process|sklearn\.gaussian_process\.kernels|sklearn\.impute|sklearn\.inspection|sklearn\.isotonic|sklearn\.kernel_approximation|sklearn\.kernel_ridge|sklearn\.linear_model|sklearn\.manifold|sklearn\.metrics|sklearn\.metrics\.cluster|sklearn\.metrics\.pairwise|sklearn\.mixture|sklearn\.model_selection|sklearn\.multiclass|sklearn\.multioutput|sklearn\.naive_bayes|sklearn\.neighbors|sklearn\.neural_network|sklearn\.pipeline|sklearn\.preprocessing|sklearn\.random_projection|sklearn\.semi_supervised|sklearn\.svm|sklearn\.tests|sklearn\.tests\.metadata_routing_common|sklearn\.tests\.test_base|sklearn\.tests\.test_build|sklearn\.tests\.test_calibration|sklearn\.tests\.test_check_build|sklearn\.tests\.test_common|sklearn\.tests\.test_config|sklearn\.tests\.test_discriminant_analysis|sklearn\.tests\.test_docstring_parameters|sklearn\.tests\.test_docstring_parameters_consistency|sklearn\.tests\.test_docstrings|sklearn\.tests\.test_dummy|sklearn\.tests\.test_init|sklearn\.tests\.test_isotonic|sklearn\.tests\.test_kernel_approximation|sklearn\.tests\.test_kernel_ridge|sklearn\.tests\.test_metadata_routing|sklearn\.tests\.test_metaestimators|sklearn\.tests\.test_metaestimators_metadata_routi