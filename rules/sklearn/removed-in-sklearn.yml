# Safe: on scikit-learn 0.19.2 to 0.23.2 sklearn.feature_extraction.stop_words.ENGLISH_STOP_WORDS
# was the same object as sklearn.feature_extraction.text.ENGLISH_STOP_WORDS.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.feature_extraction.stop_words is not a module in scikit-learn 1.9.1. Import ENGLISH_STOP_WORDS from sklearn.feature_extraction.text.
rule:
  kind: dotted_name
  regex: '^sklearn\.feature_extraction\.stop_words$'
  inside:
    kind: import_from_statement
    field: module_name
    regex: '^from\s+sklearn\.feature_extraction\.stop_words\s+import\s+\(?[\s,]*((ENGLISH_STOP_WORDS)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
  not: { matches: compat-code }
fix: sklearn.feature_extraction.text
metadata: { fix: safe }
---
# get_feature_names returned a list. get_feature_names_out returns an array, and on a frame it
# names the input columns where get_feature_names named them x0, x1 and so on. A file that
# defines its own get_feature_names is left alone, because the call may reach that method.
id: removed-in-sklearn
language: python
severity: error
message: get_feature_names was removed in favor of get_feature_names_out, added in 1.0. Call $X.get_feature_names_out(), which returns an array.
rule:
  pattern: $X.get_feature_names($$$A)
  not:
    any:
      - matches: compat-code
      - inside: { kind: module, stopBy: end, has: { kind: function_definition, stopBy: end, has: { field: name, regex: ^get_feature_names$ } } }
fix: $X.get_feature_names_out($$$A)
metadata: { fix: unsafe, since: "1.0" }
