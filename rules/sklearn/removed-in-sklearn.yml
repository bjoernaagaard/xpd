---
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.six was removed, and scikit-learn no longer ships six. Use the Python 3 name, such as io.StringIO or range.
rule:
  any:
    - kind: import_from_statement
      has: { field: module_name, regex: '^sklearn\.externals\.six(\.|$)' }
    - kind: import_statement
      regex: '\bsklearn\.externals\.six\b'
    - kind: import_from_statement
      regex: '^from\s+sklearn\.externals\s+import\b[^#]*\bsix\b'
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } } }] }
---
id: removed-in-sklearn
language: python
severity: error
message: load_boston was removed in 1.2 because of an ethical problem with the data. Load fetch_california_housing or fetch_openml(name="house_prices") instead.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+sklearn\.datasets\s+import\b[^#]*\bload_boston\b'
    - pattern: $D.load_boston($$$A)
      regex: '^(sklearn\.)?datasets\.'
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } } }] }
---
id: removed-in-sklearn
language: python
severity: error
message: sklearn.preprocessing.Imputer was removed, and sklearn.impute.SimpleImputer replaces it. Its strategy works the same way, and it has no axis parameter.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+sklearn\.preprocessing\s+import\b[^#]*\bImputer\b'
    - pattern: $P.Imputer($$$A)
      regex: '^(sklearn\.)?preprocessing\.'
  not: { matches: compat-code }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } } }] }
---
# A dotted path to a submodule that 1.9.1 does not have, such as sklearn.linear_model.logistic,
# which older releases had before the module was made private. The fix applies when every name
# the statement imports is exported by the subpackage.
id: removed-in-sklearn
language: python
severity: error
message: $M is not a module in scikit-learn 1.9.1, so the import raises. Import from $P, which exports these names.
rule:
  kind: dotted_name
  pattern: $M
  regex: '^sklearn\.\w+\.[a-z]\w*$'
  not:
    any:
      - regex: '^(sklearn\.base|sklearn\.calibration|sklearn\.callback|sklearn\.cluster|sklearn\.compose|sklearn\.covariance|sklearn\.cross_decomposition|sklearn\.datasets|sklearn\.datasets\.data|sklearn\.datasets\.descr|sklearn\.datasets\.images|sklearn\.decomposition|sklearn\.discriminant_analysis|sklearn\.dummy|sklearn\.ensemble|sklearn\.exceptions|sklearn\.experimental|sklearn\.experimental\.enable_halving_search_cv|sklearn\.experimental\.enable_hist_gradient_boosting|sklearn\.experimental\.enable_iterative_imputer|sklearn\.externals|sklearn\.externals\.array_api_compat|sklearn\.externals\.array_api_extra|sklearn\.externals\.conftest|sklearn\.feature_extraction|sklearn\.feature_extraction\.image|sklearn\.feature_extraction\.text|sklearn\.feature_selection|sklearn\.frozen|sklearn\.gaussian_process|sklearn\.gaussian_process\.kernels|sklearn\.impute|sklearn\.inspection|sklearn\.isotonic|sklearn\.kernel_approximation|sklearn\.kernel_ridge|sklearn\.linear_model|sklearn\.manifold|sklearn\.metrics|sklearn\.metrics\.cluster|sklearn\.metrics\.pairwise|sklearn\.mixture|sklearn\.model_selection|sklearn\.multiclass|sklearn\.multioutput|sklearn\.naive_bayes|sklearn\.neighbors|sklearn\.neural_network|sklearn\.pipeline|sklearn\.preprocessing|sklearn\.random_projection|sklearn\.semi_supervised|sklearn\.svm|sklearn\.tests|sklearn\.tests\.metadata_routing_common|sklearn\.tests\.test_base|sklearn\.tests\.test_build|sklearn\.tests\.test_calibration|sklearn\.tests\.test_check_build|sklearn\.tests\.test_common|sklearn\.tests\.test_config|sklearn\.tests\.test_discriminant_analysis|sklearn\.tests\.test_docstring_parameters|sklearn\.tests\.test_docstring_parameters_consistency|sklearn\.tests\.test_docstrings|sklearn\.tests\.test_dummy|sklearn\.tests\.test_init|sklearn\.tests\.test_isotonic|sklearn\.tests\.test_kernel_approximation|sklearn\.tests\.test_kernel_ridge|sklearn\.tests\.test_metadata_routing|sklearn\.tests\.test_metaestimators|sklearn\.tests\.test_metaestimators_metadata_routing|sklearn\.tests\.test_min_dependencies_consistency|sklearn\.tests\.test_multiclass|sklearn\.tests\.test_multioutput|sklearn\.tests\.test_naive_bayes|sklearn\.tests\.test_pipeline|sklearn\.tests\.test_public_functions|sklearn\.tests\.test_random_projection|sklearn\.tree|sklearn\.utils|sklearn\.utils\.arrayfuncs|sklearn\.utils\.class_weight|sklearn\.utils\.deprecation|sklearn\.utils\.discovery|sklearn\.utils\.estimator_checks|sklearn\.utils\.extmath|sklearn\.utils\.fixes|sklearn\.utils\.graph|sklearn\.utils\.metadata_routing|sklearn\.utils\.metaestimators|sklearn\.utils\.multiclass|sklearn\.utils\.murmurhash|sklearn\.utils\.optimize|sklearn\.utils\.parallel|sklearn\.utils\.random|sklearn\.utils\.sparsefuncs|sklearn\.utils\.sparsefuncs_fast|sklearn\.utils\.stats|sklearn\.utils\.validation)$'
      - regex: '^sklearn\.externals\.'
      - matches: compat-code
  inside:
    kind: import_from_statement
    field: module_name
    any: [{ regex: '^from\s+sklearn\.base\.\w+\s+import\s+\(?[\s,]*((AttrsDict|BaseEstimator|BiclusterMixin|ClassNamePrefixFeaturesOutMixin|ClassifierMixin|ClassifierTags|ClusterMixin|DensityMixin|InconsistentVersionWarning|MetaEstimatorMixin|MultiOutputMixin|OneToOneFeatureMixin|OutlierMixin|ParamsDict|RegressorMixin|RegressorTags|ReprHTMLMixin|Tags|TargetTags|TransformerMixin|TransformerTags|check_array|check_is_fitted|clone|config_context|copy|defaultdict|estimator_html_repr|functools|get_config|get_tags|inspect|is_classifier|is_clusterer|is_outlier_detector|is_pandas_na|is_regressor|is_scalar_nan|np|numbers|platform|re|validate_parameter_constraints|warnings)(\s+as\s+\w+)?[\s,]*)+\)?\s*$' }, { regex: '^from\s+sklearn\.calibration\.\w+\s+import\s+\(?[\s,]*((BaseEstimator|CalibratedClassifierCV|CalibrationDisplay|ClassifierMixin|FrozenEstimator|HalfBinomialLoss|HalfMultinomialLoss|HalfMultinomialLossArrayAPI|HasMethods|Integral|Interval|IsotonicRegression|LabelEncoder|LeaveOneOut|LinearSVC|MetaEstimatorMixin|MetadataRouter|MethodMapping|Parallel|Real|RegressorMixin|StrOptions|calibration_curve|check_array|check_classification_targets|check_consistent_length|check_cv|check_is_fitted|clone|column_or_1d|cross_val_predict|delayed|expit|get_namespace|get_namespace_and_device|get_tags|indexable|label_binarize|log|minimize|minimize_scalar|move_to|np|process_routing|signature|softmax|validate_params|warnings|xpx)(\s+as\s+\w+)?[\s,]*)+\)?\s*$' }, { regex: '^from\s+sklearn\.callback\.\w+\s+import\s+\(?[\s,]*((AutoPropagatedCallback|CallbackContext|CallbackSupportMixin|FitCallback|ProgressBar|ScoringMonitor|ScoringMonitorLog|with_callbacks)(\s+as\s+\w+)?[\s,]*)+\)?\s*$' }, { regex: '^from\s+sklearn\.cluster\.\w+\s+import\s+\(?[\s,]*((AffinityPropagation|AgglomerativeClustering|Birch|BisectingKMeans|DBSCAN|FeatureAgglomeration|HDBSCAN|KMeans|MeanShift|MiniBatchKMeans|OPTICS|SpectralBiclustering|SpectralClustering|SpectralCoclustering|affinity_propagation|cluster_optics_dbscan