# Each document finds a scikit-learn form that raises on 1.9.1: a module or name that was
# removed, a keyword that the signature no longer has, a value that parameter validation refuses,
# or a positional argument that the signature takes only by keyword. Code inside a try block that
# catches the error, or behind a version check, is a compatibility path and stays silent.
#
# A fix here turns code that raises into code that runs. A fix is safe when an older release ran
# both forms and the new form gave the same object, or a fit and an output with equal pickles, on
# real data. The comment above a safe fix names that release. The fitted model keeps the value it
# was given, so a renamed keyword or value still reads differently as a parameter. Where the
# source documents a keyword as renamed, the message says so.
# The long name lists come from scikit-learn 1.9.1 itself: its public modules, the names each
# subpackage exports, and the signatures that take arguments only by keyword.

id: removed-in-sklearn
language: python
severity: error
message: $M was removed, and its names are in sklearn.model_selection. Import them from there.
rule:
  kind: dotted_name
  pattern: $M
  regex: '^sklearn\.(cross_validation|grid_search|learning_curve)$'
  inside:
    kind: import_from_statement
    field: module_name
    regex: '^from\s+sklearn\.(cross_validation|grid_search|learning_curve)\s+import\s+\(?[\s,]*((BaseCrossValidator|BaseShuffleSplit|FixedThresholdClassifier|GridSearchCV|GroupKFold|GroupShuffleSplit|HalvingGridSearchCV|HalvingRandomSearchCV|KFold|LearningCurveDisplay|LeaveOneGroupOut|LeaveOneOut|LeavePGroupsOut|LeavePOut|ParameterGrid|ParameterSampler|PredefinedSplit|RandomizedSearchCV|RepeatedKFold|RepeatedStratifiedKFold|ShuffleSplit|StratifiedGroupKFold|StratifiedKFold|StratifiedShuffleSplit|TimeSeriesSplit|TunedThresholdClassifierCV|ValidationCurveDisplay|check_cv|cross_val_predict|cross_val_score|cross_validate|learning_curve|permutation_test_score|train_test_split|validation_curve)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
  not: { matches: compat-code }
fix: sklearn.model_selection
metadata: { fix: unsafe }
---
# The same modules, where a name has no twin in sklearn.model_selection, such as LabelKFold, or
# where the module itself is imported. No fix, because the code that reads those names is
# elsewhere.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.cross_validation, sklearn.grid_search and sklearn.learning_curve were removed. Import from sklearn.model_selection, and check each name there, because some were renamed.
rule:
  all:
    - any:
        - kind: import_from_statement
          regex: '^from\s+sklearn\.(cross_validation|grid_search|learning_curve)\s+import\b'
          not: { regex: '^from\s+sklearn\.(cross_validation|grid_search|learning_curve)\s+import\s+\(?[\s,]*((BaseCrossValidator|BaseShuffleSplit|FixedThresholdClassifier|GridSearchCV|GroupKFold|GroupShuffleSplit|HalvingGridSearchCV|HalvingRandomSearchCV|KFold|LearningCurveDisplay|LeaveOneGroupOut|LeaveOneOut|LeavePGroupsOut|LeavePOut|ParameterGrid|ParameterSampler|PredefinedSplit|RandomizedSearchCV|RepeatedKFold|RepeatedStratifiedKFold|ShuffleSplit|StratifiedGroupKFold|StratifiedKFold|StratifiedShuffleSplit|TimeSeriesSplit|TunedThresholdClassifierCV|ValidationCurveDisplay|check_cv|cross_val_predict|cross_val_score|cross_validate|learning_curve|permutation_test_score|train_test_split|validation_curve)(\s+as\s+\w+)?[\s,]*)+\)?\s*$' }
        - kind: import_statement
          has: { regex: '^sklearn\.(cross_validation|grid_search|learning_curve)\b' }
        - kind: import_from_statement
          regex: '^from\s+sklearn\s+import\b[^#]*\b(cross_validation|grid_search|learning_curve)\b'
    - not: { matches: compat-code }
---
# joblib is a dependency of scikit-learn, listed in its pyproject.toml, so it is installed.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.joblib was removed. Import joblib itself, which scikit-learn depends on.
rule:
  kind: import_from_statement
  regex: '^from\s+sklearn\.externals\s+import\s+joblib\s*$'
  not: { matches: compat-code }
fix: import joblib
metadata: { fix: unsafe }
---
# Safe: on scikit-learn 0.22.2 with joblib 0.14.1 each of these names in sklearn.externals.joblib
# was the same object as in joblib.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.joblib was removed. Import joblib itself, which scikit-learn depends on.
rule:
  kind: dotted_name
  regex: '^sklearn\.externals\.joblib$'
  inside:
    kind: import_from_statement
    field: module_name
    regex: '^from\s+sklearn\.externals\.joblib\s+import\s+\(?[\s,]*((Logger|MemorizedResult|Memory|Parallel|PrintTime|cpu_count|delayed|dump|effective_n_jobs|hash|load|parallel_backend|register_compressor|register_parallel_backend|register_store_backend|wrap_non_picklable_objects)(\s+as\s+\w+)?[\s,]*)+\)?\s*$'
  not: { matches: compat-code }
fix: joblib
metadata: { fix: safe }
---
# Unsafe: on scikit-learn 0.22.2 the module sklearn.externals.joblib was not the module joblib,
# and it also held sys, warnings and msg.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.joblib was removed. Import joblib itself, which scikit-learn depends on.
rule:
  kind: dotted_name
  regex: '^sklearn\.externals\.joblib$'
  any:
    - inside: { kind: import_from_statement, field: module_name }
    - inside: { kind: aliased_import, field: name, inside: { kind: import_statement } }
  not:
    any:
      - matches: compat-code
      - inside: { kind: import_from_statement, field: module_name, regex: '^from\s+sklearn\.externals\.joblib\s+import\s+\(?[\s,]*((Logger|MemorizedResult|Memory|Parallel|PrintTime|cpu_count|delayed|dump|effective_n_jobs|hash|load|parallel_backend|register_compressor|register_parallel_backend|register_store_backend|wrap_non_picklable_objects)(\s+as\s+\w+)?[\s,]*)+\)?\s*$' }
fix: joblib
metadata: { fix: unsafe }
---
# No fix, because the import binds another name too, or the code reads the module by its full name
# elsewhere.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.joblib was removed. Import joblib itself, which scikit-learn depends on.
rule:
  any:
    - kind: import_statement
      regex: '^import\s+sklearn\.externals\.joblib\s*$'
    - kind: import_from_statement
      regex: '^from\s+sklearn\.externals\s+import\b[^#]*\bjoblib\b'
      not: { regex: '^from\s+sklearn\.externals\s+import\s+joblib\s*$' }
  not: { matches: compat-code }
---
# No fix, because each name of six has its own Python 3 name, and the code that uses it is
# elsewhere.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.externals.six was removed, and scikit-learn no longer ships six. Use the Python 3 name, such as io.StringIO or range.
rule:
  any:
    - kind: import_from_statement
      has: { field: module_name, regex: '^sklearn\.externals\.six(\.|$)' }
    - kind: import_statement
      regex: '\bsklearn\.externals\.six\b'
    - kind: import_from_statement
      regex: '^from\s+sklearn\.externals\s+import\b[^#]*\bsix\b'
  not: { matches: compat-code }
---
# No fix, because the advice is another dataset.
id: removed-in-sklearn
language: python
severity: error
message: load_boston was removed in 1.2 because of an ethical problem with the data. Load fetch_california_housing or fetch_openml(name="house_prices") instead.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+sklearn\.datasets\s+import\b[^#]*\bload_boston\b'
    - pattern: $D.load_boston($$$A)
      regex: '^(sklearn\.)?datasets\.'
  not: { matches: compat-code }
---
# No fix, because SimpleImputer is in another module, the code that uses the name is elsewhere,
# and axis has no counterpart.
id: removed-in-sklearn
language: python
severity: error
message: sklearn.preprocessing.Imputer was removed, and sklearn.impute.SimpleImputer replaces it. Its strategy works the same way, and it has no axis parameter.
rule:
  any:
    - kind: import_from_statement
      regex: '^from\s+sklearn\.preprocessing\s+import\b[^#]*\bImputer\b'
    - pattern: $P.Imputer($$$A)
      regex: '^(sklearn\.)?preprocessing\.'
  not: { matches: compat-code }
---
# A dotted path to a submodule that 1.9.1 does not have, such as sklearn.linear_model.logistic,
# which older releases had before the module was made private. The fix applies when every name
# the statement imports is exported by the subpackage.
# Safe: on scikit-learn 0.19.2, 0.20.4, 0.21.3, 0.22.2 and 0.23.2 each listed name was the same
# object in each listed module as in its subpackage.
