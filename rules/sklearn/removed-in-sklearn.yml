id: removed-in-sklearn
language: python
severity: error
message: sklearn.metrics.$F was removed. Call $D.from_estimator, or $D.from_predictions with predictions you already have.
rule:
  any:
    - kind: dotted_name
      pattern: $F
      inside: { kind: import_from_statement, has: { field: module_name, regex: '^sklearn\.metrics$' } }
    - kind: dotted_name
      pattern: $F
      inside: { kind: aliased_import, inside: { kind: import_from_statement, has: { field: module_name, regex: '^sklearn\.metrics$' } } }
    - kind: identifier
      pattern: $F
      inside: { kind: attribute, field: attribute, regex: '^(sklearn\.)?metrics\.\w+$' }
  not: { matches: compat-code }
constraints:
  F: { regex: '^plot_(confusion_matrix|roc_curve|precision_recall_curve)$' }
transform:
  D1: { replace: { source: $F, replace: '^plot_confusion_matrix$', by: ConfusionMatrixDisplay } }
  D2: { replace: { source: $D1, replace: '^plot_roc_curve$', by: RocCurveDisplay } }
  D: { replace: { source: $D2, replace: '^plot_precision_recall_curve$', by: PrecisionRecallDisplay } }
utils:
  compat-code: { any: [{ inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*(:|\(?[\w\s,.]*(ImportError|ModuleNotFoundError|AttributeError|TypeError|ValueError|Exception))' } } }, { inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } } }] }
