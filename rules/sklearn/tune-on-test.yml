# A loop that builds one model per setting, scores each on the test rows and keeps the scores
# picks the setting by the test score. The best of 30 such scores was 0.597 accuracy on noise.
# The rule needs a score, predict or predict_proba on a name with test in it, and the loop
# variable as a keyword of the call that built that model.
id: tune-on-test
language: python
severity: error
message: This loop picks $V by the score on the test rows, so the best score is too high. The best of 30 such scores was 0.597 accuracy on data with no signal. Pick $V with GridSearchCV or cross_val_score on the training rows, and score the test rows once.
rule:
  kind: for_statement
  all:
    - has: { field: left, kind: identifier, pattern: $V }
    - has:
        field: body
        stopBy: end
        kind: call
        any: [{ pattern: '$N.score($$$S)' }, { pattern: '$N.predict($$$S)' }, { pattern: '$N.predict_proba($$$S)' }]
        has: { field: arguments, has: { nthChild: 1, regex: '(?i)(^|[^a-z])test([^a-z]|$)', not: { regex: '(?i)train' } } }
    - has:
        field: body
        stopBy: end
        kind: assignment
        all:
          - has: { field: left, pattern: $N }
          # The model's own constructor takes the variable, as in Ridge(alpha=alpha) or
          # Ridge(alpha=alpha).fit(X, y). A loop over methods or seeds compares or averages, and
          # is left alone.
          - has:
              field: right
              any:
                - { kind: call, has: { field: arguments, has: { kind: keyword_argument, has: { field: value, pattern: $V }, not: { has: { field: name, regex: '(?i)method|alg|model|name|random_state|seed' } } } } }
                - has: { field: function, has: { field: object, kind: call, has: { field: arguments, has: { kind: keyword_argument, has: { field: value, pattern: $V }, not: { has: { field: name, regex: '(?i)method|alg|model|name|random_state|seed' } } } } } }
    # The loop picks: it compares a score with >, or a later max or argmax reads the list the
    # loop appends to. A loop that only draws a curve per setting is left alone.
    - any:
        - has: { field: body, stopBy: end, kind: comparison_operator, regex: '>' }
        - all:
            - precedes:
                stopBy: end
                has:
                  stopBy: end
                  any: [{ pattern: max($L) }, { pattern: $NP.argmax($L) }, { pattern: $NP.max($L) }, { pattern: $L.index(max($L)) }, { pattern: $L.idxmax() }]
            - has: { field: body, stopBy: end, pattern: $L.append($$$X) }
