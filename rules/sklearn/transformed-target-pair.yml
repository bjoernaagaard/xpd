# TransformedTargetRegressor takes either a transformer or both functions, and fit raises
# ValueError on any other mix.
# Unsafe: the old form raises at fit.
id: transformed-target-pair
language: python
severity: error
message: TransformedTargetRegressor raises ValueError at fit when it gets func without inverse_func. Write inverse_func=np.expm1, the inverse of np.log1p.
rule:
  pattern: $C($$$A)
  has: { field: arguments, has: { kind: keyword_argument, regex: '^func\s*=\s*np\.log1p$' } }
  not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^inverse_func$ } }] } } }
constraints:
  C: { regex: '(^|\.)TransformedTargetRegressor$' }
rewriters:
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }] }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$A, rewriters: [keep], joinBy: "" }
fix: $C($KEPTinverse_func=np.expm1)
metadata: { fix: unsafe }
---
# No fix, because the inverse of this function is not in the file.
id: transformed-target-pair
language: python
severity: error
message: TransformedTargetRegressor raises ValueError at fit when it gets func without inverse_func. Pass inverse_func too, such as np.expm1 for np.log1p.
rule:
  pattern: $C($$$A)
  has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^func$ }, not: { has: { field: value, regex: ^None$ } } } }
  not:
    any:
      - has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^inverse_func$ } }] } }
      - has: { field: arguments, has: { kind: keyword_argument, regex: '^func\s*=\s*np\.log1p$' } }
constraints:
  C: { regex: '(^|\.)TransformedTargetRegressor$' }
---
# No fix, because func is not in the file.
id: transformed-target-pair
language: python
severity: error
message: TransformedTargetRegressor raises ValueError at fit when it gets inverse_func without func. Pass func too.
rule:
  pattern: $C($$$A)
  has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^inverse_func$ }, not: { has: { field: value, regex: ^None$ } } } }
  not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^func$ } }] } } }
constraints:
  C: { regex: '(^|\.)TransformedTargetRegressor$' }
---
# No fix, because the message names two rewrites.
id: transformed-target-pair
language: python
severity: error
message: TransformedTargetRegressor raises ValueError at fit when it gets both a transformer and functions. Keep one of the two.
rule:
  pattern: $C($$$A)
  all:
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^transformer$ }, not: { has: { field: value, regex: ^None$ } } } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^(func|inverse_func)$ }, not: { has: { field: value, regex: ^None$ } } } }
constraints:
  C: { regex: '(^|\.)TransformedTargetRegressor$' }
