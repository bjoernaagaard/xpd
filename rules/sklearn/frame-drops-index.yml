# pd.DataFrame around a transform result numbers the rows from 0, and pd.concat(axis=1) pairs
# rows by index. After a split or a row filter the other frame keeps its own index, so rows
# meet the wrong rows. With signal, after a filter and a split, accuracy fell from 0.836 to
# 0.608 over 30 seeds. On data with no signal the score stays near 0.5, so this is info.
id: frame-drops-index
language: python
severity: info
message: pd.DataFrame numbers the rows of $V from 0, and pd.concat(axis=1) pairs rows by index, so after a split or a filter they meet the wrong rows. Pass index= with the index of the input, or call $S.set_output(transform="pandas"), which keeps it.
rule:
  pattern: $V = $PD.DataFrame($$$A)
  has:
    field: right
    all:
      - has: { field: arguments, has: { nthChild: 1, pattern: $S.$M($$$X) } }
      - not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^index$ } }] } } }
  inside:
    kind: expression_statement
    all:
      - precedes:
          stopBy: end
          has:
            stopBy: end
            pattern: $PD.concat($$$C)
            all:
              - has: { field: arguments, has: { kind: keyword_argument, regex: '^axis\s*=\s*(1|["'']columns["''])$' } }
              - has: { field: arguments, has: { kind: list, has: { pattern: $V } } }
              - not: { regex: 'reset_index|ignore_index' }
      - not: { precedes: { stopBy: end, has: { stopBy: end, any: [{ pattern: '$V.index = $I' }, { pattern: '$V = $V.set_index($$$J)' }, { pattern: '$V.set_index($$$J, inplace=True)' }] } } }
constraints:
  PD: { regex: ^(pd|pandas)$ }
  M: { regex: ^(fit_transform|transform)$ }
  V: { kind: identifier }
