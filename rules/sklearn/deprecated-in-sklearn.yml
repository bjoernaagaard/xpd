id: deprecated-in-sklearn
language: python
severity: warning
message: LogisticRegressionCV(penalty=) is deprecated since 1.8 and will be removed in 1.10. Pass l1_ratios instead, (0,) for L2, (1,) for L1 and values between for elasticnet.
rule:
  kind: keyword_argument
  has: { field: name, regex: ^penalty$ }
  inside:
    kind: argument_list
    inside: { kind: call, field: arguments, has: { field: function, regex: '(^|\.)LogisticRegressionCV$' } }
metadata: { since: "1.8" }
---
# Three defaults of LogisticRegressionCV each give a FutureWarning on fit: l1_ratios, scoring and
# use_legacy_attributes. The source names no release for use_legacy_attributes, so the document
# applies from 1.9, the release measured.
id: deprecated-in-sklearn
language: python
severity: warning
message: LogisticRegressionCV warns on fit until l1_ratios, scoring and use_legacy_attributes are all set, because their defaults change in 1.10 and 1.11. Pass l1_ratios=(0,) and scoring="accuracy" to keep the current fit, and use_legacy_attributes=True to keep the current attributes.
rule:
  pattern: $C($$$ARGS)
  not:
    any:
      - all:
          - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^l1_ratios$ } } }
          - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^scoring$ } } }
          - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^use_legacy_attributes$ } } }
      - has: { field: arguments, has: { kind: dictionary_splat } }
constraints:
  C: { regex: '(^|\.)LogisticRegressionCV$' }
metadata: { since: "1.9" }
---
# The regressors map "friedman_mse" to "squared_error" in __init__, so the stored parameter and
# the fitted trees are the same.
id: deprecated-in-sklearn
language: python
severity: warning
message: criterion="friedman_mse" is deprecated since 1.9 and will be removed in 1.11. Write criterion="squared_error", which 1.9 maps it to.
rule:
  kind: string
  regex: '^["'']friedman_mse["'']$'
  inside:
    kind: keyword_argument
    has: { field: name, regex: ^criterion$ }
    inside:
      kind: argument_list
      inside: { kind: call, field: arguments, has: { field: function, regex: '(^|\.)(RandomForestRegressor|ExtraTreesRegressor|DecisionTreeRegressor|ExtraTreeRegressor)$' } }
fix: '"squared_error"'
metadata: { fix: safe, since: "1.9" }
---
