# Each document finds a scikit-learn form that raises FutureWarning on 1.9.1 and will raise an
# error in a later release. The warning text names the release, and the message repeats it.
# Code inside a try block that catches TypeError or a version check is a compatibility path and
# stays silent.

id: deprecated-in-sklearn
language: python
severity: warning
message: $C(probability=) is deprecated since 1.9 and will be removed in 1.11. Wrap the model as CalibratedClassifierCV($C(), ensemble=False) to get predict_proba.
rule:
  pattern: $C($$$ARGS)
  has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^probability$ } } }
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, regex: '^probability\s*=\s*False$' } }
      - matches: compat-code
constraints:
  C: { regex: '(^|\.)(SVC|NuSVC)$' }
utils:
  compat-code:
    any:
      - inside: { kind: try_statement, stopBy: end, has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(TypeError|ValueError)' } }
      - inside: { kind: if_statement, stopBy: end, has: { field: condition, regex: '__version__|parse_version|sklearn_version|SKLEARN' } }
metadata: { since: "1.9" }
---
# probability=False is what the default does, so the keyword can go. The parameter that the
# estimator stores changes from False to "deprecated", and the fitted model stays the same.
id: deprecated-in-sklearn
language: python
severity: warning
message: $C(probability=) is deprecated since 1.9 and will be removed in 1.11. Drop probability=False, which is what the default does.
rule:
  pattern: $C($$$ARGS)
  has: { field: arguments, has: { kind: keyword_argument, regex: '^probability\s*=\s*False$' } }
  not: { has: { field: arguments, has: { kind: dictionary_splat } } }
constraints:
  C: { regex: '(^|\.)(SVC|NuSVC)$' }
rewriters:
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^probability$ } }
    fix: ""
  - id: keep
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^probability$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)
metadata: { fix: safe, since: "1.9" }
---
id: deprecated-in-sklearn
language: python
severity: warning
message: $X.$A is deprecated since 1.9 and will be removed in 1.11, with SVC(probability=True). Wrap the model in CalibratedClassifierCV(ensemble=False) and read its calibrators instead.
rule:
  pattern: $X.$A
  regex: '\.prob[AB]_$'
metadata: { since: "1.9" }
---
# penalty= on LogisticRegression. Since 1.8 l1_ratio picks the penalty, and its default 0.0
# gives the L2 penalty. The fixes below hold only when l1_ratio is not passed, because a passed
# l1_ratio would then pick the penalty instead.
id: deprecated-in-sklearn
language: python
severity: warning
message: LogisticRegression(penalty=) is deprecated since 1.8 and will be removed in 1.10. Drop penalty="l2", because the default l1_ratio=0 gives the L2 penalty.
rule:
  pattern: $C($$$ARGS)
  has: { field: arguments, has: { kind: keyword_argument, regex: '^penalty\s*=\s*["'']l2["'']$' } }
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^l1_ratio$ } } }
      - has: { field: arguments, has: { kind: dictionary_splat } }
constraints:
  C: { regex: '(^|\.)LogisticRegression$' }
rewriters:
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^penalty$ } }
    fix: ""
  - id: keep
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^penalty$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)
metadata: { fix: safe, since: "1.8" }
---
id: deprecated-in-sklearn
language: python
severity: warning
message: LogisticRegression(penalty=) is deprecated since 1.8 and will be removed in 1.10. Write l1_ratio=1 for the L1 penalty.
rule:
  kind: keyword_argument
  regex: '^penalty\s*=\s*["'']l1["'']$'
  inside:
    kind: argument_list
    not:
      any:
        - has: { kind: keyword_argument, has: { field: name, regex: ^l1_ratio$ } }
        - has: { kind: dictionary_splat }
    inside: { kind: call, field: arguments, has: { field: function, regex: '(^|\.)LogisticRegression$' } }
fix: l1_ratio=1
metadata: { fix: safe, since: "1.8" }
---
# The fix holds only for an l1_ratio written as a number strictly between 0 and 1. At 0 or 1 the
# deprecated default would pick the L2 or L1 penalty instead of elasticnet.
id: deprecated-in-sklearn
language: python
severity: warning
message: LogisticRegression(penalty=) is deprecated since 1.8 and will be removed in 1.10. Drop penalty="elasticnet", because an l1_ratio between 0 and 1 already gives that penalty.
rule:
  pattern: $C($$$ARGS)
  has: { field: arguments, has: { kind: keyword_argument, regex: '^penalty\s*=\s*["'']elasticnet["'']$' } }
  all:
    - has: { field: arguments, has: { kind: keyword_argument, regex: '^l1_ratio\s*=\s*0?\.0*[1-9]\d*$' } }
    - not: { has: { field: arguments, has: { kind: dictionary_splat } } }
constraints:
  C: { regex: '(^|\.)LogisticRegression$' }
rewriters:
  - id: drop
    rule: { kind: keyword_argument, has: { field: name, regex: ^penalty$ } }
    fix: ""
  - id: keep
    rule:
      pattern: $ARG
      not:
        any:
          - kind: comment
          - kind: keyword_argument
            has: { field: name, regex: ^penalty$ }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [drop, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $C($REST)
metadata: { fix: safe, since: "1.8" }
---
# Any other penalty=, such as None, a value held in a name, or l2 next to an l1_ratio.
id: deprecated-in-sklearn
language: python
severity: warning
message: LogisticRegression(penalty=) is deprecated since 1.8 and will be removed in 1.10. Set l1_ratio instead, 0 for L2, 1 for L1 and a value between for elasticnet, and C=np.inf for no penalty.
rule:
  kind: keyword_argument
  has: { field: name, regex: ^penalty$ }
  inside:
    kind: argument_list
    inside: { kind: call, field: arguments, has: { field: function, regex: '(^|\.)LogisticRegression$' } }
  not:
    any:
      - regex: '^penalty\s*=\s*["'']none["'']$'
      - all:
          - regex: '^penalty\s*=\s*["'']l2["'']$'
          - inside: { kind: argument_list, not: { has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^l1_ratio$ } }] } } }
      - all:
          - regex: '^penalty\s*=\s*["'']l1["'']$'
          - inside: { kind: argument_list, not: { has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^l1_ratio$ } }] } } }
      - all:
          - regex: '^penalty\s*=\s*["'']elasticnet["'']$'
          - inside: { kind: argument_list, has: { kind: keyword_argument, regex: '^l1_ratio\s*=\s*0?\.0*[1-9]\d*$' }, not: { has: { kind: dictionary_splat } } }
metadata: { since: "1.8" }
---
# l1_ratio=None with the default penalty gives the L2 penalty, the same as l1_ratio=0.
id: deprecated-in-sklearn
language: python
severity: warning
message: LogisticRegression(l1_ratio=None) is deprecated since 1.8 and will raise in 1.10. Write l1_ratio=0, which gives the same L2 penalty.
rule:
  kind: keyword_argument
  regex: '^l1_ratio\s*=\s*None$'
  inside:
    kind: argument_list
    not: { has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^penalty$ } }] } }
    inside: { kind: call, field: arguments, has: { field: function, regex: '(^|\.)LogisticRegression$' } }
fix: l1_ratio=0
metadata: { fix: safe, since: "1.8" }
---
