# The hdbscan package has an HDBSCAN class too, so the document needs the class imported from
# sklearn in the same file.
id: deprecated-in-sklearn
language: python
severity: warning
message: HDBSCAN without copy warns, because the default changes from False to True in 1.10. Pass copy=False to keep the current behavior, or copy=True to keep X unchanged.
rule:
  pattern: $C($$$ARGS)
  not:
    has:
      field: arguments
      has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^copy$ } }] }
  any:
    - regex: '^sklearn\.'
    - inside:
        kind: module
        stopBy: end
        has: { kind: import_from_statement, stopBy: end, all: [{ has: { field: module_name, regex: '^sklearn(\.|$)' } }, { has: { kind: dotted_name, pattern: $C } }] }
constraints:
  C: { regex: '(^|\.)HDBSCAN$' }
