# category_encoders has a TargetEncoder too, so the document needs the class imported from
# sklearn in the same file.
id: deprecated-in-sklearn
language: python
severity: warning
message: TargetEncoder(shuffle=, random_state=) is deprecated since 1.9 and will be removed in 1.11. Pass a splitter as cv, such as cv=KFold(5, shuffle=True, random_state=0).
rule:
  pattern: $C($$$ARGS)
  has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^(shuffle|random_state)$ } } }
  any:
    - regex: '^sklearn\.'
    - inside:
        kind: module
        stopBy: end
        has: { kind: import_from_statement, stopBy: end, all: [{ has: { field: module_name, regex: '^sklearn(\.|$)' } }, { has: { kind: dotted_name, pattern: $C } }] }
constraints:
  C: { regex: '(^|\.)TargetEncoder$' }
metadata: { since: "1.9" }
---
id: deprecated-in-sklearn
language: python
severity: warning
message: MDS(dissimilarity=) was renamed metric in 1.8, and the old name will be removed in 1.10. Write metric=.
rule:
  kind: identifier
  regex: ^dissimilarity$
  inside:
    kind: keyword_argument
    field: name
    inside:
      kind: argument_list
      not: { has: { kind: keyword_argument, has: { field: name, regex: ^metric$ } } }
      inside: { kind: call, field: arguments, has: { field: function, regex: '(^|\.)MDS$' } }
fix: metric
metadata: { fix: safe, since: "1.8" }
---
id: deprecated-in-sklearn
language: python
severity: warning
message: MDS(metric=True or False) was renamed metric_mds in 1.8, and the old form will be removed in 1.10. Write metric_mds=.
