  not:
    has:
      field: arguments
      has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^init$ } }] }
constraints:
  C: { regex: '(^|\.)MDS$' }
metadata: { since: "1.8" }
