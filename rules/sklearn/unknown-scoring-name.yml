          - inside: { kind: argument_list, inside: { kind: call, matches: takes-scoring } }
    - inside:
        any: [{ kind: list }, { kind: tuple }]
        inside:
          kind: keyword_argument
          all:
            - has: { field: name, regex: ^scoring$ }
            - inside: { kind: argument_list, inside: { kind: call, matches: takes-scoring } }
    - nthChild: 1
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '(^|\.)get_scorer$' } }
constraints:
  S: { regex: '^["''](accuracy_score|average_precision_score|balanced_accuracy_score|brier_score_loss|explained_variance_score|f1_score|jaccard_score|precision_score|r2_score|recall_score|roc_auc_score|top_k_accuracy_score)["'']$' }
transform:
  T1:
    replace:
      source: $S
      replace: '^([''"])brier_score_loss([''"])$'
      by: '${1}neg_brier_score${2}'
  FIXED:
    replace:
      source: $T1
      replace: '_score([''"])$'
      by: '$1'
fix: $FIXED
metadata: { fix: unsafe }
utils:
  takes-scoring:
    has:
      field: function
      regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV|cross_val_score|cross_validate|learning_curve|validation_curve|permutation_importance|RFECV|SequentialFeatureSelector|check_scoring|LogisticRegressionCV|TunedThresholdClassifierCV|BayesSearchCV)$'
