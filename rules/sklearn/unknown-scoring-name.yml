# get_scorer raises on any name outside sklearn.metrics.get_scorer_names(). The list below is
# that function's output on scikit-learn 1.9.1. A string with { or % in it is left alone,
# because it is a template that code fills in later. No fix, because the intended name is not in the
# file.
id: unknown-scoring-name
language: python
severity: error
message: $S is not a scorer name, so this raises. Pick a name from sklearn.metrics.get_scorer_names(). Losses carry the neg_ prefix, as in "neg_mean_squared_error".
rule:
  kind: string
  pattern: $S
  not: { regex: '[{%]|^[fFrRbB]+["'']' }
  any:
    - inside:
        kind: keyword_argument
        all:
          - has: { field: name, regex: ^scoring$ }
          - inside: { kind: argument_list, inside: { kind: call, matches: takes-scoring } }
    - inside:
        any: [{ kind: list }, { kind: tuple }]
        inside:
          kind: keyword_argument
          all:
            - has: { field: name, regex: ^scoring$ }
            - inside: { kind: argument_list, inside: { kind: call, matches: takes-scoring } }
    - nthChild: 1
      inside:
        kind: argument_list
        inside: { kind: call, has: { field: function, regex: '(^|\.)get_scorer$' } }
constraints:
  S: { regex: '^["''](brier_score|log_loss|max_error|mean_absolute_error|mean_absolute_percentage_error|mean_gamma_deviance|mean_poisson_deviance|mean_squared_error|mean_squared_log_error|median_absolute_error|negative_likelihood_ratio|root_mean_squared_error|root_mean_squared_log_error)["'']$' }
transform:
  FIXED:
    replace:
      source: $S
      replace: '^([''"])'
      by: '${1}neg_'
fix: $FIXED
metadata: { fix: unsafe }
utils:
  takes-scoring:
    has:
      field: function
      regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV|cross_val_score|cross_validate|learning_curve|validation_curve|permutation_importance|RFECV|SequentialFeatureSelector|check_scoring|LogisticRegressionCV|TunedThresholdClassifierCV|BayesSearchCV)$'
