# Column 0 of predict_proba is the probability of the first class. On data with no signal both
# columns give 0.5, so no proof can show the loss, and the documents are info.
# Unsafe: the score changes on purpose. A call with pos_label can mean the first class, so it has
# no fix.
id: auc-from-labels
language: python
severity: info
message: Column 0 of predict_proba is the probability of the first class, so this scores the model upside down. Write $M.predict_proba($$$X)[:, 1].
rule:
  pattern: $F($$$ARGS)
  has: { field: arguments, has: { nthChild: 2, pattern: '$M.predict_proba($$$X)[:, 0]' } }
  not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^pos_label$ } } } }
constraints:
  F: { regex: '(^|\.)(roc_auc_score|average_precision_score|roc_curve|precision_recall_curve|det_curve)$' }
rewriters:
  - id: score
    rule:
      nthChild: 2
      pattern: '$M.predict_proba($$$X)[:, 0]'
    fix: "$M.predict_proba($$$X)[:, 1], "
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }] }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [score, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $F($REST)
metadata: { fix: unsafe }
---
# No fix, because pos_label may name the first class, and then column 0 is right.
id: auc-from-labels
language: python
severity: info
message: Column 0 of predict_proba is the probability of the first class, so this scores the model upside down. Take column 1.
rule:
  pattern: $F($$$ARGS)
  all:
    - has: { field: arguments, has: { nthChild: 2, pattern: '$M.predict_proba($$$X)[:, 0]' } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^pos_label$ } } }
constraints:
  F: { regex: '(^|\.)(roc_auc_score|average_precision_score|roc_curve|precision_recall_curve|det_curve)$' }
---
# make_scorer calls predict unless response_method says otherwise, so the scorer ranks labels.
# On data with no signal both forms give 0.5, so the document is info. No fix, because the message
# names two rewrites.
id: auc-from-labels
language: python
severity: info
message: make_scorer calls predict by default, so $F ranks the class labels. Pass response_method=("decision_function", "predict_proba"), or use scoring="$NAME".
rule:
  kind: call
  all:
    - has: { field: function, regex: '^((sklearn\.)?metrics\.)?make_scorer$' }
    - has: { field: arguments, has: { nthChild: 1, pattern: $F } }
  not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^(response_method|needs_proba|needs_threshold)$ } } } }
constraints:
  F: { regex: '^(metrics\.)?(roc_auc_score|average_precision_score)$' }
transform:
  NAME: { replace: { source: $F, replace: '^(metrics\.)?(roc_auc|average_precision)(_score)?$', by: '$2' } }
metadata: { since: "1.4" }
