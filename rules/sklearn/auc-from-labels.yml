# multi_class says the target has more than two classes, and there roc_auc_score raises on one
# label per row.
# Unsafe: the score changes on purpose, and on a target with two classes the fixed form raises,
# because roc_auc_score then takes one score per row.
id: auc-from-labels
language: python
severity: error
message: roc_auc_score with multi_class needs one probability per class, and predict returns one label per row, which raises on more than two classes. Write $M.predict_proba($$$X).
rule:
  pattern: $F($$$ARGS)
  all:
    - has: { field: arguments, has: { nthChild: 2, pattern: '$M.predict($$$X)', not: { matches: predict-returns-scores } } }
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^multi_class$ } } }
constraints:
  F: { regex: '(^|\.)roc_auc_score$' }
rewriters:
  - id: score
    rule:
      nthChild: 2
      pattern: '$M.predict($$$X)'
    fix: "$M.predict_proba($$$X), "
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }] }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [score, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $F($REST)
utils:
  predict-returns-scores:
    inside:
      kind: module
      stopBy: end
      any:
        - has: { any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'keras|tensorflow|torch' }
        - has: { stopBy: end, pattern: '$M = $BOOSTER($$$TRAIN)', has: { field: right, has: { field: function, regex: '^(xgb|xgboost|lgb|lightgbm)\.(train|Booster)$' } } }
metadata: { fix: unsafe }
