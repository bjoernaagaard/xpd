# Ranking metrics need a score per row. predict returns class labels on a scikit-learn
# classifier, so the metric ranks two values. On data with no signal the labels and the
# probabilities both give 0.5, so no proof can show the loss, and these two documents are info.
# Files that import keras, tensorflow or torch are left
# alone, and so is a Booster that xgboost or lightgbm trained, because predict returns
# probabilities there. Neither document has a fix, because the first names two rewrites and the
# second reports an assignment whose name the metric reads elsewhere.
id: auc-from-labels
language: python
severity: info
message: $F ranks the rows by score, and predict returns the class labels, which leaves two values to rank. Pass predict_proba(X)[:, 1] or decision_function(X).
rule:
  pattern: $F($$$ARGS)
  has: { field: arguments, has: { nthChild: 2, pattern: '$M.predict($$$X)', not: { any: [{ matches: predict-of-predictions }, { matches: predict-returns-scores }] } } }
  not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^multi_class$ } } } }
constraints:
  F: { regex: '(^|\.)(roc_auc_score|average_precision_score|roc_curve|precision_recall_curve|det_curve)$' }
utils:
  predict-returns-scores:
    inside:
      kind: module
      stopBy: end
      any:
        - has: { any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'keras|tensorflow|torch' }
        - has: { stopBy: end, pattern: '$M = $BOOSTER($$$TRAIN)', has: { field: right, has: { field: function, regex: '^(xgb|xgboost|lgb|lightgbm)\.(train|Booster)$' } } }
  # A calibrator's predict takes predictions and returns probabilities.
  predict-of-predictions:
    has: { field: arguments, has: { nthChild: 1, regex: '(?i)pred|prob|score' } }
---
id: auc-from-labels
language: python
severity: info
message: $V holds the class labels that predict returned, and this metric ranks the rows by score. Pass predict_proba(X)[:, 1] or decision_function(X).
rule:
  pattern: $V = $M.predict($$$X)
  not:
    any:
      # A calibrator's predict takes predictions and returns probabilities.
      - has: { stopBy: end, kind: argument_list, has: { nthChild: 1, regex: '(?i)pred|prob|score' } }
      - matches: predict-returns-scores
  inside:
    kind: expression_statement
    precedes: { stopBy: end, has: { stopBy: end, matches: metric-of-v } }
    # A name assigned again and then scored is reported at the later assignment.
    not:
      precedes:
        stopBy: end
        has: { pattern: '$V = $OTHER' }
        precedes: { stopBy: end, has: { stopBy: end, matches: metric-of-v } }
constraints:
  V: { kind: identifier }
utils:
  metric-of-v:
    kind: call
    all:
      - has: { field: function, regex: '(^|\.)(roc_auc_score|average_precision_score|roc_curve|precision_recall_curve|det_curve)$' }
      - has: { field: arguments, has: { nthChild: 2, pattern: $V } }
  predict-returns-scores:
    inside:
      kind: module
      stopBy: end
      any:
        - has: { any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'keras|tensorflow|torch' }
        - has: { stopBy: end, pattern: '$M = $BOOSTER($$$TRAIN)', has: { field: right, has: { field: function, regex: '^(xgb|xgboost|lgb|lightgbm)\.(train|Booster)$' } } }

---
# Unsafe: the fix changes the loss on purpose, and predict_proba raises on a model that has none.
id: auc-from-labels
language: python
severity: error
message: log_loss scores probabilities, and predict returns the class labels, so every wrong label costs the largest loss there is. It scored 18.0 on data with no signal, where the honest loss is 0.69. Pass predict_proba.
rule:
  pattern: $M.predict($$$X)
  nthChild: 2
  inside: { kind: argument_list, inside: { kind: call, has: { field: function, regex: '(^|\.)log_loss$' } } }
  not:
    any:
      - has: { field: arguments, has: { nthChild: 1, regex: '(?i)pred|prob|score' } }
      - matches: predict-returns-scores
utils:
  predict-returns-scores:
    inside:
      kind: module
      stopBy: end
      any:
        - has: { any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'keras|tensorflow|torch' }
        - has: { stopBy: end, pattern: '$M = $BOOSTER($$$TRAIN)', has: { field: right, has: { field: function, regex: '^(xgb|xgboost|lgb|lightgbm)\.(train|Booster)$' } } }
fix: $M.predict_proba($$$X)
metadata: { fix: unsafe }
---
# Unsafe: the loss changes on purpose, and on more than two classes column 1 is one class only.
id: auc-from-labels
language: python
severity: error
message: brier_score_loss scores probabilities, and predict returns the class labels, so it counts the wrong labels. It scored 0.50 on data with no signal, where the honest loss is 0.25. Write $M.predict_proba($$$X)[:, 1].
rule:
  pattern: $F($$$ARGS)
  has: { field: arguments, has: { nthChild: 2, pattern: '$M.predict($$$X)', not: { any: [{ matches: predict-of-predictions }, { matches: predict-returns-scores }] } } }
constraints:
  F: { regex: '(^|\.)brier_score_loss$' }
rewriters:
  - id: score
    rule:
      nthChild: 2
      pattern: '$M.predict($$$X)'
    fix: "$M.predict_proba($$$X)[:, 1], "
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }] }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$ARGS, rewriters: [score, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $F($REST)
utils:
  predict-returns-scores:
    inside:
      kind: module
      stopBy: end
      any:
        - has: { any: [{ kind: import_statement }, { kind: import_from_statement }], regex: 'keras|tensorflow|torch' }
        - has: { stopBy: end, pattern: '$M = $BOOSTER($$$TRAIN)', has: { field: right, has: { field: function, regex: '^(xgb|xgboost|lgb|lightgbm)\.(train|Booster)$' } } }
  predict-of-predictions:
    has: { field: arguments, has: { nthChild: 1, regex: '(?i)pred|prob|score' } }
metadata: { fix: unsafe }
