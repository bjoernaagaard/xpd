id: auc-from-labels
language: python
severity: error
message: $F takes one score per row, and predict_proba returns one column per class, so this raises. Write $M.predict_proba($$$X)[:, 1].
rule:
  pattern: $F($$$ARGS)
  has: { field: arguments, has: { nthChild: 2, pattern: '$M.predict_proba($$$X)' } }
  not: { has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^multi_class$ } } } }
constraints:
  F: { regex: '(^|\.)(roc_curve|precision_recall_curve|det_curve)$' }
rewriters:
  - id: score
    rule:
      nthChild: 2
