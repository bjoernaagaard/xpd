# XGBoost keeps the boosting round with the best score on eval_set. When eval_set holds the test
# rows, the test rows chose the model that is scored on them. The rule needs early stopping in
# the file and a model built from an XGBoost class, because LightGBM's early stopping on the same
# rows gave no measurable gap and CatBoost was not measured. It reads the names in eval_set.
id: early-stopping-on-test
language: python
severity: error
message: eval_set holds the test rows and early stopping keeps the round that scored best on them, so the test score is too high. It scored 0.557 AUC on data with no signal. Hold a validation part out of the training rows for eval_set.
rule:
  pattern: $M.fit($$$A)
  has:
    field: arguments
    has:
      kind: keyword_argument
      all:
        - has: { field: name, regex: '^eval_set$' }
        - has: { field: value, regex: '(?i)(^|[^a-z])test([^a-z]|$)', not: { regex: '(?i)train' } }
  any:
    - has: { field: function, has: { field: object, kind: call, has: { field: function, regex: '^((xgb|xgboost)\.)?XGB(Classifier|Regressor|RFClassifier|RFRegressor|Ranker)$' } } }
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          kind: assignment
          all:
            - has: { field: left, pattern: $M }
            - has: { field: right, kind: call, has: { field: function, regex: '^((xgb|xgboost)\.)?XGB(Classifier|Regressor|RFClassifier|RFRegressor|Ranker)$' } }
  inside: { kind: module, stopBy: end, regex: 'early_stopping_rounds' }
