# groups reaches only a splitter whose name has Group in it. KFold, StratifiedKFold and an int
# cv drop it with a UserWarning, so rows of one group land on both sides of a fold. On 40
# groups of 5 near-copies with a label drawn per group and no link to X, 1-NN scored 0.998 with
# cv=5 and 0.487 with GroupKFold, over 30 seeds. A cv held in a variable is left alone, because
# the pattern cannot see what it holds.
id: groups-ignored
language: python
severity: error
message: $F ignores groups with this cv, so rows of one group sit in both the training and the test folds. It scored 0.998 on data with no signal. Pass cv=GroupKFold(n_splits=5).
rule:
  pattern: $F($$$ARGS)
  has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^groups$ }, not: { has: { field: value, regex: ^None$ } } } }
  not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { matches: other-cv }] } } }
constraints:
  F: { regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
utils:
  # A cv keyword whose value is neither a whole number nor a splitter that drops groups.
  other-cv:
    kind: keyword_argument
    has: { field: name, regex: ^cv$ }
    not: { has: { field: value, matches: plain-cv } }
  plain-cv:
    any:
      - kind: integer
      - kind: call
        has: { field: function, regex: '(^|\.)(KFold|StratifiedKFold|ShuffleSplit|StratifiedShuffleSplit|RepeatedKFold|RepeatedStratifiedKFold|TimeSeriesSplit|LeaveOneOut|LeavePOut)$' }
---
# The search built in the same block with no cv, an int cv, or a splitter that drops groups,
# and fitted with groups=.
id: groups-ignored
language: python
severity: error
message: The search ignores groups with this cv, so rows of one group sit in both the training and the test folds. Pass cv=GroupKFold(n_splits=5) to the search.
rule:
  pattern: $S.fit($$$A)
  has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^groups$ }, not: { has: { field: value, regex: ^None$ } } } }
  any:
    - has: { field: function, has: { field: object, matches: search-without-group-cv } }
    - inside:
        stopBy: end
        kind: expression_statement
        follows:
          stopBy: end
          kind: expression_statement
          has:
            kind: assignment
            all:
              - has: { field: left, pattern: $S }
              - has: { field: right, matches: search-without-group-cv }
utils:
  search-without-group-cv:
    kind: call
    has: { field: function, regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV)$' }
    not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { matches: other-cv }] } } }
  other-cv:
    kind: keyword_argument
    has: { field: name, regex: ^cv$ }
    not: { has: { field: value, matches: plain-cv } }
  plain-cv:
    any:
      - kind: integer
      - kind: call
        has: { field: function, regex: '(^|\.)(KFold|StratifiedKFold|ShuffleSplit|StratifiedShuffleSplit|RepeatedKFold|RepeatedStratifiedKFold|TimeSeriesSplit|LeaveOneOut|LeavePOut)$' }
---
# A group splitter given no groups raises ValueError on scikit-learn 1.9.1. With metadata
# routing on, groups travel in params, so a call with params is left alone.
id: groups-ignored
language: python
severity: error
message: $F raises ValueError here, because a group splitter needs groups and this call passes none. Pass groups=, one group label per row.
rule:
  pattern: $F($$$ARGS)
  has:
    field: arguments
    has:
      kind: keyword_argument
      all:
        - has: { field: name, regex: ^cv$ }
        - has: { field: value, kind: call, has: { field: function, regex: '(^|\.)(GroupKFold|StratifiedGroupKFold|GroupShuffleSplit|LeaveOneGroupOut|LeavePGroupsOut)$' } }
  not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^(groups|params|fit_params)$ } }] } } }
constraints:
  F: { regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
