# The search built in the fit call itself with no cv. GroupKFold(n_splits=5) splits into 5 folds,
# the default number.
# Unsafe: the folds change on purpose.
id: groups-ignored
language: python
severity: error
message: The search ignores groups with this cv, so rows of one group sit in both the training and the test folds. Write cv=GroupKFold(n_splits=5) in the search.
rule:
  pattern: $G($$$GA).fit($$$A)
  all:
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^groups$ }, not: { has: { field: value, regex: ^None$ } } } }
    - has: { field: function, has: { field: object, matches: search-without-cv } }
utils:
  search-without-cv:
    kind: call
    has: { field: function, regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV)$' }
    not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^cv$ } }] } } }
rewriters:
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }] }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$GA, rewriters: [keep], joinBy: "" }
fix: $G($KEPTcv=GroupKFold(n_splits=5)).fit($$$A)
metadata: { fix: unsafe }
---
# The search built in the same block with no cv, an int cv, or a splitter that drops groups,
# and fitted with groups=. No fix, because the search is built in another statement, or its cv
# is already passed.
id: groups-ignored
language: python
severity: error
message: The search ignores groups with this cv, so rows of one group sit in both the training and the test folds. Pass cv=GroupKFold(n_splits=5) to the search.
rule:
  pattern: $S.fit($$$A)
  has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^groups$ }, not: { has: { field: value, regex: ^None$ } } } }
  not: { has: { field: function, has: { field: object, matches: search-without-cv } } }
  any:
    - has: { field: function, has: { field: object, matches: search-without-group-cv } }
    - inside:
        stopBy: end
        kind: expression_statement
        follows:
          stopBy: end
          kind: expression_statement
          has:
            kind: assignment
            all:
              - has: { field: left, pattern: $S }
              - has: { field: right, matches: search-without-group-cv }
utils:
  search-without-cv:
    kind: call
    has: { field: function, regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV)$' }
    not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { kind: keyword_argument, has: { field: name, regex: ^cv$ } }] } } }
  search-without-group-cv:
    kind: call
    has: { field: function, regex: '(^|\.)(GridSearchCV|RandomizedSearchCV|HalvingGridSearchCV|HalvingRandomSearchCV)$' }
    not: { has: { field: arguments, has: { any: [{ kind: dictionary_splat }, { matches: other-cv }] } } }
  other-cv:
    kind: keyword_argument
    has: { field: name, regex: ^cv$ }
    not: { has: { field: value, matches: plain-cv } }
  plain-cv:
    any:
      - kind: integer
      - kind: call
        has: { field: function, regex: '(^|\.)(KFold|StratifiedKFold|ShuffleSplit|StratifiedShuffleSplit|RepeatedKFold|RepeatedStratifiedKFold|TimeSeriesSplit|LeaveOneOut|LeavePOut)$' }
