# groups= reaches the splitter, and these splitters ignore it with a UserWarning. When cv is
# missing or an integer, cross_val_score splits with KFold or StratifiedKFold, which ignore it too.
# A cv given as a name is left alone, because the name can hold a group splitter.
# GroupKFold takes the same arguments as KFold, so the fix keeps them.
# Unsafe: the folds change on purpose.
id: groups-ignored
language: python
severity: error
message: cv=$K($$$KA) ignores groups=, so rows of one group are in the training and the test folds, and on data with no signal this scored 0.85 where GroupKFold scored 0.48. Write cv=GroupKFold($$$KA).
rule:
  pattern: $F($$$A)
  all:
    - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^groups$' } } }
    - has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^cv$' } }, { has: { field: value, pattern: '$K($$$KA)' } }] } }
constraints:
  F: { regex: '(^|\.)(cross_val_score|cross_validate|cross_val_predict|learning_curve|validation_curve|permutation_test_score)$' }
  K: { regex: '(^|\.)KFold$' }
rewriters:
  - id: group
    rule: { kind: keyword_argument, all: [{ has: { field: name, regex: ^cv$ } }, { has: { field: value, pattern: '$S($$$SA)' } }] }
    transform:
      G: { replace: { source: $S, replace: 'KFold$', by: 'GroupKFold' } }
    fix: "cv=$G($$$SA), "
  - id: keep
    rule:
      pattern: $ARG
      not: { any: [{ kind: comment }, { kind: line_continuation }] }
    fix: "$ARG, "
transform:
  KEPT:
    rewrite: { source: $$$A, rewriters: [group, keep], joinBy: "" }
  REST:
    replace: { source: $KEPT, replace: ", $", by: "" }
fix: $F($REST)
metadata: { fix: unsafe }
