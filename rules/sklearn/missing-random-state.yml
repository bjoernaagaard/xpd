# Without random_state these draw from a new seed on every run, so a result cannot be
# reproduced. A seed does not move the expected score, so the rule is info. Each class listed gave
# another output in five fresh runs on scikit-learn 1.9.1. LogisticRegression, PCA, TSNE with its
# default init, GaussianMixture with one component, Perceptron and AdaBoostClassifier gave the same
# output and are not listed. A file that calls np.random.seed is left alone, because scikit-learn
# then draws from that seed.
id: missing-random-state
language: python
severity: info
message: train_test_split shuffles with a new seed on every run, so the score changes from run to run. Pass random_state.
rule:
  pattern: train_test_split($$$ARGS)
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(random_state|shuffle)$' } } }
      - has: { field: arguments, has: { kind: dictionary_splat } }
      - inside: { kind: module, stopBy: end, has: { stopBy: end, pattern: '$NP.random.seed($$$S)' } }
---
id: missing-random-state
language: python
severity: info
message: $C draws random numbers with a new seed on every run, so the result changes from run to run. Pass random_state.
rule:
  pattern: $C($$$ARGS)
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^random_state$' } } }
      - has: { field: arguments, has: { kind: dictionary_splat } }
      - inside: { kind: module, stopBy: end, has: { stopBy: end, pattern: '$NP.random.seed($$$S)' } }
constraints:
  C: { regex: '(^|\.)(RandomForest(Classifier|Regressor)|ExtraTrees?(Classifier|Regressor)|Bagging(Classifier|Regressor)|GradientBoosting(Classifier|Regressor)|AdaBoostRegressor|IsolationForest|RandomTreesEmbedding|DecisionTree(Classifier|Regressor)|KMeans|MiniBatchKMeans|SpectralClustering|AffinityPropagation|MLP(Classifier|Regressor)|SGD(Classifier|Regressor|OneClassSVM)|TruncatedSVD|NMF|LatentDirichletAllocation|FastICA|MiniBatchDictionaryLearning|MDS|SpectralEmbedding|Nystroem|RBFSampler|(Sparse|Gaussian)RandomProjection|ShuffleSplit|StratifiedShuffleSplit|Repeated(Stratified)?KFold)$' }
---
id: missing-random-state
language: python
severity: info
message: $C with shuffle=True shuffles with a new seed on every run, so the folds change from run to run. Pass random_state.
rule:
  pattern: $C($$$ARGS)
  has: { field: arguments, has: { kind: keyword_argument, regex: '^shuffle\s*=\s*True$' } }
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^random_state$' } } }
      - inside: { kind: module, stopBy: end, has: { stopBy: end, pattern: '$NP.random.seed($$$S)' } }
constraints:
  C: { regex: '(^|\.)(KFold|StratifiedKFold|GroupKFold|StratifiedGroupKFold)$' }
---
# These draw random numbers only with the argument shown: TSNE(init="random"),
# SVC(probability=True), HistGradientBoosting with early_stopping=True, and a mixture with more
# than one component.
id: missing-random-state
language: python
severity: info
message: $C with these arguments draws random numbers with a new seed on every run, so the result changes from run to run. Pass random_state.
rule:
  pattern: $C($$$ARGS)
  any:
    - all: [{ has: { field: function, regex: '(^|\.)TSNE$' } }, { has: { field: arguments, has: { kind: keyword_argument, regex: '^init\s*=\s*.random.$' } } }]
    - all: [{ has: { field: function, regex: '(^|\.)SVC$' } }, { has: { field: arguments, has: { kind: keyword_argument, regex: '^probability\s*=\s*True$' } } }]
    - all: [{ has: { field: function, regex: '(^|\.)HistGradientBoosting(Classifier|Regressor)$' } }, { has: { field: arguments, has: { kind: keyword_argument, regex: '^early_stopping\s*=\s*True$' } } }]
    - all: [{ has: { field: function, regex: '(^|\.)(Bayesian)?GaussianMixture$' } }, { has: { field: arguments, has: { kind: keyword_argument, all: [{ has: { field: name, regex: '^n_components$' } }, { not: { has: { field: value, regex: '^1$' } } }] } } }]
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^random_state$' } } }
      - has: { field: arguments, has: { kind: dictionary_splat } }
      - inside: { kind: module, stopBy: end, has: { stopBy: end, pattern: '$NP.random.seed($$$S)' } }
---
# With more than 10000 rows HistGradientBoosting stops early on a validation part it draws at
# random, so from that size the result changes. A pattern cannot see the number of rows.
id: missing-random-state
language: python
severity: info
message: $C holds out a random validation part when it gets more than 10000 rows, so from that size the result changes from run to run. Pass random_state.
rule:
  pattern: $C($$$ARGS)
  not:
    any:
      - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: '^(random_state|early_stopping)$' } } }
      - has: { field: arguments, has: { kind: dictionary_splat } }
      - inside: { kind: module, stopBy: end, has: { stopBy: end, pattern: '$NP.random.seed($$$S)' } }
constraints:
  C: { regex: '(^|\.)HistGradientBoosting(Classifier|Regressor)$' }
