---
# No fix when a splat comes before the third argument, because then the code does not show which
# parameter the argument fills.
id: positional-tolerance
language: python
severity: warning
message: The third argument of $NP.$F is rtol, a relative tolerance, and atol stays 1e-8. Name it, as in rtol=$T, or write atol=$T for an absolute tolerance.
rule:
  any:
    - pattern: $NP.$F($A, $B, $T)
    - pattern: "$NP.$F($A, $B, $T, $$$REST)"
  has: { field: arguments, any: [{ has: { nthChild: 1, any: [{ kind: list_splat }, { kind: dictionary_splat }] } }, { has: { nthChild: 2, any: [{ kind: list_splat }, { kind: dictionary_splat }] } }] }
  not:
    has:
      field: arguments
      any:
        - has: { nthChild: 4, not: { kind: keyword_argument } }
        - has: { kind: keyword_argument, has: { field: name, regex: ^atol$ } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(isclose|allclose)$' }
  T:
    not:
      any:
        - kind: keyword_argument
        - kind: list_splat
        - kind: dictionary_splat
        - regex: '(?i)rtol'
