# np.core.<name> was the same object as np.<name> for the public names. The fix is unsafe,
# because np.core also held private names that the main namespace does not export.
id: deprecated-in-numpy-2
language: python
severity: warning
message: numpy.core is private since NumPy 2.0 and warns on use. Write $NP.$N.
rule:
  all:
    - pattern: $NP.core.$N
      not: { inside: { kind: assignment, field: left } }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
constraints:
  NP: { regex: '^(np|numpy)$' }
  N: { regex: '^[a-zA-Z]\w*$', not: { regex: '^(records|defchararray|multiarray|numeric|umath|fromnumeric|numerictypes|shape_base|function_base|einsumfunc|arrayprint|getlimits|overrides|umath_tests)$' } }
fix: $NP.$N
metadata: { fix: unsafe, since: "2.0" }
