# NumPy stores no time zone and warns when the string has one. "Z" means UTC, which is what the
# value already is without it.
id: deprecated-in-numpy-2
language: python
severity: warning
message: datetime64 warns on a time zone in the string because NumPy stores none. Write $NEW, which gives the same time.
rule:
  all:
    - kind: string
      pattern: $S
