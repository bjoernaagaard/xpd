# Each document finds a NumPy form that warns on NumPy 2.5, mostly with a DeprecationWarning,
# and will raise in a later release. The release notes of 2.0 to 2.5 announce each one.

# numpy.core became the private numpy._core in NumPy 2.0. Its old names still work, with a
# DeprecationWarning on the first use. On NumPy 1, numpy.core is where these names live, so the
# documents apply from 2.0. _multiarray_umath and multiarray._reconstruct stay silent
# because pickles from NumPy 1 name them, so they are left alone.
id: deprecated-in-numpy-2
language: python
severity: warning
message: numpy.core is private since NumPy 2.0 and warns on use. Import the public names from numpy, and normalize_axis_index or normalize_axis_tuple from numpy.lib.array_utils.
rule:
  all:
    - kind: dotted_name
      regex: '^numpy\.core(\.\w+)*$'
      not: { regex: '^numpy\.core\.(_multiarray_umath|umath_tests)(\.\w+)*$' }
      any:
        - inside: { kind: import_from_statement, field: module_name, not: { has: { field: name, regex: '^_reconstruct$' } } }
        - inside: { kind: import_statement }
        - inside: { kind: aliased_import, inside: { kind: import_statement } }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
metadata: { since: "2.0" }
