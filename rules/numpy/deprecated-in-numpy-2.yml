# NumPy 2.5 deprecated fix. trunc rounds toward zero too, and returns the same values and dtype
# on every input that was tried, from bool to object arrays.
id: deprecated-in-numpy-2
language: python
severity: warning
message: $NP.fix is deprecated since NumPy 2.5. Write $NP.trunc, which gives the same result and is faster.
rule:
  all:
    - pattern: $NP.fix
      not:
        any:
          - inside: { kind: assignment, field: left }
          # trunc takes its input by position only, so fix(x=...) is left alone.
          - inside: { kind: call, field: function, has: { field: arguments, has: { kind: keyword_argument } } }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
constraints:
  NP: { regex: '^(np|numpy)$' }
fix: $NP.trunc
metadata: { fix: safe }
