# NumPy 2.0 deprecated s= without axes= on the n-dimensional transforms. Today s applies to the
# last len(s) axes, and a later release will apply it to the axes given.
id: deprecated-in-numpy-2
language: python
severity: warning
message: $F with s= and no axes= is deprecated since NumPy 2.0. Pass axes= too, such as axes=range(-len(s), 0) for the last axes.
rule:
  all:
    - pattern: $F($$$ARGS)
      any:
        - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^s$ } } }
        - has: { field: arguments, has: { nthChild: 2, not: { kind: keyword_argument } } }
      not:
        any:
          - has: { field: arguments, has: { kind: keyword_argument, has: { field: name, regex: ^axes$ } } }
          - has: { field: arguments, has: { nthChild: 3, not: { kind: keyword_argument } } }
          - has: { field: arguments, has: { any: [{ kind: list_splat }, { kind: dictionary_splat }] } }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
constraints:
  F: { regex: '^(np|numpy)\.fft\.(fftn|ifftn|rfftn|irfftn)$' }
