# random_integers(low, high, size) draws what randint(low, high + 1, size) draws from the same
# state. Without a size it returns a NumPy integer where randint returns a Python int, so that
# fix is unsafe. The fix applies when high is a name, a number, an attribute, a call or a
# subscript, so that adding 1 needs no brackets.
# Unsafe: the pattern cannot tell a RandomState from another object with a random_integers
# method.
id: deprecated-in-numpy-2
language: python
severity: warning
message: random_integers is deprecated. Write $R.randint($LO, $HI + 1, $SIZE), which draws the same numbers.
rule:
  all:
    - { pattern: '$R.random_integers($LO, $HI, $SIZE)' }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
constraints:
  HI: { any: [{ kind: identifier }, { kind: integer }, { kind: attribute }, { kind: call }, { kind: subscript }] }
  SIZE: { not: { any: [{ kind: list_splat }, { kind: dictionary_splat }] } }
fix: $R.randint($LO, $HI + 1, $SIZE)
metadata: { fix: unsafe }
