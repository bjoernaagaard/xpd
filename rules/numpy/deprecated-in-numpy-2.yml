# Setting shape, dtype or strides on an array warns since NumPy 2.4 and 2.5, because another
# thread or view can share the array. The rule needs the name to be bound from an np call in the
# same function, which proves it holds an array. The view fixes are unsafe, because other names
# that share the old array keep its shape or dtype.
id: deprecated-in-numpy-2
language: python
severity: warning
message: Setting $X.shape is deprecated since NumPy 2.5. Write $X = $X.reshape($V).
rule:
  all:
    - pattern: $X.shape = $V
      matches: numpy-array
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
  numpy-array:
    inside:
      kind: function_definition
      stopBy: end
      has:
        kind: assignment
        stopBy: end
        all:
          - has: { field: left, pattern: $X }
          - has: { field: right, regex: '^(np|numpy)\.' }
constraints:
  X: { kind: identifier }
fix: $X = $X.reshape($V)
metadata: { fix: unsafe }
