# The np.dot docs prefer matmul or `a @ b` when both arrays are 2-D:
# https://numpy.org/doc/stable/reference/generated/numpy.dot.html
# Unsafe: @ raises on a scalar and on two Python lists, and for arrays of more than two
# dimensions it broadcasts stacks of matrices where np.dot sums over the last axis of the
# first array and the second to last of the second. An operand that binds less tightly than @,
# such as a + 1, gets parentheses, and the call stands where @ needs no parentheses of its own.
id: dot-on-matrices
language: python
severity: info
message: For 2-D arrays NumPy's docs prefer the @ operator to $NP.dot. Write $PA @ $PB.
rule:
  pattern: "$NP.dot($A, $B)"
  not: { matches: tight-context }
constraints:
  NP: { regex: '^(np|numpy)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
utils:
  # A place where `a @ b` would be read as part of a larger operand, as in np.dot(a, b).T.
  tight-context:
    any:
      - inside: { kind: attribute, field: object }
      - inside: { kind: subscript, field: value }
      - inside: { kind: call, field: function }
      - inside: { kind: unary_operator }
      - inside: { kind: binary_operator, has: { field: operator, regex: '^\*\*$' } }
      - inside: { kind: binary_operator, field: right, has: { field: operator, regex: '^(\*|/|//|%|@)$' } }
rewriters:
  - id: tight
    rule: { pattern: $X, any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }, { kind: call }, { kind: parenthesized_expression }] }
    fix: $X
  - id: wrap
    rule: { pattern: $X }
    fix: ($X)
transform:
  PA: { rewrite: { source: $A, rewriters: [tight, wrap] } }
  PB: { rewrite: { source: $B, rewriters: [tight, wrap] } }
fix: $PA @ $PB
metadata: { fix: unsafe }
---
# Unsafe for the same reasons, and the product gets parentheses of its own.
id: dot-on-matrices
language: python
severity: info
message: For 2-D arrays NumPy's docs prefer the @ operator to $NP.dot. Write ($PA @ $PB).
rule:
  pattern: "$NP.dot($A, $B)"
  matches: tight-context
constraints:
  NP: { regex: '^(np|numpy)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
utils:
  tight-context:
    any:
      - inside: { kind: attribute, field: object }
      - inside: { kind: subscript, field: value }
      - inside: { kind: call, field: function }
      - inside: { kind: unary_operator }
      - inside: { kind: binary_operator, has: { field: operator, regex: '^\*\*$' } }
      - inside: { kind: binary_operator, field: right, has: { field: operator, regex: '^(\*|/|//|%|@)$' } }
rewriters:
  - id: tight
    rule: { pattern: $X, any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }, { kind: call }, { kind: parenthesized_expression }] }
    fix: $X
  - id: wrap
    rule: { pattern: $X }
    fix: ($X)
transform:
  PA: { rewrite: { source: $A, rewriters: [tight, wrap] } }
  PB: { rewrite: { source: $B, rewriters: [tight, wrap] } }
fix: ($PA @ $PB)
metadata: { fix: unsafe }
