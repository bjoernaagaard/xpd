# Calls whose arguments sit in the wrong places, so the call raises on every input. The fixes
# are unsafe, because the old form raised and the new form returns an array.

# The second argument of np.zeros, np.ones and np.empty is the dtype.
id: argument-in-wrong-slot
language: python
severity: error
message: The second argument of $NP.$F is the dtype, so $NP.$F($A, $B) raises TypeError. Pass the shape as one tuple, $NP.$F(($A, $B)).
rule:
  pattern: $NP.$F($A, $B)
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(zeros|ones|empty)$' }
  B: { kind: integer }
fix: $NP.$F(($A, $B))
metadata: { fix: unsafe }
---
id: argument-in-wrong-slot
language: python
severity: error
message: The third argument of $NP.full is the dtype, so this raises TypeError. Pass the shape as one tuple, $NP.full(($A, $B), $C).
rule:
  pattern: $NP.full($A, $B, $C)
constraints:
  NP: { regex: '^(np|numpy)$' }
  C: { kind: integer }
fix: $NP.full(($A, $B), $C)
metadata: { fix: unsafe }
---
# The third argument of np.reshape is the order, a string.
id: argument-in-wrong-slot
language: python
severity: error
message: The third argument of $NP.reshape is the order, so this raises TypeError. Pass the shape as one tuple, $NP.reshape($A, ($B, $C)).
rule:
  pattern: $NP.reshape($A, $B, $C)
constraints:
  NP: { regex: '^(np|numpy)$' }
  B: { kind: integer }
  C: { kind: integer }
fix: $NP.reshape($A, ($B, $C))
metadata: { fix: unsafe }
---
# np.vstack and its kin take one sequence of arrays, and their other parameters are keyword only.
id: argument-in-wrong-slot
language: python
severity: error
message: $NP.$F takes one sequence of arrays, so two positional arguments raise TypeError. Write $NP.$F(($A, $B)).
rule:
  pattern: $NP.$F($A, $B)
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(vstack|hstack|dstack|column_stack)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: $NP.$F(($A, $B))
metadata: { fix: unsafe }
---
id: argument-in-wrong-slot
language: python
severity: error
message: $NP.$F takes one sequence of arrays, so more than one positional argument raises TypeError. Put the arrays in one tuple.
rule:
  pattern: $NP.$F($$$ARGS)
  has:
    field: arguments
    all:
      - has: { nthChild: 2, not: { kind: keyword_argument } }
      - has: { nthChild: 3 }
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(vstack|hstack|dstack|column_stack)$' }
---
# The second argument of np.concatenate and np.stack is the axis, so a list, a tuple or an array
# there is an array that was meant to join the first.
id: argument-in-wrong-slot
language: python
severity: error
message: The second argument of $NP.$F is the axis, so passing $B there raises TypeError. Write $NP.$F(($A, $B)).
rule:
  pattern: $NP.$F($A, $B)
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(concatenate|stack)$' }
  B:
    any:
      - kind: list
      - kind: tuple
      - kind: call
        has: { field: function, regex: '^(np|numpy)\.(array|asarray|zeros|ones|empty|full|arange|linspace|concatenate|stack|vstack|hstack)$' }
fix: $NP.$F(($A, $B))
metadata: { fix: unsafe }
---
# np.random.rand and np.random.randn take the dimensions as separate integers.
id: argument-in-wrong-slot
language: python
severity: error
message: $NP.random.$F takes each dimension as its own argument, so a tuple raises TypeError. Write $NP.random.$F($DIMS).
rule:
  pattern: $NP.random.$F($T)
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(rand|randn)$' }
  T: { kind: tuple }
transform:
  DIMS: { substring: { source: $T, startChar: 1, endChar: -1 } }
fix: $NP.random.$F($DIMS)
metadata: { fix: unsafe }
---
# np.random.random and its aliases take the shape as one tuple.
id: argument-in-wrong-slot
language: python
severity: error
message: $NP.random.$F takes the shape as one tuple, so two arguments raise TypeError. Write $NP.random.$F(($A, $B)).
rule:
  pattern: $NP.random.$F($A, $B)
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(random|random_sample)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: $NP.random.$F(($A, $B))
metadata: { fix: unsafe }
---
# The third argument of np.linspace is the number of values. A float there raises, and a true
# division always gives a float.
id: argument-in-wrong-slot
language: python
severity: error
message: The third argument of $NP.linspace is the number of values, not a step, so a number that is not whole raises TypeError. Pass a count, or call $NP.arange($A, $B, step) for a step.
rule:
  any:
    - pattern: $NP.linspace($A, $B, $N)
    - pattern: $NP.linspace($A, $B, $N, $$$REST)
constraints:
  NP: { regex: '^(np|numpy)$' }
  N:
    any:
      - matches: not-whole
      - kind: keyword_argument
        all:
          - has: { field: name, regex: ^num$ }
          - has: { field: value, matches: not-whole }
utils:
  not-whole:
    any:
      - kind: float
      - kind: binary_operator
        has: { field: operator, regex: '^/$' }
      - kind: parenthesized_expression
        has: { matches: not-whole }
---
# np.quantile takes fractions from 0 to 1. A whole number of 2 or more, or a list holding one,
# is a percent, and raises ValueError. np.percentile with the same numbers gives what was meant.
id: argument-in-wrong-slot
language: python
severity: error
message: $NP.$F takes fractions from 0 to 1, so $Q raises ValueError. For percents write $NP.$P($A, $Q).
rule:
  pattern: $NP.$F($A, $Q)
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(nan)?quantile$' }
  Q: { matches: percents }
utils:
  percents:
    any:
      - matches: percent
      - { kind: list, has: { matches: percent } }
      - { kind: tuple, has: { matches: percent } }
  percent:
    any:
      - { kind: integer, regex: '^([2-9]|[1-9]\d+)$' }
      - { kind: float, regex: '^([2-9]|[1-9]\d+)(\.\d*)?$' }
      - { kind: float, regex: '^1\.\d*[1-9]\d*$' }
transform:
  P: { replace: { source: $F, replace: quantile, by: percentile } }
fix: $NP.$P($A, $Q)
metadata: { fix: unsafe }
---
id: argument-in-wrong-slot
language: python
severity: error
message: $NP.$F takes fractions from 0 to 1, so a percent raises ValueError. For percents call $NP.$P with the same arguments.
rule:
  any:
    - pattern: $NP.$F($A, $Q, $$$REST)
    - pattern: $NP.$F($A, $Q)
      has: { field: arguments, has: { nthChild: 2, kind: keyword_argument } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(nan)?quantile$' }
  Q:
    any:
      - matches: percents
      - kind: keyword_argument
        all:
          - has: { field: name, regex: ^q$ }
          - has: { field: value, matches: percents }
utils:
  percents:
    any:
      - matches: percent
      - { kind: list, has: { matches: percent } }
      - { kind: tuple, has: { matches: percent } }
  percent:
    any:
      - { kind: integer, regex: '^([2-9]|[1-9]\d+)$' }
      - { kind: float, regex: '^([2-9]|[1-9]\d+)(\.\d*)?$' }
      - { kind: float, regex: '^1\.\d*[1-9]\d*$' }
transform:
  P: { replace: { source: $F, replace: quantile, by: percentile } }
