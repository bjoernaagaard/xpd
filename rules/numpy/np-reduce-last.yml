# A running total read at its end. The speedups are from
# research/numpy-rules/math/runs/bench.jsonl and bench2.jsonl, one thread, NumPy 2.5.4.

# cumsum adds in order and np.sum adds in pairs, so the sum is also closer. On ten million
# float32 values of 0.1, cumsum was off by 1.4 million units in the last place and np.sum by 2.
# Unsafe: the last bits of a float change, and on an empty array [-1] raises where np.sum
# returns 0.
id: np-reduce-last
language: python
severity: warning
message: This builds every running total to read the last one, which ran 8 times slower on 1,000,000 values and adds up more rounding. Write $NP.sum($X).
rule: { pattern: "$NP.cumsum($X)[-1]" }
constraints:
  NP: { regex: '^(np|numpy)$' }
fix: $NP.sum($X)
metadata: { fix: unsafe }
---
id: np-reduce-last
language: python
severity: warning
message: This builds every running product to read the last one, which ran 2.3 times slower on 1,000,000 values. Write $NP.prod($X).
rule: { pattern: "$NP.cumprod($X)[-1]" }
constraints:
  NP: { regex: '^(np|numpy)$' }
fix: $NP.prod($X)
metadata: { fix: unsafe }
