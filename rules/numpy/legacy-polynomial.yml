# np.poly1d and the poly* functions are NumPy's old polynomial API. The docs say they should
# not be used in new code and that numpy.polynomial is preferred:
# https://numpy.org/doc/stable/reference/routines.polynomials.html. numpy.polynomial stores
# coefficients from degree zero up, the reverse of the old order, so each fix reverses them
# with [::-1] on the way in and, where coefficients come out, on the way out. Unsafe: the old
# functions also take poly1d objects, which [::-1] does not reverse, and numpy.polynomial turns
# whole number coefficients into floats and computes in another order, so the last bits can
# change.

# Unsafe also because Polynomial.fit maps x onto [-1, 1] before it fits, a fit whose highest
# coefficients are zero comes back shorter, and a 2-D y raises where polyfit fitted each column.
id: legacy-polynomial
language: python
severity: info
message: $NP.polyfit is part of NumPy's legacy polynomial API, and its docs recommend Polynomial.fit as more stable numerically. Write $NP.polynomial.Polynomial.fit($X, $Y, $DEG).convert().coef[::-1], which keeps the coefficients from the highest degree down.
rule: { pattern: "$NP.polyfit($X, $Y, $DEG)" }
constraints:
  NP: { regex: '^(np|numpy)$' }
  X: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
  Y: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
  DEG: { any: [{ not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }, { regex: '^deg\s*=' }] }
fix: $NP.polynomial.Polynomial.fit($X, $Y, $DEG).convert().coef[::-1]
metadata: { fix: unsafe }
---
# Unsafe also because a Polynomial has other methods than a poly1d, such as roots() for r and
# coef for coeffs, from degree zero up.
id: legacy-polynomial
language: python
severity: info
message: $NP.poly1d is part of NumPy's legacy polynomial API. Write $NP.polynomial.Polynomial($PC[::-1]), because the new class takes coefficients from degree zero up.
rule: { pattern: "$NP.poly1d($C)" }
constraints:
  NP: { regex: '^(np|numpy)$' }
  C: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
rewriters:
  - id: tight
    rule: { pattern: $K, any: [{ kind: identifier }, { kind: attribute }, { kind: subscript }, { kind: call }, { kind: parenthesized_expression }, { kind: list }, { kind: tuple }] }
    fix: $K
  - id: wrap
    rule: { pattern: $K }
    fix: ($K)
transform:
  PC: { rewrite: { source: $C, rewriters: [tight, wrap] } }
fix: $NP.polynomial.Polynomial($PC[::-1])
metadata: { fix: unsafe }
