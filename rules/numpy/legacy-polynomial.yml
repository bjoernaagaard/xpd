# np.poly1d and the poly* functions are NumPy's old polynomial API. The docs say they should
# not be used in new code and that numpy.polynomial is preferred:
# https://numpy.org/doc/stable/reference/routines.polynomials.html. No fix, because
# numpy.polynomial stores coefficients from degree zero up, the reverse of the old order, and
# the old functions also take poly1d objects.
id: legacy-polynomial
language: python
severity: warning
message: $NP.polyfit is part of NumPy's legacy polynomial API, and its docs recommend Polynomial.fit as more stable numerically. Write $NP.polynomial.Polynomial.fit(x, y, deg), and call .convert().coef for the coefficients from degree zero up.
rule: { pattern: $NP.polyfit($$$ARGS) }
constraints:
  NP: { regex: '^(np|numpy)$' }
---
id: legacy-polynomial
language: python
severity: warning
message: $NP.poly1d is part of NumPy's legacy polynomial API. Write $NP.polynomial.Polynomial(coef[::-1]), because the new class takes coefficients from degree zero up.
rule: { pattern: $NP.poly1d($$$ARGS) }
constraints:
  NP: { regex: '^(np|numpy)$' }
---
id: legacy-polynomial
language: python
severity: warning
message: $NP.polyval is part of NumPy's legacy polynomial API. Write $NP.polynomial.polynomial.polyval(x, coef[::-1]), which takes x first and coefficients from degree zero up.
rule: { pattern: $NP.polyval($$$ARGS) }
constraints:
  NP: { regex: '^(np|numpy)$' }
