id: legacy-polynomial
language: python
severity: warning
message: $NP.$F is part of NumPy's legacy polynomial API. Make $NP.polynomial.Polynomial objects from coef[::-1] and use the + - * and divmod operators on them.
rule: { pattern: $NP.$F($$$ARGS) }
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(polyadd|polysub|polymul|polydiv)$' }
