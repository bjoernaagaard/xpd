# Unsafe also because np.poly of a square matrix gave its characteristic polynomial, where
# polyfromroots takes the values of the matrix as roots.
id: legacy-polynomial
language: python
severity: info
message: $NP.poly is part of NumPy's legacy polynomial API. Write $NP.polynomial.polynomial.polyfromroots($R)[::-1], which gives the same coefficients from the highest degree down.
rule: { pattern: "$NP.poly($R)" }
constraints:
  NP: { regex: '^(np|numpy)$' }
  R: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
fix: $NP.polynomial.polynomial.polyfromroots($R)[::-1]
metadata: { fix: unsafe }
