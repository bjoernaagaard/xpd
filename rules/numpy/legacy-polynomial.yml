# No fix, because the advice is to keep Polynomial objects and use their operators.
id: legacy-polynomial
language: python
severity: info
message: $NP.$F is part of NumPy's legacy polynomial API. Make $NP.polynomial.Polynomial objects from coef[::-1] and use the + - * and divmod operators on them.
rule: { pattern: $NP.$F($$$ARGS) }
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(polyadd|polysub|polymul|polydiv)$' }
---
# No fix for the other arguments, such as full=True, w, r=True or m, because the documents
# above rebuild only the usual call.
id: legacy-polynomial
language: python
severity: info
message: $NP.$F is part of NumPy's legacy polynomial API. $HINT
rule:
  pattern: $NP.$F($$$ARGS)
  not:
    any:
      - all: [{ pattern: "$NP.polyfit($X, $Y, $DEG)" }, { has: { field: arguments, all: [{ has: { nthChild: 1, matches: plain } }, { has: { nthChild: 2, matches: plain } }, { has: { nthChild: 3, any: [{ matches: plain }, { regex: '^deg\s*=' }] } }] } }]
      - all: [{ pattern: "$NP.polyval($C, $X)" }, { has: { field: arguments, all: [{ has: { nthChild: 1, matches: plain } }, { has: { nthChild: 2, matches: plain } }] } }]
      - all: [{ pattern: "$NP.$G($C)" }, { has: { field: function, regex: '\.(poly1d|roots|poly|polyder|polyint)$' } }, { has: { field: arguments, has: { nthChild: 1, matches: plain } } }]
constraints:
  NP: { regex: '^(np|numpy)$' }
  F: { regex: '^(polyfit|poly1d|polyval|roots|poly|polyder|polyint)$' }
utils:
  plain: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
transform:
  H1: { replace: { source: $F, replace: '^polyfit$', by: 'Its docs recommend Polynomial.fit as more stable numerically. Write numpy.polynomial.Polynomial.fit(x, y, deg), and call .convert().coef for the coefficients from degree zero up.' } }
  H2: { replace: { source: $H1, replace: '^poly1d$', by: 'Write numpy.polynomial.Polynomial(coef[::-1]), because the new class takes coefficients from degree zero up.' } }
  H3: { replace: { source: $H2, replace: '^polyval$', by: 'Write numpy.polynomial.polynomial.polyval(x, coef[::-1]), which takes x first and coefficients from degree zero up.' } }
  H4: { replace: { source: $H3, replace: '^roots$', by: 'Write numpy.polynomial.polynomial.polyroots(coef[::-1]), because the new functions take coefficients from degree zero up.' } }
  H5: { replace: { source: $H4, replace: '^poly$', by: 'Write numpy.polynomial.polynomial.polyfromroots(roots), which gives coefficients from degree zero up.' } }
  HINT: { replace: { source: $H5, replace: '^(polyder|polyint)$', by: 'Write numpy.polynomial.polynomial.$1(coef[::-1]), because the new functions take coefficients from degree zero up.' } }
