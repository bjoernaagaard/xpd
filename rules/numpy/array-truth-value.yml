---
# No fix for other operands, such as a mask held in a name, three comparisons or a chain with a
# call in it, which the fixes above do not rebuild.
id: array-truth-value
language: python
severity: error
message: and, or, not and a chained comparison ask for the truth of a whole array, which raises ValueError. Combine masks with & | and ~, with each comparison in parentheses, as in ($X > a) & ($X < b).
rule:
  kind: subscript
  all:
    - has: { field: value, pattern: $X }
    - has:
        field: subscript
        any:
          - kind: boolean_operator
          - kind: not_operator
          - kind: comparison_operator
            has: { nthChild: 3 }
            not: { has: { kind: binary_operator, has: { field: operator, regex: '^[&|]$' } } }
    - not: { has: { field: subscript, any: [{ matches: masks-and }, { matches: masks-or }, { matches: not-mask }, { matches: simple-chain }] } }
    - has:
        field: subscript
        any:
          - { kind: comparison_operator, has: { pattern: $X } }
          - has: { stopBy: end, kind: comparison_operator, has: { pattern: $X } }
constraints:
  X: { any: [{ kind: identifier }, { kind: attribute }] }
utils:
  # A comparison of two values, bare or in parentheses.
  mask:
    any:
      - { kind: comparison_operator, matches: two-operands }
      - { kind: parenthesized_expression, has: { kind: comparison_operator, matches: two-operands } }
  two-operands:
    all:
      - not: { has: { nthChild: 3 } }
      - not: { has: { field: operators, regex: '^(in|not in|is|is not)$' } }
  simple:
    any:
      - kind: identifier
      - kind: integer
      - { kind: float, regex: '^[\d.]+([eE]\d+)?$' }
      - { kind: attribute, not: { has: { stopBy: end, any: [{ kind: call }, { kind: subscript }] } } }
  masks-and:
    kind: boolean_operator
    all: [{ has: { field: left, matches: mask } }, { has: { field: right, matches: mask } }, { has: { field: operator, regex: '^and$' } }]
  masks-or:
    kind: boolean_operator
    all: [{ has: { field: left, matches: mask } }, { has: { field: right, matches: mask } }, { has: { field: operator, regex: '^or$' } }]
  not-mask:
    kind: not_operator
    has: { field: argument, matches: mask }
  simple-chain:
    kind: comparison_operator
    all:
      - has: { nthChild: 1, matches: simple }
      - has: { nthChild: 2, matches: simple }
      - has: { nthChild: 3, matches: simple }
      - not: { has: { nthChild: 4 } }
      - not: { has: { field: operators, regex: '^(in|not in|is|is not)$' } }
  compares-x:
    any:
      - { kind: comparison_operator, has: { pattern: $X } }
      - has: { stopBy: end, kind: comparison_operator, has: { pattern: $X } }
