# These NumPy helpers still call the Python function once per value or once per row. The
# replacement depends on the body of the function, so there is no fix.
id: np-vectorize
language: python
severity: warning
message: $F still calls the Python function once per value or once per slice, so it runs at the speed of a Python loop. Where the function is arithmetic or a condition, write it on whole arrays, for example with np.where or np.select.
rule: { pattern: $F($$$ARGS) }
constraints:
  F: { regex: '^(np|numpy)\.(vectorize|frompyfunc|apply_along_axis)$' }
---
# The same helper used as a bare decorator, as in `@np.vectorize` above a def.
id: np-vectorize
language: python
severity: warning
message: $F still calls the Python function once per value or once per slice, so it runs at the speed of a Python loop. Where the function is arithmetic or a condition, write it on whole arrays, for example with np.where or np.select.
rule:
  kind: decorator
  has: { pattern: $F }
constraints:
  F: { regex: '^(np|numpy)\.(vectorize|frompyfunc)$' }
