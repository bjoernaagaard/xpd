# Unsafe: assert_array_equal treats NaN in the same place as equal, compares an array with a
# scalar where np.array_equal returns False, and fails on shapes that == broadcasts.
id: assert-on-arrays
language: python
severity: info
message: A failed assert on an array comparison reports only False. Write $NP.testing.assert_array_equal($A, $B), which shows the differing elements.
rule:
  any:
    - pattern: "assert $NP.array_equal($A, $B)"
    - pattern: assert $NP.all($A == $B)
  not: { has: { nthChild: 2 } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: $NP.testing.assert_array_equal($A, $B)
metadata: { fix: unsafe }
---
id: assert-on-arrays
language: python
severity: info
message: A failed assert on (a == b).all() reports only False. Write np.testing.assert_array_equal($A, $B), which shows the differing elements.
rule:
  pattern: assert ($A == $B).all()
  not: { has: { nthChild: 2 } }
fix: np.testing.assert_array_equal($A, $B)
metadata: { fix: unsafe }
