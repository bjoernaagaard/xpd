# NumPy's testing guidelines name assert_allclose for near equality and assert_equal or
# assert_array_equal for exact equality. A plain assert on np.allclose reports only False, while
# these functions report the mismatched elements and their largest difference:
# https://numpy.org/doc/stable/reference/testing.html
# The fix writes np.allclose's tolerances, which differ from assert_allclose's defaults.
# Unsafe: assert_allclose fails on shapes that np.allclose broadcasts, such as (3,) against
# (1,), and the call still runs under python -O, where the assert statement was skipped. An
# assert with a message has no fix, because err_msg must be a string.
id: assert-on-arrays
language: python
severity: info
message: A failed assert on $NP.allclose reports only False. Write $NP.testing.assert_allclose($A, $B, rtol=1e-05, atol=1e-08, equal_nan=False), which keeps the tolerances and shows the differing elements.
rule:
  pattern: "assert $NP.allclose($A, $B)"
  not: { has: { nthChild: 2 } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: $NP.testing.assert_allclose($A, $B, rtol=1e-05, atol=1e-08, equal_nan=False)
metadata: { fix: unsafe }
---
id: assert-on-arrays
language: python
severity: info
message: A failed assert on $NP.allclose reports only False. Write $NP.testing.assert_allclose with the same rtol and atol, which shows the differing elements. Its defaults are rtol=1e-07 and atol=0.
rule:
  kind: assert_statement
  has: { nthChild: 1, pattern: $NP.allclose($$$ARGS) }
  not:
    all:
      - pattern: "assert $NP.allclose($A, $B)"
      - not: { has: { nthChild: 2 } }
constraints:
  NP: { regex: '^(np|numpy)$' }
---
# Unsafe: assert_array_equal treats NaN in the same place as equal, compares an array with a
# scalar where np.array_equal returns False, and fails on shapes that == broadcasts.
id: assert-on-arrays
language: python
severity: info
message: A failed assert on an array comparison reports only False. Write $NP.testing.assert_array_equal($A, $B), which shows the differing elements.
rule:
  any:
    - pattern: "assert $NP.array_equal($A, $B)"
    - pattern: assert $NP.all($A == $B)
  not: { has: { nthChild: 2 } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: $NP.testing.assert_array_equal($A, $B)
metadata: { fix: unsafe }
---
id: assert-on-arrays
language: python
severity: info
message: A failed assert on (a == b).all() reports only False. Write np.testing.assert_array_equal($A, $B), which shows the differing elements.
rule:
  pattern: assert ($A == $B).all()
  not: { has: { nthChild: 2 } }
fix: np.testing.assert_array_equal($A, $B)
metadata: { fix: unsafe }
---
# The same comparisons with a message, or with more arguments, have no fix.
id: assert-on-arrays
language: python
severity: info
message: A failed assert on an array comparison reports only False. Write np.testing.assert_array_equal(a, b, err_msg=...), which shows the differing elements.
rule:
  kind: assert_statement
  has:
    nthChild: 1
    any:
      - pattern: $NP.array_equal($$$ARGS)
      - pattern: $NP.all($A == $B)
      - pattern: ($A == $B).all()
  not:
    all:
      - any:
          - pattern: "assert $NP.array_equal($A, $B)"
          - pattern: assert $NP.all($A == $B)
          - pattern: assert ($A == $B).all()
      - not: { has: { nthChild: 2 } }
constraints:
  NP: { regex: '^(np|numpy)$' }
