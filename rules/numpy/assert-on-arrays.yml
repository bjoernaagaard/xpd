# No fix for the other forms, such as equal_nan, a splat or a message that is not written as a
# string, because err_msg must be a string and the documents above rebuild only rtol and atol.
id: assert-on-arrays
language: python
severity: info
message: A failed assert on $NP.allclose reports only False. Write $NP.testing.assert_allclose with the same rtol and atol, which shows the differing elements. Its defaults are rtol=1e-07 and atol=0.
rule:
  kind: assert_statement
  has: { nthChild: 1, pattern: $NP.allclose($$$ARGS) }
  not:
    any:
      - all: [{ pattern: "assert $NP.allclose($A, $B)" }, { matches: no-message }]
      - matches: rtol-only
      - matches: atol-only
      - matches: both-tolerances
      - matches: string-message
constraints:
  NP: { regex: '^(np|numpy)$' }
utils:
  plain: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
  no-message: { not: { has: { nthChild: 2 } } }
  first-two-plain:
    has: { nthChild: 1, has: { field: arguments, all: [{ has: { nthChild: 1, matches: plain } }, { has: { nthChild: 2, matches: plain } }] } }
  rtol-only:
    all:
      - any: [{ pattern: "assert $NP.allclose($A, $B, rtol=$R)" }, { pattern: "assert $NP.allclose($A, $B, $R)" }]
      - matches: no-message
      - matches: first-two-plain
      - has: { nthChild: 1, has: { field: arguments, has: { nthChild: 3, any: [{ matches: plain }, { regex: '^rtol\s*=' }] } } }
  atol-only:
    all:
      - pattern: "assert $NP.allclose($A, $B, atol=$T)"
      - matches: no-message
      - matches: first-two-plain
  both-tolerances:
    all:
      - any:
          - pattern: "assert $NP.allclose($A, $B, rtol=$R, atol=$T)"
          - pattern: "assert $NP.allclose($A, $B, atol=$T, rtol=$R)"
          - pattern: "assert $NP.allclose($A, $B, $R, atol=$T)"
          - pattern: "assert $NP.allclose($A, $B, $R, $T)"
      - matches: no-message
      - matches: first-two-plain
      - has: { nthChild: 1, has: { field: arguments, all: [{ has: { nthChild: 3, any: [{ matches: plain }, { regex: '^(rtol|atol)\s*=' }] } }, { has: { nthChild: 4, any: [{ matches: plain }, { regex: '^(rtol|atol)\s*=' }] } }] } }
