# NumPy's testing guidelines name assert_allclose for near equality and assert_equal or
# assert_array_equal for exact equality. A plain assert on np.allclose reports only False, while
# these functions report the mismatched elements and their largest difference:
# https://numpy.org/doc/stable/reference/testing.html
# The fix writes np.allclose's tolerances, which differ from assert_allclose's defaults.
# Unsafe: assert_allclose fails on shapes that np.allclose broadcasts, such as (3,) against
# (1,), and the call still runs under python -O, where the assert statement was skipped. An
# assert with a message has no fix, because err_msg must be a string.
id: assert-on-arrays
language: python
severity: info
message: A failed assert on $NP.allclose reports only False. Write $NP.testing.assert_allclose($A, $B, rtol=1e-05, atol=1e-08, equal_nan=False), which keeps the tolerances and shows the differing elements.
rule:
  pattern: "assert $NP.allclose($A, $B)"
  not: { has: { nthChild: 2 } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: $NP.testing.assert_allclose($A, $B, rtol=1e-05, atol=1e-08, equal_nan=False)
metadata: { fix: unsafe }
---
# Unsafe for the same reasons. The fix writes the default of a tolerance that the call leaves out,
# and equal_nan=False.
id: assert-on-arrays
language: python
severity: info
message: A failed assert on $NP.allclose reports only False. Write $NP.testing.assert_allclose($A, $B, rtol=$R, atol=1e-08, equal_nan=False), which keeps the tolerances and shows the differing elements.
rule:
  any:
    - pattern: "assert $NP.allclose($A, $B, rtol=$R)"
    - pattern: "assert $NP.allclose($A, $B, $R)"
  matches: rtol-only
constraints:
  NP: { regex: '^(np|numpy)$' }
utils:
  plain: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
  no-message: { not: { has: { nthChild: 2 } } }
  first-two-plain:
    has: { nthChild: 1, has: { field: arguments, all: [{ has: { nthChild: 1, matches: plain } }, { has: { nthChild: 2, matches: plain } }] } }
  rtol-only:
    all:
      - any: [{ pattern: "assert $NP.allclose($A, $B, rtol=$R)" }, { pattern: "assert $NP.allclose($A, $B, $R)" }]
      - matches: no-message
      - matches: first-two-plain
      - has: { nthChild: 1, has: { field: arguments, has: { nthChild: 3, any: [{ matches: plain }, { regex: '^rtol\s*=' }] } } }
  atol-only:
    all:
      - pattern: "assert $NP.allclose($A, $B, atol=$T)"
      - matches: no-message
      - matches: first-two-plain
  both-tolerances:
    all:
      - any:
          - pattern: "assert $NP.allclose($A, $B, rtol=$R, atol=$T)"
          - pattern: "assert $NP.allclose($A, $B, atol=$T, rtol=$R)"
          - pattern: "assert $NP.allclose($A, $B, $R, atol=$T)"
          - pattern: "assert $NP.allclose($A, $B, $R, $T)"
      - matches: no-message
      - matches: first-two-plain
      - has: { nthChild: 1, has: { field: arguments, all: [{ has: { nthChild: 3, any: [{ matches: plain }, { regex: '^(rtol|atol)\s*=' }] } }, { has: { nthChild: 4, any: [{ matches: plain }, { regex: '^(rtol|atol)\s*=' }] } }] } }
  string-message:
    all:
      - pattern: "assert $NP.allclose($A, $B), $M"
      - has: { nthChild: 2, any: [{ kind: string }, { kind: concatenated_string }] }
      - matches: first-two-plain
fix: $NP.testing.assert_allclose($A, $B, rtol=$R, atol=1e-08, equal_nan=False)
metadata: { fix: unsafe }
