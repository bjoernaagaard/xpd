# sorted gives a list of NumPy scalars and np.sort gives an array, so there is no fix.
id: builtin-on-array
language: python
severity: warning
message: sorted compares the values one pair at a time in Python. Write np.sort($E), which ran 13 to 16 times faster on 1,000,000 values, and add .tolist() where a list is needed.
rule: { pattern: sorted($E) }
constraints:
  E: { matches: numpy-call }
utils:
  # A call to a NumPy function that returns one array.
  numpy-call:
    kind: call
    has: { field: function, regex: '^(np|numpy)\.(sqrt|cbrt|square|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|arcsin|arccos|arctan|arctan2|hypot|sinh|cosh|tanh|floor|ceil|trunc|rint|round|around|sign|abs|absolute|fabs|power|maximum|minimum|fmax|fmin|clip|add|subtract|multiply|divide|true_divide|floor_divide|mod|remainder|diff|cumsum|cumprod|ravel|asarray|array|arange|linspace|concatenate|hstack|vstack|dot|matmul|outer|isnan|isfinite|isinf|logical_and|logical_or|logical_not|logical_xor|equal|not_equal|greater|greater_equal|less|less_equal|isclose)$' }
  # A comparison with such a call on one side, as in np.abs(x) > 1.
  numpy-comparison:
    kind: comparison_operator
    not: { regex: '\b(in|is)\b' }
    has: { matches: numpy-call }
---
# list gives NumPy scalars, or arrays for a 2-D array, and tolist gives Python values, so there is
# no fix.
id: builtin-on-array
language: python
severity: warning
message: list makes one NumPy scalar per value in Python. Write $E.tolist(), which ran 1.7 to 3.4 times faster and gives plain Python values.
rule: { pattern: list($E) }
constraints:
  E: { matches: numpy-call }
utils:
  # A call to a NumPy function that returns one array.
  numpy-call:
    kind: call
    has: { field: function, regex: '^(np|numpy)\.(sqrt|cbrt|square|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|arcsin|arccos|arctan|arctan2|hypot|sinh|cosh|tanh|floor|ceil|trunc|rint|round|around|sign|abs|absolute|fabs|power|maximum|minimum|fmax|fmin|clip|add|subtract|multiply|divide|true_divide|floor_divide|mod|remainder|diff|cumsum|cumprod|ravel|asarray|array|arange|linspace|concatenate|hstack|vstack|dot|matmul|outer|isnan|isfinite|isinf|logical_and|logical_or|logical_not|logical_xor|equal|not_equal|greater|greater_equal|less|less_equal|isclose)$' }
  # A comparison with such a call on one side, as in np.abs(x) > 1.
  numpy-comparison:
    kind: comparison_operator
    not: { regex: '\b(in|is)\b' }
    has: { matches: numpy-call }
