# A Python builtin given a NumPy array walks it one value at a time. The argument must be a call
# to a NumPy function that returns one array, or a comparison of one, because ast-grep sees no
# types. abs and round already call NumPy on an array, and any and all stop at the first true
# value where NumPy does not, so those are left alone.

# Unsafe: Python adds the values in order and NumPy adds them in pairs, so a float sum can differ
# in the last bits. sum of a 2-D array adds its rows, which axis=0 keeps.
id: builtin-on-array
language: python
severity: warning
message: sum walks the array one value at a time in Python. Write $E.sum(axis=0), which ran 37 to 47 times faster on 1,000,000 values.
rule: { pattern: sum($E) }
constraints:
  E: { matches: numpy-call }
utils:
  # A call to a NumPy function that returns one array.
  numpy-call:
    kind: call
    has: { field: function, regex: '^(np|numpy)\.(sqrt|cbrt|square|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|arcsin|arccos|arctan|arctan2|hypot|sinh|cosh|tanh|floor|ceil|trunc|rint|round|around|sign|abs|absolute|fabs|power|maximum|minimum|fmax|fmin|clip|add|subtract|multiply|divide|true_divide|floor_divide|mod|remainder|diff|cumsum|cumprod|ravel|asarray|array|arange|linspace|concatenate|hstack|vstack|dot|matmul|outer|isnan|isfinite|isinf|logical_and|logical_or|logical_not|logical_xor|equal|not_equal|greater|greater_equal|less|less_equal|isclose)$' }
  # A comparison with such a call on one side, as in np.abs(x) > 1.
  numpy-comparison:
    kind: comparison_operator
    not: { regex: '\b(in|is)\b' }
    has: { matches: numpy-call }
fix: $E.sum(axis=0)
metadata: { fix: unsafe }
---
# Unsafe: as with sum. A mask sums to the same whole number.
id: builtin-on-array
language: python
severity: warning
