# An array built from a comprehension whose element is arithmetic on the loop variable, with
# calls only to functions that work on each element. Such a comprehension is the same
# expression on the whole array. An element that calls any other function, a filter with `if`,
# a second `for`, and a loop over zip are left alone, and so is a power with the loop variable
# in the exponent.
id: per-value-comprehension
language: python
severity: warning
message: This runs Python once per value of $IT. Apply the expression to the whole array instead, with $X replaced by np.asarray($IT), which ran 60 to 470 times faster on 1,000,000 values of an array and 2 to 24 times faster on a list.
rule:
  pattern: $NP.$MAKE($LIST)
  has:
    field: arguments
    has: { kind: list_comprehension, matches: per-value }
constraints:
  NP: { regex: '^(np|numpy)$' }
  MAKE: { regex: '^(array|asarray)$' }
  IT: { not: { any: [{ regex: '\.(shape|strides)$' }, { pattern: range($$$) }] } }
utils:
  per-value:
    all:
      - has:
          kind: for_in_clause
          all:
            - has: { field: left, kind: identifier, pattern: $X }
            - has: { field: right, pattern: $IT }
      - has: { field: body, matches: arithmetic, has: { stopBy: end, pattern: $X } }
      - not: { has: { kind: if_clause } }
      - not: { has: { kind: for_in_clause, nthChild: 3 } }
  arithmetic:
    all:
      - not: { any: [{ matches: not-arithmetic }, { has: { stopBy: end, matches: not-arithmetic } }] }
      - not: { any: [{ matches: power-of-x }, { has: { stopBy: end, matches: power-of-x } }] }
  # x**i builds a row per pass when x is an array, and 2**i overflows int64 where Python ints
  # do not.
  power-of-x:
    kind: binary_operator
    all:
      - has: { field: operator, regex: '^\*\*$' }
      - has: { field: right, any: [{ pattern: $X }, { has: { stopBy: end, pattern: $X } }] }
  not-arithmetic:
    any:
      - kind: lambda
      - kind: list_comprehension
      - kind: generator_expression
      - kind: string
      - kind: slice
      - kind: tuple
      - kind: list
      - kind: dictionary
      - kind: subscript
      - { kind: comparison_operator, regex: '\bin\b' }
      - { kind: binary_operator, has: { field: operator, regex: '^@$' } }
      - kind: attribute
        not: { inside: { kind: call, field: function } }
      - kind: call
        not: { has: { field: function, matches: elementwise-function } }
  elementwise-function:
    any:
      - regex: '^(np|numpy)\.(sqrt|cbrt|square|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|arcsin|arccos|arctan|arctan2|hypot|sinh|cosh|tanh|arcsinh|arccosh|arctanh|floor|ceil|trunc|rint|round|sign|abs|absolute|fabs|power|maximum|minimum|fmax|fmin|clip|isnan|isfinite|isinf|degrees|radians|deg2rad|rad2deg|logaddexp|mod|fmod|remainder)$'
      - regex: '^math\.(sqrt|cbrt|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|asin|acos|atan|atan2|hypot|sinh|cosh|tanh|asinh|acosh|atanh|floor|ceil|trunc|fabs|pow|degrees|radians|fmod|copysign)$'
      - regex: '^(abs|min|max)$'
---
# The same comprehension over range, which np.arange replaces.
id: per-value-comprehension
language: python
severity: warning
message: This runs Python once per value of range. Apply the expression to the whole array instead, with $X replaced by np.arange($$$R), which ran 49 to 51 times faster on 1,000,000 values.
rule:
  pattern: $NP.$MAKE($LIST)
  has:
    field: arguments
    has: { kind: list_comprehension, matches: per-value }
constraints:
  NP: { regex: '^(np|numpy)$' }
  MAKE: { regex: '^(array|asarray)$' }
  IT: { pattern: range($$$R) }
utils:
  per-value:
    all:
      - has:
          kind: for_in_clause
          all:
            - has: { field: left, kind: identifier, pattern: $X }
            - has: { field: right, pattern: $IT }
      - has: { field: body, matches: arithmetic, has: { stopBy: end, pattern: $X } }
      - not: { has: { kind: if_clause } }
      - not: { has: { kind: for_in_clause, nthChild: 3 } }
  arithmetic:
    all:
      - not: { any: [{ matches: not-arithmetic }, { has: { stopBy: end, matches: not-arithmetic } }] }
      - not: { any: [{ matches: power-of-x }, { has: { stopBy: end, matches: power-of-x } }] }
  # x**i builds a row per pass when x is an array, and 2**i overflows int64 where Python ints
  # do not.
  power-of-x:
    kind: binary_operator
    all:
      - has: { field: operator, regex: '^\*\*$' }
      - has: { field: right, any: [{ pattern: $X }, { has: { stopBy: end, pattern: $X } }] }
  not-arithmetic:
    any:
      - kind: lambda
      - kind: list_comprehension
      - kind: generator_expression
      - kind: string
      - kind: slice
      - kind: tuple
      - kind: list
      - kind: dictionary
      - kind: subscript
      - { kind: comparison_operator, regex: '\bin\b' }
      - { kind: binary_operator, has: { field: operator, regex: '^@$' } }
      - kind: attribute
        not: { inside: { kind: call, field: function } }
      - kind: call
        not: { has: { field: function, matches: elementwise-function } }
  elementwise-function:
    any:
      - regex: '^(np|numpy)\.(sqrt|cbrt|square|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|arcsin|arccos|arctan|arctan2|hypot|sinh|cosh|tanh|arcsinh|arccosh|arctanh|floor|ceil|trunc|rint|round|sign|abs|absolute|fabs|power|maximum|minimum|fmax|fmin|clip|isnan|isfinite|isinf|degrees|radians|deg2rad|rad2deg|logaddexp|mod|fmod|remainder)$'
      - regex: '^math\.(sqrt|cbrt|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|asin|acos|atan|atan2|hypot|sinh|cosh|tanh|asinh|acosh|atanh|floor|ceil|trunc|fabs|pow|degrees|radians|fmod|copysign)$'
      - regex: '^(abs|min|max)$'
---
# map with a NumPy or math function that works on each element calls it once per value.
id: per-value-comprehension
language: python
severity: warning
message: map calls $F once per value of $IT. Call the NumPy function on the whole array, as in np.$N(np.asarray($IT)), which ran 56 to 170 times faster on 1,000,000 values of an array and 2.2 times faster on a list.
rule:
  pattern: map($F, $IT)
  # A tuple or list written out, as in map(np.log, (a, b)), holds whole arrays.
  not: { has: { field: arguments, has: { nthChild: 2, any: [{ kind: tuple }, { kind: list }] } } }
constraints:
  F: { regex: '^(np\.|numpy\.|math\.)(sqrt|cbrt|square|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|arcsin|arccos|arctan|asin|acos|atan|sinh|cosh|tanh|arcsinh|arccosh|arctanh|asinh|acosh|atanh|floor|ceil|trunc|rint|sign|abs|absolute|fabs|isnan|isfinite|isinf|degrees|radians|deg2rad|rad2deg)$' }
transform:
  N:
    replace:
      source: $F
      replace: '^(np|numpy|math)\.(asin|acos|atan|asinh|acosh|atanh|.*)$'
      by: '$2'
