# The same loop written with a counter: `while i < n:`, the element write, and `i += 1`.
id: element-loop
language: python
severity: warning
message: This loop computes $OUT one element per pass in Python. Write it as one expression on whole arrays, with slices or index arrays in place of $I, which ran 350 times faster on 1,000,000 values.
rule:
  kind: while_statement
  all:
    - has: { field: condition, pattern: $I < $END }
    - has:
        field: body
        all:
          - has: { nthChild: 1, matches: element-write }
          - has: { nthChild: 2, has: { pattern: $I += 1 } }
          - not: { has: { nthChild: 3 } }
    - matches: numpy-proof
constraints:
  NP: { regex: '^(np|numpy)$' }
  I: { kind: identifier }
  OUT: { any: [{ kind: identifier }, { kind: attribute }] }
