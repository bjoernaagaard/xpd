# np.nditer and np.ndenumerate hand Python one element per pass. With the external_loop flag,
# nditer hands over whole chunks, and that loop is left alone.
id: element-loop
language: python
severity: warning
message: $NP.$F hands Python one element per pass. Write the body as one expression on whole arrays, which ran 700 to 1,500 times faster on 1,000,000 values.
rule:
  kind: for_statement
  all:
    - has: { field: right, pattern: $NP.$F($$$ARGS) }
    - not: { has: { field: right, has: { stopBy: end, regex: external_loop, kind: string } } }
    - has:
        field: body
        not: { has: { stopBy: end, any: [{ kind: lambda }, { kind: list_comprehension }, { kind: generator_expression }, { kind: call, not: { has: { field: function, matches: elementwise-function } } }] } }
