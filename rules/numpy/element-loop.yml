# A loop whose whole body writes one element of a NumPy array from arithmetic on the loop
# position. A body that calls a function of its own, reads the array it writes, writes a slice,
# reads through a lookup table, or does more than one thing is left alone, because such a loop
# is often meant. The array must come from a NumPy call before the loop, or the body must call
# NumPy, so that a loop over a Python list is not reported.
id: element-loop
language: python
severity: warning
message: This loop computes $OUT one element per pass in Python. Write it as one expression on whole arrays, with slices or index arrays in place of $I, which ran 70 to 530 times faster on 1,000,000 values.
rule:
  kind: for_statement
  all:
    - has: { field: left, kind: identifier, pattern: $I }
    - has:
        field: right
        any: [{ pattern: range($$$) }, { pattern: $NP.arange($$$) }, { pattern: $NP.ndindex($$$) }]
    - has: { field: body, has: { all: [{ matches: only-statement }, { matches: element-write }] } }
    - matches: numpy-proof
constraints:
  NP: { regex: '^(np|numpy)$' }
  OUT: { any: [{ kind: identifier }, { kind: attribute }] }
utils:
  only-statement:
    all: [{ nthChild: 1 }, { nthChild: { position: 1, reverse: true } }]
  # $OUT[$I] = arithmetic, where the right side does not read $OUT.
  element-write:
    kind: expression_statement
    has:
      kind: assignment
      all:
        - has:
            field: left
            kind: subscript
            all:
              - has: { field: value, pattern: $OUT }
              - has: { pattern: $I }
              - not: { has: { stopBy: end, matches: not-element } }
        - has:
            field: right
            matches: arithmetic
            not: { has: { stopBy: end, pattern: $OUT } }
  # $OUT comes from a NumPy call before the loop, or the loop body calls NumPy.
  numpy-proof:
    any:
      - follows: { stopBy: end, matches: numpy-array }
      - inside: { stopBy: end, any: [{ kind: for_statement }, { kind: while_statement }], follows: { stopBy: end, matches: numpy-array } }
      - has: { field: body, has: { stopBy: end, kind: call, regex: '^(np|numpy)\.' } }
  numpy-array:
    kind: expression_statement
    has: { pattern: $OUT = $NP.$MAKE($$$) }
  # A slice, a nested subscript or a call in an index writes more than one element, or writes
  # through a lookup table.
  not-element:
    any: [{ kind: slice }, { kind: subscript }, { kind: call }, { kind: tuple }, { kind: list }, { kind: dictionary }]
  # Names, numbers, element reads and operators, with calls only to functions that work on each
  # element, so the same expression on whole arrays gives the same values.
  arithmetic:
    not: { any: [{ matches: not-arithmetic }, { has: { stopBy: end, matches: not-arithmetic } }] }
  not-arithmetic:
    any:
      - kind: lambda
      - kind: list_comprehension
      - kind: generator_expression
      - kind: string
      - kind: slice
      - kind: tuple
      - kind: list
      - kind: dictionary
      - kind: subscript
        has: { stopBy: end, kind: subscript }
      - kind: call
        not: { has: { field: function, matches: elementwise-function } }
  elementwise-function:
    any:
      - regex: '^(np|numpy)\.(sqrt|cbrt|square|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|arcsin|arccos|arctan|arctan2|hypot|sinh|cosh|tanh|arcsinh|arccosh|arctanh|floor|ceil|trunc|rint|round|sign|abs|absolute|fabs|power|maximum|minimum|fmax|fmin|where|clip|isnan|isfinite|isinf|degrees|radians|deg2rad|rad2deg|logaddexp|mod|fmod|remainder)$'
      - regex: '^math\.(sqrt|cbrt|exp|exp2|expm1|log|log2|log10|log1p|sin|cos|tan|asin|acos|atan|atan2|hypot|sinh|cosh|tanh|asinh|acosh|atanh|floor|ceil|trunc|fabs|pow|degrees|radians|fmod|copysign)$'
      - regex: '^(abs|min|max)$'
