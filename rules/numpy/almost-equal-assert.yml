id: almost-equal-assert
language: python
severity: info
message: $F is on NumPy's not recommended list, and decimal=$D is an absolute tolerance of 1.5e-$D. Write assert_allclose($A, $B, rtol=0, atol=1.5e-$D).
rule:
  # all checks in order, so the search for the import runs only on a call of that name.
