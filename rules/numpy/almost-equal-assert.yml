# assert_almost_equal, assert_array_almost_equal and assert_approx_equal are listed under
# "Asserts (not recommended)", and their docs recommend assert_allclose:
# https://numpy.org/doc/stable/reference/routines.testing.html
# The decimal test is abs(desired - actual) < 1.5 * 10**-decimal, so the fix writes rtol=0 and
# that atol. Unsafe: a difference of exactly atol fails before and passes after, dicts and
# ragged nested lists are no longer compared item by item, and complex values are compared by
# magnitude instead of by each part. The fix keeps the module the call came from.
id: almost-equal-assert
language: python
severity: info
message: assert_almost_equal is on NumPy's not recommended list, and its default test is an absolute tolerance of 1.5e-7. Write $M.assert_allclose($A, $B, rtol=0, atol=1.5e-7).
rule: { pattern: "$M.assert_almost_equal($A, $B)" }
constraints:
  M: { regex: '^(np\.testing|numpy\.testing|npt|nt|testing)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: $M.assert_allclose($A, $B, rtol=0, atol=1.5e-7)
metadata: { fix: unsafe }
---
id: almost-equal-assert
language: python
severity: info
message: assert_almost_equal is on NumPy's not recommended list, and decimal=$D is an absolute tolerance of 1.5e-$D. Write $M.assert_allclose($A, $B, rtol=0, atol=1.5e-$D).
rule: { pattern: "$M.assert_almost_equal($A, $B, $DECIMAL)" }
constraints:
  M: { regex: '^(np\.testing|numpy\.testing|npt|nt|testing)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
  DECIMAL: { regex: '^(decimal\s*=\s*)?\d+$' }
transform:
  D: { replace: { source: $DECIMAL, replace: '^decimal\s*=\s*', by: '' } }
fix: $M.assert_allclose($A, $B, rtol=0, atol=1.5e-$D)
metadata: { fix: unsafe }
