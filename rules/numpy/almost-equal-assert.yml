# A bare name that the file imports from numpy.testing. The fix writes assert_allclose bare, so
# it applies only in a file that also imports assert_allclose from numpy.testing, which
# pack.yml says under members.
id: almost-equal-assert
language: python
severity: info
message: assert_almost_equal is on NumPy's not recommended list, and its default test is an absolute tolerance of 1.5e-7. Write assert_allclose($A, $B, rtol=0, atol=1.5e-7).
rule:
  pattern: "$F($A, $B)"
  inside: { stopBy: end, kind: module, has: { stopBy: end, kind: import_from_statement, all: [{ has: { field: module_name, regex: '^numpy\.testing$' } }, { has: { stopBy: end, kind: identifier, pattern: $F } }] } }
constraints:
  F: { regex: '^assert_almost_equal$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
fix: assert_allclose($A, $B, rtol=0, atol=1.5e-7)
metadata: { fix: unsafe }
