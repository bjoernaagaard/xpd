---
# Every other call, such as a bare name that the file does not import from numpy.testing, an
# err_msg argument or a computed decimal. No fix, because a bare name that the file does not
# import may name another function, and the documents above rebuild only the two values and a
# literal decimal.
id: almost-equal-assert
language: python
severity: info
message: $F is on NumPy's not recommended list. Write assert_allclose with rtol=0 and atol=1.5 * 10**-decimal, where decimal defaults to 7 for assert_almost_equal and 6 for assert_array_almost_equal.
rule:
  pattern: $F($$$ARGS)
  not: { all: [{ any: [{ matches: qualified }, { matches: imported-bare-name }] }, { matches: fixable-arguments }] }
constraints:
  F: { regex: '^((np\.testing|numpy\.testing|npt|nt|testing)\.)?(assert_almost_equal|assert_array_almost_equal)$' }
utils:
  qualified:
    has: { field: function, regex: '^(np\.testing|numpy\.testing|npt|nt|testing)\.' }
  imported-bare-name:
    all:
      - has: { field: function, kind: identifier, pattern: $F, regex: '^assert_(array_)?almost_equal$' }
      - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^numpy\.testing$' } }, { has: { stopBy: end, kind: identifier, pattern: $F } }] } }
  fixable-arguments:
    has:
      field: arguments
      all:
        - has: { nthChild: 1, not: { kind: keyword_argument } }
        - has: { nthChild: 2, not: { kind: keyword_argument } }
        - not: { has: { nthChild: 4 } }
        - any:
            - not: { has: { nthChild: 3 } }
            - has: { nthChild: 3, kind: integer }
            - has: { nthChild: 3, kind: keyword_argument, regex: '^decimal\s*=\s*\d+$' }
---
# assert_approx_equal compares 7 significant digits by default, which the fix writes as
# rtol=1e-6. Unsafe: the old test scaled the tolerance to the power of ten below the
# mean of the two values, so a difference up to ten times rtol passed before and fails after,
# and a desired value of 0 now fails on any other actual value.
id: almost-equal-assert
language: python
severity: info
message: assert_approx_equal is on NumPy's not recommended list, and its default compares 7 significant digits. Write $M.assert_allclose($A, $B, rtol=1e-6).
rule: { pattern: "$M.assert_approx_equal($A, $B)" }
constraints:
  M: { regex: '^(np\.testing|numpy\.testing|npt|nt|testing)$' }
  A: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
  B: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
fix: $M.assert_allclose($A, $B, rtol=1e-6)
metadata: { fix: unsafe }
---
id: almost-equal-assert
language: python
severity: info
message: assert_approx_equal is on NumPy's not recommended list, and its default compares 7 significant digits. Write assert_allclose($A, $B, rtol=1e-6).
rule:
  # all checks in order, so the search for the import runs only on a call of that name.
  all:
    - pattern: "$F($A, $B)"
    - has: { field: function, kind: identifier, regex: '^assert_approx_equal$' }
    - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^numpy\.testing$' } }, { has: { stopBy: end, kind: identifier, pattern: $F } }] } }
constraints:
  F: { regex: '^assert_approx_equal$' }
  A: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
  B: { not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
fix: assert_allclose($A, $B, rtol=1e-6)
metadata: { fix: unsafe }
---
# No fix for significant=, err_msg or a bare name that the file does not import from
# numpy.testing, because the documents above write only the default of 7 digits.
id: almost-equal-assert
language: python
severity: info
message: assert_approx_equal is on NumPy's not recommended list. Write assert_allclose with rtol set to the relative tolerance the test needs, such as rtol=1e-6 for 7 significant digits.
rule:
  pattern: $F($$$ARGS)
  not:
    all:
      - any:
          - has: { field: function, regex: '^(np\.testing|numpy\.testing|npt|nt|testing)\.' }
          - all:
              - has: { field: function, kind: identifier, regex: '^assert_approx_equal$' }
              - inside: { stopBy: end, kind: module, has: { kind: import_from_statement, all: [{ has: { field: module_name, regex: '^numpy\.testing$' } }, { has: { stopBy: end, kind: identifier, regex: '^assert_approx_equal$' } }] } }
      - has:
          field: arguments
          all:
            - has: { nthChild: 1, not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
            - has: { nthChild: 2, not: { any: [{ kind: keyword_argument }, { kind: list_splat }, { kind: dictionary_splat }] } }
            - not: { has: { nthChild: 3 } }
constraints:
  F: { regex: '^((np\.testing|numpy\.testing|npt|nt|testing)\.)?assert_approx_equal$' }
