constraints:
  F: { regex: '^(assert_almost_equal|assert_array_almost_equal)$' }
  A: { not: { kind: keyword_argument } }
  B: { not: { kind: keyword_argument } }
  DECIMAL: { regex: '^(decimal\s*=\s*)?\d+$' }
