# Each document finds a NumPy name, method, module or keyword that raises on NumPy 2.5. Most
# went in 2.0 (see the migration guide, numpy.org/doc/stable/numpy_2_0_migration_guide.html),
# the rest in 1.24, 2.3, 2.4 and 2.5. A safe fix gives what the old form gave on the last NumPy
# that had it. An assignment such as `np.float_ = float` is a shim for old libraries and is left
# alone.

# These were the Python builtins under another name, so the builtin is the same object.
id: removed-in-numpy-2
language: python
severity: error
message: $NP.$N was an alias of the builtin $NEW and is gone since NumPy 1.24. Write $NEW.
rule:
  all:
    - { matches: numpy-name }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
  numpy-name:
    kind: attribute
    all:
      - has: { field: object, pattern: $NP }
      - has: { field: attribute, pattern: $N }
    not: { inside: { kind: assignment, field: left } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  N: { regex: '^(int|float|complex|object|str|unicode)$' }
transform:
  NEW: { replace: { source: $N, replace: '^unicode$', by: str } }
fix: $NEW
metadata: { fix: safe }
---
# Each old name was the same type object as the new one.
id: removed-in-numpy-2
language: python
severity: error
message: $NP.$N was removed in NumPy 2. Write $NP.$NEW, which is the same type.
rule:
  all:
    - { matches: numpy-name }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
  numpy-name:
    kind: attribute
    all:
      - has: { field: object, pattern: $NP }
      - has: { field: attribute, pattern: $N }
    not: { inside: { kind: assignment, field: left } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  N:
    regex: '^(float_|complex_|cfloat|unicode_|string_|longfloat|singlecomplex|longcomplex|clongfloat|bool8|int0|uint0|object0|str0|bytes0|void0|typeDict)$'
transform:
  T1: { replace: { source: $N, replace: '^float_$', by: float64 } }
  T2: { replace: { source: $T1, replace: '^(complex_|cfloat)$', by: complex128 } }
  T3: { replace: { source: $T2, replace: '^(unicode_|str0)$', by: str_ } }
  T4: { replace: { source: $T3, replace: '^(string_|bytes0)$', by: bytes_ } }
  T5: { replace: { source: $T4, replace: '^longfloat$', by: longdouble } }
  T6: { replace: { source: $T5, replace: '^singlecomplex$', by: complex64 } }
  T7: { replace: { source: $T6, replace: '^(longcomplex|clongfloat)$', by: clongdouble } }
  T8: { replace: { source: $T7, replace: '^bool8$', by: bool_ } }
  T9: { replace: { source: $T8, replace: '^int0$', by: intp } }
  T10: { replace: { source: $T9, replace: '^uint0$', by: uintp } }
  T11: { replace: { source: $T10, replace: '^object0$', by: object_ } }
  T12: { replace: { source: $T11, replace: '^void0$', by: void } }
  NEW: { replace: { source: $T12, replace: '^typeDict$', by: sctypeDict } }
fix: $NP.$NEW
metadata: { fix: safe }
