# A leading minus binds less tightly than an attribute, a call, a subscript or a power, so the
# fix applies only where the name is not the left side of one of those.
id: removed-in-numpy-2
language: python
severity: error
message: $NP.NINF was removed in NumPy 2. Write -$NP.inf.
rule:
  all:
    - matches: numpy-name
      not: { matches: tight-operand }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
  numpy-name:
    kind: attribute
    all:
      - has: { field: object, pattern: $NP }
      - has: { field: attribute, pattern: $N }
    not: { inside: { kind: assignment, field: left } }
  tight-operand:
    any:
      - inside: { kind: attribute, field: object }
      - inside: { kind: subscript, field: value }
      - inside: { kind: call, field: function }
      - inside: { kind: binary_operator, field: left, has: { field: operator, regex: '^\*\*$' } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  N: { regex: '^(NINF)$' }
fix: -$NP.inf
metadata: { fix: safe }
