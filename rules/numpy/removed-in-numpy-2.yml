# Each old function called the new one with the same arguments, or was the same object.
id: removed-in-numpy-2
language: python
severity: error
message: $NP.$N was removed in NumPy 2. Write $NP.$NEW, which takes the same arguments.
rule:
  all:
    - { matches: numpy-name }
    - not: { matches: compat-code }
utils:
  compat-code:
    any:
      - inside:
          kind: if_statement
          stopBy: end
          has: { field: condition, regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version' }
      - inside:
          kind: conditional_expression
          stopBy: end
          regex: '__version__|NumpyVersion|hasattr\((np|numpy)\b|\bNP_|NUMPY_|numpy_version|np_version'
      - inside:
          kind: try_statement
          stopBy: end
          has: { kind: except_clause, regex: '^except\s*\(?[\w\s,.]*(ImportError|AttributeError|ModuleNotFoundError)' }
  numpy-name:
    kind: attribute
    all:
      - has: { field: object, pattern: $NP }
      - has: { field: attribute, pattern: $N }
    not: { inside: { kind: assignment, field: left } }
constraints:
  NP: { regex: '^(np|numpy)$' }
  N:
    regex: '^(product|cumproduct|sometrue|alltrue|round_|row_stack|mat|compare_chararrays|format_parser|add_newdoc|add_docstring|DataSource|tracemalloc_domain)$'
transform:
  T1: { replace: { source: $N, replace: '^product$', by: prod } }
  T2: { replace: { source: $T1, replace: '^cumproduct$', by: cumprod } }
  T3: { replace: { source: $T2, replace: '^sometrue$', by: any } }
  T4: { replace: { source: $T3, replace: '^alltrue$', by: all } }
  T5: { replace: { source: $T4, replace: '^round_$', by: round } }
  T6: { replace: { source: $T5, replace: '^row_stack$', by: vstack } }
  T7: { replace: { source: $T6, replace: '^mat$', by: asmatrix } }
  T8: { replace: { source: $T7, replace: '^compare_chararrays$', by: char.compare_chararrays } }
  T9: { replace: { source: $T8, replace: '^format_parser$', by: rec.format_parser } }
  T10: { replace: { source: $T9, replace: '^(add_newdoc|add_docstring|tracemalloc_domain)$', by: 'lib.$1' } }
  NEW: { replace: { source: $T10, replace: '^DataSource$', by: lib.npyio.DataSource } }
fix: $NP.$NEW
metadata: { fix: safe }
