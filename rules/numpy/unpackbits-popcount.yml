# np.bitwise_count, added in NumPy 2.0, counts the set bits of each integer in one pass.
# Unpacking first writes eight bytes per byte of input. Counting the bits of 1,000,000 uint64
# values ran 37 times faster, and of uint8 values 7.6 times faster, and 1.4 to 10 times faster
# on 1,000 values. No fix, because the view, reshape and axis around unpackbits vary.
id: unpackbits-popcount
language: python
severity: warning
message: This unpacks every byte into eight before it counts the set bits. Write $NP.bitwise_count(x), summed as needed, which ran 37 times faster on 1,000,000 uint64 values.
rule:
  any:
    - pattern: $NP.unpackbits($X.view($NP.uint8)).sum()
    - pattern: $NP.sum($NP.unpackbits($X.view($NP.uint8)))
    - pattern: $NP.count_nonzero($NP.unpackbits($X.view($NP.uint8)))
constraints:
  NP: { regex: '^(np|numpy)$' }
fix: $NP.bitwise_count($X).sum()
metadata: { since: "2.0", fix: unsafe }
