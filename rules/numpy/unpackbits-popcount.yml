  not:
    any:
      - pattern: $NP.unpackbits($Y.view($NP.uint8)).sum()
      - pattern: $NP.sum($NP.unpackbits($Y.view($NP.uint8)))
      - pattern: $NP.count_nonzero($NP.unpackbits($Y.view($NP.uint8)))
