# A program that writes a file and reads the same file back. A text file that another tool
# reads, or that the program only reads, is left alone, because only the same file argument in
# a save and a load in one source file shows the program owns the format. np.save adds .npy to a
# name without it, so there is no fix.
id: file-roundtrip
language: python
severity: warning
message: This program writes $FILE as text with np.savetxt and parses it back with $NP.$LOAD. Write it with np.save and read it with np.load, which ran 27 to 880 times faster reading and 420 to 510 times faster writing 1,000,000 values, and keeps the dtype and shape.
rule:
  all:
    - any: [{ pattern: $NP.$LOAD($FILE) }, { pattern: '$NP.$LOAD($FILE, $$$REST)' }]
    # Checked before the search of the whole file below, which would otherwise run for every
    # call with one argument.
    - has: { field: function, regex: '^(np|numpy)\s*\.\s*(loadtxt|genfromtxt)$' }
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          pattern: $NP.savetxt($FILE, $$$ARGS)
constraints:
  NP: { regex: '^(np|numpy)$' }
  LOAD: { regex: '^(loadtxt|genfromtxt)$' }
---
# The docs of numpy.fromfile say: "Do not rely on the combination of tofile and fromfile for data
# storage, as the binary files generated are not platform independent. In particular, no
# byte-order or data-type information is saved. Data can be stored in the platform independent
# .npy format using save and load instead."
# https://numpy.org/doc/stable/reference/generated/numpy.fromfile.html
# A raw file that another tool writes is read with fromfile alone, and is left alone. So is a
# file object held on self, as in scipy.io.FortranFile, which writes a format other programs read.
# No fix, because the tofile call that writes the file has to change too.
id: file-roundtrip
language: python
severity: warning
message: This program writes $FILE with tofile and reads it back with $NP.fromfile, and the raw file keeps no dtype, shape or byte order. NumPy's docs say to use np.save and np.load for storage instead.
rule:
  all:
    - any: [{ pattern: $NP.fromfile($FILE) }, { pattern: '$NP.fromfile($FILE, $$$REST)' }]
    - inside:
        kind: module
        stopBy: end
        has:
          stopBy: end
          any: [{ pattern: $X.tofile($FILE) }, { pattern: '$X.tofile($FILE, $$$ARGS)' }]
constraints:
  NP: { regex: '^(np|numpy)$' }
  FILE: { any: [{ kind: string }, { kind: identifier }] }
