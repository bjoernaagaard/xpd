# The NumPy pack. Every other .yml file in this folder is a rule.

# A fix that writes `np.` applies only in a file with `import numpy as np`. Elsewhere the issue
# has no fix.
aliases:
  np: numpy

# Names a fix may write bare, each with the module it must be imported from. A fix that writes
# `assert_allclose(` applies only in a file with `from numpy.testing import assert_allclose`.
members:
  assert_allclose: numpy.testing
