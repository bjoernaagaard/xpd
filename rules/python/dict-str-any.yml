# A dict[str, Any] in a signature tells the caller and the type checker nothing about the keys
# or the values, so every function that takes it has to know the shape by heart. Name the
# fields once, where the data enters the program, in a NamedTuple, or in a TypedDict when the
# value has to stay a dict. The rule has no fix, because the fields are not in the file.
id: dict-str-any
language: python
severity: warning
message: $TYPE in a signature hides which keys and values the function works with. Name the fields in a NamedTuple, or in a TypedDict when the value has to stay a dict, and pass that.
rule:
  kind: generic_type
  pattern: $TYPE
  regex: ^(typing\.|t\.)?(dict|Dict|Mapping|MutableMapping)\[\s*str,\s*(typing\.|t\.)?Any\s*\]$
  inside:
    stopBy: end
    kind: type
    any:
      - inside: { kind: typed_parameter }
      - inside: { kind: typed_default_parameter }
      - inside: { kind: function_definition, field: return_type }
