# A skipped test stays in the suite and reports nothing, so the failure it was written to catch
# comes back unseen. `skipif` is left alone, because it states the platform or version where the
# test cannot run. A bare `xfail` is left alone too, because `strict_xfail` in the project's
# settings decides whether it can hide a failure, and a rule reads one file.
# No fix, because the test has to be repaired or deleted, and the file does not show which.
id: test-skip
language: python
severity: warning
message: This test never runs. Fix what makes it fail, or delete the test and write down why.
files: ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
rule:
  any:
    - pattern: pytest.mark.skip
    - pattern: mark.skip
    - pattern: unittest.skip
---
# `xfail(strict=False)` says in the test file that the test may fail or pass, so the run passes
# either way, whatever `strict_xfail` is in the settings. The pytest documentation calls this
# "rather dangerous to use permanently".
# No fix, because the test has to be repaired or deleted, and the file does not show which.
id: test-skip
language: python
severity: warning
message: This test may fail and the run still passes. Fix what makes it fail, or delete the test and write down why.
files: ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
rule:
  kind: call
  all:
    - has: { field: function, regex: (^|\.)xfail$ }
    - has:
        field: arguments
        has:
          kind: keyword_argument
          all:
            - has: { field: name, regex: ^strict$ }
            - has: { field: value, regex: ^False$ }
