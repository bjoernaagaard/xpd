id: error-message-prefix
language: python
severity: warning
message: This error message starts with a value, so a line copied from a log does not search back to this raise. Start it with fixed words, and put the values after them.
rule:
  kind: string
  nthChild: 1
  has: { kind: interpolation, nthChild: 2 }
  inside:
    kind: argument_list
    inside:
      kind: call
      inside: { kind: raise_statement }
