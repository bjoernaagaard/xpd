id: counting-loop-without-counter
language: python
severity: warning
message: This loop only counts the items of $ITEMS. Write $D = collections.Counter(iter($ITEMS)) in place of the loop.
rule:
  kind: for_statement
  all:
    - has: { field: left, pattern: $KEY }
    - has: { field: right, pattern: $ITEMS }
    - not: { has: { field: alternative, kind: else_clause } }
    - has:
        field: body
        kind: block
        all:
          - has:
              kind: expression_statement
              has: { pattern: "$D[$KEY] = $D.get($KEY, 0) + 1" }
          - not:
              has: { nthChild: 2 }
    - follows:
        stopBy: { not: { kind: comment } }
        kind: expression_statement
        has:
          kind: assignment
          any:
            - pattern: $D = {}
            - pattern: "$D: $TYPE = {}"
            - pattern: $D = dict()
            - pattern: "$D: $TYPE = dict()"
constraints:
  D: { kind: identifier }
  KEY: { kind: identifier }
fix: $D = Counter(iter($ITEMS))
metadata: { fix: unsafe, fixImports: [Counter] }
