# A comprehension with two `for` clauses reads in the order of a nested loop, while its result
# stands first, so a reader has to reorder it. A nested loop says the same thing in the order
# it runs. Python 3.15 flattens with `[*xs for xs in lists]`.
id: comprehension-two-fors
language: python
severity: warning
message: This comprehension has more than one for. Write a nested loop, or flatten with [*xs for xs in lists] on Python 3.15.
rule:
  any:
    - kind: dictionary_comprehension
    - kind: list_comprehension
    - kind: set_comprehension
    - kind: generator_expression
  has:
    kind: for_in_clause
    follows: { stopBy: end, kind: for_in_clause }
