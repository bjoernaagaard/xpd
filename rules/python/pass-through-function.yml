# A function that only hands its own parameters to one call gives that call a second name, and a
# reader has to open the function to learn that it does nothing else. Call the other function
# directly. A function that computes something, such as a formula, is left alone, and so is a
# method, a decorated function and a function that returns a chain of two or more pipe calls. The rule has no fix, because the calls of the function are
# in other places and other files.
id: pass-through-function
language: python
severity: warning
message: This function only passes its parameters to one call. Call that function where this one is called, and delete this one.
rule:
  kind: function_definition
  inside: { kind: module }
  has:
    field: body
    all:
      - has:
          kind: return_statement
          has: { matches: passes-names }
          # A chain of two or more pipe calls names the steps of a pipeline in the order they
          # run, which is what xpd graph reads, so the function does more than rename one call.
          not: { has: { pattern: $FRAME.pipe($$$FIRST).pipe($$$NEXT) } }
      - not:
          has:
            any:
              - kind: return_statement
                follows: { stopBy: end, kind: return_statement }
              - not:
                  any:
                    - kind: return_statement
                    - kind: comment
                    - kind: expression_statement
                      has: { kind: string }
utils:
  # A call whose arguments are all plain names, with at least one of them.
  only-names:
    kind: call
    has:
      field: arguments
      kind: argument_list
      has: { kind: identifier }
    not:
      has:
        field: arguments
        kind: argument_list
        has:
          not:
            any:
              - kind: identifier
              - regex: ^[(),]$
  # The same, where an argument may also be one more call of plain names.
  passes-names:
    kind: call
    has:
      field: arguments
      kind: argument_list
      has:
        any:
          - kind: identifier
          - matches: only-names
    not:
      has:
        field: arguments
        kind: argument_list
        has:
          not:
            any:
              - kind: identifier
              - regex: ^[(),]$
              - matches: only-names
