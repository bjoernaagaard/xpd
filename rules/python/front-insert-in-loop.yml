# items.insert(0, item) moves every item already in the list one place to the right, so a loop
# that builds a list this way does work that grows with the square of its length. On Python
# 3.15.2 on one machine, building a list of 10,000 items took 4.87 milliseconds with insert at
# index 0, 0.074 with append in the loop and one reverse() after it, and 0.103 with
# collections.deque and appendleft. The loop with insert was slower at every size measured: 1.39
# times at 10 items, 2.06 at 100, 6.87 at 1,000 and 65.68 at 10,000. The three forms give equal
# contents. The rule reports only a list that the same function, or the module, starts as an
# empty list under a plain name, because that code can always start it another way. It leaves
# alone an insert outside a loop, an insert at another index, a parameter, an attribute, and a
# list that starts with items. It has no fix, because the rewrite changes two places, and a deque
# is not a list.
id: front-insert-in-loop
language: python
severity: warning
message: Each insert at index 0 moves every item already in $L. Append in the loop and call $L.reverse() once after it, or start $L as collections.deque() and call $L.appendleft($X).
rule:
  all:
    - pattern: $L.insert(0, $X)
    - inside:
        stopBy: { kind: function_definition }
        kind: block
        inside:
          any:
            - kind: for_statement
            - kind: while_statement
    - any:
        - inside:
            stopBy: { kind: function_definition }
            kind: function_definition
            has:
              stopBy: end
              kind: assignment
              any:
                - pattern: $L = []
                - pattern: "$L: $TYPE = []"
                - pattern: $L = list()
                - pattern: "$L: $TYPE = list()"
        - all:
            - not:
                inside: { stopBy: end, kind: function_definition }
            - inside:
                stopBy: end
                kind: module
                has:
                  kind: expression_statement
                  has:
                    kind: assignment
                    any:
                      - pattern: $L = []
                      - pattern: "$L: $TYPE = []"
                      - pattern: $L = list()
                      - pattern: "$L: $TYPE = list()"
constraints:
  L: { kind: identifier }
