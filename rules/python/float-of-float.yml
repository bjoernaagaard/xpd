# mean, median, std and var of a NumPy array or a pandas Series return np.float64 when no axis is
# given, and np.float64 is a subclass of float: isinstance(np.arange(4.0).mean(), float) was True
# on NumPy 2.5 and pandas 3.1, and ty 0.0.105 accepted `return x.mean()` in a function that
# returns float. float() around the call converts a float to a float. The rule runs only in a
# file that imports numpy or pandas, and not in one that imports a library whose mean returns
# its own array type. The fix is safe, because the value is equal and already a float.
id: float-of-float
language: python
severity: warning
message: $CALL already returns a float, because np.float64 is a subclass of float. Drop the float() around it.
rule:
  pattern: float($CALL)
  has:
    field: arguments
    has:
      kind: call
      pattern: $CALL
      all:
        - has: { field: function, kind: attribute, has: { field: attribute, regex: ^(mean|median|std|var)$ } }
        - not: { has: { field: arguments, has: { stopBy: end, kind: keyword_argument, has: { field: name, regex: ^(axis|level|dtype|out|keepdims)$ } } } }
        - not: { has: { field: arguments, has: { any: [{ kind: integer }, { kind: identifier }, { kind: tuple }] } } }
  inside:
    stopBy: end
    kind: module
    all:
      - has: { any: [{ kind: import_statement }, { kind: import_from_statement }, { kind: future_import_statement }], regex: \b(numpy|pandas)\b }
      - not: { has: { any: [{ kind: import_statement }, { kind: import_from_statement }], regex: \b(torch|jax|tensorflow|xarray|cupy|dask|mlx|polars|sympy)\b } }
fix: $CALL
metadata: { fix: safe }
