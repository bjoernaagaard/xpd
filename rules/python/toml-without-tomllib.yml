# tomllib has been in the standard library since Python 3.11, and every Python that still gets
# fixes has it. tomli is the package that tomllib was copied from, with the same load and
# loads, so tomllib replaces it line for line. The older toml package also reads TOML with load
# and loads. The rule reports an import of tomli, and toml.load and toml.loads. It leaves alone
# toml.dump and toml.dumps, because tomllib cannot write, and an import of tomli inside try or
# if, which is how code that still runs on Python 3.10 falls back.
id: toml-without-tomllib
language: python
severity: warning
message: The standard library reads TOML. Write import tomllib, and call tomllib.load on a file opened with "rb" or tomllib.loads on text.
rule:
  kind: import_from_statement
  pattern: $STMT
  all:
    - has: { field: module_name, regex: '^tomli$' }
    - not:
        inside:
          stopBy: end
          any:
            - kind: try_statement
            - kind: if_statement
transform:
  FIXED:
    replace:
      source: $STMT
      replace: '^from(\s+)tomli\b'
      by: 'from${1}tomllib'
fix: $FIXED
metadata: { fix: unsafe }
---
id: toml-without-tomllib
language: python
severity: warning
message: The standard library reads TOML. Write import tomllib, and call tomllib.load on a file opened with "rb" or tomllib.loads on text.
rule:
  kind: import_statement
  pattern: import tomli as $ALIAS
  not:
    inside:
      stopBy: end
      any:
        - kind: try_statement
        - kind: if_statement
fix: import tomllib as $ALIAS
metadata: { fix: unsafe }
---
id: toml-without-tomllib
language: python
severity: warning
message: The standard library reads TOML. Write import tomllib, and call tomllib.load on a file opened with "rb" or tomllib.loads on text.
rule:
  any:
    - pattern: toml.load($$$ARGS)
    - pattern: toml.loads($$$ARGS)
    - all:
        - kind: import_statement
        - regex: ^import\s+tomli\b
        - not: { pattern: import tomli as $ALIAS }
        - not:
            inside:
              stopBy: end
              any:
                - kind: try_statement
                - kind: if_statement
    - all:
        - kind: import_from_statement
        - regex: ^from\s+tomli\.
        - not:
            inside:
              stopBy: end
              any:
                - kind: try_statement
                - kind: if_statement
