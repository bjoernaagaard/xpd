id: vague-module-name
language: python
severity: warning
message: This module's name does not say what it holds. Name it after its contents, and split it when the contents have no single name.
files:
  - "**/{util,utils,helper,helpers,common,misc,config,types,constants,handlers}.py"
  - "**/{util,utils,helper,helpers,common,misc,config,types,constants,handlers}/__init__.py"
rule:
  kind: module
