# A dataclass, a NamedTuple, a TypedDict and an attrs class each hold named fields, and each
# needs its own code to check a value that comes from outside and to write it out again. A
# msgspec Struct holds the same fields, checks the types when it decodes JSON, TOML, YAML,
# MessagePack or a dict, and encodes back. On msgspec 0.22.0 a Struct with an np.ndarray field
# was built without a check of the field, so it also holds values that are never decoded. One
# kind of record in a project means one way to copy, compare and decode a value. The rule has no
# fix, because default_factory and replace move to msgspec names and the project has to depend
# on msgspec first.
id: record-without-msgspec
language: python
severity: warning
message: This record is not a msgspec Struct. Write class Name(msgspec.Struct, frozen=True), which holds the same fields and also decodes and encodes them.
rule:
  kind: class_definition
  any:
    - inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: ^@((dataclasses|attrs?|pydantic\.dataclasses)\.)?(dataclass|define|frozen|mutable|s|attrs)\b
    - has:
        field: superclasses
        kind: argument_list
        has:
          any:
            - { kind: identifier, regex: ^(NamedTuple|TypedDict)$ }
            - { kind: attribute, regex: ^(typing|typing_extensions|t)\.(NamedTuple|TypedDict)$ }
