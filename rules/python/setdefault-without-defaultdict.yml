# d.setdefault(key, []).append(value) builds a new empty list on every pass and throws it away
# when the key is there. The Python documentation says of defaultdict(list) that it is "simpler
# and faster than an equivalent technique using dict.setdefault()". On Python 3.15.2 on one
# machine, grouping 100,000 items under 50 keys took 3.87 milliseconds with setdefault and 2.87
# with a defaultdict. The rule reports only a dict that the same function, or the module, starts
# as an empty dict under a plain name, because that code can always start a defaultdict
# instead. It leaves alone a parameter, an attribute, and a dict that starts with keys. It has
# no fix, because a defaultdict also adds a key when code reads one that is missing.
id: setdefault-without-defaultdict
language: python
severity: warning
message: $D can be a defaultdict. Start it with collections.defaultdict(list), or with set or dict for another kind of value, and write $D[$KEY] in place of this setdefault call, which builds a new empty value on every pass.
rule:
  all:
    - any:
        - pattern: $D.setdefault($KEY, $FACTORY())
        - pattern: $D.setdefault($KEY, $EMPTY)
    - any:
        - inside:
            stopBy: { kind: function_definition }
            kind: function_definition
            has:
              stopBy: end
              kind: assignment
              any:
                - pattern: $D = {}
                - pattern: "$D: $TYPE = {}"
                - pattern: $D = dict()
                - pattern: "$D: $TYPE = dict()"
        - all:
            - not:
                inside: { stopBy: end, kind: function_definition }
            - inside:
                stopBy: end
                kind: module
                has:
                  kind: expression_statement
                  has:
                    kind: assignment
                    any:
                      - pattern: $D = {}
                      - pattern: "$D: $TYPE = {}"
                      - pattern: $D = dict()
                      - pattern: "$D: $TYPE = dict()"
constraints:
  D: { kind: identifier }
  FACTORY: { regex: ^(list|set|dict)$ }
  EMPTY: { regex: "^(\\[\\]|\\{\\})$" }
