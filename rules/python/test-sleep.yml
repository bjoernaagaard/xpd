# A sleep in a test waits a fixed time and hopes the work is done by then. The test fails on a
# slow machine and wastes the time on a fast one. `asyncio.sleep(0)` is left alone, because it
# hands control to the event loop and waits for nothing.
id: test-sleep
language: python
severity: warning
message: This test waits a fixed time. Wait for the result itself, such as a join, an event or a poll with a deadline.
files: ["**/tests/**", "**/test_*.py", "**/*_test.py", "**/conftest.py"]
rule:
  any:
    - pattern: time.sleep($$$ARGS)
    - pattern: asyncio.sleep($$$ARGS)
    - pattern: sleep($$$ARGS)
      inside:
        stopBy: end
        kind: module
        has:
          kind: import_from_statement
          all:
            - has: { field: module_name, regex: ^(time|asyncio)$ }
            - has: { stopBy: end, kind: dotted_name, regex: ^sleep$ }
  not:
    pattern: asyncio.sleep(0)
