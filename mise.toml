[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy", mr_boxington = true }
mr-boxington = "1.30.0"
cargo-deny = "0.20.2"
lefthook = "2.2.2"
jactionlint = "2.5.0"
ruff = "0.17.4"
"aqua:Kitware/CMake" = "4.5.0"
node = "26.13.1"
# The Starlight build starts the MCP server with uv to list its tools for the reference.
uv = "0.13.9"

# Builds the Starlight site in website/ into site/, the folder that GitHub Pages publishes. The
# build runs `cargo run -- rules` first and writes a page for each rule from that catalog. It then
# writes the command reference from `xpd commands` and the MCP reference from the server that uv
# starts in website/.mcp-venv. The docs-preview daemon in pitchfork.toml serves the site under
# /xpd/, the path it has on Pages.
[tasks.docs]
description = "Build the documentation site into site/"
dir = "website"
run = """
npm ci
npm run build
"""

# Builds the wheels this machine can build, to try a build before pushing a tag. zig cross-compiles
# the C and C++ code of tree-sitter and llama.cpp for Linux. llama.cpp links Apple's frameworks on
# macOS, which only a Mac has, and it does not link for Windows with zig, so GitHub's Windows
# runner builds that wheel with MSVC. The task adds the Rust targets it needs, so CI and other
# tasks skip downloading them. A pushed v* tag builds and publishes the release on GitHub's
# runners.
[tasks.wheels]
description = "Build the sdist and the Linux wheels into dist/, and the macOS wheels on a Mac"
run = """
architectures="{{ [p.target for p in read_json(path=".github/wheel-platforms.json")] | join(sep=" ") }}"
for arch in $architectures; do
  rustup target add "$arch-unknown-linux-gnu" "$arch-unknown-linux-musl"
done
rm -rf dist
uvx maturin sdist --out dist
build() { uvx --with ziglang maturin build --release --zig --out dist "$@"; }
for arch in $architectures; do
  build --compatibility manylinux2014 --target "$arch-unknown-linux-gnu"
done
for arch in $architectures; do
  build --compatibility musllinux_1_2 --target "$arch-unknown-linux-musl"
done
if [ "$(uname)" = Darwin ]; then
  for arch in $architectures; do
    rustup target add "$arch-apple-darwin"
    build --target "$arch-apple-darwin"
  done
fi
ls dist
"""
