[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy", mr_boxington = true }
mr-boxington = "1.30.0"
cargo-deny = "0.20.2"
lefthook = "2.2.2"
jactionlint = "2.5.0"
ruff = "0.17.4"
"github:rust-lang/mdBook" = "0.5.0"
"github:badboy/mdbook-mermaid" = "0.17.1"
"aqua:Kitware/CMake" = "4.5.0"
node = "26.13.1"

[tasks.docs]
description = "Build the documentation site into site/"
run = """
mdbook-mermaid install .
mdbook build
"""

# The Starlight site that replaces the mdBook site. It builds on its own into website/dist/ until
# GitHub Pages publishes it. Its build runs `cargo run -- rules` first and writes a page for each
# rule from that catalog. The docs-preview daemon in pitchfork.toml serves it under /xpd/, the
# path it has on Pages.
[tasks."docs:starlight"]
description = "Build the Starlight site into website/dist/"
dir = "website"
run = """
npm ci
npm run build
"""

# Builds the wheels this machine can build, to try a build before pushing a tag. zig cross-compiles
# the C and C++ code of tree-sitter and llama.cpp for Linux. llama.cpp links Apple's frameworks on
# macOS, which only a Mac has, and it does not link for Windows with zig, so GitHub's Windows
# runner builds that wheel with MSVC. The task adds the Rust targets it needs, so CI and other
# tasks skip downloading them. A pushed v* tag builds and publishes the release on GitHub's
# runners.
[tasks.wheels]
description = "Build the sdist and the Linux wheels into dist/, and the macOS wheels on a Mac"
run = """
rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl \
  aarch64-unknown-linux-musl
rm -rf dist
uvx maturin sdist --out dist
build() { uvx --with ziglang maturin build --release --zig --out dist "$@"; }
build --compatibility manylinux2014 --target x86_64-unknown-linux-gnu
build --compatibility manylinux2014 --target aarch64-unknown-linux-gnu
build --compatibility musllinux_1_2 --target x86_64-unknown-linux-musl
build --compatibility musllinux_1_2 --target aarch64-unknown-linux-musl
if [ "$(uname)" = Darwin ]; then
  rustup target add x86_64-apple-darwin aarch64-apple-darwin
  build --target x86_64-apple-darwin
  build --target aarch64-apple-darwin
fi
ls dist
"""
