# cargo-deny policy. lefthook runs `cargo deny check` before every push.

[graph]
all-features = true

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2021-0139", reason = "ast-grep terminal colors; unmaintained-only advisory" },
    { id = "RUSTSEC-2024-0436", reason = "libcst compile-time macro; unmaintained-only advisory" },
]

[licenses]
# Permissive licenses only. Read a license's terms before adding it here.
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "MIT-0", "NCSA", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8
# The unmodified option-ext dependency comes from ast-grep's project-directory support.
# Its license and complete source
# archive ship under licenses/ to satisfy MPL's source-availability requirement.
# libcst, which checks that a fixed file is still valid Python, holds parts of CPython under the
# PSF license, which is permissive. Its license file ships as licenses/libcst-LICENSE.
exceptions = [
    { crate = "libcst@1.9.0", allow = ["PSF-2.0"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
    { crate = "xpd", allow = ["MPL-2.0", "PSF-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
