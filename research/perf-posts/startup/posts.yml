# Linux on x86_64. Each attempt pins one paired hyperfine invocation to one core
# using taskset on core 4. Hyperfine 2 runs two warmups and five fresh processes
# per form. A coefficient of variation above 5 percent triggers another attempt,
# up to three attempts. The reported attempt minimizes the largest coefficient
# of variation across its forms. All attempts stay in the raw file.
#
# Values are milliseconds. SD is the sample standard deviation. Module probes
# report cumulative importtime from the child. Other rows measure elapsed process
# time. The load averages span one, five and fifteen minutes respectively.
# On 3.13 and 3.14 the explicit lazy keyword fails the syntax check before timing.
# Single eager rows on those versions are controls. They are not lazy timings.
# The 3.15 typing matrix times all three interpreters together. Commands and
# filenames in the raw output describe the original run. Use run.sh to resolve
# the paths on another machine. An import can defer exceptions and side effects.
#
# For comparable ratios, direction-only means the gap exceeded the observed
# scatter but its size differed by more than 25 percent from the published ratio,
# or the code or method only allowed a partial comparison. This descriptive
# tolerance is not a confidence interval.
