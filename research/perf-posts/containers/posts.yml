- url: https://discuss.python.org/t/93394/29
  title: A sorted that returns a generator. Post 29.
  author: dg-pb
  published: '2025-05-28'
  python_measured: The post does not name the CPython version. Its Python expressions run on all three pinned versions.
  claim: Sorting the whole list beats fully consuming a stable heap iterator over 100,000 one item tuples.
  author_numbers: IPython timeit gave 55 ms for sorted and 346 ms for collecting the stable heap. Getting only the first item took 45 ms and produced a different result.
  script: bench/heapsort.py
  provenance: Rebuilt the inline function and seeded tuple input. The harness checks the identity and order of every result, including ties.
