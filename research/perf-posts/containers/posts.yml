# Each ratio is the mean of paired wall time ratios. The raw files retain the
# samples in acquisition order. The load averages follow that order, with the
# first form rotating each round. The best attempt has the lowest maximum
# coefficient of variation across forms, regardless of which form won.
# SD describes three rounds within one pinned interpreter process.
- url: https://github.com/python/cpython/issues/131525
  title: Caching the tuple hash calculation speeds up some code significantly
  author: Michael Droettboom
  published: '2025-03-20'
  python_measured: CPython 3.14.0a6+ with and without the patch.
  claim: Remembering the hash of each tuple speeds up MDP, which repeatedly looks up nested tuple keys.
  author_numbers: The issue reports an 86% gain. The archived table gives 2.51 s and 1.34 s. The overall geometric mean is 1.000 times baseline. The table also shows smaller changes in other workloads, including regex_v8 at 1.05 times baseline.
  author_results: https://github.com/faster-cpython/benchmarking-public/blob/main/results/bm-20250320-3.14.0a6%2B-a31e8be/bm-20250320-pythonperf2-x86_64-mdboom-tuple_hash_cache2-3.14.0a6%2B-a31e8be-vs-base.md
  author_raw: https://raw.githubusercontent.com/faster-cpython/benchmarking-public/main/results/bm-20250320-3.14.0a6%2B-a31e8be/bm-20250320-pythonperf2-x86_64-mdboom-tuple_hash_cache2-3.14.0a6%2B-a31e8be.json
  script: bench/mdp.py
  source_repository: https://github.com/python/pyperformance
