  title: "Python's deque: Implement Efficient Queues and Stacks"
  author: Leodanis Pozo Ramos
  published: '2026-01-12'
  python_measured: The dated tutorial omits its interpreter version. Its append benchmark runs on all three pinned releases.
  claim: Growing a sequence from the left takes less time per item with deque.appendleft than with list.insert at index zero.
  author_numbers: Across 10,000 insertions the author measured 1225.31 ns for list and 90.4832 ns for deque, a ratio of 13.54.
